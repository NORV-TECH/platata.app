name: make-voice

# Makes the narration for the demo feature scripts. demo-studio branch only; the live site is never touched.
on:
  push:
    branches: [demo-studio]
    paths:
      - "demo-studio/features/**"
      - "demo-studio/voices.json"
      - "demo-studio/tools/make_voice.py"
      - "demo-studio/voice-ready.txt"
      - ".github/workflows/make-voice.yml"

permissions:
  contents: write

concurrency:
  group: make-voice
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: demo-studio
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Make narration
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python demo-studio/tools/make_voice.py
      - name: Save audio to the branch
        run: |
          git config user.name "platata-voice-bot"
          git config user.email "voice-bot@users.noreply.github.com"
          git add demo-studio/audio
          git diff --cached --quiet || git commit -m "narration [skip ci]"
          git pull --rebase origin demo-studio
          git push origin HEAD:demo-studio
