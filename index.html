<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Platata · Coming soon</title>
<meta name="description" content="Manage your business from your phone. The register on your counter. The business in your pocket. Coming soon.">
<meta name="google-site-verification" content="4WOJQYerp-EWYaqOElbRiF87kWX9tnWlG6-gbdONc-M">
<link rel="canonical" href="https://platata.app/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://platata.app/">
<meta property="og:title" content="Platata · Coming soon">
<meta property="og:description" content="Manage your business from your phone.">
<meta property="og:image" content="https://platata.app/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="/img/app-icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mona+Sans:wdth,wght@75..125,300..900&display=swap">
<script>
  /* light or dark: the visitor's own choice, else the phone or computer setting */
  (function () {
    var t = null;
    try { t = localStorage.getItem('platata-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
/* Platata coming soon (23 Nov 2026). The approved 22 Nov home page (Design C, Mona Sans) with a Coming soon label:
   the real counter register photo and the same shop's owner workspace (Transfers and Funding on top). */
:root {
  --f: "Mona Sans", "Segoe UI", system-ui, sans-serif;
  --bg: #EFEFEC; --card: #FFFFFF; --ink: #101011; --ink2: #64625E; --line: #D9D8D3;
  --accent: #F2B705; --onaccent: #1B1400; --ok: #1E7F45; --bezel: #0E0E10; --shadow: rgba(20,18,12,.30);
}
:root[data-theme="dark"] { color-scheme: dark;
  --bg: #0C0C0D; --card: #18181A; --ink: #F1F0EC; --ink2: #9D9A94; --line: #2A2A2C;
  --ok: #6FCF8E; --bezel: #2A2B2F; --shadow: rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); }
body { min-height: 100vh; display: flex; flex-direction: column; color: var(--ink); font-family: var(--f);
  font-size: 15px; line-height: 1.4; -webkit-font-smoothing: antialiased; }
a { color: inherit; }

header { display: flex; align-items: center; justify-content: space-between; padding: 18px 44px 0; }
.logo { display: flex; align-items: center; gap: 9px; font-weight: 800; font-size: 19px; letter-spacing: -0.02em;
  font-stretch: 118%; text-decoration: none; }
.logo i { width: 26px; height: 26px; border-radius: 8px; background: var(--accent); color: var(--onaccent);
  display: grid; place-items: center; font-style: normal; font-size: 15px; font-weight: 800; }
.mode { width: 40px; height: 40px; border-radius: 999px; border: 0; background: var(--card); color: var(--ink);
  box-shadow: 0 0 0 1px var(--line); display: grid; place-items: center; cursor: pointer; }
.mode svg { width: 20px; height: 20px; }
.mode .sun { display: none; }
:root[data-theme="dark"] .mode .sun { display: block; }
:root[data-theme="dark"] .mode .moon { display: none; }

main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 40px; align-items: center;
  padding: 8px 44px 8px; max-width: 1280px; width: 100%; margin: 0 auto; }
.left { display: flex; flex-direction: column; gap: 22px; }
.soon { align-self: flex-start; display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px;
  border-radius: 999px; background: var(--accent); color: var(--onaccent); font-weight: 800; font-size: 14px;
  letter-spacing: .02em; }
.soon b { width: 8px; height: 8px; border-radius: 999px; background: var(--onaccent); }
h1 { margin: 0; font-size: clamp(36px, min(5.2vw, 9.5vh), 60px); line-height: 1.0; letter-spacing: -0.035em; max-width: 600px; }
.say { margin: 0; font-size: clamp(16px, 1.5vw, 19px); line-height: 1.45; color: var(--ink2); max-width: 540px; }
.free { margin: 0; display: flex; align-items: center; gap: 7px; font-size: 14.5px; font-weight: 700; color: var(--ink2); }
.free svg { width: 20px; height: 20px; color: var(--ok); }
.ask { margin: 0; font-size: 15px; color: var(--ink2); }
.ask a { color: var(--ink); font-weight: 700; text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 4px; }

/* the picture: one 560 x 560 stage, scaled to the window so it never needs a scroll */
.stage { position: relative; height: min(560px, calc(100vh - 140px)); aspect-ratio: 1 / 1; }
.reg { position: absolute; right: 0; top: 0; width: 92.9%; height: 96.4%; border-radius: 6%; overflow: hidden; background: #050506; }
.reg img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 40%; display: block; }
/* 23 Nov, Monti: thinner bezel, a bigger phone so the workspace reads */
.phone { position: absolute; left: 0; bottom: 0; width: 43%; padding: 0.9%; border-radius: 11.5% / 5.4%;
  background: var(--bezel); box-shadow: 0 40px 70px -34px var(--shadow), 0 2px 6px rgba(0,0,0,.16);
  filter: drop-shadow(0 24px 40px rgba(0,0,0,.28)); }
.phone img { display: block; width: 100%; height: auto; border-radius: 10.4% / 4.9%; }
.phone .dark { display: none; }
:root[data-theme="dark"] .phone .light { display: none; }
:root[data-theme="dark"] .phone .dark { display: block; }
.tag { position: absolute; font-size: 12.5px; font-weight: 800; padding: 5px 11px; border-radius: 999px; white-space: nowrap; }
.tag.tr { right: 3.2%; top: 3.2%; background: rgba(255,255,255,.92); color: #1B1A18; }
.tag.tp { left: 45.5%; bottom: 4.6%; background: var(--card); color: var(--ink); box-shadow: 0 0 0 1px var(--line); }

footer { display: flex; gap: 16px; justify-content: center; padding: 10px 20px 16px; font-size: 13px; color: var(--ink2); }
footer a { color: var(--ink2); }

@media (max-width: 820px) {
  header { padding: 16px 20px 0; }
  main { grid-template-columns: 1fr; gap: 28px; padding: 22px 20px 12px; }
  .left { gap: 16px; }
  h1 { font-size: clamp(34px, 10vw, 48px); }
  .stage { height: auto; width: 100%; max-width: 460px; justify-self: center; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="/"><i>P</i>Platata</a>
  <button class="mode" type="button" aria-label="Switch light or dark">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</header>
<main>
  <div class="left">
    <span class="soon"><b></b>Coming soon</span>
    <h1>Manage your business from your phone.</h1>
    <p class="say">The register on your counter. The business in your pocket.</p>
    <p class="free"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M8 12.5l2.7 2.7L16.5 9.5"/></svg>The app is 100% free.</p>
    <p class="ask">Questions? <a href="mailto:hello@platata.app">hello@platata.app</a></p>
  </div>
  <div class="stage">
    <div class="reg"><img src="/img/coming/register.webp" width="1100" height="1141" alt="A counter register running Platata"></div>
    <div class="phone">
      <img class="light" src="/img/coming/workspace-light.webp" width="540" height="1145" alt="The owner's workspace in Platata: today's sales, transfers and funding">
      <img class="dark" src="/img/coming/workspace-dark.webp" width="540" height="1145" alt="The owner's workspace in Platata: today's sales, transfers and funding">
    </div>
    <span class="tag tr">The register</span>
    <span class="tag tp">The owner’s phone</span>
  </div>
</main>
<footer><span>© 2026 Norv Inc.</span><a href="/en/privacy/">Privacy</a></footer>
<script>
  document.querySelector('.mode').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('platata-theme', t); } catch (e) {}
  });
</script>
</body>
</html>
