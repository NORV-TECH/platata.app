<style>
/* Layout: one column like a phone app (header, live demo, footer), with the feature list docked on the left on wide screens.
   One deliberate light look, Platata's own paper palette (always light, as Monti asked). */
:root{
  --page:#F4EBDD; --paper:#FBFAF7; --surface:#FFFFFF; --ink:#1F1B17; --ink2:#5B5249; --muted:#8A8077; --line:#E6DDD0;
  --potato:#3A2A1F; --potatoInk:#FFFFFF; --soon:#EFE8DC; --ready:#E4F0E2; --readyTx:#2C6A35; --hint:#F59E0B;
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif; --body:"Roboto",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme: light;
}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:var(--body);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--hint);outline-offset:2px}
.wrap{height:100%;display:grid;grid-template-columns:1fr;grid-template-rows:auto auto 1fr;max-width:520px;margin:0 auto;
  padding-left:max(12px, env(safe-area-inset-left, 0px));padding-right:max(12px, env(safe-area-inset-right, 0px));padding-block:8px 10px;gap:8px}
@media (min-width:980px){
  .wrap{max-width:1100px;grid-template-columns:360px 1fr;grid-template-rows:auto auto 1fr;column-gap:24px}
  header{grid-column:1 / -1}
  .side{display:flex!important;grid-row:2 / 4;grid-column:1}
  footer{grid-column:2;grid-row:2} main{grid-column:2;grid-row:3}
  .featBtn{display:none!important}
}
header{display:flex;align-items:center;gap:8px;min-width:0}
.logo{font:600 22px var(--display);color:var(--potato);flex:0 0 auto}
.pick{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:10px;height:54px;padding:0 12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);text-align:left}
.pick .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.pick .lbl{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.pick .lbl small,.pick .lbl b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .lbl small{font:500 12px var(--body);color:var(--muted);letter-spacing:.02em}
.pick .lbl b{font:500 16px var(--body);color:var(--ink)}
.pick .caret{color:var(--muted);flex:0 0 auto}
.vid{flex:0 0 auto;height:54px;padding:0 14px 0 10px;border-radius:14px;border:0;background:var(--potato);color:var(--potatoInk);display:flex;align-items:center;gap:6px;font:600 15px var(--display)}
.vid svg{width:22px;height:22px}
.vid[disabled]{background:#CFC4B6;cursor:default}
main{position:relative;min-height:0;border-radius:18px;overflow:hidden;background:var(--page)}
main iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:var(--page)}
.soon{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:24px;color:var(--ink2)}
.soon b{font:600 22px/1.2 var(--display);color:var(--potato);text-wrap:balance;max-width:24ch}
.soon p{margin:0;max-width:34ch;line-height:1.45}
.soon .num{font:600 13px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;border:0;border-radius:99px;background:var(--surface);box-shadow:0 6px 20px rgba(58,42,31,.25);padding:10px 16px;font:500 15px var(--body);white-space:nowrap;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis}
footer{display:flex;gap:8px}
.featBtn{flex:0 0 auto;height:52px;padding:0 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font:500 15px var(--body)}
.featBtn small{color:var(--muted);font-size:13px}
.install{flex:1;height:60px;border-radius:18px;background:var(--potato);color:var(--potatoInk);font:600 22px var(--display);box-shadow:0 8px 22px rgba(58,42,31,.28);display:flex;align-items:center;justify-content:center;text-decoration:none}
/* feature list (sheet on phone, sidebar on desktop) */
.side{display:none;flex-direction:column;min-height:0;background:var(--surface);border-radius:18px;border:1px solid var(--line);overflow:hidden}
.listHead{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.listHead b{display:block;font:600 18px var(--display);color:var(--potato)}
.listHead span{font-size:13px;color:var(--muted)}
.list{overflow:auto;padding:6px 8px 10px;min-height:0}
.group{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 8px 6px}
.feat{width:100%;display:grid;grid-template-columns:30px 1fr auto;align-items:center;gap:8px;padding:9px 8px;border:0;background:none;border-radius:12px;text-align:left}
.feat:hover{background:var(--paper)}
.feat.cur{background:var(--soon)}
.feat .n{font:600 12px var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.feat .name{font:400 15px/1.3 var(--body);min-width:0}
.feat .st{display:flex;gap:4px}
.badge{font:500 11px var(--body);border-radius:99px;padding:3px 8px;white-space:nowrap}
.badge.demo{background:var(--ready);color:var(--readyTx)}
.badge.video{background:var(--potato);color:#fff;display:inline-flex;align-items:center;gap:3px}
.badge.video svg{width:10px;height:10px}
.badge.soonb{background:var(--soon);color:var(--muted)}
.feat.off .name{color:var(--muted)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(31,27,23,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.scrim[hidden]{display:none}
.sheet{background:var(--surface);width:min(100%,520px);max-height:86%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom, 0px)}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:8px auto 2px}
.sheet .sbody{overflow:auto;padding:6px 16px 16px;display:flex;flex-direction:column;gap:14px;min-height:0}
.sheet h3{margin:6px 0 0;font:600 20px var(--display);color:var(--potato)}
.sec{display:flex;flex-direction:column;gap:8px}
.sec>span{font:600 12px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.bizs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.biz{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--paper);text-align:left}
.biz .dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.biz b{display:block;font:500 15px var(--body)}
.biz small{display:block;color:var(--muted);font-size:12px}
.biz[aria-pressed="true"]{border-color:var(--potato);box-shadow:inset 0 0 0 1px var(--potato);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--paper);border-radius:99px;padding:8px 14px;font:500 14px var(--body)}
.chip[aria-pressed="true"]{background:var(--potato);border-color:var(--potato);color:#fff}
.chip[disabled]{opacity:.4;cursor:default}
.more{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;padding:12px 14px;border-radius:14px;border:1px dashed var(--line);background:var(--paper);font:500 14px var(--body);color:var(--ink2)}
.more[aria-expanded="true"] .mc{transform:rotate(180deg)}
.chooser{display:flex;flex-direction:column;gap:14px}
.sheetSub{font-size:13px;color:var(--muted);margin-top:-8px}
.sideChange{margin-top:6px;border:0;background:none;padding:0;font:500 13px var(--body);color:var(--ink2);text-decoration:underline}
.done{height:48px;border:0;border-radius:14px;background:var(--potato);color:#fff;font:600 17px var(--display)}
/* video */
.vbox{position:fixed;inset:0;background:rgba(15,12,10,.92);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:16px}
.vbox[hidden]{display:none}
.vbox video{max-height:calc(100% - 70px);max-width:100%;aspect-ratio:9/16;border-radius:14px;background:#000}
.vbox .x{height:44px;padding:0 20px;border-radius:14px;border:0;background:#fff;color:var(--potato);font:600 16px var(--display)}
.vbox .none{color:#fff;max-width:30ch;text-align:center;line-height:1.5}
@media (prefers-reduced-motion:no-preference){ .next{animation:rise .3s ease-out} @keyframes rise{from{opacity:0;transform:translate(-50%,8px)}} }
</style>

<div class="wrap">
  <header>
    <div class="logo">Platata</div>

/* ================= state + deep link (#biz-country-lang-feature) ================= */
let st = {biz:"edificios", c:"CO", l:"es", f:"B4"};
try{ const h=(location.hash||"").slice(1).split("-"); if(h.length===4 && BIZ.some(b=>b.id===h[0]) && COUNTRIES[h[1]]) st={biz:h[0],c:h[1],l:h[2],f:h[3]}; }catch(e){}
const biz = () => BIZ.find(b=>b.id===st.biz);
const u = () => UI[st.l] || UI.es;
const fname = id => { const a=F[id]; return a[IDX[st.l]] || a[0]; };
function featuresOf(b, c){
  const shared = b.noShared ? [] : S_ALL;
  const ok = id => (!ONLY[id] || ONLY[id].includes(c)) && !(b.hide||[]).includes(id);
  return { shared: shared.filter(ok), own: b.own.filter(ok) };
}
function fix(){
  const b=biz();
  if(b.countries && !b.countries.includes(st.c)) st.c=b.countries[0];
  const langs = b.langs || COUNTRIES[st.c].langs;
  if(!langs.includes(st.l)) st.l=langs[0];
  const fs=featuresOf(b,st.c), all=[...fs.own,...fs.shared];
  if(!all.includes(st.f)) st.f = all.find(id=>B(id)) || all[0];
}
const B = id => BUILT[st.biz+":"+id] || BUILT[id];   // a business can have its own version of a shared feature ("restaurante:S3")
const isBuilt = id => !!B(id) && (!B(id).only || B(id).only.includes(st.c+"-"+st.l));
const videoOf = id => isBuilt(id) && (B(id).video[st.c+"-"+st.l] || B(id).video[st.l]);

/* ================= render ================= */
const $ = id => document.getElementById(id);
function featRow(id, n){
  const b = isBuilt(id), v = videoOf(id);
  const st2 = b ? `<span class="badge demo">${u().demo}</span>${v?`<span class="badge video"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4v16l13-8z"/></svg>${u().video}</span>`:""}` : `<span class="badge soonb">${u().soonT}</span>`;
  return `<button class="feat${id===st.f?" cur":""}${b?"":" off"}" data-f="${id}"><span class="n">${n}</span><span class="name">${fname(id)}</span><span class="st">${st2}</span></button>`;
}
function listHTML(){
  const fs=featuresOf(biz(),st.c); let n=0, h="";
  if(fs.own.length){ h+=`<div class="group">${u().own}</div>`+fs.own.map(id=>featRow(id,++n)).join(""); }
  if(fs.shared.length){ h+=`<div class="group">${u().shared}</div>`+fs.shared.map(id=>featRow(id,++n)).join(""); }
  return h;
}
function counts(){ const fs=featuresOf(biz(),st.c), all=[...fs.own,...fs.shared]; return {ready:all.filter(isBuilt).length,total:all.length}; }
function render(){
  fix();
  try{ history.replaceState(null,"","#"+[st.biz,st.c,st.l,st.f].join("-")); }catch(e){}
  document.documentElement.lang = st.l;
  const b=biz();
  $("pickDot").style.background=b.color;
  const fsAll=[...featuresOf(b,st.c).own,...featuresOf(b,st.c).shared];
  $("pickBiz").textContent = `${b.n[st.l]||b.n.es} · ${COUNTRIES[st.c].n[st.l]} · ${st.l.toUpperCase()}`;
  $("pickFeat").textContent = `${fsAll.indexOf(st.f)+1}. ${fname(st.f)}`;
  $("vidLbl").textContent=u().video; $("vid").disabled = !videoOf(st.f);
  const k=counts(); $("sideChange").textContent=u().chg;
  $("sideTitle").textContent=`${u().feats} · ${b.n[st.l]||b.n.es}`; $("sideSub").textContent=`${k.ready} ${u().ready} · ${k.total}`;
  $("sideList").innerHTML=listHTML();
  const ins=$("install"); ins.textContent=u().install;
  ins.href="https://play.google.com/store/apps/details?id=tata.fijando.su.plata&referrer="+encodeURIComponent(`utm_source=demo-tree&utm_medium=demo&utm_campaign=${st.f}-${st.c}-${st.l}`);
  // the demo
  const main=$("main"), all=[...featuresOf(b,st.c).own,...featuresOf(b,st.c).shared], pos=all.indexOf(st.f)+1;
  if(isBuilt(st.f)){
    const src = B(st.f).page(st.c, st.l);
    const cur = main.querySelector("iframe");
    if(!cur || cur.dataset.src!==src){ main.innerHTML = `<iframe title="${fname(st.f)}" data-src="${src}" src="${src}"></iframe>`; }
  } else {
    main.innerHTML = `<div class="soon"><span class="num">${pos} / ${all.length}</span><b>${fname(st.f)}</b><p>${u().soonP}</p></div>`;
  }
}
function nextBuilt(){
  const fs=featuresOf(biz(),st.c), all=[...fs.own,...fs.shared], i=all.indexOf(st.f);
  for(let k=1;k<=all.length;k++){ const id=all[(i+k)%all.length]; if(isBuilt(id) && id!==st.f) return id; }
  return null;
}

/* ================= events ================= */
function fillChooser(){
  const b=biz();
  $("lblBiz").textContent=u().biz; $("lblCountry").textContent=u().country; $("lblLang").textContent=u().lang;
  $("bizList").innerHTML = BIZ.map(x=>`<button class="biz" data-b="${x.id}" aria-pressed="${x.id===st.biz}"><span class="dot" style="background:${x.color}"></span><span><b>${x.n[st.l]||x.n.es}</b><small>${x.sub[st.l]||x.sub.es}</small></span></button>`).join("");
  $("countryList").innerHTML = ALL.map(c=>{ const dis = b.countries && !b.countries.includes(c); return `<button class="chip" data-c="${c}" aria-pressed="${c===st.c}"${dis?" disabled":""}>${COUNTRIES[c].n[st.l]}</button>`; }).join("");
  const langs = b.langs || COUNTRIES[st.c].langs;
  $("langList").innerHTML = Object.keys(LANGS).map(l=>`<button class="chip" data-l="${l}" aria-pressed="${l===st.l}"${langs.includes(l)?"":" disabled"}>${LANGS[l]}</button>`).join("");
}
function openPick(showChooser){
  const b=biz(), k=counts();
  $("pickTitle").textContent = `${b.n[st.l]||b.n.es} · ${COUNTRIES[st.c].n[st.l]}`;
  $("pickSub").textContent = `${u().feats}: ${k.ready} ${u().ready} · ${k.total}`;
  $("featList").innerHTML = listHTML();
  $("moreLbl").textContent = u().more; $("pickDone").textContent=u().done;
  const open = !!showChooser; $("chooser").hidden = !open; $("more").setAttribute("aria-expanded", String(open));
  if(open) fillChooser();
  $("pickSheet").hidden=false;
}
$("pick").onclick=()=>openPick(false);
$("sideChange").onclick=()=>openPick(true);
$("more").onclick=()=>{ const open=$("chooser").hidden; $("chooser").hidden=!open; $("more").setAttribute("aria-expanded",String(open)); if(open) fillChooser(); };
$("pickDone").onclick=()=>{ $("pickSheet").hidden=true; };
$("pickSheet").addEventListener("click",e=>{
  if(e.target===$("pickSheet")){ $("pickSheet").hidden=true; return; }
  const b=e.target.closest("[data-b]"), c=e.target.closest("[data-c]:not([disabled])"), l=e.target.closest("[data-l]:not([disabled])");
  const f=e.target.closest("[data-f]");
  if(f){ st.f=f.dataset.f; $("pickSheet").hidden=true; render(); return; }
  if(b){ st.biz=b.dataset.b; render(); openPick(true); }
  if(c){ st.c=c.dataset.c; st.l=COUNTRIES[st.c].langs[0]; render(); openPick(true); }
  if(l){ st.l=l.dataset.l; render(); openPick(true); }
});
$("sideList").addEventListener("click",e=>{ const f=e.target.closest("[data-f]"); if(f){ st.f=f.dataset.f; render(); } });
// video
$("vid").onclick=()=>{
  const v=videoOf(st.f), vb=$("vbox"), el=$("video"), none=$("vnone");
  $("vclose").textContent=u().close;
  if(v){ none.hidden=true; el.hidden=false; el.src=v; vb.hidden=false; el.play().catch(()=>{}); }
  else { el.hidden=true; none.hidden=false; none.textContent=u().noVideo; vb.hidden=false; }
};
const closeVideo=()=>{ const el=$("video"); el.pause(); el.removeAttribute("src"); el.load(); $("vbox").hidden=true; };
$("vclose").onclick=closeVideo;
document.addEventListener("keydown",e=>{ if(e.key==="Escape"){ closeVideo(); $("pickSheet").hidden=true; } });
// when a demo ends, offer the next built one
window.addEventListener("message",e=>{
  if(!e.data || e.data.type!=="platata-demo-end") return;
  const n=nextBuilt(); if(!n) return;
  const old=document.querySelector(".next"); if(old) old.remove();
  const btn=document.createElement("button"); btn.className="next"; btn.textContent=`${u().next} ${fname(n)} →`;
  btn.onclick=()=>{ st.f=n; btn.remove(); render(); };
  $("main").appendChild(btn);
});
render();
})();
