<script>
/* R11 "Aviso de pedido listo": the KITCHEN marks a to-go order ready, the COUNTER TABLET's bell lights up, the cashier
   taps WhatsApp and the ready message to the customer is already written (the cashier sends it in WhatsApp).
   Devices: kitchen screen -> counter tablet. Every country (R.C data), es/pt/en.
   Screens follow the app at the newest sim/usa-canada commit (paths under app/src/main/java/com/example/):
   kitchen screen   ui/screens/kds/KitchenDisplayScreen.kt (ticker chips, History chip, green dot, station name, leave
                    icon; adaptive 180 dp grid), ui/components/KdsTicketCard.kt (title kdsTicketTitle: typed name, else
                    "Mesa N", else the dining option's own name; waiter first name under a table; kds_status_new; items
                    "1x  name"; yellow banner MESA 4 / PARA LLEVAR), KdsTicketDetailDialog.kt (85 % x 85 % r12, title
                    26sp = the card's title, dining label 18sp at the right, status 18sp, items 20sp, CERRAR #424242 and
                    LISTO #2E7D32, 56 dp r6). After LISTO: the undo bar kds_ready_one_undo + kds_action_undo
                    (KdsUndoBar #323232, KdsUndoAction #FFD740).
   the trip         kitchen screen -> owner phone (on, Platata open) -> shop Wi-Fi -> counter tablet (SyncHostService
                    ready feed; the Wi-Fi ready ticket carries the customer, KITCHEN-3).
   counter tablet   ui/screens/mamapos/MamaPosScreen.kt:1040-1090 (left 60 %: SumaTabRow Teclado (pen) / Catálogo /
                    Ventas / Abiertas + the Notifications bell with a red Badge count; ProductLibraryView with
                    GridCells.Fixed(4); right pane: MamaSwitchPersonRow "<name> Cambiar" #007AFF + home_cart_empty).
                    Bell -> SumaBottomSheet with ui/components/MamashipNotificationPanel.kt (360 dp: header bell 18 dp +
                    orange dot #FF6D00, mamaship_panel_title 14sp bold; body #F5F5F5; card r8: "Pedido de <cliente>"
                    mamaship_order_of 16sp bold, green #25D366 button receipt_opt_whatsapp_btn 48 dp + Ignorar).
   message          ui/pos/OrderFlowActions.kt pingWhatsApp -> utils/ReadyOrderMessage.signed: order_ready_whatsapp with the
                    customer's name, in the SHOP's language, + whatsapp_signature; number = the customer's WhatsApp
                    (utils/ReadyWhatsappNumber); KdsDispatchHelper opens WhatsApp's chat with the text written; the
                    cashier taps Send (WhatsApp's own screen, drawn plainly here).
   Demo setup: a to-go order was charged at the counter tablet with the customer (saved with WhatsApp) attached;
   "Pedido listo" (Notificaciones, owner phone) left on, as it starts. */
const R = RKIT.ctx(), C = R.C, esc = RKIT.esc;
const SH = C.lang;   // the ready message is written in the shop's language
const S = {
  history:{es:"Historial",pt:"Histórico",en:"History"}, station:{es:"Cocina",pt:"Cozinha",en:"Kitchen"},
  kNew:{es:"%dm – NUEVO",pt:"%dm – NOVO",en:"%dm – NEW"}, table:{es:"Mesa %d",pt:"Mesa %d",en:"Table %d"},
  toGo:{es:"Para llevar",pt:"Para viagem",en:"To Go"},
  close:{es:"CERRAR",pt:"FECHAR",en:"CLOSE"}, ready:{es:"LISTO",pt:"PRONTO",en:"MARK READY"},
  undo1:{es:"Listo: %s",pt:"Pronto: %s",en:"Marked ready: %s"}, undo:{es:"DESHACER",pt:"DESFAZER",en:"UNDO"},
  tabs:{es:["Teclado","Catálogo","Ventas","Abiertas"],pt:["Teclado","Catálogo","Vendas","Abertas"],en:["Keypad","Library","Sales","Open"]},
  all:{es:"Todos",pt:"Todos",en:"All"}, sw:{es:"Cambiar",pt:"Trocar",en:"Switch"},
  empty:{es:"El carrito está vacío",pt:"Carrinho vazio",en:"Cart is empty"}, emptySub:{es:"agrega artículos para empezar",pt:"adicione itens para começar",en:"add items to start"},
  panel:{es:"Notificaciones y Entrega",pt:"Notificações e Entrega",en:"Notifications & Handoff"},
  orderOf:{es:"Pedido de %s",pt:"Pedido de %s",en:"%s’s order"},
  wa:{es:"WhatsApp",pt:"WhatsApp",en:"WhatsApp"}, ignore:{es:"Ignorar",pt:"Ignorar",en:"Ignore"},
  msg:{es:"¡%s, tu pedido está listo! 🎉",pt:"%s, seu pedido está pronto! 🎉",en:"%s, your order is ready! 🎉"},
  sign:{es:"Hecho con Platata · platata.app",pt:"Feito com Platata · platata.app",en:"Made with Platata · platata.app"},
  devKds:{es:"Pantalla de cocina",pt:"Tela da cozinha",en:"Kitchen screen"},
  devTab:{es:"Tablet de mostrador",pt:"Tablet do balcão",en:"Counter tablet"},
  hopNote:{es:"Pasa por tu teléfono: déjalo encendido, con Platata abierta y en el Wi-Fi del local.",
           pt:"Passa pelo seu celular: deixe-o ligado, com o Platata aberto e no Wi-Fi do restaurante.",
           en:"It goes through your phone: keep it on, with Platata open and on the restaurant's Wi-Fi."}
};
const T = (k, ...a) => { let s = R.pick(S[k]); a.forEach(v => { s = s.replace(/%[ds]/, v); }); return s; };
const TS = (k, ...a) => { let s = S[k][SH]; a.forEach(v => { s = s.replace(/%[ds]/, v); }); return s; };   // shop language
const CUST = C.people.customer, CASHIER = C.people.waiter2;
const MSG = TS("msg", CUST) + "\n\n" + TS("sign");
const DIAL = {CO:"57",MX:"52",PE:"51",CL:"56",EC:"593",AR:"54 9",PA:"507",BR:"55",US:"1",CA:"1"}[R.country];
const PHONE = "+" + DIAL + " " + C.people.phone.replace(/[()]/g,"").replace(/-/g," ").replace(/^0/,"");
const item = id => C.items.find(x=>x.id===id);
const TABLE_LINES = [{id:C.order[0]},{id:C.order[2]}];                 // Mesa 4, still cooking
const TOGO_LINES = [{id:C.order[1], q:2},{id:C.order[2], q:1}];       // the customer's to-go order
const W1 = C.people.waiter.split(" ")[0];
const ALL_C = "#607D8B";
const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const colorOf = it => (C.catOf(it.cat)||{color:ALL_C}).color;
const I = {
  logout:'<svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>',
  bell:'<svg viewBox="0 0 24 24"><path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.89 2 2 2zm6-6v-5c0-3.07-1.64-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.63 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  swacc:'<svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-6 2.5c1.93 0 3.5 1.57 3.5 3.5S15.93 11.5 14 11.5 10.5 9.93 10.5 8 12.07 4.5 14 4.5zM20 16H8v-1.5c0-1.99 4-3 6-3s6 1.01 6 3V16z"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>',
  dots:'<svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>'
};

/* ---------- kitchen screen ---------- */
function kcard(title, sub, mins, lines, banner, t){
  const body = lines.map(l=>`<div class="ki">${l.q||1}x&nbsp; ${esc(item(l.id).name)}</div>`).join("");
  return `<div class="kcard"${t?` data-t="${t}"`:""}><div class="kc"><div class="kh"><b>${esc(title)}</b><b>${esc(T("kNew",mins))}</b></div>
    ${sub?`<div class="kw">${esc(sub)}</div>`:""}<hr>${body}<div class="kb">${esc(banner.toUpperCase())}</div></div></div>`;
}
function kds(st){
  const all = [...TABLE_LINES, ...(st.ready?[]:TOGO_LINES)];
  const counts = {}; all.forEach(l=>{ counts[l.id]=(counts[l.id]||0)+(l.q||1); });
  const ticker = Object.keys(counts).map(id=>`<span class="kchip">${esc(item(id).name)} × ${counts[id]}</span>`).join("");
  let h = `<div class="kds"><div class="ktop"><div class="ktick">${ticker}</div><span class="khist">${esc(T("history"))}</span><i class="kdot"></i><span class="kst">${esc(T("station"))}</span><span class="klog">${I.logout}</span></div>
    <div class="kgrid">${kcard(T("table",4), W1, 4, TABLE_LINES, T("table",4))}${st.ready?"":kcard(T("toGo"), "", 1, TOGO_LINES, T("toGo"), "togo")}</div>
    ${st.undo?`<div class="kundo"><span>${esc(T("undo1", T("toGo")))}</span><b>${esc(T("undo"))}</b></div>`:""}</div>`;
  if(st.dialog){
    h += `<div class="kscrim"><div class="kdlg"><div class="kdh"><b>${esc(T("toGo"))}</b><span>${esc(T("toGo"))}</span></div>
      <div class="kds2">${esc(T("kNew",1))}</div><hr>
      ${TOGO_LINES.map(l=>`<div class="kdi">${l.q||1}x&nbsp; ${esc(item(l.id).name)}</div>`).join("<hr class='th'>")}
      <div class="kdf"><span class="kclose">${esc(T("close"))}</span><span class="kready" data-t="ready">${esc(T("ready"))}</span></div></div></div>`;
  }
  if(st.hop) h += RKIT.hop(R,{from:T("devKds"), to:T("devTab"), line:T("undo1", T("toGo")), note:T("hopNote")});
  return h;
}

/* ---------- counter tablet ---------- */
function tablet(st){
  const tabs = R.pick(S.tabs).map((t,i)=>`<span class="${i===1?"on":""}">${i===0?I.edit:""}${esc(t)}</span>`).join("");
  const chips = [{name:T("all"),color:ALL_C,all:true}].concat(C.catsByName).map(c=>{
    const s = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${s}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("");
  const grid = C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="ttile" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${R.money(it.price)}</span></div></div>`; }).join("");
  const n = st.cleared ? 0 : 1;
  let h = `<div class="tab"><div class="tl"><div class="ttabs"><div class="tt">${tabs}</div>
      <span class="tbell" data-t="bell">${I.bell}${n?`<i>${n}</i>`:""}</span></div>
      <div class="tchips">${chips}</div><div class="tgrid">${grid}</div></div>
    <div class="tr"><div class="tsw">${I.swacc}<b>${esc(CASHIER)}</b><span>${esc(T("sw"))}</span></div>
      <div class="tempty"><b>${esc(T("empty"))}</b><small>${esc(T("emptySub"))}</small></div></div></div>`;
  if(st.panel){
    h += `<div class="tscrim"><div class="tsheet"><i class="hdl"></i><div class="npanel">
      <div class="nph">${I.bell}${n?`<i class="nd"></i>`:""}<b>${esc(T("panel"))}</b></div>
      <div class="npb"><div class="ncard"><b>${esc(T("orderOf", CUST))}</b><div class="nrow"><span class="nwa" data-t="wa">${esc(T("wa"))}</span><span class="nig">${esc(T("ignore"))}</span></div></div></div>
    </div></div></div>`;
  }
  return h;
}
function whatsapp(st){
  const body = esc(MSG).replace(/\n/g,"<br>");
  return `<div class="wa"><div class="wahd"><span>${I.back}</span><span class="waav">${esc(CUST[0])}</span><b>${esc(PHONE)}</b><span>${I.dots}</span></div>
    <div class="wachat">${st.sent?`<div class="wabub">${body}<small>12:41 <i>✓✓</i></small></div>`:""}</div>
    <div class="wain"><div class="wabox">${st.sent?"":body}</div><span class="wasend" data-t="wa-send">${I.send}</span></div></div>`;
}

function render(st){
  if(st.screen==="kds") return kds(st);
  if(st.screen==="tablet") return tablet(st);
  if(st.screen==="wa") return whatsapp(st);
  return "";
}

RKIT.start(R, {
  id:"R11", tallVideo:true, clock:"12:41",
  endText:R.pick({es:"Así le avisas al cliente que su pedido está listo, con Platata.",pt:"Assim você avisa o cliente que o pedido está pronto, com o Platata.",en:"That's how you tell customers their order is ready, with Platata."}),
  beats:R.pick({
    es:["La cocina abre el pedido para llevar","Toca LISTO: el aviso va a la tablet","En la tablet, toca la campana","Toca WhatsApp: el mensaje ya está escrito","Así avisas que el pedido está listo"],
    pt:["A cozinha abre o pedido para viagem","Toque em PRONTO: o aviso vai ao tablet","No tablet, toque no sino","Toque em WhatsApp: a mensagem já está escrita","Assim você avisa que o pedido está pronto"],
    en:["The kitchen opens the to-go order","Tap Mark ready: the alert goes to the tablet","On the tablet, tap the bell","Tap WhatsApp: the message is already written","That's how you tell them the order is ready"]}),
  state:{screen:"kds", dialog:false, ready:false, undo:false, hop:false, panel:false, cleared:false, sent:false},
  render,
  device: st => st.screen==="kds" ? "kds" : "tablet",
  who: st => st.screen==="kds" ? T("devKds") : T("devTab"),
  steps:[
    {beat:0, hint:R.pick({es:"Toca el pedido Para llevar",pt:"Toque no pedido Para viagem",en:"Tap the To Go order"}), target:'[data-t="togo"]',
      tap(st){ st.dialog=true; }},
    {beat:1, hint:R.pick({es:"Toca LISTO",pt:"Toque em PRONTO",en:"Tap Mark ready"}), target:'[data-t="ready"]',
      tap(st,E){ st.dialog=false; st.ready=true; st.undo=true;
        E.after(2200,()=>{ st.hop=true; }); E.after(4000,()=>{ st.hop=false; st.undo=false; st.screen="tablet"; }); }},
    {beat:2, hint:R.pick({es:"Toca la campana",pt:"Toque no sino",en:"Tap the bell"}), target:'[data-t="bell"]',
      tap(st){ st.panel=true; }},
    {beat:3, hint:R.pick({es:"Toca WhatsApp",pt:"Toque em WhatsApp",en:"Tap WhatsApp"}), target:'[data-t="wa"]',
      tap(st){ st.panel=false; st.cleared=true; st.screen="wa"; }},
    {beat:3, hint:R.pick({es:"Toca enviar en WhatsApp",pt:"Toque em enviar no WhatsApp",en:"Tap send in WhatsApp"}), target:'[data-t="wa-send"]',
      tap(st,E){ st.sent=true; E.after(2600,()=>{}); }}
  ]
});
</script>

.kclose{background:#424242} .kready{background:#2E7D32}
/* ---- counter tablet (landscape): MamaPosScreen.kt, SumaTabRow, ProductLibraryView Fixed(4), MamaSwitchPersonRow ---- */
.tab{flex:1;min-height:0;display:flex;background:#fff;position:relative}
