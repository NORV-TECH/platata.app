const TABLE = 7;

const TOTAL = D1.price + D2.price;
const OWNER = C.owner;
const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const ALL_C = "#607D8B";
const colorOf = it => (C.catOf(it.cat)||{color:ALL_C}).color;

/* ---- PrintManager.kt:311-323 + 339-430, reproduced: the same arithmetic on the same 32 columns ---- */
const plain = s => String(s).replace(/[  ]/g," ");
const money = v => plain(R.money(v));
const center = t => " ".repeat(Math.max(0, Math.floor((W - t.length)/2))) + t;
const leftRight = (l, r) => { const gap = W - l.length - r.length; return gap > 0 ? l + " ".repeat(gap) + r : l.slice(0, Math.max(0, W - r.length - 1)) + " " + r; };
const divider = () => "-".repeat(W);
const hardWrap = t => { const out=[]; for(let i=0;i<t.length;i+=W) out.push(t.slice(i,i+W)); return out; };   // a line longer than the paper: the printer breaks it
const wrapWords = t => { const out=[]; let cur=""; t.split(" ").forEach(wd=>{ if(!cur) cur=wd; else if((cur+" "+wd).length<=W) cur+=" "+wd; else { out.push(cur); cur=wd; } }); if(cur) out.push(cur); return out; };   // TicketWrap.wrap
function testPage(){
  return [center(C.place.slice(0,W)), divider(), center(L.tTitle.toLocaleUpperCase(R.lang)), L.tPrinter(PNAME).slice(0,W), "2026-10-20 12:41", divider(),
    ...hardWrap(L.tOk), "áéíóú ÁÉÍÓÚ ñÑ üÜ çÇ ãõ ¿¡".slice(0,W), "1234567890".repeat(4).slice(0,W)].join("\n");
}
function receipt(){
  const lines = [center(C.place.toLocaleUpperCase(R.lang)), center(L.rDate), divider()];
  [D1, D2].forEach(it => { const qty = "1x", price = money(it.price), nameMax = W - qty.length - price.length - 2;
    lines.push(leftRight(`${qty} ${it.name.slice(0, Math.max(0, nameMax))}`, price)); });
  lines.push(divider(), leftRight(L.rTotal, money(TOTAL)), divider(), center(L.cash.toLocaleUpperCase(R.lang)), divider());
  wrapWords("Thank you for shopping with us!").forEach(l => lines.push(center(l)));
  return lines.join("\n");
}
function comanda(){
  const lines = [center(L.oTicket.toLocaleUpperCase(R.lang)), center("12:41"), center(`${L.oTable.toLocaleUpperCase(R.lang)} ${TABLE}`),
    center(`${L.oWaiter}: ${OWNER}`.slice(0,W)), divider()];
  [D1, D2].forEach(it => { const head = "1x  "; wrapWords(head + it.name).forEach((l,i)=>lines.push(i ? " ".repeat(head.length) + l : l)); });
  lines.push(divider());
  return lines.join("\n");
}

  if(st.step===3) return frame(3, `<div class="p0q">${esc(L.whatQ)}</div>

  const grid = `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);

  const n = st.lines.length, tot = st.lines.reduce((s,p)=>s+p.price,0);
  return `<div class="p0pg"><div class="mtabs"><span>${esc(L.tabs[0])}</span><span class="on">${esc(L.tabs[1])}</span></div>${cats}${grid}

function paper(st){
  if(st.paper==="test") return `<div class="p0paper"><span class="lab">${esc(L.tTitle)}</span><div class="p0slip feed">${esc(testPage())}</div></div>`;
  return `<div class="p0paper"><span class="lab">${esc(L.slipRec)}</span><div class="p0slip feed">${esc(receipt())}</div>

function render(st){
  if(st.paper) return paper(st);
  switch(st.screen){
    case "printers": return printers(st);
    case "add":      return addFlow(st);
    case "sell":     return sell(st);
    case "table":    return tables();
    case "pay":      return pay();
    default:         return complete();
  }
}
