   empleado -> Conectar -> Invitado + "Código del negocio X · PIN Y" -> Enviar invitación by WhatsApp), then the
   WAITER's phone joins with the business code and his PIN and lands on the sell screen. Two devices, every country.
   Screens follow the app at the newest sim/usa-canada commit (paths under app/src/main/java/com/example/):
   owner Home       ui/screens/home/HomeScreen.kt:598-700 (TabRow Teclado | Catálogo, then ConnectNudgeStrip
                    ui/screens/home/ConnectNudge.kt:31-55: 48 dp, primaryContainer #F2F2F7, nudge_connect_title
                    labelLarge bold, text buttons nudge_connect_cta (bold) + nudge_connect_later, labelMedium).
                    Shown on the owner's phone while no tablet register or employee phone is connected
                    (sync/ConnectNudgeRule, every country); assumed: register open, empty sale.
   chooser          ui/screens/connections/ConnectionDialogs.kt:142-195 ConnectChooserSheet (paper sheet: h2
                    conn_choose_title; rows surface + line border r14, 46 dp accent tile, rowTitle + body muted;
                    "Ahora no" conn_not_now).
   pick page        ui/screens/connections/ConnectEmployeePhoneScreen.kt:120-265 (paper page, restaurant accent;
                    SumaTopBar paper conn_pick_title; h2 conn_pick_question; row: initial on accentSoft, name
                    rowTitle SemiBold, the job title or team_badge_team "Equipo" muted (PersonName.displayJobTitle), FilledAccent small "Conectar" 108 dp;
                    after Conectar: pill team_status_invited (#F6EED8 / #8A6712), line conn_pick_next_step
                    "Código del negocio X · PIN Y" ink2, TextButton conn_pick_send_invite; conn_pick_add_employee;
                    conn_pick_note only where connections are paid, i.e. not US/CA).
   invite           utils/StaffInviteShare.kt send(): WhatsApp opened on the employee's saved number with
                    phone_reg_share_message (shop, Play link, business code, PIN) signed with whatsapp_signature
                    (WASIG-1); the owner taps Send in WhatsApp (WhatsApp's own screen, drawn plainly here).
   waiter phone     ui/screens/onboarding/BusinessStartScreen.kt:210-400 (welcome: brandMark, Tata on the cream
                    disc, welcome_hero_title / welcome_hero_subtitle, Brand button welcome_start_cta, link
                    welcome_already_link; sheet welcome_sheet_title + 3 door cards), ui/screens/auth/
                    GoogleAuthScreen.kt:480-560 (EmployeeGoogleStep: Tata thumbs-up on #E3EEF0, h1
                    auth_employee_welcome_title, sub, Google button auth_google_btn, footnote with **Equipo**, terms
                    line), Google's account chooser (not drawn), no workplace yet -> ui/screens/onboarding/
                    EmployeeJoinScreen.kt:150-230 (h1 join_biz_title, sub, CÓDIGO DEL NEGOCIO boxes 5-5, TU PIN 4
                    boxes with dots, join_biz_pin_hint, Brand/Off button join_biz_button) -> OnboardingNavGraph
                    onJoined: markSkipMiniPosPinOnce -> MiniPosHome = the sell screen (MiniPosSellScreen.kt).
   Demo setup: the waiter is on the Team list with his WhatsApp number; the register is open. */

  chooseTitle:{es:"¿Qué quieres conectar?",pt:"O que você quer conectar?",en:"What do you want to connect?"},

  heroSub:{es:"Vende, cobra y lleva tus cuentas desde el celular. Empezar es gratis.",pt:"Venda, cobre e mantenha suas contas pelo celular. Começar é grátis.",en:"Sell, charge and keep your books from your phone. Starting is free."},
  start:{es:"Empezar mi negocio",pt:"Começar meu negócio",en:"Start my business"},
  already:{es:"Ya uso Platata",pt:"Já uso o Platata",en:"I already use Platata"},
  sheetTitle:{es:"¿Cómo entras hoy?",pt:"Como você entra hoje?",en:"How are you getting in today?"},
  work:{es:"Trabajo en un negocio",pt:"Trabalho em um negócio",en:"I work at a business"},
  workSub:{es:"Con el código del negocio y tu PIN. Sirve cualquier cuenta de Google",pt:"Com o código do negócio e seu PIN. Qualquer conta do Google serve",en:"Use the business code and your PIN. Any Google account works"},
  restore:{es:"Recuperar mi negocio",pt:"Recuperar meu negócio",en:"Restore my business"},
  restoreSub:{es:"En un celular nuevo, desde tu respaldo",pt:"Em um celular novo, a partir do seu backup",en:"On a new phone, from your backup"},
  conn:{es:"Conectar una tablet o pantalla de cocina",pt:"Conectar um tablet ou tela de cozinha",en:"Connect a tablet or kitchen screen"},
  connSub:{es:"Tablet de mostrador o pantalla de cocina",pt:"Tablet de balcão ou tela de cozinha",en:"Counter tablet or kitchen display"},
  welcomeTeam:{es:"¡Bienvenido al equipo!",pt:"Bem-vindo à equipe!",en:"Welcome to the team!"},
  welcomeSub:{es:"Entra con cualquier cuenta de Google. La primera vez necesitas el código del negocio y tu PIN.",pt:"Entre com qualquer conta do Google. Na primeira vez você precisa do código do negócio e do seu PIN.",en:"Sign in with any Google account. The first time you need the business code and your PIN."},
  google:{es:"Continuar con Google",pt:"Continuar com o Google",en:"Continue with Google"},
  notInvited:{es:"¿Primera vez? Pídele al dueño el código del negocio y tu PIN. Los encuentra en %s.",pt:"Primeira vez? Peça ao dono o código do negócio e o seu PIN. Ele encontra em %s.",en:"First time? Ask the owner for the business code and your PIN. The owner finds them in %s."},
  team:{es:"Equipo",pt:"Equipe",en:"Team"},
  terms:{es:"Al continuar aceptas los %s y la %s.",pt:"Ao continuar, você aceita os %s e a %s.",en:"By continuing you accept the %s and the %s."},
  termsT:{es:"Términos",pt:"Termos de serviço",en:"Terms"}, termsP:{es:"Política de privacidad",pt:"Política de privacidade",en:"Privacy Policy"},
  joinTitle:{es:"Únete a tu negocio",pt:"Entre no seu negócio",en:"Join your business"},
  joinSub:{es:"Pídele al dueño el código del negocio. Lo ve en Mi negocio › Equipo.",pt:"Peça ao dono o código do negócio. Ele vê em Meu negócio › Equipe.",en:"Ask the owner for the business code. They can see it in My business › Team."},

  join:{es:"Unirme",pt:"Entrar",en:"Join"},
  tabs:{es:["Catálogo","Ventas","Abiertas"],pt:["Catálogo","Vendas","Abertas"],en:["Library","Sales","Open"]},
  devOwner:{es:"Tu teléfono",pt:"Seu celular",en:"Your phone"},
  devEmp:{es:"Teléfono de empleado",pt:"Celular de funcionário",en:"Employee phone"},
  hopLine:{es:"Invitación por WhatsApp",pt:"Convite pelo WhatsApp",en:"Invitation by WhatsApp"},
  hopNote:{es:"Lleva el código del negocio y su PIN.",pt:"Leva o código do negócio e o PIN dele.",en:"It carries the business code and their PIN."}
};
const T = (k, ...a) => { let s = R.pick(S[k]); a.forEach(v => { s = s.replace(/%[ds]/, v); }); return s; };
const CODE = "7Q2KM4XW9D", PIN = "2580";
const W = C.people.waiter, W2 = C.people.waiter2, WFIRST = W.split(" ")[0];
const FREE = R.country==="US" || R.country==="CA";                         // sync/Entitlement.countryIsFree
const PLAY = "https://play.google.com/store/apps/details?id=tata.fijando.su.plata";
const INVITE = T("invite", C.place, PLAY, CODE, PIN) + "\n\n" + T("sign");
const ALL_C = "#607D8B";
const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const colorOf = it => (C.catOf(it.cat)||{color:ALL_C}).color;
const I = {

  edit:'<svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>',
  cart:'<svg class="mi" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>',
  receipt:'<svg class="mi" viewBox="0 0 24 24"><path d="M18 17H6v-2h12v2zm0-4H6v-2h12v2zm0-4H6V7h12v2zM3 22l1.5-1.5L6 22l1.5-1.5L9 22l1.5-1.5L12 22l1.5-1.5L15 22l1.5-1.5L18 22l1.5-1.5L21 22V2l-1.5 1.5L18 2l-1.5 1.5L15 2l-1.5 1.5L12 2l-1.5 1.5L9 2 7.5 3.5 6 2 4.5 3.5 3 2v20z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  tablet:'<svg viewBox="0 0 24 24"><path d="M21 4H3c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h18c1.1 0 1.99-.9 1.99-2L23 6c0-1.1-.9-2-2-2zm-2 14H5V6h14v12z"/></svg>',
  phone:'<svg viewBox="0 0 24 24"><path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>',
  dots:'<svg viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
  gente:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.7" stroke-linecap="round"><circle cx="9" cy="8.5" r="3"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M3.5 19c.8-3.2 3-5 5.5-5s4.7 1.8 5.5 5M14 15.2c.8-.5 1.6-.7 2.5-.7 2 0 3.6 1.4 4.2 4.5"/></svg>',
  nube:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.7" stroke-linejoin="round"><path d="M7 18h10.5a4 4 0 0 0 .4-8A6 6 0 0 0 6.4 9.3 4.4 4.4 0 0 0 7 18z"/></svg>',
  caja:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.7" stroke-linejoin="round"><rect x="4" y="5" width="16" height="11" rx="1.5"/><path d="M8 20h8M12 16v4"/></svg>',
  g:'<svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.5 12.3c0-.8-.1-1.5-.2-2.3H12v4.3h5.9a5 5 0 0 1-2.2 3.3v2.8h3.5c2.1-1.9 3.3-4.7 3.3-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.5-2.8c-1 .7-2.3 1.1-3.8 1.1-2.9 0-5.4-2-6.3-4.7H2.1v2.9A11 11 0 0 0 12 23z"/><path fill="#FBBC05" d="M5.7 13.9a6.6 6.6 0 0 1 0-4.2V6.8H2.1a11 11 0 0 0 0 9.9z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.1-3.1A11 11 0 0 0 2.1 6.8l3.6 2.9C6.6 7.2 9.1 5.4 12 5.4z"/></svg>'
};
/* the four business-type stickers around Tata (BusinessStartScreen.kt WelcomeHero: ic_drawn_hamburguesa, _carrito, _tijeras, _edificio), drawn plainly */
const HERO = {
  burger:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.6" stroke-linejoin="round"><path d="M4 10a8 5 0 0 1 16 0z" fill="#F2C46D"/><path d="M3.5 13h17" stroke="#6B8E23" stroke-width="2.2"/><path d="M4.5 15.5h15v1.5a2.5 2.5 0 0 1-2.5 2.5H7a2.5 2.5 0 0 1-2.5-2.5z" fill="#F2C46D"/></svg>',
  cart:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4h2.5l2.2 10.5h10.3L20 7.5H6.4"/><circle cx="9" cy="19" r="1.6"/><circle cx="17" cy="19" r="1.6"/></svg>',
  scissors:'<svg viewBox="0 0 24 24" fill="none" stroke="#1F2933" stroke-width="1.6" stroke-linecap="round"><circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M8.3 15.8 18 4M15.7 15.8 6 4"/></svg>',

};
/* Tata, drawn plainly (the app's PaperPotato art is a drawable; this is a stand-in of the same character) */
const potato = (thumb) => `<svg viewBox="0 0 120 120"><ellipse cx="60" cy="64" rx="38" ry="44" fill="#D9A66A"/><circle cx="47" cy="56" r="4.6" fill="#3A2A1F"/><circle cx="73" cy="56" r="4.6" fill="#3A2A1F"/>
  <path d="M48 74q12 9 24 0" stroke="#3A2A1F" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="36" cy="80" r="2.5" fill="#B07F48"/><circle cx="82" cy="40" r="2.2" fill="#B07F48"/>
  ${thumb?'<path d="M96 70c6-2 9 3 6 8l-2 4c3 1 3 6-1 7h-9c-3 0-4-3-4-6v-7c0-3 2-5 4-6l3-6c2-3 6-2 6 1z" fill="#D9A66A" stroke="#3A2A1F" stroke-width="2.4" stroke-linejoin="round"/>':'<path d="M20 58c-6-4-9-12-5-15 3-2 7 2 9 8" fill="#D9A66A" stroke="#3A2A1F" stroke-width="2.4" stroke-linecap="round"/>'}</svg>`;

/* ---------- owner phone ---------- */
const cats = () => `<div class="mcats">` + [{name:T("all"),color:ALL_C,all:true}].concat(C.catsByName).map(c=>{
    const s = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${s}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
const grid = () => `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${R.money(it.price)}</span></div></div>`; }).join("") + `</div>`;
function ownerHome(st){
  let h = `<div class="otabs"><span>${I.edit}${esc(T("keypad"))}</span><span class="on">${esc(T("library"))}</span></div>
    <div class="nudge"><b>${esc(T("nudge"))}</b><span class="cta" data-t="nudge-connect">${esc(T("connect"))}</span><span>${esc(T("later"))}</span></div>`
    + cats() + grid()
    + `<div class="opair"><span class="b2 off">${esc(T("save"))}</span><span class="b1 off">${esc(T("charge", R.money(0)))}</span></div>`
    + `<div class="mnav"><div class="on"><span class="pill">${I.cart}</span>${esc(T("register"))}</div><div><span class="pill">${I.receipt}</span>${esc(T("sales"))}</div><div><span class="flagc">${R.flag()}</span>${esc(T("myBiz"))}</div></div>`;
  if(st.sheet) h += `<div class="mscrim"><div class="psheet"><i class="hdl"></i><h2>${esc(T("chooseTitle"))}</h2>
      <div class="copt"><span class="ctile">${I.tablet}</span><div><b>${esc(T("optReg"))}</b><small>${esc(T("optRegD"))}</small></div></div>
      <div class="copt" data-t="opt-phone"><span class="ctile">${I.phone}</span><div><b>${esc(T("optPhone"))}</b><small>${esc(T("optPhoneD"))}</small></div></div>
      <div class="cnot">${esc(T("later"))}</div></div></div>`;
  return h;
}
function pickRow(name, id, st){
  const inv = st.invited && id===1;
  return `<div class="prow2"><div class="ptop"><span class="pav">${esc(name.trim()[0].toUpperCase())}</span><div class="pn"><b>${esc(name)}</b><small>${esc(T("cashier"))}</small></div>
      ${inv ? `<span class="ppill">${esc(T("invited"))}</span>` : `<span class="pbtn"${id===1?' data-t="pick-connect"':""}>${esc(T("connect"))}</span>`}</div>
    ${inv ? `<div class="pnext">${esc(T("nextStep", CODE, PIN))}</div><span class="plink2" data-t="send-invite">${esc(T("sendInvite"))}</span>` : ""}</div>`;
}
function pick(st){
  return `<div class="paper"><div class="ptb"><span class="pib">${I.back}</span><b>${esc(T("pickTitle"))}</b></div>
    <div class="pbody"><h2>${esc(T("pickQ"))}</h2>${pickRow(W,1,st)}${pickRow(W2,2,st)}
      <span class="plink2">${esc(T("addEmp"))}</span>${FREE?"":`<small class="pnote">${esc(T("costNote"))}</small>`}</div></div>`;
}
function whatsapp(st){
  const body = esc(INVITE).replace(/\n/g,"<br>");
  return `<div class="wa"><div class="wahd"><span class="wab">${I.back}</span><span class="waav">${esc(WFIRST[0])}</span><b>${esc(W)}</b><span class="wam">${I.dots}</span></div>
    <div class="wachat">${st.sent?`<div class="wabub">${body}<small>12:41 <i>✓✓</i></small></div>`:""}</div>
    <div class="wain"><div class="wabox">${st.sent?"":body}</div><span class="wasend" data-t="wa-send">${I.send}</span></div></div>`;
}

/* ---------- waiter phone ---------- */
function welcome(st){
  let h = `<div class="paper"><div class="wbody"><div class="wmark">Platata</div>
    <div class="whero"><i class="wdisc"></i><span class="wtata">${potato(false)}</span>
      <span class="wt t1">${HERO.burger}</span><span class="wt t2">${HERO.cart}</span><span class="wt t3">${HERO.scissors}</span><span class="wt t4">${HERO.building}</span></div>
    <div class="wtitle">${esc(T("heroTitle"))}</div><div class="wsub">${esc(T("heroSub"))}</div></div>
    <div class="wfoot"><span class="bbrand">${esc(T("start"))}</span><span class="wlink" data-t="already">${esc(T("already"))}</span></div></div>`;
  if(st.sheet2) h += `<div class="mscrim"><div class="psheet"><i class="hdl"></i><h2>${esc(T("sheetTitle"))}</h2>

function gstep(st){

  return `<div class="paper"><div class="ptb"><span class="pib">${I.back}</span></div>

}
function joinStep(st){
  const code = st.code, act = code.length;
  const slot = i => `<span class="cs${i===act && st.typing==="code"?" act":""}">${esc(code[i]||"")}</span>`;
  const grp = from => `<div class="cg">${[0,1,2,3,4].map(k=>slot(from+k)).join("")}</div>`;
  const pins = [0,1,2,3].map(i=>`<span class="ps${i===st.pin && st.typing==="pin"?" act":""}">${i<st.pin?"<i></i>":""}</span>`).join("");
  const ready = code.length===CODE.length && st.pin===4;
  return `<div class="paper"><div class="ptb"><span class="pib">${I.back}</span></div>
    <div class="jbody"><h1 class="ph1">${esc(T("joinTitle"))}</h1><p class="psub">${esc(T("joinSub"))}</p>

function sell(){

}

function render(st){
  let h = "";
  if(st.screen==="ohome") h = ownerHome(st);
  else if(st.screen==="pick") h = pick(st);
  else if(st.screen==="wa") h = whatsapp(st);
  else if(st.screen==="welcome") h = welcome(st);
  else if(st.screen==="gstep") h = gstep(st);
  else if(st.screen==="join") h = joinStep(st);
  else if(st.screen==="sell") h = sell(st);
  if(st.hop) h += RKIT.hop(R,{from:T("devOwner"), to:T("devEmp"), line:T("hopLine"), note:T("hopNote")});
  return h;
}
