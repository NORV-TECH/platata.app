/* ---- SumaTopBar (ui/components/SumaTopBar.kt): 64 dp, nav 48, title titleLarge bold, action at the end ---- */
function topbar(o){ o=o||{};
  const nav = o.nav ? `<span class="nb" data-t="${o.navT||"nav"}">${o.nav==="close"?I.close:I.back}</span>` : "";
  const title = o.html || (o.sub ? `<b class="two">${esc(o.title)}</b><small>${esc(o.sub)}</small>` : esc(o.title||""));
  return `<div class="x-top"><div class="tt${o.nav?"":" nonav"}${o.sub?" hs":""}">${nav}<div class="t">${title}</div></div>${o.action||""}</div>`;
}
/* ---- SUPPORT-3 strip (ui/screens/reports/SupportStrip.kt): every LEVEL_2_PLUS page, under the page; hidden while the keyboard is up ---- */
const strip = () => `<div class="x-strip"><div class="h"><span class="bd">${I.support}</span><span class="tx"><b>${esc(P(W.support))}</b><small>${esc(P(W.supportSub))}</small></span></div>
  <i class="dv"></i><div class="h"><span class="tx"><b>${esc(P(W.myReports))}</b><small>${esc(P(W.noReports))}</small></span><span class="cv">${I.chev}</span></div></div>`;
/* ---- the phone's own keyboard (Gboard look; NOT the app). Hides the strip, as the app does (rememberImeVisible) ---- */
function kbd(kind){
  const row = (keys, cls) => `<div class="r">${keys.map(k=>`<span class="${cls||""}${k.length>1?" w":""}">${esc(k)}</span>`).join("")}</div>`;
  if(kind==="num"){
    const sep = (CUR_LOC[C.cur]||C.loc).startsWith("en") ? "." : ",";
    return `<div class="x-kbd num">${row(["1","2","3","−"])}${row(["4","5","6","␣"])}${row(["7","8","9","⌫"])}${row([sep,"0",".","↵"])}</div>`;
  }
  return `<div class="x-kbd">${row("qwertyuiop".split(""))}${row("asdfghjklñ".split(""))}${row(["⇧"].concat("zxcvbnm".split("")).concat(["⌫"]))}${row(["?123",",","          ",".","↵"])}</div>`;
}
/* ---- OutlinedTextField (M3, shape extraSmall 6 dp, outline #C7C7CC; focused 2 dp primary; error #FF3B30) ---- */
function field(o){ o=o||{};
  const cls = ["x-f"]; if(o.foc) cls.push("foc"); if(o.err) cls.push("err"); if(o.ro) cls.push("ro");
  const v = o.value!=null && o.value!=="" ? `<span class="v">${esc(o.value)}${o.foc?'<i class="caret"></i>':""}</span>` : `<span class="v ph">${o.foc?'<i class="caret"></i>':""}${esc(o.ph||"")}</span>`;
  const lab = o.label ? `<label class="${o.value||o.foc?"up":""}">${esc(o.label)}</label>` : "";
  return `<div class="${cls.join(" ")}" ${o.t?`data-t="${o.t}"`:""} style="${o.style||""}">${lab}${v}${o.sfx?`<span class="sfx">${esc(o.sfx)}</span>`:""}${o.trail||""}</div>${o.sup?`<div class="x-sup${o.err?" e":""}">${esc(o.sup)}</div>`:""}`;
}
/* ---- SumaButton: 52 dp min, radius 12 (pill 26), primary #1C1C1E / outlined; disabled = M3 12 % / 38 % ---- */
const btn = (text, o) => { o=o||{}; return `<div class="x-btn${o.pill?" pill":""}${o.sec?" sec":""}${o.off?" off":""}" ${o.t?`data-t="${o.t}"`:""} style="${o.style||""}">${esc(text)}</div>`; };
/* ---- owner phone bottom bar: Caja / Ventas / the flag "Mi negocio" (ui/app/PlatataApp.kt NavigationBar, navLabelRes) ---- */
const ownerNav = () => `<div class="mnav"><div class="on"><span class="pill">${I.cart}</span>${esc(P(W.register))}</div><div><span class="pill">${I.receipt}</span>${esc(P(W.sales))}</div><div><span class="flagc">${R.flag()}</span>${esc(P(W.myBiz))}</div></div>`;
const staffNav = () => `<div class="mnav"><div class="on"><span class="pill">${I.cart}</span>${esc(P(W.register))}</div><div><span class="flagc">${R.flag()}</span>${esc(P(W.myBiz))}</div></div>`;
/* category chips: ProductLibraryView.kt:213-280 ("Todos" first, then the categories sortOrder, name) */
const chipsRow = (selId) => `<div class="mcats">` + [{id:0,name:P(W.all),color:ALL_C}].concat(C.catsByName).map(c=>{
    const on = (selId||0)===c.id;
    const st = on ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${st}" data-t="chip-${c.id}">${on?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
/* a dish tile: ProductCard.kt (plain tile: tint 12 %, border 35 %, titleMedium bold, price bodyLarge; photo tile: crop + black gradient, titleSmall white) */
function tile(it, o){ o=o||{}; const c=colorOf(it); const price = R.money(o.price!=null?o.price:it.price);
  if(o.photo) return `<div class="mtile ph" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><img src="${o.photo}" alt=""><div class="gr"><b>${esc(it.name)}</b><span>${price}</span></div></div>`;
  return `<div class="mtile" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${price}</span></div>${o.badge?`<em class="cb">${esc(o.badge)}</em>`:""}</div>`;
}
const snack = (text, bottom) => `<div class="msnack" style="bottom:calc(var(--u)*${bottom})">${esc(text)}</div>`;

const dishCount = (c, extra) => inCat(c).length + (extra||0);
function yourMenu(o){ o=o||{};
  const nItems = C.items.length + (o.extraDishes||0);
  const cards = C.catsByName.map(c => { const n = dishCount(c, (o.extraIn===c.id)?1:0);
    return `<div class="ymc" data-t="cat-${c.id}"><b>${esc(c.name)}</b><small>${esc(n===1?P(YM.one):fmt(P(YM.n),n))}</small></div>`; }).join("")
    + `<div class="ymc add"><span>+</span><small>${esc(P(YM.addCat))}</small></div>`;
  const used = o.addons||0, combos = o.combos||0;
  return `<div class="x-col tint"><div class="ymh"><span class="nb">${I.back}</span><b>${esc(fmt(P(YM.pill), nItems, C.cats.length))}</b><span class="pl">＋</span></div>

      <div class="row" data-t="row-addons"><div><b>${esc(P(YM.addons))}</b><small>${esc(used===1?P(YM.inUse1):fmt(P(YM.inUse),used))}</small></div><span class="pc">+</span></div>

function waiterSell(o){ o=o||{};
  const tabs = `<div class="mtabs">${P(WT.tabs).map((t,i)=>`<span class="${i===0?"on":""}">${esc(t)}</span>`).join("")}</div>`;
  const grid = `<div class="mgrid">` + C.itemsByName.map(it=>tile(it)).join("") + `</div>`;
  let h = tabs + chipsRow(0) + grid + `<div class="mlink"><span>${esc(P(W.keypadTab))}</span></div>`;

  newPre:{es:"Nuevo",pt:"Novo",en:"New"}, dish:{es:"Plato",pt:"Prato",en:"Dish"}, create:{es:"Crear",pt:"Criar",en:"Create"},
  addPhoto:{es:"Agregar foto",pt:"Adicionar foto",en:"Add Photo"},
  name:{es:"Nombre",pt:"Nome",en:"Name"}, price:{es:"Precio",pt:"Preço",en:"Price"}, category:{es:"Categoría",pt:"Categoria",en:"Category"},
  addons:{es:"Adiciones",pt:"Adicionais",en:"Add-ons"}, none:{es:"Ninguna",pt:"Nenhum",en:"None"},
  del:{es:"Eliminar plato",pt:"Excluir prato",en:"Delete dish"}
};
const T = (k, ...a) => fmt(P(S[k]), ...a);
/* the edited dish (the category's first) and its new price; the new dish typed by hand (owner's words, the country's language) */
const ED_PRICE = {CO:40000,MX:99,PE:40,CL:9500,EC:7,AR:15500,PA:13,BR:49.9,US:15,CA:19};
const NEWD = {CO:["Mojarra frita",36000],MX:["Mole poblano",145],PE:["Seco de res",34],CL:["Porotos granados",7900],EC:["Guatita",6],
  AR:["Asado de tira",19000],PA:["Guacho de mariscos",11],BR:["Bife acebolado",38],US:["Fried chicken",13.5],CA:["Shepherd's pie",16]};
const ED = inCat(MAIN)[0];
const NEW = {id:"new", cat:MAIN.name, name:NEWD[R.country][0], price:NEWD[R.country][1]};
function catRows(st){
  const list = inCat(MAIN).map(it => it.id===ED.id ? Object.assign({}, it, {price: st.edPrice}) : it);
  if(st.added) list.splice(st.movedUp ? list.length-1 : list.length, 0, NEW);
  return list;
}
function catPage(st){
  const list = catRows(st);
  const act = `<div class="act"><span class="nb">${I.more}</span><span class="blk" data-t="cat-add">＋</span></div>`;
  const ord = `<div class="x-ord">${st.ordering?`<span class="h">${esc(T("orderHint"))}</span>`:`<span class="sp"></span>`}<span class="tb" data-t="order">${esc(st.ordering?T("orderDone"):P(YM.order))}</span></div>`;
  const rows = list.map((it,i)=>`<div class="x-li" data-t="row-${it.id}"><span class="th"></span><div class="tx"><b>${esc(it.name)}</b><small>${esc(R.money(it.price))}</small></div>
      ${st.ordering?`<span class="ar${i===0?" off":""}" data-t="up-${it.id}">${I.up}</span><span class="ar${i===list.length-1?" off":""}">${I.down}</span>`:""}</div>`).join("");
  return `<div class="x-col tint">${topbar({nav:"back", title:MAIN.name, action:act})}${ord}<div class="x-list">${rows}</div><div class="x-scroll"></div>${strip()}</div>`;
}
function form(st, isNew){
  const top = isNew
    ? topbar({nav:"close", html:`${esc(T("newPre"))} <span style="color:#007AFF">${esc(T("dish"))}</span>`})
    : topbar({nav:"back", navT:"form-back", title:T("editTitle"), action:`<span class="st" style="color:${st.status==="saving"?"#6E6E73":"#2E7D32"}">${esc(st.status==="saving"?T("saving"):T("saved"))}</span>`});
  const name = isNew ? st.nName : ED.name, priceTxt = isNew ? st.nPrice : st.edTyped;
  const foc = st.focus;
  const body = `<div class="x-form">
    <div class="r1"><div class="pb"><i>${I.addPhoto}</i><small>${esc(T("addPhoto"))}</small></div>
      ${field({label:T("name"), value:name, foc:foc==="name", t:"f-name", style:"flex:1"})}</div>
    <div class="r2"><div style="flex:1;min-width:0">${field({label:T("price"), value:priceTxt, foc:foc==="price", t:"f-price"})}</div>
      <div style="flex:1;min-width:0">${field({label:T("category"), value:MAIN.name, trail:`<span class="tr">${I.drop}</span>`})}</div></div>
    <div class="x-addons"><i>${I.list}</i><div><b>${esc(T("addons"))}</b><small>${esc(T("none"))}</small></div><span>${I.chev}</span></div>
    ${isNew ? btn(T("create")+" "+T("dish").toLowerCase(), {pill:true, off:!(st.nName && st.nPrice), t:"create"}) : `<div class="x-del">${esc(T("del"))}</div>`}
  </div>`;
  return `<div class="x-col">${top}${body}<div class="x-scroll"></div>${st.focus ? kbd(st.focus==="price"?"num":"text") : strip()}</div>`;
}
function render(st){
  if(st.screen==="menu") return yourMenu({});
  if(st.screen==="cat") return catPage(st);
  if(st.screen==="edit") return form(st, false);
  if(st.screen==="new") return form(st, true);
  return "";
}

  id:"R2", tallVideo:true, clock:"12:41",

    pt:["Seu cardápio: toque numa categoria","Toque num prato para mudar","Mude o preço: salva sozinho","Com o + você adiciona um prato aqui","Escreva o nome e o preço","Toque em Criar prato","Ordenar muda a ordem no caixa","Assim você edita seu cardápio, com o Platata."],
    en:["Your menu: tap a category","Tap a dish to change it","Change the price: it saves itself","Tap + to add a dish here","Type the name and the price","Tap Create dish","Reorder changes the order on the register","That's how you edit your menu, with Platata."]}),
  state:{screen:"menu", edPrice:ED.price, edTyped:inputForm(ED.price), status:"saved", focus:null, added:false, movedUp:false, ordering:false, nName:"", nPrice:""},
  render,
  device: () => "phone",

    {beat:0, hint:P({es:"Toca ",pt:"Toque em ",en:"Tap "})+MAIN.name, target:`[data-t="cat-${MAIN.id}"]`, tap(st){ st.screen="cat"; }},
    {beat:1, hint:P({es:"Toca ",pt:"Toque em ",en:"Tap "})+ED.name, target:`[data-t="row-${ED.id}"]`, tap(st){ st.screen="edit"; }},

    {beat:2, hint:P({es:"Toca la flecha para volver",pt:"Toque na seta para voltar",en:"Tap the arrow to go back"}), target:'[data-t="form-back"]', tap(st){ st.focus=null; st.screen="cat"; }},
    {beat:3, hint:P({es:"Toca el +",pt:"Toque no +",en:"Tap the +"}), target:'[data-t="cat-add"]', tap(st){ st.screen="new"; }},
    {beat:4, hint:P({es:"Toca Nombre",pt:"Toque em Nome",en:"Tap Name"}), target:'[data-t="f-name"]', tap(st,E){ st.focus="name"; E.after(300,()=>E.type("nName", NEW.name, null, 75)); }},
    {beat:4, hint:P({es:"Toca Precio",pt:"Toque em Preço",en:"Tap Price"}), target:'[data-t="f-price"]', tap(st,E){ st.focus="price"; E.after(300,()=>E.type("nPrice", inputForm(NEW.price), null, 150)); }},
    {beat:5, hint:P({es:"Toca Crear plato",pt:"Toque em Criar prato",en:"Tap Create dish"}), target:'[data-t="create"]', tap(st){ st.focus=null; st.added=true; st.screen="cat"; }},
    {beat:6, hint:P({es:"Toca Ordenar",pt:"Toque em Ordenar",en:"Tap Reorder"}), target:'[data-t="order"]', tap(st){ st.ordering=true; }},
    {beat:6, hint:P({es:"Sube ",pt:"Suba ",en:"Move up "})+NEW.name, target:'[data-t="up-new"]', tap(st){ st.movedUp=true; }}

});
