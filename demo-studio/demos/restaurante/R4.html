<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platata · Pedido en la mesa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Roboto:wght@300;400;500;600;700&display=swap">
<link rel="stylesheet" href="../../kit/edif.css">
<link rel="stylesheet" href="../../kit/material.css">
</head>
<body class="mat">
<div id="root"></div>
<script src="../../kit/engine.js"></script>
<script>
/* R4 "Pedido en la mesa": the WAITER takes the order on their own phone (Mini POS). Colombia, Spanish.
   Every screen follows the app code at d1b7698d (sim/usa-canada):
   PIN gate            MiniPosHomeScreen.kt:262-393 (one bound employee, no picker)
   sell screen         MiniPosSellScreen.kt:512-691, ProductLibraryView.kt, ProductCard.kt, PlatataApp.kt (bottom bar)
   tap a dish          CartActions.handleProductClick: a dish with add-ons opens ModifierSelectionSheet; one without goes in
   add-ons             ModifierSheetContent.kt, the app's own idea "Término de cocción" (ModifierTemplates.kt: not required, pick one)
   "Cobrar · N"        the waiter phone's only way into checkout (MiniPosSellScreen.kt:665) -> openPayDirect
   "¿Qué mesa?"        DiningChooserContent table grid; opens directly because Mesas is the only option the owner switched on
   pay step            CheckoutSheetBody inline + CheckoutPayBlock (cash only, the factory state; staff never sees QR/Card setup)
   Guardar             saveCurrentOrderAsPending -> clearCart -> back to Catálogo
   "Guardado: Mesa 4"  NOT IN THE APP YET: Monti asked for it (19 Oct); coder prompt sent. Same snackbar text as the owner phone.
   Abiertas            TransactionsScreen open list + CartSheetContent open-ticket card (title "Cliente (N.° 27)", line "Mesa 4")
   Demo state the owner set up beforehand: Mesas switched on with 12 tables; the add-on on Churrasco. */
const I = {
  back:'<svg class="mi" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>',
  cart:'<svg class="mi" viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49A1.003 1.003 0 0020 4H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>',
  person:'<svg class="mi" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  trash:'<svg class="mi" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>',
  search:'<svg class="mi" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>',
  co:'<svg viewBox="0 0 6 4"><rect width="6" height="2" fill="#FCD116"/><rect y="2" width="6" height="1" fill="#003893"/><rect y="3" width="6" height="1" fill="#CE1126"/></svg>'
};
const money = n => "$ " + Math.round(n).toLocaleString("es-CO").replace(/,/g,".");   // CurrencyUtils.kt:204 (U+00A0)
const esc = Demo.K.esc;
const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };

/* categories: ORDER BY sortOrder, name (PosDao.kt:169); colour = CategoryChipPalette[id % 10] (HomeScreen.kt:1946) */
const CATS = [ {id:3,name:"Bebidas",c:"#FFD54F"}, {id:1,name:"Platos fuertes",c:"#4FC3F7"}, {id:2,name:"Sopas",c:"#81C784"} ];
const ALL_C = "#607D8B";   // CategoryChipNeutral
/* products: ORDER BY name ASC (PosDao.kt:324) */
const ITEMS = [
  {id:"ajiaco", name:"Ajiaco", cat:2, price:28000},
  {id:"bandeja", name:"Bandeja paisa", cat:1, price:38000},
  {id:"churrasco", name:"Churrasco", cat:1, price:42000, mods:true},
  {id:"gaseosa", name:"Gaseosa", cat:3, price:5000},
  {id:"jugo", name:"Jugo natural", cat:3, price:8000},
  {id:"limonada", name:"Limonada de coco", cat:3, price:12000},
  {id:"pechuga", name:"Pechuga a la plancha", cat:1, price:32000},
  {id:"sancocho", name:"Sancocho", cat:2, price:26000}
];
const COLOR = id => (CATS.find(c=>c.id===id)||{c:ALL_C}).c;
const TERMINO = ["Poco hecho","Medio crudo","Término medio","Casi bien cocido","Bien cocido"];   // ModifierTemplates.kt temperature
const ORDER_ID = 27, TIME = "12:41";

const tabs = on => `<div class="mtabs">${["Catálogo","Ventas","Abiertas"].map((t,i)=>`<span class="${i===on?"on":""}" data-t="tab-${i}">${t}</span>`).join("")}</div>`;
const nav = lit => `<div class="mnav"><div class="${lit?"on":""}"><span class="pill">${I.cart}</span>Caja</div><div><span class="flagc">${I.co}</span>Mi negocio</div></div>`;
const cats = () => `<div class="mcats">` + [{id:null,name:"Todos",c:ALL_C}].concat(CATS).map(c=>{
    const on = c.id===null;
    const style = on ? `background:${hexA(c.c,.22)};border:calc(var(--u)*1.5) solid ${c.c};color:${c.c}` : `background:${hexA(c.c,.05)};border:1px solid ${hexA(c.c,.3)}`;
    return `<span style="${style}">${on?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
const grid = () => `<div class="mgrid">` + ITEMS.map(it=>{ const c=COLOR(it.cat);
    return `<div class="mtile" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`;
const total = st => st.lines.reduce((s,l)=>s+l.price,0);

function render(st){
  if(st.screen==="pin"){
    const k = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    return `<div class="pin"><div class="top"><span class="ib">${I.back}</span></div><div class="mid">
      <div class="biz">La Fonda de Marta</div>
      <div class="av" style="background:#4CAF50">CP</div>
      <div class="nm">Carlos Pérez</div><div class="ask">Ingresa tu PIN</div>
      <div class="dots">${[0,1,2,3].map(i=>`<i class="${i<st.pin?"f":""}" style="${i<st.pin?"background:#4CAF50":""}"></i>`).join("")}</div>
      <div class="keys">${k.map(x=>x?`<span data-t="key-${x==="⌫"?"del":x}">${x}</span>`:`<span class="blank"></span>`).join("")}</div>
      </div></div>`;
  }
  if(st.screen==="sell"){
    const n = st.lines.length;
    let h = tabs(0) + cats() + grid() + `<div class="mlink"><span>Teclado</span></div>`;
    if(n) h += `<div class="mcart" data-t="cart"><span>Cobrar</span><span>${money(total(st))}</span><span>· ${n} ${n===1?"artículo":"artículos"}</span></div>`;
    h += nav(true);
    if(st.snack) h += `<div class="msnack" style="bottom:calc(var(--u)*${80+40+12})">Guardado: Mesa 4</div>`;
    if(st.sheet){
      const pick = st.termino;
      h += `<div class="mscrim"><div class="msheet"><h2>Churrasco</h2>
        <div class="gh"><b>Término de cocción</b><small>elige 1</small></div>
        <div class="chips">${TERMINO.map(t=>`<span class="chip${t===pick?" on":""}" data-t="mod-${t.replace(/\s/g,"")}">${t===pick?I.check:""}${t}</span>`).join("")}</div>
        <hr><div class="qty"><div class="st"><span class="sb">−</span><span class="n">1</span><span class="sb">+</span></div>${pick?"<small>1 extra</small>":""}</div>
        <div class="add" data-t="mod-add">Agregar a la venta · ${money(42000)}</div></div></div>`;
    }
    return h;
  }
  if(st.screen==="table"){
    return `<div class="mtables"><h3>¿Qué mesa?</h3><div class="g">${Array.from({length:12},(_,i)=>`<span data-t="table-${i+1}">${i+1}</span>`).join("")}</div></div>` + nav(true);
  }
  if(st.screen==="pay"){
    const k = ["1","2","3","4","5","6","7","8","9","000","0","⌫"];
    return `<div class="mpay"><div class="hd"><span>‹</span><span class="tr">${I.trash}</span></div>
      <div class="cust">${I.person}Agrega un cliente a la venta</div>
      <div class="blk"><div class="tot"><small>Total</small><b>${money(total(st))}</b></div>
      <div class="links"><span>Artículos (${st.lines.length}) ›</span><span>Mesa 4</span></div>
      <div class="kp">${k.map(x=>`<span class="${x==="000"||x==="⌫"?"s":""}">${x}</span>`).join("")}</div>
      <div class="exact">Exacto · ${money(total(st))}</div>
      <div class="save" data-t="save">Guardar</div></div></div>` + nav(true);
  }
  if(st.screen==="open"){
    return tabs(2) + `<div class="msearch">${I.search}Por artículos, clientes, empleados…</div>
      <div class="mlist"><div class="mtick${st.flash?" flash":""}"><div class="l"><b>Cliente (N.° ${ORDER_ID})</b><strong>Mesa 4</strong><small>Guardado a las ${TIME} p.&nbsp;m.</small></div>
      <div class="r"><b>${money(st.saved)}</b><small>Toca para cargar</small></div></div></div>
      <div class="mlink"><span>Teclado</span></div>` + nav(false);
  }
  return "";
}
const add = id => st => { const it = ITEMS.find(x=>x.id===id); st.lines.push({id, price:it.price}); };

Demo.start({
  id:"R4", campaign:"R4-CO-es", tallVideo:true, label:"Restaurante · Colombia", clock:"12:41",
  endText:"Así toman tus meseros los pedidos en la mesa, con Platata.",
  beats:[
    "El celular de tu mesero: entra con su PIN",
    "Toca los platos; si tienen opciones, se abren primero",
    "Elige la opción y toca Agregar a la venta",
    "Los demás entran con un toque. Luego, Cobrar",
    "Elige la mesa",
    "La mesa paga al final: toca Guardar",
    "Queda en Abiertas, en tu caja y en la cocina",
    "Así toman tus meseros los pedidos en la mesa"
  ],
  state:{screen:"pin", pin:0, lines:[], sheet:false, termino:null, snack:false, saved:0, flash:false},
  render,
  steps:[
    {beat:0, hint:"Toca el PIN del mesero", target:'[data-t="key-4"]', tap(st,E){ st.pin=1;
        E.after(260,()=>{st.pin=2}); E.after(520,()=>{st.pin=3}); E.after(780,()=>{st.pin=4});
        E.after(1100,()=>{ st.screen="sell"; st.pin=0; }); }},
    {beat:1, hint:"Toca Churrasco", target:'[data-t="dish-churrasco"]', tap(st){ st.sheet=true; }},
    {beat:2, hint:"Elige Término medio", target:'[data-t="mod-Términomedio"]', tap(st){ st.termino="Término medio"; }},
    {beat:2, hint:"Toca Agregar a la venta", target:'[data-t="mod-add"]', tap(st){ st.sheet=false; st.lines.push({id:"churrasco", price:42000}); }},
    {beat:3, hint:"Toca Ajiaco", target:'[data-t="dish-ajiaco"]', tap:add("ajiaco")},
    {beat:3, hint:"Toca Limonada de coco", target:'[data-t="dish-limonada"]', tap:add("limonada")},
    {beat:3, hint:"Toca Cobrar", target:'[data-t="cart"]', tap(st){ st.screen="table"; }},
    {beat:4, hint:"Elige la mesa 4", target:'[data-t="table-4"]', tap(st){ st.screen="pay"; }},
    {beat:5, hint:"Toca Guardar", target:'[data-t="save"]', tap(st,E){ st.saved=total(st); st.lines=[]; st.screen="sell"; st.snack=true; }},
    {beat:6, hint:"Toca Abiertas", target:'[data-t="tab-2"]', tap(st,E){ st.snack=false; st.screen="open"; st.flash=true; E.after(1800,()=>{ st.flash=false; }); }}
  ]
});
</script>
<style>.mat .mtick.flash{background:#CBDFF8}</style>
</body>
</html>
