  caja:'<svg viewBox="0 0 32 32" fill="none" stroke="#3A2A1F" stroke-width="1.8" stroke-linejoin="round"><rect x="5" y="6" width="22" height="15" rx="2.5" fill="#fff"/><path d="M9 25h14M16 21v4"/><path d="M9 11h8M9 15h5" stroke-linecap="round"/></svg>',
  cocina:'<svg viewBox="0 0 32 32" fill="none" stroke="#3A2A1F" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M7 15h18v4a7 7 0 0 1-7 7h-4a7 7 0 0 1-7-7z" fill="#fff"/><path d="M5 15h22M12 6c-1 2 1 3 0 5M16 5c-1 2 1 3 0 5M20 6c-1 2 1 3 0 5"/></svg>',
  cel:'<svg viewBox="0 0 24 24" fill="none" stroke="#3A2A1F" stroke-width="1.7" stroke-linejoin="round"><rect x="7" y="2.5" width="10" height="19" rx="2" fill="#fff"/><path d="M10.5 18.5h3" stroke-linecap="round"/></svg>'
};

/* ---- owner phone ---- */
const topbar = t => `<div class="k8tb"><span class="ib">${I.back}</span><b>${esc(t)}</b></div>`;
const bars = n => `<div class="k8bars">${[0,1,2].map(i=>`<i class="${i<=n?"on":""}"></i>`).join("")}</div>`;
function screenCard(s){
  return `<div class="k8card" data-t="scr-${s.key}"><span class="k8av">${I.tv}</span><div class="k8cc"><b>${esc(s.name)}</b>
    <div class="k8tags">${s.tags.map(t=>`<span>${esc(t)}</span>`).join("")}</div><span class="k8st">${esc(L.con)}</span></div><span class="k8chev">›</span></div>`;
}
function list(st){
  const screens = [{key:"cocina", name:L.kitchen, tags:[L.all]}];
  if(st.barSaved) screens.push({key:"bar", name:BAR, tags:[DRINKS] });
  return `<div class="k8pg">${topbar(L.list)}<div class="k8list">${screens.map(screenCard).join("")}</div>
    <div class="k8foot"><div class="k8btn" data-t="add">${esc(L.add)}</div><div class="k8free">${esc(L.free)}</div></div></div>`;
}
function addFlow(st){
  let body = "", title = L.addTitle;
  if(st.step===0){
    body = `<div class="k8q">${esc(L.q1)}</div>
      <div class="k8chips">${L.sugg.map((s,i)=>`<span class="${st.name===s?"on":""}" data-t="sugg-${i}">${st.name===s?I.check:""}${esc(s)}</span>`).join("")}</div>
      <div class="k8field${st.name?" has":""}">${st.name?`<small>${esc(L.name)}</small>${esc(st.name)}`:esc(L.name)}</div>`;
  } else if(st.step===1){
    title = st.name;
    body = `<div class="k8q">${esc(L.q2)}</div>
      <div class="k8choice${st.some?"":" on"}"><b>${esc(L.all)}</b><small>${esc(L.allSub)}</small></div>
      <div class="k8choice${st.some?" on":""}" data-t="some"><b>${esc(L.some)}</b><small>${esc(L.someSub)}</small></div>`;
    if(st.some) body += `<div class="k8lab">${esc(L.pick)}</div>` + CATS.map(c=>{ const on = st.picked.includes(c);
      return `<div class="k8cb" data-t="cat-${c===DRINKS?"drinks":CATS.indexOf(c)}"><i class="${on?"on":""}">${on?I.check:""}</i>${esc(c)}</div>`; }).join("");
    body += `<div class="k8lab" style="margin-top:calc(var(--u)*8)">${esc(L.types)}</div>
      <div class="k8chips">${L.dining.map(d=>`<span class="on">${I.check}${esc(d)}</span>`).join("")}</div>`;
  } else {
    title = L.conTitle;
    body = `<div class="k8line">1. ${esc(L.l1)}</div><div class="k8line">2. ${esc(L.l2)}</div><div class="k8line">3. ${esc(L.l3)}</div>
      <div class="k8code">${CODE}</div>
      ${st.joined ? `<div class="k8ok">${esc(L.ok)}</div>` : `<div class="k8wait"><i></i>${esc(L.waiting)}</div>`}`;
  }
  const can = st.step===0 ? !!st.name : (!st.some || st.picked.length>0);
  const foot = st.step<2 ? `<div class="k8btn${can?"":" off"}" data-t="next">${esc(L.next)}</div>` : `<div class="k8btn sec">${esc(L.later)}</div>`;
  return `<div class="k8pg">${topbar(title)}${bars(st.step)}<div class="k8body">${body}</div><div class="k8foot">${foot}</div></div>`;
}

/* ---- kitchen tablet ---- */
function kind(st){
  const tile = (k, ic, t, d) => `<div class="k8tile${st.kind===k?" on":""}" data-t="kind-${k}"><span class="ic">${ic}</span><b>${esc(t)}</b><small>${esc(d)}</small>${st.kind===k?`<span class="ck">${I.wcheck}</span>`:""}</div>`;
  /* REVIEW-2: the tablet's body scrolls (ConnectDeviceScreen); on the video frame the second tile sat half under Continuar,
     so the list is scrolled up a little before the tap */
  return `<div class="k8p"><div class="k8ptb"><span>${I.pback}</span></div><div class="k8pb">
    <div style="display:flex;flex-direction:column;align-items:flex-start;gap:calc(var(--u)*12);transform:translateY(calc(var(--u)*${st.kscroll?-64:0}))">
    <h1>${esc(L.kindT)}</h1><div class="k8sub">${esc(L.kindS)}</div>
    ${tile("reg", I.caja, L.reg, L.regD)}${tile("kds", I.cocina, L.kds, L.kdsD)}</div></div>
    <div class="k8pf"><div class="k8pbtn" data-t="cont">${esc(L.cont)}</div></div></div>`;
}
function code(st){
  const v = st.typed || "", act = st.focus ? v.length : -1;
  const slot = i => `<span class="${i===act?"act":""}">${esc(v[i]||"")}</span>`;
  const g = s => `<div class="g">${[0,1,2,3,4].map(k=>slot(s+k)).join("")}</div>`;
  const on = v.length > 0;
  return `<div class="k8p"><div class="k8ptb"><span>${I.pback}</span></div><div class="k8pb">
    <h1>${esc(L.codeT)}</h1><div class="k8sub">${esc(L.where)}</div>
    <div class="k8boxes" data-t="boxes">${g(0)}<b>-</b>${g(5)}</div>
    <div class="k8note"><span class="ic">${I.cel}</span><span>${esc(L.note)}</span></div></div>
    <div class="k8pf"><div class="k8pbtn${on||st.pairing?"":" off"}" data-t="connect">${st.pairing?"<i></i>":esc(L.connect)}</div></div></div>`;
}
function kdsEmpty(st){
  return `<div class="k8kds"><div class="k8ktop"><div class="k8tick"></div>
    <div class="k8hist"><span class="gh">${esc(L.active)}</span><span class="gh">${esc(L.hist)}</span><span>${esc(L.hist)}</span></div>
    <span class="k8dot"></span><span class="k8stn">${esc(BAR)}</span><span class="k8out">${I.logout}</span></div>
    <div class="k8empty">${esc(L.waitingOrders)}</div></div>`;
}

function render(st){
  if(st.hop) return RKIT.hop(R, {from:L.phone, to:L.kds, line:CODE, note:R.pick({
    es:"Pasa por tu teléfono: déjalo encendido, con Platata abierta y en el Wi-Fi del local.",
    pt:"Passa pelo seu celular: deixe-o ligado, com o Platata aberto e no Wi-Fi do restaurante.",
    en:"It goes through your phone: keep it on, with Platata open and on the restaurant's Wi-Fi."})});
  switch(st.screen){
    case "list": return list(st);
    case "add":  return addFlow(st);
    case "kind": return kind(st);
    case "code": return code(st);
    default:     return kdsEmpty(st);
  }
}
const onTablet = st => ["kind","code","kds"].includes(st.screen);

RKIT.start(R, {
  id:"R8", tallVideo:true, clock:"12:41",
  endText:R.pick({es:"Así conectas tu pantalla de cocina con Platata.", pt:"Assim você conecta a tela da cozinha com o Platata.", en:"That's how you connect a kitchen screen with Platata."}),
  beats:R.pick({
    es:["Agrega otra pantalla de cocina desde tu teléfono","Ponle nombre: dónde va la pantalla",`Elige qué platos muestra: el bar solo ve ${DRINKS}`,"Siguiente te da un código para la tablet","En la tablet, elige Pantalla de cocina","Escribe el código y toca Conectar","En tu teléfono, la pantalla sale Conectada","Así conectas tu pantalla de cocina con Platata"],
    pt:["Adicione outra tela da cozinha pelo seu celular","Dê um nome: onde fica a tela",`Escolha os pratos: o bar só vê ${DRINKS}`,"Próximo dá um código para o tablet","No tablet, escolha Tela da cozinha","Digite o código e toque em Conectar","No seu celular, a tela aparece Conectada","Assim você conecta a tela da cozinha com o Platata"],
    en:["Add another kitchen screen from your phone","Name it: where the screen goes",`Pick the dishes: the bar only sees ${DRINKS}`,"Next gives you a code for the tablet","On the tablet, choose Kitchen display","Type the code and tap Connect","On your phone, the screen shows Connected","That's how you connect a kitchen screen with Platata"]}),
  state:{screen:"list", hop:false, step:0, name:"", some:false, picked:[], joined:false, barSaved:false, kind:"reg", kscroll:false, typed:"", focus:false, pairing:false},
  render,
  device: st => st.hop ? "phone" : (st.screen==="kds" ? "kds" : onTablet(st) ? "tablet" : "phone"),
  who: st => st.hop ? "" : (onTablet(st) ? L.kds : L.phone),
  steps:[
    {beat:0, hint:R.pick({es:"Toca Agregar pantalla de cocina", pt:"Toque em Adicionar tela da cozinha", en:"Tap Add kitchen screen"}), target:'[data-t="add"]', tap(st){ st.screen="add"; st.step=0; }},
    {beat:1, hint:R.pick({es:`Toca ${BAR}`, pt:`Toque em ${BAR}`, en:`Tap ${BAR}`}), target:'[data-t="sugg-2"]', tap(st){ st.name = BAR; }},
    {beat:1, hint:R.pick({es:"Toca Siguiente", pt:"Toque em Próximo", en:"Tap Next"}), target:'[data-t="next"]', tap(st){ st.step = 1; }},
    {beat:2, hint:R.pick({es:"Toca Solo algunas categorías", pt:"Toque em Só algumas categorias", en:"Tap Only some categories"}), target:'[data-t="some"]', tap(st){ st.some = true; }},
    {beat:2, hint:R.pick({es:`Marca ${DRINKS}`, pt:`Marque ${DRINKS}`, en:`Tick ${DRINKS}`}), target:'[data-t="cat-drinks"]', tap(st){ st.picked = [DRINKS]; }},
    {beat:3, hint:R.pick({es:"Toca Siguiente", pt:"Toque em Próximo", en:"Tap Next"}), target:'[data-t="next"]', tap(st,E){
      st.step = 2;
      E.after(3200, ()=>{ st.hop = true; });
      E.after(4900, ()=>{ st.hop = false; st.screen = "kind"; }); E.after(5700, ()=>{ st.kscroll = true; }); }},
    {beat:4, hint:R.pick({es:"Toca Pantalla de cocina", pt:"Toque em Tela da cozinha", en:"Tap Kitchen display"}), target:'[data-t="kind-kds"]', tap(st){ st.kind = "kds"; }},
    {beat:4, hint:R.pick({es:"Toca Continuar", pt:"Toque em Continuar", en:"Tap Continue"}), target:'[data-t="cont"]', tap(st){ st.screen = "code"; st.focus = true; }},
    {beat:5, hint:R.pick({es:"Toca las casillas y escribe el código", pt:"Toque nas caixas e digite o código", en:"Tap the boxes and type the code"}), target:'[data-t="boxes"]', tap(st,E){ E.type("typed", CODE, null, 110); }},
    {beat:5, hint:R.pick({es:"Toca Conectar", pt:"Toque em Conectar", en:"Tap Connect"}), target:'[data-t="connect"]', tap(st,E){
      st.pairing = true; st.focus = false;
      E.after(1300, ()=>{ st.pairing = false; st.screen = "kds"; });
      E.after(3600, ()=>{ st.screen = "add"; st.step = 2; st.joined = true; });
      E.after(5100, ()=>{ st.screen = "list"; st.barSaved = true; }); }}
  ]
});
</script>
</body>
</html>
