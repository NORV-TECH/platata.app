const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const ALL_C = "#607D8B";
const colorOf = it => (C.catOf(it.cat)||{color:ALL_C}).color;
const item = id => C.items.find(x=>x.id===id);
const OWNER = C.owner, OWNER_FIRST = OWNER.split(" ")[0];

/* SumaTopBar: TopAppBar 64 dp, back arrow, titleLarge bold (ui/components/SumaTopBar.kt) */
const topbar = (title, o={}) => `<div class="tb">${o.noBack?"":`<span class="ib" data-t="${o.backT||"back"}">${o.close?I.close:I.back}</span>`}<div class="tt">${o.html||esc(title)}</div>${o.action||""}</div>`;
/* SumaButton: 52 dp, radius 12 (pill = 50), titleMedium SemiBold */
const btn = (text, kind, dt, o={}) => `<div class="sb ${kind||"pri"}${o.pill?" pill":""}${o.off?" off":""}" ${dt?`data-t="${dt}"`:""}>${o.icon||""}<span>${esc(text)}</span></div>`;
/* CashKeypad (OpenRegisterScreen.kt:191): 4 rows sharing the height, 48..72 dp, 4 dp gaps, grey keys r12, headlineLarge bold */
const keypad = (pre, rowH) => { const rows=[["1","2","3"],["4","5","6"],["7","8","9"],["z","0","del"]];
  return `<div class="ck" style="--kh:${rowH||64}">${rows.map(r=>`<div class="kr">${r.map(k=>`<span data-t="${pre}-${k}">${k==="del"?I.bksp:k==="z"?esc(ZKEY):k}</span>`).join("")}</div>`).join("")}</div>`; };
/* owner bottom NavigationBar (PlatataApp.kt:505-700): Caja (ShoppingCart), Ventas (Receipt), Mi negocio (32 dp flag circle;
   a fingerprint while Security is locked, isSecurityLocked) */
const nav = (on, o={}) => `<div class="mnav">
  <div class="${on==="caja"?"on":""}" data-t="nav-caja"><span class="pill">${I.cart}</span>${esc(t("mamaship_tab_register"))}</div>
  <div class="${on==="ventas"?"on":""}" data-t="nav-ventas"><span class="pill">${I.receipt}</span>${esc(t("tx_tab_all"))}</div>
  <div class="${on==="biz"?"on":""}" data-t="nav-biz"><span class="flagc${on==="biz"?" lit":""}">${o.locked?`<i class="fp">${I.fp}</i>`:R.flag()}</span>${esc(t("home_tab_my_business"))}</div></div>`;
/* product grid: ProductLibraryView.kt chips (first "All") + 3-column cards */
const cats = () => `<div class="mcats">` + [{name:t("items_filter_all"),color:ALL_C,all:true}].concat(C.catsByName).map(c=>{
    const st = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${st}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
const grid = () => `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`;
/* owner Home, Catálogo tab (HomeScreen.kt:610-690 top, FooterButtonPair bottom). o.top = html of the one top strip */
function home(o){
  o = o||{};
  const tabs = `<div class="htabs"><span class="${o.tab===0?"on":""}">${I.edit}${esc(t("home_tab_manual"))}</span><span class="${o.tab!==0?"on":""}">${esc(t("home_tab_library"))}</span></div>`;
  const n = o.count||0, tot = o.total||0;
  let h = (o.warn||"") + tabs + (o.top||"") + (o.body!=null ? o.body : `<div class="hedit"><span>${I.edit}${esc(t("common_edit"))}</span></div>` + cats() + grid());
  h += `<div class="hfoot">${n?`<div class="cstrip"><span>${esc(tp("home_current_sale_items", n, n))}</span><i>›</i></div>`:""}
    <div class="fpair">${btn(t("common_save"),"sec","save",{pill:true,off:!n})}${btn(t("common_charge", money(tot)),"pri","charge",{pill:true,off:!n})}</div></div>`;
  return h + nav("caja", {locked:o.locked});
}

/* the business panel (HomeScreen.kt ~1400-1760): name header, register card, Sell online, "Día a día", Menú, Clientes, Reportes */
function panel(o){

  const card = open
    ? `<div class="wr reg on" data-t="reg-card"><i class="dot">●</i><div class="tx"><b>${esc(t("workspace_register_open"))}</b><small>${esc(t("workspace_register_sales"))}</small></div><b class="amt">${money(tot)}</b></div>`
    : `<div class="wr reg off" data-t="reg-card"><i class="dot">●</i><div class="tx"><b>${esc(t("workspace_register_closed"))}</b><small>${esc(t("workspace_register_closed_sub"))}</small></div><b class="act">${esc(t("workspace_register_open_action"))}</b></div>`;
  const row = (ic, ti, sub, tr) => `<div class="wr"><span class="ic">${ic}</span><div class="tx"><b>${esc(ti)}</b><small>${esc(sub)}</small></div>${tr||""}</div>`;
  return `<div class="wp"><div class="wph"><b>${esc(C.place)}</b>${I.down}</div>

    <div class="wps">${esc(t("panel_heading_every_day"))}</div>
    ${row(I.rest, t("workspace_menu_title"), t("more_my_products_count", C.items.length))}
    ${row(I.person, t("more_customers_title"), tp("home_clientes_count", o.clients||0, o.clients||0))}
    ${row(I.rlong, t("workspace_full_reports"), t((R.country==="US"||R.country==="CA") ? "scan_row_reports_today" : "scan_row_reports_today_net", money(o.today||tot)))}

}

const bioSheet = (ok) => `<div class="mscrim"><div class="bio"><b>${esc(t("settings_gate_title"))}</b><small>${esc(t("settings_gate_subtitle"))}</small>

/* Register screen (cash/RegisterStatusScreen.kt:130-520), 0/1 register: no tab row. o = {start, cashSales, moves:[{kind,reason,amount,at}], scroll} */
function registerScreen(o){
  const out = (o.moves||[]).filter(m=>m.kind==="out").reduce((s,m)=>s+m.amount,0), inn = (o.moves||[]).filter(m=>m.kind==="in").reduce((s,m)=>s+m.amount,0);
  const exp = o.start + o.cashSales + inn - out;
  const reason = r => t({supplier:"cash_movement_reason_supplier",owner:"cash_movement_reason_owner_took",other:"cash_movement_reason_other",change:"cash_movement_reason_change"}[r]);
  const moves = (o.moves||[]).map(m=>`<div class="mv${m.isNew?" new":""}"><span>${esc(t(m.kind==="out"?"cash_movement_out":"cash_movement_in"))} · ${esc(reason(m.reason))} · ${esc(fmtTime(m.at))}</span><b class="${m.kind}">${m.kind==="out"?"-":"+"}${money(m.amount)}</b><i>${esc(t("cash_movement_void"))}</i></div>`).join("");
  const tbar = topbar("", {html:`<div class="navd"><span class="dim">${I.chevL}</span><b>${esc(t("register_nav_today", shortDay(o.openedAt)))}</b><span class="dim">${I.chevR}</span></div>`,
                 action:`<span class="tba">${esc(t("register_status_full_reports"))}</span>`});
  const body = `<div class="rs" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <div class="pillrow"><span class="spill">${esc(t("register_status_pill_open"))}</span></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_opened_at"))}</span><span>${esc(fmtDT(o.openedAt))}</span></div>
      <div class="lr"><span>${esc(t("register_status_opened_by"))}</span><span>${esc(OWNER)}</span></div></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_starting_cash"))}</span><span>${money(o.start)}</span></div>
      <div class="lr"><span>${esc(t("register_status_cash_sales_here"))}</span><span>${money(o.cashSales)}</span></div>
      ${moves}<hr><div class="lr em${o.expFlash?" flash":""}"><span>${esc(t("register_status_expected"))}</span><span class="pri">${money(exp)}</span></div></div>
    ${btn(t("cash_movement_out"),"sec","cash-out")}${btn(t("cash_movement_in"),"sec","cash-in")}
    <div class="scard"><div class="lr ms"><span>${esc(t("register_status_cash_all"))}</span><span>${money(o.cashSales)}</span></div>
      ${o.cashSales?`<div class="lr ind"><span>${esc(OWNER)}</span><span>${money(o.cashSales)}</span></div>`:""}
      <hr><div class="lr em"><span>${esc(t("reports_total_collected"))}</span><span>${money(o.cashSales)}</span></div></div>
    <div class="hist">${I.clock}<span>${esc(t("register_list_title"))}</span></div>
    ${btn(t("register_status_close_btn"),"sec","close-reg")}<div style="height:calc(var(--u)*16)"></div></div>`;
  return `<div class="pg">${tbar}<div class="pscroll">${body}</div>${o.snack?`<div class="msnack" style="bottom:calc(var(--u)*16)">${esc(o.snack)}</div>`:""}</div>`;
}
