/* ---------- owner Home (the till) ---------- */
function home(o){ o=o||{};
  const lines = o.lines||[];
  const totalV = lines.reduce((s,l)=>s+l.price,0);
  let h = "";
  if(o.warnBar) h += o.warnBar;
  h += `<div class="otabs">${P(W.tabs).map((t,i)=>`<span class="${i===1?"on":""}">${i===0?svg(IP.edit,"ti"):""}${esc(t)}</span>`).join("")}</div>`;
  if(o.regClosed) h += `<div class="rcbar"><span>${esc(T("regClosedBar"))}</span><b>${esc(T("regOpenBtn"))}</b></div>`;
  if(o.offline) h += `<div class="offs">${esc(T("offline"))}</div>`;
  h += `<div class="oedit"><span>${svg(IP.edit,"ti")}${esc(T("edit"))}</span></div>`;
  h += `<div class="mcats">` + [{name:T("all"),color:"#607D8B",all:true}].concat(C.catsByName).map(c=>{
    const st = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${st}">${c.all?svg(IP.check,"ck"):""}${esc(c.name)}</span>`; }).join("") + `</div>`;
  h += `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${R.money(it.price)}</span></div></div>`; }).join("") + `</div>`;
  const n = lines.length;
  if(n) h += `<div class="csale"><span>${esc(fmt(P(W.sale)[n===1?0:1], n))}</span><i>›</i></div>`;
  h += `<div class="fpair"><span class="sec${n?"":" dis"}" data-t="save">${esc(o.saveLabel||T("save"))}</span><span class="pri${n?"":" dis"}" data-t="charge">${esc(fmt(P(W.charge), R.money(totalV)))}</span></div>`;
  h += nav(o.nav||{});
  return h;
}
function nav(o){ o=o||{};
  const flag = o.finger ? svg(IP.finger,"fp") : R.flag();
  return `<div class="mnav onav"><div class="${o.on==="reg"?"on":""}"><span class="pill">${I("cart")}</span>${esc(T("register"))}</div>
    <div class="${o.on==="sales"?"on":""}"><span class="pill">${I("receipt")}${o.badge?`<em class="nbadge">${o.badge}</em>`:""}</span>${esc(T("sales"))}</div>
    <div data-t="flag"><span class="flagc${o.panel?" lit":""}">${flag}</span>${esc(T("myBiz"))}</div></div>`;
}
/* ---------- the business panel ---------- */
function wsRow(o){
  return `<div class="wrow${o.cls?" "+o.cls:""}" ${o.t?`data-t="${o.t}"`:""} style="${o.bg?`background:${o.bg}`:""}">
    ${o.dot?`<span class="wdot" style="color:${o.fg}">●</span>`:`<span class="wic">${I(o.icon)}</span>`}
    <span class="wtx"><b style="${o.fg?`color:${o.fg}`:""}">${esc(o.title)}</b>${o.sub?`<small style="${o.fg?`color:${hexA(o.fg,.7)}`:""}">${esc(o.sub)}</small>`:""}</span>
    ${o.trail||""}${o.dot?"":`<span class="wch">${I("chev")}</span>`}</div>`;
}
function panel(o){ o=o||{};
  const name = o.name || C.place;
  let h = `<div class="panel"><div class="phd" data-t="pname"><span>${esc(name)}</span>${svg(IP.down,"pdn")}</div><div class="plist">`;
  if(o.before) h += o.before;
  const open = o.regOpen!==false;
  h += wsRow(open ? {dot:true, title:T("regOpen"), sub:T("regSales"), bg:"#E8F5E9", fg:"#2E7D32", trail:`<b class="wtr" style="color:#2E7D32">${R.money(o.salesToday||0)}</b>`}
                  : {dot:true, title:T("regClosed"), sub:T("regClosedSub"), bg:"#FFEBEE", fg:"#C62828", trail:`<b class="wtr sm" style="color:#C62828">${esc(T("regOpenBtn"))}</b>`});
  const on = !!o.storeOn;

function hub(o){ o=o||{};

/* how far (in dp) the page must scroll so that `sel` sits above the bottom of .cpage (the real pages scroll; the demo moves
   the page's inner column with a transform kept in state, so a re-render keeps the place) */
function scrollFor(sel){
  const el=document.querySelector('#app '+sel), pg=document.querySelector('#app .cpage, #app .spage, #app .wscr'); if(!el||!pg) return 0;
  const u=document.getElementById('screen').getBoundingClientRect().width/412;
  const over=el.getBoundingClientRect().bottom - pg.getBoundingClientRect().bottom + 16*u;
  return over>0 ? Math.ceil(over/u) : 0;
}
