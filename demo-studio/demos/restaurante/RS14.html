/* utils/WhatsappUtils.kt formatWhatsappForReading */
function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

/* RS14 "Equipo y claves": the owner opens Team, adds a waitress (name, WhatsApp, job title), picks what she may do,
   saves, and the app shows her new PIN once.
   Screens follow the app at app-head (paths under app/src/main/java/com/example/):
   the list        ui/screens/team/TeamManagementScreen.kt:133-610 (ListScreenHeader team_title "Equipo (N)" counting the
                   people who are not the owner and not blocked, TeamFormRules.teamTitleCount; BusinessCodeCard.kt
                   (owner device + owner view, TeamBusinessCode.mayShow); the pay switch strip
                   employee_pay_switch_label; sticky letter headers labelLarge bold on surfaceVariant 90%)
   a row           EmployeeRow :616 (48 dp circle, PersonName.initials; name titleMedium SemiBold; job title line
                   bodyMedium (none for the owner); badges labelSmall r4 15%: the owner team_role_owner, everyone else
                   their job title else team_badge_team; StaffPhoneViews.kt EmployeeStatusPill "En su celular" #2E7D32)
   the form        EmployeeAddEditView :1005 (SumaTopBar team_add_employee_title + TextButton Guardar; team_field_first_name
                   with Person icon; team_field_whatsapp seeded with "+57" (dialCodeFor), Phone icon; Cargo with Badge
                   icon; FormSummaryRow "🔑 Permisos" (granted names joined " · ", count bubble); the "⚙️ Avanzado" row;
                   EmployeeCodeRow :1564: the PIN generated at once (generateUniquePin), masked, Mostrar)
   permissions     the bottom sheet :1450-1525 (perm_label + FilterChips; restaurant: no stock chip, no supplier chip),
                   live apply, closed by a tap outside
   new PIN         TeamManagementScreen.kt:342-356 (team_new_pin_title / team_new_pin_notice once after save, OK)
   Demo data: the owner and one waiter (on his phone); the shop's business code already exists. */
// KEYS: team_title,team_search_placeholder,team_business_code_title,team_business_code_copy,team_business_code_sub,employee_pay_switch_label,team_role_owner,team_status_on_phone
// KEYS: team_add_employee_title,common_save,team_field_first_name,team_field_whatsapp,crm_whatsapp_hint,counter_reg_field_job_title,perm_label,common_none,profile_advanced,profile_advanced_sub,team_code_label,team_code_show,team_code_sub
// KEYS: perm_can_refund,perm_can_close_shift,team_perm_waive_fee,perm_can_void,perm_can_comp,perm_can_cancel_receipt,perm_can_edit_customer,perm_can_see_reports,team_new_pin_title,team_new_pin_notice,common_ok
const C = R.C;
const W1 = C.people.waiter, W2 = C.people.waiter2;
const JOB1 = pick({es:"Mesero",pt:"Garçom",en:"Server"}), JOB2 = pick({es:"Mesera",pt:"Garçonete",en:"Server"});
const CODE = "K7Q2M9XD4P", PIN2 = "4821";
const PLUS = "+" + DIAL;
const initials = n => n.split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const PERMS = ["perm_can_refund","perm_can_close_shift","team_perm_waive_fee","perm_can_void","perm_can_comp","perm_can_cancel_receipt","perm_can_edit_customer","perm_can_see_reports"];
const ic = {
  person:I.person, phone:I.phone, badge:I.badge,
  pin:P("M12.65 10C11.83 7.67 9.61 6 7 6c-3.31 0-6 2.69-6 6s2.69 6 6 6c2.61 0 4.83-1.67 5.65-4H17v4h4v-4h2v-4H12.65zM7 14c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z")
};
function row(name, job, owner, onPhone, hl){
  const badge = owner ? `<span class="tm-b own">${esc(S("team_role_owner"))}</span>` : `<span class="tm-b">${esc(job)}</span>`;
  const pill = onPhone ? `<span class="tm-p"><i></i>${esc(S("team_status_on_phone"))}</span>` : "";
  return `<div class="tm-row${hl?" rs-hl":""}"><span class="av">${esc(initials(name))}</span><div class="nm"><b>${esc(name)}</b>${!owner&&job?`<span class="jt">${esc(job)}</span>`:""}<div class="bd">${badge}${pill}</div></div><span class="mv">${I.more}</span></div>`;
}
function list(st){
  const people = [{n:OWNER_NAME, owner:true},{n:W1, job:JOB1, phone:true}].concat(st.added?[{n:W2, job:JOB2, hl:true}]:[]);
  const groups = {}; people.slice().sort((a,b)=>a.n.localeCompare(b.n, LOCALE)).forEach(p=>{ const k=p.n[0].toUpperCase(); (groups[k]=groups[k]||[]).push(p); });
  const n = people.filter(p=>!p.owner).length;
  return `<div class="rs-lh"><div class="r1"><span class="ib">${I.back}</span><b>${esc(F("team_title", n))}</b><span class="rs-new" data-t="new">${esc(pick({es:"+ Nuevo",pt:"+ Novo",en:"+ New"}))}</span></div>
    <div class="srch">${I.search}<span>${esc(S("team_search_placeholder"))}</span></div></div>
    <div class="tm-code"><small>${esc(S("team_business_code_title"))}</small><div><b>${CODE}</b><span>${esc(S("team_business_code_copy"))}</span></div><p>${esc(S("team_business_code_sub"))}</p></div>
    <div class="tm-sw"><span>${esc(S("employee_pay_switch_label"))}</span>${sw(false)}</div>
    <div class="rs-scroll"><div class="in">${Object.keys(groups).sort().map(k=>`<div class="tm-h">${k}</div>`+groups[k].map(p=>row(p.n,p.job,p.owner,p.phone,p.hl)).join("")).join("")}</div></div>` + strip();
}
function form(st){
  const granted = PERMS.filter(k=>st.perm[k]).map(S);
  const save = `<span class="cl-save" data-t="save">${esc(S("common_save"))}</span><span class="ib">${I.more}</span>`;
  const sheet = st.sheet ? `<div class="tm-scrim" data-t="outside"></div><div class="tm-sheet"><i class="hd"></i><div class="fl"><span class="lb">${esc(S("perm_label"))}</span>${PERMS.map(k=>`<span class="ch${st.perm[k]?" on":""}" data-t="chip-${k}">${esc(S(k))}</span>`).join("")}</div></div>` : "";
  return topbar(S("team_add_employee_title"), {action:save}) + `<div class="rs-scroll"><div class="in tm-form">
    ${field(S("team_field_first_name"), st.name, {focus:st.focus==="name", tag:"f-name", lead:ic.person})}
    ${field(S("team_field_whatsapp"), PLUS + st.wa, {focus:st.focus==="wa", tag:"f-wa", lead:ic.phone})}
    ${field(S("counter_reg_field_job_title"), st.job, {focus:st.focus==="job", tag:"f-job", lead:ic.badge})}
    <div class="tm-sum" data-t="perms"><span class="g">🔑</span><div><b>${esc(S("perm_label"))}</b><small>${esc(granted.length?granted.join(" · "):S("common_none"))}</small></div>${granted.length?`<span class="cnt">${granted.length}</span>`:""}<span class="gt">›</span></div>
    <div class="tm-sum"><span class="g">⚙️</span><div><b>${esc(S("profile_advanced"))}</b><small>${esc(S("profile_advanced_sub"))}</small></div>${P("M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z")}</div>
    <div class="tm-pin"><div><small>${esc(S("team_code_label"))}</small><b>••••</b><small>${esc(S("team_code_sub"))}</small></div><span>${esc(S("team_code_show"))}</span></div>
  </div></div>` + strip() + sheet;
}
function render(st){
  if(st.screen==="panel") return panel({regTotal:fromMoney(862980), today:fromMoney(739125), menuCount:C.items.length, clients:8, invoices:3, team:1, phones:1});
  if(st.screen==="form") return form(st);
  const dlg = st.pinDlg ? `<div class="rs-scrim"><div class="rs-dlg"><h3>${esc(S("team_new_pin_title"))}</h3><p>${esc(F("team_new_pin_notice", W2, PIN2))}</p><div class="acts"><span data-t="ok">${esc(S("common_ok"))}</span></div></div></div>` : "";
  return list(st) + dlg;
}
const fromMoney = v => ({CO:1,BR:0.0011,US:0.00042,CA:0.00048,MX:0.0048,PE:0.00098,CL:0.27,EC:0.00026,AR:0.32,PA:0.00026}[R.country] * v);
const HINT = (es,pt,en) => pick({es:"Toca "+es, pt:"Toque em "+pt, en:"Tap "+en});
const H1 = k => HINT(S(k),S(k),S(k));
RKIT.start(R, {
  id:"RS14", tallVideo:true, clock:"16:40",
  endText:pick({es:"Así armas tu equipo, con Platata.",pt:"Assim você monta sua equipe, com o Platata.",en:"That's how you build your team, with Platata."}),
  beats:pick({
    es:["En Mi negocio, toca Equipo","Tu equipo y el código del negocio. Toca + Nuevo","Nombre, WhatsApp y cargo","Elige qué puede hacer","Su PIN se crea solo. Toca Guardar","El PIN se muestra una vez: anótalo","Así armas tu equipo"],
    pt:["Em Meu negócio, toque em Equipe","Sua equipe e o código do negócio. Toque em + Novo","Nome, WhatsApp e cargo","Escolha o que a pessoa pode fazer","O PIN é criado sozinho. Toque em Salvar","O PIN aparece uma vez: anote","Assim você monta sua equipe"],
    en:["In My business, tap Team","Your team and the business code. Tap + New","Name, WhatsApp and job title","Choose what they can do","Their PIN is made for you. Tap Save","The PIN shows once: write it down","That's how you build your team"]}),
  state:{screen:"panel", name:"", wa:"", job:"", focus:"", sheet:false, perm:{}, added:false, pinDlg:false},
  render,
  device: () => "phone",
  who: () => pick({es:"Tu teléfono",pt:"Seu celular",en:"Your phone"}),
  steps:[
    {beat:0, hint:HINT("Equipo","Equipe","Team"), target:'[data-t="row-team"]', tap(st){ st.screen="list"; }},
    {beat:1, hint:HINT("+ Nuevo","+ Novo","+ New"), target:'[data-t="new"]', tap(st){ st.screen="form"; }},
    {beat:2, hint:H1("team_field_first_name"), target:'[data-t="f-name"]', tap(st,E){ st.focus="name"; E.type("name", W2, null, 70); }},
    {beat:2, hint:H1("team_field_whatsapp").replace(" *",""), target:'[data-t="f-wa"]', tap(st,E){ st.focus="wa"; E.type("wa", natNum(3), null, 70); }},
    {beat:2, hint:H1("counter_reg_field_job_title"), target:'[data-t="f-job"]', tap(st,E){ st.focus="job"; E.type("job", JOB2, null, 90); }},
    {beat:3, hint:H1("perm_label"), target:'[data-t="perms"]', tap(st){ st.focus=""; st.sheet=true; }},
    {beat:3, hint:H1("perm_can_close_shift"), target:'[data-t="chip-perm_can_close_shift"]', tap(st){ st.perm.perm_can_close_shift=true; }},
    {beat:3, hint:pick({es:"Toca afuera para cerrar",pt:"Toque fora para fechar",en:"Tap outside to close"}), target:'[data-t="outside"]', tap(st){ st.sheet=false; }},
    {beat:4, hint:H1("common_save"), target:'[data-t="save"]', tap(st){ st.screen="list"; st.added=true; st.pinDlg=true; }},
    {beat:5, hint:HINT("OK","OK","OK"), target:'[data-t="ok"]', tap(st){ st.pinDlg=false; }}
  ]
});
</script>
