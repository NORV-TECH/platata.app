/* utils/WhatsappUtils.kt formatWhatsappForReading */
function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

/* RS16 "Descuentos y cargos": the owner switches on the service charge the app made for the restaurant, then makes a
   10% discount on the drinks.
   Screens follow the app at app-head (paths under app/src/main/java/com/example/):
   way in        panel Settings row -> SettingsHubScreen (settings_hub_discounts, group "Getting paid")
   the list      ui/screens/discounts/DiscountsManagementScreen.kt:236-366 (SumaTopBar disc_title + NewTextAction
                 common_new_short; TabRow disc_tab_saved | disc_tab_templates; section titles titleMedium bold primary
                 disc_section_saved_discounts / disc_section_saved_fees; SavedRuleCard :433: surface 30% (white on white, no
                 shadow), leading icon tinted, name titleMedium bold, value titleSmall bold "− 10%" #1A7F3C / "+ 10%" #007AFF,
                 disc_auto_on_items for a scoped rule, then the 48 dp line: switch, LocalOffer (scoped only), red trash)
   the seed      data/repo/SeedStore.kt:197-228 seedServiceFee (at creation, BACKOFFICE-2 A): name by business language
                 "Cargo por servicio" / "Taxa de serviço" / "Service charge", sync/ServiceFeeSeed: 10% in CO, 15% elsewhere,
                 asksAtCheckout, wholeTicket, isActive = false (so the card shows a switch, no items icon, no subtitle)
   the form      ui/screens/discounts/DiscountFormScreen.kt:63-215 (disc_new_title; segmented disc_kind_discount |
                 disc_kind_charge; disc_field_name; "%" | currency symbol; disc_field_value_pct; disc_requires_customer;
                 disc_what_happens_discount; divider + disc_applies_to + disc_choose_items / disc_chosen_count; bottom Save)
   item picker   DiscountsManagementScreen.kt:546 DiscountAssociationWindow (disc_link_dialog_title, disc_select_all,
                 categories A-Z with a checkbox each, rows with checkboxes; disc_scope_required + disc_associate_button)
   after Save    disc_saved_toast, back on the first tab (DiscountsManagementScreen.kt:209-213)
   Demo data: the discount is "Hora feliz" 10% on the drinks category. */
// KEYS: disc_title,disc_tab_saved,disc_tab_templates,disc_section_saved_discounts,disc_section_saved_fees,disc_new_title,disc_kind_discount,disc_kind_charge,disc_field_name,disc_field_value_pct,disc_requires_customer,disc_what_happens_discount,disc_applies_to,disc_choose_items,disc_scope_required,disc_link_dialog_title,disc_select_all,disc_associate_button,disc_saved_toast,common_save,settings_hub_discounts
// PLURALS: disc_auto_on_items,disc_chosen_count
const C = R.C;
const FEE_NAME = pick({es:"Cargo por servicio", pt:"Taxa de serviço", en:"Service charge"});   // SeedStore: by business language
const FEE_PCT = R.country === "CO" ? 10 : 15;                                                    // ServiceFeeSeed.percentFor
const DNAME = pick({es:"Hora feliz", pt:"Happy hour", en:"Happy hour"});
const DVAL = "10";
const CUR_SYM = ({COP:"$",MXN:"$",PEN:"S/",CLP:"$",USD:"$",ARS:"$",BRL:"R$",CAD:"$"})[C.cur] || "$";
const pctTxt_ = n => n + "%";                                                                    // formatTaxRate: whole number
const DRINKS = C.cats.find(c => /Bebidas|Drinks/.test(c));
const CATS = C.cats.slice().sort();                                                              // categories.sortedBy { it.name }
const byCat = k => C.items.filter(i => i.cat === k).sort((a,b) => a.name < b.name ? -1 : 1);
const NDRINKS = byCat(DRINKS).length;
/* where the drinks block starts in the picker list: select-all row, then each category above it */
const U_HEAD = 56, U_ROW = 72, U_GAP = 16;
const drinksTop = 16 + U_HEAD + U_GAP + CATS.slice(0, CATS.indexOf(DRINKS)).reduce((a,k) => a + U_HEAD + byCat(k).length*U_ROW + U_GAP, 0);
const PICK_SCROLL = drinksTop > 300 ? drinksTop - 60 : 0;

const chk = on => `<span class="dc-cb${on?" on":""}">${on?P("M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"):""}</span>`;
function card(o){
  return `<div class="dc-card${o.hl?" rs-hl":""}"><div class="r"><span class="li" style="color:${o.col}">${o.icon}</span><div class="tx"><b>${esc(o.name)}</b><strong style="color:${o.col}">${esc(o.val)}</strong>${o.sub?`<small>${esc(o.sub)}</small>`:""}</div></div>
    <div class="ctl"><span class="cell">${sw(o.on, o.swTag)}</span>${o.assoc?`<span class="cell" style="color:var(--m-on)">${I.tag}</span>`:""}<span class="cell" style="color:var(--m-err)">${I.trash}</span></div></div>`;
}
function list(st){
  const sec = t => `<h5 class="dc-sec">${esc(t)}</h5>`;
  let body = "";
  if (st.saved) body += sec(S("disc_section_saved_discounts")) + card({name:DNAME, val:"− "+pctTxt_(DVAL), col:"#1A7F3C", icon:I.tag, sub:PL("disc_auto_on_items", NDRINKS), on:true, assoc:true, hl:true});
  body += sec(S("disc_section_saved_fees")) + card({name:FEE_NAME, val:"+ "+pctTxt_(FEE_PCT), col:"#007AFF", icon:I.add, on:st.feeOn, swTag:"sw-fee", assoc:false});
  return topbar(S("disc_title"), {action:newAction("new")}) +
    `<div class="mtabs"><span class="on">${esc(S("disc_tab_saved"))}</span><span class="off">${esc(S("disc_tab_templates"))}</span></div>
    <div class="rs-scroll"><div class="in dc-list">${body}</div></div>${st.toast?toast(S("disc_saved_toast")):""}` + strip();
}
function seg(a, b, aOn){ const ck = P("M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z");
  return `<div class="dc-seg"><span class="${aOn?"on":""}">${aOn?ck:""}${esc(a)}</span><span class="${aOn?"":"on"}">${aOn?"":ck}${esc(b)}</span></div>`; }
function form(st){
  const n = st.items ? NDRINKS : 0;
  const ok = st.name && st.val && n > 0;
  const valTxt = st.val ? pctTxt_(st.val) : "—";
  return topbar(S("disc_new_title")) + `<div class="rs-scroll"><div class="in dc-form">
    ${seg(S("disc_kind_discount"), S("disc_kind_charge"), true)}
    ${field(S("disc_field_name"), st.name, {focus:st.focus==="name", tag:"f-name"})}
    ${seg("%", CUR_SYM, true)}
    ${field(S("disc_field_value_pct"), st.val, {focus:st.focus==="val", tag:"f-val"})}
    <div class="dc-swr"><span>${esc(S("disc_requires_customer"))}</span>${sw(false)}</div>
    <p class="dc-what">${esc(F("disc_what_happens_discount", valTxt))}</p>
    <hr class="dc-hr"><h5 class="dc-sec">${esc(S("disc_applies_to"))}</h5>
    <div class="dc-choose${st.items?" rs-hl":""}" data-t="choose"><div><b>${esc(S("disc_choose_items"))}</b><small>${esc(n ? PL("disc_chosen_count", n) : S("disc_scope_required"))}</small></div>${I.chev}</div>
  </div></div>
  <div class="dc-bot"><div class="rs-btn${ok?"":" off"}" data-t="save">${esc(S("common_save"))}</div></div>`;
}
function picker(st){
  const rows = k => byCat(k).map(it => { const on = st.pick && k === DRINKS;
    return `<div class="dc-pr">${chk(on)}<span>${esc(it.name)}</span></div>`; }).join("");
  const blocks = CATS.map(k => { const on = st.pick && k === DRINKS;
    return `<div class="dc-ch"><b>${esc(k)}</b><span${k===DRINKS?' data-t="cat-drinks"':""}>${chk(on)}</span></div><div class="dc-pc">${rows(k)}</div>`; }).join("");
  return topbar(F("disc_link_dialog_title", st.name)) + `<div class="rs-scroll"><div class="in dc-pick" style="transform:translateY(calc(var(--u)*${-st.pscroll}))">
    <div class="dc-ch"><b>${esc(S("disc_select_all"))}</b><span>${chk(false)}</span></div>${blocks}</div></div>
    <div class="dc-bot">${st.pick?"":`<p class="err">${esc(S("disc_scope_required"))}</p>`}<div class="rs-btn${st.pick?"":" off"}" data-t="done">${esc(S("disc_associate_button"))}</div></div>`;
}
const fromMoney = v => ({CO:1,BR:0.0011,US:0.00042,CA:0.00048,MX:0.0048,PE:0.00098,CL:0.27,EC:0.00026,AR:0.32,PA:0.00026}[R.country] * v);
function render(st){
  if(st.screen==="panel") return panel({regTotal:fromMoney(862980), today:fromMoney(739125), menuCount:C.items.length, clients:CLIENTS.length, invoices:3, team:2, phones:2});
  if(st.screen==="hub") return settingsHub();
  if(st.screen==="form") return form(st);
  if(st.screen==="pick") return picker(st);
  return list(st);
}
const HINT = (es,pt,en) => pick({es:"Toca "+es, pt:"Toque em "+pt, en:"Tap "+en});
const H1 = k => HINT(S(k),S(k),S(k));
RKIT.start(R, {
  id:"RS16", tallVideo:true, clock:"10:15",
  endText:pick({es:"Así das descuentos y cobras cargos, con Platata.",pt:"Assim você dá descontos e cobra taxas, com o Platata.",en:"That's how you give discounts and add charges, with Platata."}),
  beats:pick({
    es:["En Mi negocio, toca Configuración","Toca Descuentos y cargos","Tu cargo por servicio ya viene. Enciéndelo","Ahora un descuento. Toca + Nuevo","Ponle nombre y porcentaje","Elige a qué artículos se aplica","Toca Guardar","Se aplica solo en cada venta con esas bebidas","Así das descuentos y cobras cargos"],
    pt:["Em Meu negócio, toque em Configurações","Toque em Descontos e taxas","Sua taxa de serviço já vem pronta. Ligue","Agora um desconto. Toque em + Novo","Dê um nome e a porcentagem","Escolha em quais itens ele vale","Toque em Salvar","Vale sozinho em cada venda com essas bebidas","Assim você dá descontos e cobra taxas"],
    en:["In My business, tap Settings","Tap Discounts and charges","Your service charge comes ready. Switch it on","Now a discount. Tap + New","Give it a name and a percentage","Choose which items it applies to","Tap Save","It applies by itself on every sale with those drinks","That's how you give discounts and add charges"]}),
  state:{screen:"panel", feeOn:false, name:"", val:"", focus:"", items:false, pick:false, pscroll:0, saved:false, toast:false},
  render,
  device: () => "phone",
  who: () => pick({es:"Tu teléfono",pt:"Seu celular",en:"Your phone"}),
  steps:[
    {beat:0, hint:HINT(PS.settings,PS.settings,PS.settings), target:'[data-t="row-settings"]', tap(st){ st.screen="hub"; }},
    {beat:1, hint:H1("settings_hub_discounts"), target:'[data-t="hub-discounts"]', tap(st){ st.screen="list"; }},
    {beat:2, hint:pick({es:"Toca el interruptor",pt:"Toque no botão",en:"Tap the switch"}), target:'[data-t="sw-fee"]', tap(st){ st.feeOn=true; }},
    {beat:3, hint:HINT("+ Nuevo","+ Novo","+ New"), target:'[data-t="new"]', tap(st){ st.screen="form"; }},
    {beat:4, hint:H1("disc_field_name"), target:'[data-t="f-name"]', tap(st,E){ st.focus="name"; E.type("name", DNAME, null, 80); }},
    {beat:4, hint:HINT(pick({es:"Porcentaje",pt:"Porcentagem",en:"Percentage"}),pick({es:"Porcentaje",pt:"Porcentagem",en:"Percentage"}),pick({es:"Porcentaje",pt:"Porcentagem",en:"Percentage"})), target:'[data-t="f-val"]', tap(st,E){ st.focus="val"; E.type("val", DVAL, null, 160); }},
    {beat:5, hint:H1("disc_choose_items"), target:'[data-t="choose"]', tap(st){ st.focus=""; st.screen="pick"; st.pscroll=PICK_SCROLL; }},
    {beat:5, hint:HINT(DRINKS,DRINKS,DRINKS), target:'[data-t="cat-drinks"]', tap(st){ st.pick=true; }},
    {beat:5, hint:H1("disc_associate_button"), target:'[data-t="done"]', tap(st){ st.items=true; st.screen="form"; }},
    {beat:6, hint:H1("common_save"), target:'[data-t="save"]', tap(st,E){ st.screen="list"; st.saved=true; st.toast=true; E.after(2200,()=>{ st.toast=false; }); }}
  ]
});
