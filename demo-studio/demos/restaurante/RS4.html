/* ---- shared by RS3..RS7 (copied into each page; kit/ is not edited) ----
   Words come from STR (the app's own values / values-es / values-pt-rBR, read at the newest app-head commit).
   Screens (paths under app/src/main/java/com/example/):
   register tab   ui/screens/home/HomeScreen.kt (TabRow, ProductLibraryView, CurrentSaleStrip, HomeFooterButtons), PlatataApp.kt bottom bar
   pay screen     ui/screens/home/CheckoutSheetBody.kt + CheckoutPayBlock.kt (keypad always on, Exact blue, links column, set-up link)
   pay ways       sync/PayWaysVisibility.kt (QR only with switch + picture; Card only in CO (Wompi) and US/CA (Stripe))
   sale complete  ui/screens/home/ReceiptOptionsScreen.kt (SaleCompleteContent) + sync/ReceiptSendRoute (US/CA = text + email)
   receipt text   utils/ReceiptFormatter.kt generatePastPlainTextReceipt */
const R = RKIT.ctx(), C = R.C, esc = RKIT.esc, L = R.lang, CC = R.country;
const SS = STR[L];
function fmt(s, a){ s = s.replace(/%%/g,"\u0001"); let i = 0;
  s = s.replace(/%(\d+)\$([sd])|%([sd])/g, (m, pos, t1) => { const idx = pos ? parseInt(pos,10)-1 : i++; const v = a[idx]; return v==null ? "" : String(v); });
  return s.replace(/\u0001/g,"%"); }
const t = (k, ...a) => { const s = SS[k]; if(s==null) throw new Error("no string "+k); return fmt(s, a); };
const tp = (k, n, ...a) => { const o = SS[k]; const one = n===1 || (L==="pt" && n===0); return fmt(o[one?"one":"other"]||o.other, a.length?a:[n]); };
const money = v => R.money(v);
const STRIPE = CC==="US" || CC==="CA";          // Stripe country: no QR row at all, Card = Tap to Pay (PayWaysVisibility.kt)
const WOMPI = CC==="CO";                          // Wompi country: the typed card form
const PIX = C.cur==="BRL";                        // QR is "Pix" and carries the amount (utils/PixLabels.kt, QR-2)
const TEXT_ROUTE = STRIPE;                        // sync/ReceiptSendRoute: own {US, CA} set
const DIAL = {CO:"+57",MX:"+52",PE:"+51",CL:"+56",EC:"+593",AR:"+54",PA:"+507",BR:"+55",US:"+1",CA:"+1"}[CC];
/* utils/CashRounding.kt: CL to $10 (1-5 down, 6-9 up), PE always down to S/ 0.10, CA to the nearest 5 cents. Cash only. */
function cashDue(v){
  if(CC==="CL"){ const r = Math.round(v) % 10; return r<=5 ? Math.round(v)-r : Math.round(v)-r+10; }
  if(CC==="PE") return Math.floor(v*10+1e-6)/10;
  if(CC==="CA") return Math.round(v*20)/20;
  return v;
}
const DECKEY = C.dec===0 ? "000" : new Intl.NumberFormat(C.loc).formatToParts(1.5).find(p=>p.type==="decimal").value;  // CheckoutPayBlock zeroKey
/* the amount a customer hands over: the next round note above what is due (whole units, MoneyKeypadEntry) */
function received(due){ let k = 1; while(k*10 <= due) k *= 10; for(const m of [1,2,5,10]) if(m*k > due+1e-9) return m*k; return 10*k; }
function keysFor(v){ return (C.dec===0 && v>=1000 && v%1000===0) ? [...String(v/1000), "000"] : [...String(v)]; }

/* ---------- pay screen ---------- o: {lines, typed, table, others, qr, card:"none"|"ready"|"setup", cashDisabled} */
function payScreen(o){
  const total = saleTotal(o.lines), due = cashDue(total), typed = o.typed||"";
  const qr = !!o.qr, cardOn = o.card && o.card!=="none", cardReady = o.card==="ready";
  const cardPrimary = STRIPE && cardReady;
  /* PayWaysVisibility.link: owner, not dismissed, not a Stripe country, something not set up yet; Colombia always asks "QR or card" */
  const qrNotSetUp = !qr, cardNotSetUp = WOMPI && !cardReady;
  let link = (STRIPE || !(qrNotSetUp || cardNotSetUp)) ? null : WOMPI ? "pay_setup_link_qr_card" : (PIX ? "pay_setup_link_pix" : "pay_setup_link_qr");
  if(o.noLink) link = null;
  let rc = "";
  if(typed){ const v = typedValue(typed); const ch = v - due;
    rc = `<div class="ln"><small>${esc(t("checkout_received_label"))}</small><b>${money(v)}</b></div>` +
      (ch >= -1e-9 ? `<div class="ln"><small>${esc(t("checkout_change_row_label"))}</small><b class="chg">${money(ch)}</b></div>`
                   : `<div class="short">${esc(t("cash_shortfall", money(-ch)))}</div>`); }
  const keys = ["1","2","3","4","5","6","7","8","9",DECKEY,"0","⌫"];
  const enough = !typed || typedValue(typed) >= due-1e-9;
  const cashW = cardPrimary ? 1.2 : (cardOn && qr) ? 1.3 : qr ? 2 : 1;
  const exactLabel = cardOn ? t("cash_exact_short") : t("cash_exact", money(due));
  let btns = `<div style="flex:${cashW}" class="${!typed?"exact":enough?"cash":"dis"}" data-t="${typed?"cash":"exact"}">${esc(typed?t("checkout_cash_label"):exactLabel)}</div>`;
  if(qr) btns += `<div style="flex:1" class="ob" data-t="qr"><i class="x-qrg"></i>${esc(PIX?"Pix":t("pay_qr_short"))}</div>`;
  if(cardOn) btns += cardReady ? `<div style="flex:${cardPrimary?2:1}" class="ob" data-t="card">${I.card}${esc(t("pay_card_short"))}</div>`
                               : `<div style="flex:1" class="nudge" data-t="card-setup"><span>+ ${esc(t("pay_card_short"))}</span><small>${esc(t("pay_card_setup_hint"))}</small></div>`;
  const rounding = Math.abs(due-total) > 1e-9 ? `<div class="x-round">${esc(t("cash_rounding_line", (due-total<0?"-":"+")+money(Math.abs(due-total))))}</div>` : "";

    (o.others ? `<span class="oth" data-t="other">${I.more}<span>${esc(t("checkout_other_method", o.others))}</span></span>` : "");
  return `<div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span><span class="clr">${esc(t("checkout_clear"))}</span></div><div class="grow"></div>
    <div class="x-pb"><div class="x-tot"><small>${esc(t("common_total"))}</small><b>${money(total)}</b></div>${rounding}

function receiptText(lines, o){ o=o||{};
  const each = t("receipt_label_each"), total = saleTotal(lines);
  let s = `${C.place}\n${t("receipt_label_order_number")}: ${SALE_NO}\n${t("receipt_label_date")}: ${DATE}\n===============================\n`;
  lines.forEach(id=>{ const it=item(id); s += `1x ${it.name}\n   @ ${money(it.price)} ${each} ... ${money(it.price)}\n`; });
  s += `-------------------------------\n${t("receipt_label_subtotal")}: ${money(total)}\n`;
  if(o.tip) s += `${t("receipt_label_tip")}: ${money(o.tip)}\n`;
  s += `===============================\n${t("receipt_label_total")}: ${money(total + (o.tip||0))}\n`;
  if(o.cardLine) s += o.cardLine + "\n";
  if(o.change) s += `${t("receipt_label_change_due")}: ${money(o.change)}\n`;
  s += `${o.method}\n\nThank you for shopping with us!`;
  return s;
}

function fakeQr(seed, mod){ mod = mod||29; let x = seed>>>0 || 7; const rnd = () => (x = (x*1103515245+12345)>>>0, (x>>>16)&1);
  let r = ""; const fp = (cx,cy)=>{ r += `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#000"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#000"/>`; };
  for(let yy=0; yy<mod; yy++) for(let xx=0; xx<mod; xx++){ const inF = (xx<8&&yy<8)||(xx>=mod-8&&yy<8)||(xx<8&&yy>=mod-8); if(!inF && rnd()) r += `<rect x="${xx}" y="${yy}" width="1" height="1" fill="#000"/>`; }
  fp(0,0); fp(mod-7,0); fp(0,mod-7);
  return `<svg viewBox="-2 -2 ${mod+4} ${mod+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${mod+4}" height="${mod+4}" fill="#fff"/>${r}</svg>`; }

   QR countries (CO MX PE CL EC AR PA; BR = Pix): Payment methods (ui/screens/settings/PaymentMethodsScreen.kt) -> switch
   "Pago QR" -> the warning page (QrResponsibilityScreen.kt, PaperTheme, through QrTermsGateHost) -> tick + "Entendido, activar
   pagos QR" -> the source chooser (QrSourceChooserDialog) -> "Subir código QR" -> Android's file picker -> toast "Código QR
   guardado." (the method turns on only after a good upload) -> at the till "QR" -> QrPaymentOverlay -> "Pagó · Sin foto".
   Brazil (QR-2): only a reusable Pix code is accepted and the checkout QR carries the sale total (utils/PixBrCode).
   US / Canada: there is NO QR at all (PaymentMethodsScreen hides the row; PayWaysVisibility.showQr needs !stripeCountry).
   The honest alternative shown there: the shop's own method (Zelle / Interac e-Transfer) with the "did you see the payment"
   confirm (PAY-1). The tree should hide RS4 for US/CA.
   Demo setup: register open, menu loaded, dining options off (factory). The bank QR picture is the shop's own (a placeholder here). */
const H = (es,pt,en) => R.pick({es,pt,en});
