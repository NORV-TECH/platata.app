const X = h => `<div class="x">${h}</div>`;

/* one line that shrinks through steps and never wraps (CheckoutPayBlock.kt:630-648 FitOneLine): the first step that fits wins;
   if none fits it is drawn at the smallest step and CLIPPED at the button edge (softWrap=false, no ellipsis). Widths in dp. */
const MEAS = document.createElement("canvas").getContext("2d");
function textW(s, size){ MEAS.font = `600 ${size}px Roboto, system-ui, sans-serif`; return MEAS.measureText(s).width; }
function fitOne(s, boxDp, padDp, steps){ for(const z of steps) if(textW(s, z) <= boxDp - 2*padDp) return {z, fits:true}; return {z:steps[steps.length-1], fits:false}; }

/* ---------- register tab, owner phone (as RS5: HomeScreen.kt TabRow, ProductLibraryView, CurrentSaleStrip, HomeFooterButtons) ---------- */
function cats(){ return `<div class="mcats">` + [{name:t("items_filter_all"),color:ALL_C,all:true}].concat(C.catsByName).map(c=>{

    return `<span style="${st}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`; }
function grid(){ return `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`; }

/* ---------- pay screen: CheckoutSheetBody.kt CheckoutLayoutContent + CheckoutPayBlock.kt (keypad always on, Exact blue) ----------
   No QR button (see Demo setup): Exacto 1 : Tarjeta 1 (CheckoutPayBlock.kt:330 + :416; cardIsPrimary is false because the phone
   cannot tap, CheckoutSheetBody.kt:260), no slot under the row. Nothing typed -> "Exacto" short (card on). The QR_ON branch is kept
   to show what a shop WITH a bank QR gets (three buttons, the hint clipped). */
function payScreen(){
  const total = BASE;
  const keys = ["1","2","3","4","5","6","7","8","9", C.dec===0 ? "000" : new Intl.NumberFormat(C.loc).formatToParts(1.5).find(p=>p.type==="decimal").value, "0","⌫"];
  const rowDp = 412 - 2*12;                                   // DesignTokens.CheckoutSidePad 12
  const weights = QR_ON ? [1.3, 1, 1] : [1, 1];
  const unit = (rowDp - 8*(weights.length-1)) / weights.reduce((a,b)=>a+b, 0);   // CheckoutButtonGap 8
  const cardDp = unit * 1;
  const hint = t("pay_card_link_hint"), f = fitOne(hint, cardDp, 8, [12, 11, 10]);   // DesignTokens.CheckoutHintSteps, HintLine pad SpaceXs
  let btns = `<div style="flex:${weights[0]}" class="exact">${esc(t("cash_exact_short"))}</div>`;
  if(QR_ON) btns += `<div style="flex:1" class="ob"><i class="x-qrg"></i>${esc(t("pay_qr_short"))}</div>`;
  btns += `<div style="flex:1" class="ob col" data-t="card"><span class="r">${I.card}${esc(t("pay_card_short"))}</span>` +
          `<span class="h" style="font-size:calc(var(--u)*${f.z});text-align:${f.fits?"center":"left"}">${esc(hint)}</span></div>`;
  const links = `<span>${esc(t("checkout_items_link", SALE.length))} ›</span><span class="oth">${I.more}<span>${esc(t("checkout_other_method", 1))}</span></span>`;
  return `<div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span><span class="clr">${esc(t("checkout_clear"))}</span></div><div class="grow"></div>
    <div class="x-pb"><div class="x-tot"><small>${esc(t("common_total"))}</small><b>${money(total)}</b></div>
    <div class="x-amt"><div class="x-links">${links}</div><div class="x-rc"></div></div>
    <div class="x-kp">${keys.map(k=>`<span class="${k.length>1||k==="⌫"||/[.,]/.test(k)?"s":""}">${esc(k)}</span>`).join("")}</div>
    <div class="x-btns">${btns}</div></div>
    <div class="x-lhint">${I.info}<span>${esc(t("pay_card_link_bar"))}</span></div>
    <div class="x-sec"><div class="x-cust">${I.person}${esc(t("checkout_add_customer_cta"))}</div></div>`;
}

/* ---------- "Este teléfono no puede cobrar con tarjeta acercándola": PosLinkScreen.kt:103-184 ---------- */
function noticePage(){
  const step = (n, k) => `<div class="stp"><i>${n}</i><span>${esc(t(k))}</span></div>`;
  return `<div class="x-lp"><div class="x-top"><span class="nb">${I.back}</span><h1>${esc(t("link_notice_title"))}</h1></div>
    <div class="x-np"><div class="red"><b>${esc(t("link_notice_headline"))}</b><p>${esc(t("link_notice_reason_no_nfc"))} ${esc(t("link_notice_not_platata"))}</p></div>
      <h2>${esc(t("link_notice_how_title"))}</h2>${step(1,"link_notice_step_1")}${step(2,"link_notice_step_2")}${step(3,"link_notice_step_3")}
      <div class="cost">${esc(t("link_notice_cost"))}</div></div>
    <div class="x-nb"><div class="p" data-t="continue">${esc(t("link_continue"))}</div><div class="s">${esc(t("link_other_way"))}</div></div></div>`;
}
/* ---------- the tip page: StripePaymentSheet.kt:262-347 StripeTipScreen (titleLarge, headlineMedium, Secondary SumaButtons) ---------- */
function tipPage(){
  const b = (lbl, tag) => `<div class="sb"${tag?` data-t="${tag}"`:""}>${esc(lbl)}</div>`;
  return `<div class="x-st top"><h2>${esc(t("stripe_tip_title"))}</h2><div class="hm">${money(BASE)}</div><div style="height:calc(var(--u)*0)"></div>
    ${[15,18,20].map(p=>b(t("stripe_tip_preset", p, money(presetTip(p))), "tip-"+p)).join("")}${b(t("stripe_tip_none"))}${b(t("stripe_tip_custom"))}
    <div class="tb">${esc(t("common_cancel"))}</div></div>`;
}
/* a placeholder QR picture (not scannable): the app draws the Stripe link with generateReadableQrBitmap, black on white */
function fakeQr(seed, mod){ mod = mod||33; let x = seed>>>0 || 7; const rnd = () => (x = (x*1103515245+12345)>>>0, (x>>>16)&1);
  let r = ""; const fp = (cx,cy)=>{ r += `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#000"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#000"/>`; };
  for(let yy=0; yy<mod; yy++) for(let xx=0; xx<mod; xx++){ const inF = (xx<8&&yy<8)||(xx>=mod-8&&yy<8)||(xx<8&&yy>=mod-8); if(!inF && rnd()) r += `<rect x="${xx}" y="${yy}" width="1" height="1" fill="#000"/>`; }
  fp(0,0); fp(mod-7,0); fp(0,mod-7);
  return `<svg viewBox="0 0 ${mod} ${mod}" shape-rendering="crispEdges"><rect width="${mod}" height="${mod}" fill="#fff"/>${r}</svg>`; }
/* ---------- the link page: PosLinkScreen.kt:244-375 (Waiting) and :272-283 (BusyBody: Creating / Settling) ---------- */
function linkPage(stage){
  const top = `<div class="x-top"><span class="nb">${I.back}</span><h1>${esc(t("link_title"))}</h1></div>`;
  if(stage==="creating" || stage==="settle")
    return `<div class="x-lp">${top}<div class="x-busy"><div class="x-spin s48"></div><div>${esc(t(stage==="creating"?"link_creating":"link_settling"))}</div></div></div>`;
  const total = BASE + TIP;
  return `<div class="x-lp">${top}<div class="x-lw"><div class="tot">${money(total)}</div>${TIP>0?`<div class="tip">${esc(t("link_includes_tip", money(TIP)))}</div>`:""}
      <div class="qr" data-t="qr">${fakeQr(Math.round(total*100)+29)}</div><div class="help">${esc(t("link_scan_help"))}</div>
      <div class="wait"><i class="x-spin s14"></i><span>${esc(t("link_waiting"))}</span></div></div>
    <div class="x-lb"><div class="wa">${esc(t("link_whatsapp"))}</div><div class="chk">${esc(t("link_check"))}</div><div class="cnl">${esc(t("common_cancel"))}</div></div></div>`;
}
/* ---------- sale complete: ReceiptOptionsScreen.kt SaleCompleteContent, card branch :213-216 ---------- */
function doneScreen(){
  let b = `<img src="${IMG.celebrate}" alt=""><div class="ttl">${esc(t("receipt_opt_completed"))}</div><div class="ok">${esc(t("card_approved_title"))}</div><div class="sub">${esc(LINE)}</div>`;
  b += `<div class="q">${esc(t("receipt_opt_how_receipt"))}</div>`;

                     : `<div class="b wa">${esc(t("receipt_opt_whatsapp_btn"))}</div>`;
  f += `<div class="b ol">${esc(t("receipt_opt_show_receipt"))}</div><div class="b pri">${esc(t("receipt_opt_new_sale_no_receipt"))}</div><div class="pv">${esc(t("receipt_opt_privacy"))}</div>`;
  return `<div class="x-sc-body">${b}</div><div class="x-sc-foot">${f}</div>`;
}
/* the customer's side is Stripe's own page: never drawn. A hop card says what happens there (demo words, not an app screen). */
const HOP = {
  from: H("Celular del cliente","Celular do cliente","Customer's phone"),
  line: H("Paga ahí con su tarjeta","Paga ali com o cartão","Pays there by card"),
  note: H("El pago llega a tu teléfono y la venta se cierra sola.","O pagamento chega ao seu celular e a venda fecha sozinha.","The payment reaches your phone and the sale closes by itself.")
};
/* any other country: no link (PayByLinkOffer.decide -> NONE outside US, CA, MX). One honest card, in the page language. */
function onlyThere(){
  return `<div class="x-only"><div class="cd"><b>${esc(t("link_title"))}</b>
    <p>${esc(H("Cobrar con enlace existe solo en México, Estados Unidos y Canadá.","O Cobrar por link existe só no México, nos Estados Unidos e no Canadá.","Charge by link is only in Mexico, the United States and Canada."))}</p>
    <span class="ok" data-t="ok">${esc(H("Entendido","Entendi","Got it"))}</span></div></div>`;
}
function render(st){
  if(!LINK) return X(onlyThere());
  if(st.screen==="reg") return X(regScreen(SALE));
  if(st.screen==="done") return X(doneScreen());
  let h = payScreen();
  if(st.link==="notice") h += noticePage();
  else if(st.link==="tip") h += tipPage();
  else if(st.link) h += linkPage(st.link==="hop" ? "wait" : st.link);
  if(st.link==="hop") h += RKIT.hop(R, {from:HOP.from, to:t("conn_slot_phone"), line:HOP.line, note:HOP.note});
  return X(h);
}
const tapH = H("Toca ","Toque em ","Tap ");
const stepsLink = [
  {beat:0, hint:tapH + H("Cobrar","Cobrar","Charge"), target:'[data-t="charge"]', tap(st){ st.screen="pay"; }},
  {beat:1, wait:2.4, hint:tapH + t("pay_card_short"), target:'[data-t="card"]', tap(st){ st.link="notice"; }},
  {beat:2, wait:2.2, hint:tapH + t("link_continue"), target:'[data-t="continue"]', tap(st){ st.link="tip"; }},
  {beat:3, hint:H("El cliente toca ","O cliente toca ","The customer taps ") + t("stripe_tip_preset", 15, money(TIP)), target:'[data-t="tip-15"]', tap(st,E){
      st.link="creating"; E.after(1400,()=>{ st.link="wait"; }); }},
  {beat:5, hint:H("El cliente escanea el QR con su celular","O cliente escaneia o QR com o celular","The customer scans the QR with their phone"), target:'[data-t="qr"]', tap(st,E){
      st.link="hop"; E.after(2600,()=>{ st.link="settle"; }); E.after(4000,()=>{ st.link=null; st.screen="done"; }); }}
];
const stepsOnly = [
  {beat:0, hint:tapH + H("Entendido","Entendi","Got it"), target:'[data-t="ok"]', tap(){}}
];
const END = LINK ? H("Así cobras con enlace, con Platata.","Assim você cobra por link, com o Platata.","That's how you charge by link with Platata.")
                 : H("Cobrar con enlace: solo México, EE. UU. y Canadá.","Cobrar por link: só México, EUA e Canadá.","Charge by link: only Mexico, the US and Canada.");
RKIT.start(R, {
  id:"RS25", tallVideo:true, clock:"12:41",
  endText: END,
  beats: LINK ? R.pick({
      es:["Con la venta lista, toca Cobrar","¿Tu teléfono no lee tarjetas? Toca Tarjeta","Platata te explica cómo: toca Continuar","El cliente elige la propina","Un QR con el total, o el enlace por WhatsApp","El cliente escanea el QR y paga en su celular","El pago llega y la venta se cierra sola",END],
      pt:["Com a venda pronta, toque em Cobrar","O celular não lê cartão por aproximação? Toque em Cartão","O Platata explica como: toque em Continuar","O cliente escolhe a gorjeta","Um QR com o total, ou o link pelo WhatsApp","O cliente escaneia o QR e paga no celular dele","O pagamento chega e a venda fecha sozinha",END],
      en:["A sale is ready: tap Charge","Phone can't read cards by tapping? Tap Card","Platata explains how: tap Continue","The customer picks a tip","A QR with the total, or the link by WhatsApp","The customer scans the QR and pays on their phone","The payment arrives and the sale closes by itself",END]})
    : [H("Cobrar con enlace no está en tu país","Cobrar por link não está no seu país","Charge by link isn't in your country"), END],
  state:{screen:"reg", link:null},
  render,
  device: () => "phone",
  who: () => LINK ? t("conn_slot_phone") : "",
  steps: LINK ? stepsLink : stepsOnly
});
</script>
