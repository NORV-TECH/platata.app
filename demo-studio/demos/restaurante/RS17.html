/* utils/WhatsappUtils.kt formatWhatsappForReading */
function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

/* RS17 "Impuestos": the owner adds the restaurant's tax and opens it again to change it.
   Screens follow the app at app-head (paths under app/src/main/java/com/example/):
   way in        panel Settings row -> SettingsHubScreen settings_hub_taxes
   the list      ui/screens/settings/TaxesManagementScreen.kt:116-125, 312-421 (SumaTopBar tax_title + NewTextAction
                 common_new_short; empty: tax_empty_state centred onSurfaceVariant; a rate = SumaCard tapping opens the edit
                 form, primaryContainer (#F2F2F7) at 50% when on; name bodyLarge bold + black badge tax_active_badge
                 labelSmall r6; tax_line_included / tax_line_added with formatTaxRate; Switch, Edit, red Delete)
   new tax       :134-307 (tax_add_section; sync/TaxPresets chips "IVA 19%" ... (AssistChip; CO: IVA 19, Impoconsumo 8;
                 PE IGV 18; PA ITBMS 7; MX IVA 16; CL IVA 19; AR IVA 21; EC IVA 15; BR, US, CA none) that only FILL the
                 fields; in Colombia a picked IVA/Impoconsumo shows tax_preset_one_or_other; tax_field_name, tax_field_pct;
                 tax_in_prices_question + two radios, default sync/TaxPriceDefault (included everywhere except US/CA);
                 Save at the bottom -> snackbar tax_saved_on; the tax is saved ON, TaxDiningActions.addTaxRate)
   edit          openEdit: tax_edit_section, the two fields filled, tax_edit_note, no radios (the kind is carried)
   Demo data: the preset of the country where there is one; Brazil, the US and Canada type their own (Brazil has no
   preset on purpose; US/CA a local sales tax added on top). */
// KEYS: settings_hub_taxes,tax_title,tax_empty_state,tax_add_section,tax_edit_section,tax_field_name,tax_field_pct,tax_in_prices_question,tax_in_prices_yes,tax_in_prices_no,tax_preset_one_or_other,tax_saved_on,tax_line_included,tax_line_added,tax_active_badge,tax_edit_note,common_save
const C = R.C;
const PRESETS = ({CO:[["IVA",19],["Impoconsumo",8]],PE:[["IGV",18]],PA:[["ITBMS",7]],MX:[["IVA",16]],CL:[["IVA",19]],AR:[["IVA",21]],EC:[["IVA",15]]})[R.country] || [];
const PICK = R.country === "CO" ? PRESETS[1] : PRESETS[0];                 // the restaurant's tax: CO impoconsumo
const TYPED = ({BR:["Imposto","5"],US:["Sales tax","8.25"],CA:["HST","13"]})[R.country];
const USCA = R.country === "US" || R.country === "CA";
const DEC = ({COP:",",MXN:".",PEN:".",CLP:",",USD:".",ARS:",",BRL:",",CAD:"."})[C.cur] || ".";
const rate = v => String(v).replace(".", DEC) + "%";                     // formatTaxRate (decimal mark of the currency)
const TNAME = PICK ? PICK[0] : TYPED[0], TPCT = PICK ? String(PICK[1]) : TYPED[1];
const INCLUDED = !USCA;                                                   // TaxPriceDefault

function list(st){
  const body = !st.saved ? `<p class="tx-empty">${esc(S("tax_empty_state"))}</p>` :
    `<div class="tx-card${st.hl?" rs-hl":""}" data-t="rate"><div class="l"><div class="n"><b>${esc(TNAME)}</b><span class="bd">${esc(S("tax_active_badge"))}</span></div>
      <small>${esc(F(INCLUDED?"tax_line_included":"tax_line_added", rate(TPCT)))}</small></div>
      <span class="sw2">${sw(true)}</span><span class="ic" style="color:var(--m-onv)">${I.edit}</span><span class="ic" style="color:var(--m-err)">${I.trash}</span></div>`;
  return topbar(S("tax_title"), {action:newAction("new")}) + `<div class="rs-scroll"><div class="in tx-list">${body}</div></div>${st.snack?snack(S("tax_saved_on")):""}` + strip();
}
const radio = (on, t) => `<div class="tx-rad"><span class="rb${on?" on":""}"><i></i></span><span>${esc(t)}</span></div>`;
function form(st){
  const chips = st.edit ? "" : PRESETS.map(p => `<span class="tx-chip"${p===PICK?' data-t="chip"':""}>${esc(p[0]+" "+rate(p[1]))}</span>`).join("");
  return topbar(S(st.edit?"tax_edit_section":"tax_add_section")) + `<div class="tx-form">
    ${chips?`<div class="tx-chips">${chips}</div>`:""}
    ${st.picked && !st.edit && R.country==="CO" ? `<p class="tx-note">${esc(S("tax_preset_one_or_other"))}</p>` : ""}
    ${field(S("tax_field_name"), st.name, {focus:st.focus==="name", tag:"f-name"})}
    ${field(S("tax_field_pct"), st.pct, {focus:st.focus==="pct", tag:"f-pct"})}
    ${st.edit ? `<p class="tx-edit">${esc(S("tax_edit_note"))}</p>` :
      `<p class="tx-q">${esc(S("tax_in_prices_question"))}</p>${radio(INCLUDED, S("tax_in_prices_yes"))}${radio(!INCLUDED, S("tax_in_prices_no"))}`}
    <div class="sp"></div>
    <div class="rs-btn" data-t="save">${esc(S("common_save"))}</div></div>` + strip();
}
const fromMoney = v => ({CO:1,BR:0.0011,US:0.00042,CA:0.00048,MX:0.0048,PE:0.00098,CL:0.27,EC:0.00026,AR:0.32,PA:0.00026}[R.country] * v);
function render(st){
  if(st.screen==="panel") return panel({regTotal:fromMoney(862980), today:fromMoney(739125), menuCount:C.items.length, clients:CLIENTS.length, invoices:3, team:2, phones:2});
  if(st.screen==="hub") return settingsHub();
  if(st.screen==="form") return form(st);
  return list(st);
}
const HINT = (es,pt,en) => pick({es:"Toca "+es, pt:"Toque em "+pt, en:"Tap "+en});
const H1 = k => HINT(S(k),S(k),S(k));
const fill = [];
if (PICK) fill.push({beat:3, hint:HINT(PICK[0]+" "+rate(PICK[1]),PICK[0]+" "+rate(PICK[1]),PICK[0]+" "+rate(PICK[1])), target:'[data-t="chip"]', tap(st){ st.picked=true; st.name=TNAME; st.pct=TPCT; }});
else fill.push(
  {beat:3, hint:H1("tax_field_name"), target:'[data-t="f-name"]', tap(st,E){ st.focus="name"; E.type("name", TNAME, null, 90); }},
  {beat:3, hint:H1("tax_field_pct"), target:'[data-t="f-pct"]', tap(st,E){ st.focus="pct"; E.type("pct", TPCT, null, 160); }});
RKIT.start(R, {
  id:"RS17", tallVideo:true, clock:"10:30",
  endText:pick({es:"Así pones tus impuestos, con Platata.",pt:"Assim você configura seus impostos, com o Platata.",en:"That's how you set up your taxes, with Platata."}),
  beats:pick({
    es:["En Mi negocio, toca Configuración","Toca Impuestos","Aún no hay impuestos. Toca + Nuevo","Toca el impuesto de tu país: se llena solo","¿Ya está en tus precios? Toca Guardar","Listo: activo en tus ventas","Toca el impuesto para cambiarlo","Las ventas pasadas no cambian","Así pones tus impuestos"],
    pt:["Em Meu negócio, toque em Configurações","Toque em Impostos","Ainda não há impostos. Toque em + Novo","Escreva o nome e a porcentagem","Já está nos seus preços? Toque em Salvar","Pronto: ativo nas suas vendas","Toque no imposto para mudar","As vendas passadas não mudam","Assim você configura seus impostos"],
    en:["In My business, tap Settings","Tap Taxes","No taxes yet. Tap + New","Type the name and the rate","Already in your prices? Tap Save","Done: it's on for your sales","Tap the tax to change it","Past sales don't change","That's how you set up your taxes"]}),
  state:{screen:"panel", name:"", pct:"", focus:"", picked:false, saved:false, snack:false, hl:false, edit:false},
  render,
  device: () => "phone",
  who: () => pick({es:"Tu teléfono",pt:"Seu celular",en:"Your phone"}),
  steps:[
    {beat:0, hint:HINT(PS.settings,PS.settings,PS.settings), target:'[data-t="row-settings"]', tap(st){ st.screen="hub"; }},
    {beat:1, hint:H1("settings_hub_taxes"), target:'[data-t="hub-taxes"]', tap(st){ st.screen="list"; }},
    {beat:2, hint:HINT("+ Nuevo","+ Novo","+ New"), target:'[data-t="new"]', tap(st){ st.screen="form"; }},
    ...fill,
    {beat:4, hint:H1("common_save"), target:'[data-t="save"]', tap(st,E){ st.screen="list"; st.saved=true; st.focus=""; st.snack=true; st.hl=true; E.after(3200,()=>{ st.snack=false; }); }},
    {beat:6, hint:HINT(TNAME,TNAME,TNAME), target:'[data-t="rate"]', tap(st){ st.screen="form"; st.edit=true; st.hl=false; st.snack=false; st.name=TNAME; st.pct=TPCT; }}
  ]
});
</script>
