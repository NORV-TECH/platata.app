/* ===== shared by RS19..RS24 (copied into each page; kit/ is not edited) =====

   home()      ui/screens/home/HomeScreen.kt:551-700 (one warning bar, TabRow Teclado|Catálogo, RegisterClosedBar, OfflineStrip),
               ItemEditModeBar :1989-2070 (right-aligned "Editar"), ProductLibraryView (chips + 3-column grid, A-Z),
               footer :804-842 (CurrentSaleStrip + FooterButtonPair "Guardar" | "Cobrar $X", HomeFooterButtons.kt)
   nav()       ui/app/PlatataApp.kt:503-722 (Caja = ShoppingCart, Ventas = Receipt, flag circle 32 dp "Mi negocio";
               fingerprint instead of the flag while Security is on and the 10-minute session is over :499, :621-633)
   panel()     HomeScreen.kt:1440-1830 (name 28 sp Black SumaBlue + arrow; register card; Vender en línea; "Día a día";
               Menú, Clientes, Facturas, Equipo, Reportes; divider; Configuración). WorkspaceRow r16 #F2F2F7, 42 dp white circle.
   hub()       ui/screens/settings/SettingsHubScreen.kt:170-330 + sync/SettingsHubRules.kt (restaurant: + Opciones de servicio)
   strip()     ui/screens/reports/SupportStrip.kt (SUPPORT-3) on every LEVEL_2_PLUS page (reports/ReportLevels.kt), hidden
               while a dialog / sheet / system prompt has the window focus
   dlg()       ui/components/SumaDialog.kt (Material AlertDialog, shapes.medium)
   bio()       the Android system BiometricPrompt (ui/BiometricHelper.kt showBiometricPrompt): SYSTEM UI, only title + subtitle

/* how far (in dp) the page must scroll so that `sel` sits above the bottom of .cpage (the real pages scroll; the demo moves
   the page's inner column with a transform kept in state, so a re-render keeps the place) */
function scrollFor(sel){
  const el=document.querySelector('#app '+sel), pg=document.querySelector('#app .cpage, #app .spage, #app .wscr'); if(!el||!pg) return 0;
  const u=document.getElementById('screen').getBoundingClientRect().width/412;
  const over=el.getBoundingClientRect().bottom - pg.getBoundingClientRect().bottom + 16*u;
  return over>0 ? Math.ceil(over/u) : 0;
}

  return `<div class="slot"${c.k==="add"&&!c.step?' data-t="conn-addc"':""}><div class="circ ${cls}">${inner}<span class="badge">${c.n}</span></div><b>${esc(l1)}</b><small class="${ok?"ok":""}">${esc(l2)}</small></div>`;
}
function circles(incl, paid){
  let h = `<div class="cgrp"><div class="kv ok">${esc(t("gIncl"))}</div><div class="crow">${incl.map(circle).join("")}</div></div>`;
  if(paid.length) h += `<div class="cgrp"><div class="kv">${esc(t("gPaid"))}</div><div class="crow">${paid.map(circle).join("")}</div></div>`;
  return h;
}
function money(paid){
  let h = `<div class="mline"><div class="l"><b>${esc(t("ledIncl"))}</b><small>${esc(t("ledInclSub"))}</small></div><span class="v ok">${esc(t("included"))}</span></div>`;
  if(paid<=0) h += `<div class="mline"><div class="l"><b>${esc(t("ledEach"))}</b><small>${esc(t("ledEachSub"))}</small></div></div>`;
  else h += `<div class="mline"><div class="l"><b>${esc(t("ledAdded"))}</b></div><span class="v">${paid}</span></div><div class="mline big"><div class="l"><b>${esc(t("ledPay"))}</b></div></div>`;
  return h;
}
function connPage(st){
  const paid = st.paid;
  let hero;
  const incl = [{k:"phone",n:1},{k:"dev",n:2,name:TAB_NAME}];
  if(FREE){
    hero = `<div class="pcard"><div class="h2" style="color:#2C6A35">${esc(t("allIncl"))}</div>${circles(incl,[])}<div class="pbody">${esc(t("usa"))}</div></div>`;
  } else {
    const paidRow = []; for(let j=0;j<paid;j++) paidRow.push({k:"open",n:3+j,paid:true}); paidRow.push({k:"add",n:3+paid});
    hero = `<div class="pcard"><div class="kv">${esc(t("inUse"))}</div><div class="h1">${esc(t("nOfM",2,2+paid))}</div>${circles(incl,paidRow)}
      <div class="pbody">${esc(paid?t("oneAvail"):t("allInUse"))}</div>${money(paid)}</div>`;
  }
  let h = topbar(t("title"),{paper:true}) + `<div class="cpage"><div class="cin" style="transform:translateY(calc(var(--u)*${-(st.sc||0)}))">` + hero +
    `<div class="prow"><span>${esc(t("printers"))}</span>${I("chev")}</div>
     <div class="dsec"><div class="kv">${esc(t("secReg"))}</div><div class="drow"><span class="dtile">${I("tablet")}</span><span class="nm">${esc(TAB_NAME)}</span>
       <span class="rt"><span class="chip ok">${esc(t("included"))}</span><span class="rmv">${esc(t("remove"))}</span></span></div></div>`;
  if(paid>0) h += `<div class="dsec"><div class="kv">${esc(t("secPaid"))}</div><div class="drow"><span class="dtile">${I("add")}</span><span class="nm">${esc(t("availT"))}<br><small class="small">${esc(t("availS"))}</small></span>
       <span class="rt"><span class="chip pd">${esc(t("paidSlot"))}</span><span class="rmv">${esc(t("remove"))}</span></span></div></div>`;
  h += `<div class="pbtn" data-t="conn-connect">${I("add")}${esc(t("connect"))}</div>`;
  if(FREE) h += `<div class="scard" style="background:#fff"><div class="top"><span class="sbox" style="background:#F9EAE3">${I("box")}</span><span class="tx"><b>${esc(t("storeT"))}</b><span class="pbody">${esc(t("storeUsa"))}</span></span><span class="okpill">${esc(t("storeOn"))}</span></div></div>`;
  else h += `<div class="scard" style="background:#F9EAE3"><div class="top"><span class="sbox" style="background:#fff">${I("box")}</span><span class="tx"><b>${esc(t("lockT"))}</b><span class="pbody">${esc(t("lockB"))}</span></span></div><div class="pbtn sm">${I("add")}${esc(t("addConn"))}</div></div>`;
  h += `</div></div>` + (st.sheet||st.dlg ? "" : strip());
  if(st.dlg) h += dlg({paper:true, title:t("dlgT"), body:`<p>${esc(t("dlgB"))}</p><p style="color:#464A52">${esc(t("dlgWhy"))}</p><p style="background:#F9EAE3;color:#3A2A1F;border-radius:calc(var(--u)*14);padding:calc(var(--u)*12)">${esc(t("dlgStore"))}</p><p class="small" style="font-size:calc(var(--u)*12.5);margin:0">${esc(t("dlgPlay"))}</p>`,
     dismiss:T("notNow"), confirm:t("addConn"), t:"dlg-add"});
  if(st.sheet) h += `<div class="sheetp"><div class="sheet"><div class="grab"></div><div class="h2">${esc(t("chooseT"))}</div>
    <div class="opt"><span class="tl">${I("tablet")}</span><span><b>${esc(t("optReg"))}</b><small>${esc(t("optRegD"))}</small></span></div>
    <div class="opt" data-t="opt-phone"><span class="tl">${I("phone")}</span><span><b>${esc(t("optPh"))}</b><small>${esc(t("optPhD"))}</small></span></div>
    <div class="notnow">${esc(T("notNow"))}</div></div></div>`;
  return h;
}
function addPage(){
  const incl=[{k:"phone",n:1},{k:"open",n:2,paid:false}], paidRow=[{k:"open",n:3,paid:true},{k:"add",n:4,step:true}];
  return topbar(t("addTitle"),{paper:true}) + `<div class="cpage" style="gap:calc(var(--u)*12)">
    <div class="stepc"><div class="step"><span class="sbt">${svg("M19 13H5v-2h14v2z")}</span><span class="mid"><span class="h1">1</span><small>${esc(t("addedLabel"))}</small></span><span class="sbt">${I("add")}</span></div>
      ${circles(incl,paidRow)}${money(1)}</div>
    <div class="hint">${esc(t("hintUp"))}</div><div class="hint">${esc(t("dlgStore"))}</div>
    <div class="pbtn" data-t="apply">${esc(t("apply"))}</div></div>` + strip();
}
function pickPage(st){
  const rows = EMPS.map((name,i)=>{
    const inv = i===0 && st.invited;
    return `<div class="emp${inv&&st.flash?" flash":""}"><div class="r"><span class="av">${esc(name[0])}</span><span class="who"><b>${esc(name)}</b><small>${esc(t("cashier"))}</small></span>
      ${inv?`<span class="chip wn">${esc(t("invited"))}</span>`:`<span class="cbtn" data-t="emp-${i}">${esc(t("connect"))}</span>`}</div>
      ${inv?`<div class="code">${esc(t("nextStep",CODE,PIN))}</div><div class="send">${esc(t("send"))}</div>`:""}</div>`;
  }).join("");
  return topbar(t("pickT"),{paper:true}) + `<div class="cpage" style="gap:calc(var(--u)*12);padding-top:calc(var(--u)*16)"><div class="h2">${esc(t("pickQ"))}</div>${rows}
    <div class="addemp">${esc(t("addEmp"))}</div>${FREE?"":`<div class="small">${esc(t("costNote"))}</div>`}</div>` + strip();
}
function render(st){
  if(st.screen==="home") return home({nav:{on:"reg"}});
  if(st.screen==="panel") return panel({salesToday:C.order.reduce((a,id)=>a+item(id).price,0)*6});
  if(st.screen==="hub") return hub({backupLast:backupDate()});
  if(st.screen==="conn") return connPage(st);
  if(st.screen==="add") return addPage() + (st.hop ? RKIT.hop(R,{from:T("devOwner"), to:t("play"), line:t("oneConn"), note:t("playNote")}) : "");
  if(st.screen==="pick") return pickPage(st);
  return "";
}
const scrollTo = (st, sel) => { const v = scrollFor(sel); if(v>0) st.sc = (st.sc||0) + v; };
RKIT.start(R, {
  id:"RS19", tallVideo:true, clock:"12:41",
  endText:P({es:"Así conectas otro celular o tableta con Platata.",pt:"Assim você conecta outro celular ou tablet com o Platata.",en:"That's how you connect another phone or tablet with Platata."}),
  beats: FREE ? P({
    es:["Abre tu negocio, Configuración y Conexiones","Tu teléfono y tu caja: las dos incluidas","En EE. UU. y Canadá no pagas conexiones","Para otro equipo, toca Conectar","Elige el teléfono de un empleado","Elige quién lo va a usar y toca Conectar","Entra con el código del negocio y su PIN","Así conectas otro celular o tableta con Platata."],
    en:["Open your business, Settings, then Connections","Your phone and your register: both included","No connection charges in the US and Canada","For another device, tap Connect","Pick an employee phone","Pick who will use it and tap Connect","They sign in with the business code and their PIN","That's how you connect another phone or tablet with Platata."]})
  : P({
    es:["Abre tu negocio, Configuración y Conexiones","Dos incluidas: tu teléfono y tu primera caja","Agrega una conexión y confírmala en Google Play","Ya tienes una conexión libre. Toca Conectar","Elige el teléfono de un empleado","Elige quién lo va a usar y toca Conectar","Entra con el código del negocio y su PIN","Así conectas otro celular o tableta con Platata."],
    pt:["Abra seu negócio, Configurações e Conexões","Duas incluídas: seu celular e seu primeiro caixa","Adicione uma conexão e confirme no Google Play","Agora há uma conexão livre. Toque em Conectar","Escolha o celular de um funcionário","Escolha quem vai usar e toque em Conectar","Ele entra com o código do negócio e o PIN","Assim você conecta outro celular ou tablet com o Platata."],
    en:["Open your business, Settings, then Connections","Two included: your phone and your first register","Add a connection and confirm it in Google Play","Now one connection is free. Tap Connect","Pick an employee phone","Pick who will use it and tap Connect","They sign in with the business code and their PIN","That's how you connect another phone or tablet with Platata."]}),
  state:{screen:"home", paid:0, sc:0, sheet:false, hop:false, invited:false, flash:false},
  render,
  who: () => T("devOwner"),
  steps: [
    {beat:0, hint:P({es:"Toca Mi negocio",pt:"Toque em Meu negócio",en:"Tap My business"}), target:'[data-t="flag"]', tap(st){ st.screen="panel"; }},
    {beat:0, hint:P({es:"Toca Configuración",pt:"Toque em Configurações",en:"Tap Settings"}), target:'[data-t="settings"]', tap(st){ st.screen="hub"; }},
    {beat:0, hint:P({es:"Toca Conexiones",pt:"Toque em Conexões",en:"Tap Connections"}), target:'[data-t="hub-conn"]', tap(st){ st.screen="conn"; }},
  ].concat(FREE ? [
    {beat:3, hint:P({es:"Toca Conectar",pt:"Toque em Conectar",en:"Tap Connect"}), target:'[data-t="conn-connect"]', tap(st){ st.sheet=true; }},
  ] : [
    {beat:1, hint:P({es:"Toca Agregar",pt:"Toque em Adicionar",en:"Tap Add"}), target:'[data-t="conn-addc"]', tap(st){ st.screen="add"; }},
    {beat:2, hint:P({es:"Toca Confirmar en Google Play",pt:"Toque em Confirmar no Google Play",en:"Tap Confirm in Google Play"}), target:'[data-t="apply"]', tap(st,E){ st.hop=true;
        E.after(2600,()=>{ st.hop=false; st.paid=1; st.screen="conn"; });
        E.after(3800,()=>scrollTo(st,'[data-t="conn-connect"]')); }},
    {beat:3, hint:P({es:"Toca Conectar",pt:"Toque em Conectar",en:"Tap Connect"}), target:'[data-t="conn-connect"]', tap(st){ st.sheet=true; }},
  ]).concat([
    {beat:4, hint:P({es:"Toca El teléfono de un empleado",pt:"Toque em O celular de um funcionário",en:"Tap An employee phone"}), target:'[data-t="opt-phone"]', tap(st){ st.sheet=false; st.screen="pick"; }},
    {beat:5, hint:P({es:"Toca Conectar",pt:"Toque em Conectar",en:"Tap Connect"}), target:'[data-t="emp-0"]', tap(st,E){ st.invited=true; st.flash=true; E.after(1300,()=>{ st.flash=false; }); }}
  ])
});

</script>
