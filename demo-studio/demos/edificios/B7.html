<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Platata · Fechas que exige la ley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Roboto:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../../kit/edif.css">
<style>
.seg span{font-size:3.3cqw;letter-spacing:.01em}
.sect{font:600 3.1cqw var(--app);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:.6cqw}
.duty{gap:1cqw;padding:3cqw 3.8cqw 2.4cqw}
.duty b{font:500 3.9cqw/1.3 var(--app);color:var(--ink)}
.card.bad.duty b{color:var(--badtx)}
.duty .when{font:400 3.3cqw var(--app);color:var(--muted)}
.duty .law{font:400 3cqw/1.35 var(--app);color:var(--muted)}
.duty .act{align-self:flex-end;font:600 3.6cqw var(--app);color:var(--ink);padding:1.4cqw 2cqw;border-radius:2.4cqw}
.duty.done{background:var(--okbg);border-color:transparent}
.duty.done b{color:var(--oktx)}
.duty.done .act{color:var(--oktx);display:flex;align-items:center;gap:1cqw}
.duty.done .act svg{width:4cqw;height:4cqw}
.sum{padding:2.6cqw 3.8cqw;font:500 3.6cqw var(--app);color:var(--accent)}
</style>
</head>
<body>
<div id="root"></div>
<script src="../../kit/engine.js"></script>
<script>
const {K} = Demo, I = K.icons;
// Duty texts are the app's own (edif_deber_*); law references as the app shows them.
const DUTIES = [
  {id:"mora", sec:"Vencido", t:"Confirme la tasa de mora de este mes", w:"Venció hace 3 días", law:"Ley 675 art. 30 — máximo 1,5 × interés bancario corriente, certificado mensual", act:"Poner tasa", bad:true},
  {id:"ret", sec:"Hoy", t:"Declare y PAGUE la retención en la fuente del mes", w:"Vence hoy", law:"E.T. arts. 368, 580-1 (ineficacia), 606 par. 2, 641", act:"Ya lo hice"},
  {id:"fac", sec:"Hoy", t:"Cargue las facturas del mes: aseo, vigilancia, ascensor, jardinería", w:"Vence hoy", law:"", act:"Ya lo hice"},
  {id:"pre", sec:"Lo que viene", t:"Empiece el presupuesto del año que viene", w:"Faltan 43 días", law:"", act:"Ya lo hice"},
  {id:"conv", sec:"Lo que viene", t:"Envíe la convocatoria — mínimo 15 días antes, con la lista de morosos", w:"Faltan 148 días", law:"Ley 675 art. 39", act:"Ya lo hice"}
];
const DONE_BEFORE = [
  {t:"Suba el extracto del banco del mes pasado", w:"cerrada el 19 oct 2026"},
  {t:"Cierre el cobro del mes: quién pagó y quién no", w:"cerrada el 2 oct 2026"},
  {t:"Pague la seguridad social del mes", w:"cerrada el 1 oct 2026"}
];
Demo.start({
  id:"B7", campaign:"B7-CO-es", label:"Edificios · Colombia",
  endText:"Así no se le pasa ninguna fecha.",
  beats:["Las fechas que la ley le exige","Pendientes: lo vencido, lo de hoy y lo que viene","Hecho: toque Ya lo hice","En Hechas queda la constancia","Así no se le pasa ninguna fecha"],
  state:{view:"chat", seg:"hacer", retDone:false, retGone:false},
  render(st){
    const badge = st.retGone ? 2 : 3;
    if(st.view==="chat"){
      const chat = `<div class="day">Hoy</div>` +
        K.tata("Octubre entró: 52 movimientos. La cuenta cierra en $ 18.420.300.",{tm:"8:02"}) +
        K.tata("Tiene 3 cosas para esta semana. Una ya se venció: la tasa de mora de octubre.",{tm:"8:02"});
      return K.head() + `<div class="chat">${chat}</div>` + K.inbar() + K.tabs("chat", badge);
    }
    const segs = [["hacer","Por hacer"],["hechas","Hechas"],["ano","El año"]].map(([id,l])=>`<span class="${st.seg===id?"on":""}" data-t="seg-${id}">${l}</span>`).join("");
    let body = "";
    if(st.seg==="hacer"){
      body += `<div class="card soft sum">Octubre: 17 de 20 pagaron · faltan $ 1.230.000</div>`;
      let last = "";
      for(const d of DUTIES){
        if(d.id==="ret" && st.retGone) continue;
        if(d.sec!==last){ body += `<div class="sect">${d.sec}</div>`; last=d.sec; }
        const done = d.id==="ret" && st.retDone;
        body += `<div class="card duty${d.bad?" bad":""}${done?" done new":""}"><b>${d.t}</b><span class="when">${done?"Hecho":d.w}</span>${d.law?`<span class="law">${d.law}</span>`:""}<span class="act" data-t="act-${d.id}">${done?I.check+"Hecho":d.act}</span></div>`;
      }
    } else {
      const list = (st.retGone?[{t:"Declare y PAGUE la retención en la fuente del mes", w:"cerrada el 19 oct 2026", isNew:true}]:[]).concat(DONE_BEFORE);
      body += list.map(d=>`<div class="card duty done${d.isNew?" new":""}"><b>${d.t}</b><span class="when">${d.w}</span><span class="act" style="color:var(--ink2)">Volver a abrirla</span></div>`).join("");
    }
    return K.head({title:"Pendientes", sub:"lunes 19 de octubre"}) + `<div class="seg">${segs}</div><div class="body" style="gap:2cqw">${body}</div>` + K.tabs("pend", badge);
  },
  steps:[
    {beat:1, hint:"Toque Pendientes", target:'[data-t="tab-pend"]', tap(st){ st.view="pend"; }},
    {beat:2, hint:"Toque Ya lo hice", target:'[data-t="act-ret"]', tap(st,E){ st.retDone=true; E.after(1000, ()=>{ st.retGone=true; }); }},
    {beat:3, hint:"Toque Hechas", target:'[data-t="seg-hechas"]', tap(st,E){ st.seg="hechas"; E.after(1600, ()=>{}); }}
  ]
});
</script>
</body>
</html>
