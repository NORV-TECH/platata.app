/* TS4 "Cobrar con QR" as a SHOP, on the owner phone. Every country, es/pt/en; ?type=pharmacy sells the pharmacy items.
   Same as RS4 (nothing in the QR code asks the business type); what differs for a shop:
   - Payment methods (ui/screens/settings/PaymentMethodsScreen.kt + PaymentMethodRowHead.kt) has the shop's "Fiado" row: no switch, the
     note pay_methods_tab_note (isTab). Order = PosViewModel.paymentMethods sort: cash, QR, Mercado Pago, then the rest by id.
   - The sale comes from the Scan register (ScanCheckoutTab.kt): two products already scanned, "Escanear más" + "Cobrar $X".
   - The pay screen's save slot reads "Fiar" (CheckoutSheetBody.kt:322-341), no dining question.
   QR countries (CO MX PE CL EC AR PA; BR = Pix): switch "Pago QR" -> QrResponsibilityScreen.kt (PaperTheme, via QrTermsGateHost) ->
   tick + "Entendido, activar pagos QR" -> QrSourceChooserDialog -> "Subir código QR" -> Android's file picker -> toast "Código QR guardado."
   (the method turns on only after a good upload) -> at the till "QR"/"Pix" -> QrPaymentOverlay -> "Pagó · Sin foto".
   Brazil (QR-2): a reusable Pix code only; the checkout QR carries the sale total (utils/PixBrCode); the word is "Pix" (utils/PixLabels).
   US / Canada: NO QR at all (PaymentMethodsScreen hides the row; PayWaysVisibility.showQr needs !stripeCountry). The honest
   alternative shown there: the shop's own method (Zelle / Interac e-Transfer) with the "did you see the payment" confirm (PAY-1).
   Demo setup: register open, products already in the catalogue, the bank QR picture is the shop's own (a placeholder here). */

const hexA = (hex, a) => { const n=parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const ALL_C = "#607D8B";
const colorOf = it => (C.catOf(it.cat)||{color:ALL_C}).color;
const item = id => C.item(id);
const OWNER = C.owner, OWNER_FIRST = OWNER.split(" ")[0];

/* SumaTopBar: TopAppBar 64 dp, back arrow, titleLarge bold (ui/components/SumaTopBar.kt) */
const topbar = (title, o={}) => `<div class="tb">${o.noBack?"":`<span class="ib" data-t="${o.backT||"back"}">${o.close?I.close:I.back}</span>`}<div class="tt">${o.html||esc(title)}</div>${o.action||""}</div>`;
/* SumaButton: 52 dp, radius 12 (pill = 50), titleMedium SemiBold */
const btn = (text, kind, dt, o={}) => `<div class="sb ${kind||"pri"}${o.pill?" pill":""}${o.off?" off":""}" ${dt?`data-t="${dt}"`:""}>${o.icon||""}<span>${esc(text)}</span></div>`;
/* CashKeypad (OpenRegisterScreen.kt:191): 4 rows sharing the height, 48..72 dp, 4 dp gaps, grey keys r12, headlineLarge bold */
const keypad = (pre, rowH) => { const rows=[["1","2","3"],["4","5","6"],["7","8","9"],["z","0","del"]];
  return `<div class="ck" style="--kh:${rowH||64}">${rows.map(r=>`<div class="kr">${r.map(k=>`<span data-t="${pre}-${k}">${k==="del"?I.bksp:k==="z"?esc(ZKEY):k}</span>`).join("")}</div>`).join("")}</div>`; };
/* owner bottom NavigationBar (PlatataApp.kt:505-700): Caja (ShoppingCart), Ventas (Receipt), Mi negocio (32 dp flag circle;
   a fingerprint while Security is locked, isSecurityLocked) */
const nav = (on, o={}) => `<div class="mnav">
  <div class="${on==="caja"?"on":""}" data-t="nav-caja"><span class="pill">${I.cart}</span>${esc(t("mamaship_tab_register"))}</div>
  <div class="${on==="ventas"?"on":""}" data-t="nav-ventas"><span class="pill">${I.receipt}</span>${esc(t("tx_tab_all"))}</div>
  <div class="${on==="biz"?"on":""}" data-t="nav-biz"><span class="flagc${on==="biz"?" lit":""}">${o.locked?`<i class="fp">${I.fp}</i>`:R.flag()}</span>${esc(t("home_tab_my_business"))}</div></div>`;
/* product grid: ProductLibraryView.kt chips (first "All") + 3-column cards */
const cats = () => `<div class="mcats">` + [{name:t("items_filter_all"),color:ALL_C,all:true}].concat(C.catsByName).map(c=>{
    const st = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${st}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
const grid = () => `<div class="mgrid">` + C.itemsByName.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" data-t="dish-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`;
/* owner Home, Catálogo tab (HomeScreen.kt:610-690 top, FooterButtonPair bottom). o.top = html of the one top strip */
function home(o){
  o = o||{};
  const tabs = `<div class="htabs"><span class="${o.tab===0?"on":""}">${I.edit}${esc(t("home_tab_manual"))}</span><span class="${o.tab!==0?"on":""}">${esc(t("home_tab_library"))}</span></div>`;
  const n = o.count||0, tot = o.total||0;
  let h = (o.warn||"") + tabs + (o.top||"") + (o.body!=null ? o.body : `<div class="hedit"><span>${I.edit}${esc(t("common_edit"))}</span></div>` + cats() + grid());
  h += `<div class="hfoot">${n?`<div class="cstrip"><span>${esc(tp("home_current_sale_items", n, n))}</span><i>›</i></div>`:""}
    <div class="fpair">${btn(t("common_save"),"sec","save",{pill:true,off:!n})}${btn(t("common_charge", money(tot)),"pri","charge",{pill:true,off:!n})}</div></div>`;
  return h + nav("caja", {locked:o.locked});
}
/* RegisterClosedBar.kt: #FEF3C7 row, titleSmall bold #856404, orange pill "Abrir" */
const closedBar = () => `<div class="cbar"><b>${esc(t("workspace_register_closed"))}</b><span data-t="bar-open">${esc(t("workspace_register_open_action"))}</span></div>`;

/* Open register (cash/OpenRegisterScreen.kt): top bar, "Efectivo inicial", the amount (displaySmall bold), keypad, button at the bottom */
const openRegister = (typed, rowH) => `<div class="pg">${topbar(t("register_open_title"))}
  <div class="pb"><div class="lbl" style="text-align:center">${esc(t("register_open_amount_hint"))}</div><div class="amt">${money(amountOf(typed))}</div>
  <div class="grow"></div>${keypad("k", rowH)}</div>
  <div class="pf">${btn(t("register_open_confirm"),"pri","open-confirm")}</div></div>`;

/* the business panel (HomeScreen.kt ~1400-1760): name header, register card, Sell online, "Día a día", Menú, Clientes, Reportes */
function panel(o){
  const open = o.open, tot = o.sales||0;
  const card = open
    ? `<div class="wr reg on" data-t="reg-card"><i class="dot">●</i><div class="tx"><b>${esc(t("workspace_register_open"))}</b><small>${esc(t("workspace_register_sales"))}</small></div><b class="amt">${money(tot)}</b></div>`
    : `<div class="wr reg off" data-t="reg-card"><i class="dot">●</i><div class="tx"><b>${esc(t("workspace_register_closed"))}</b><small>${esc(t("workspace_register_closed_sub"))}</small></div><b class="act">${esc(t("workspace_register_open_action"))}</b></div>`;
  const row = (ic, ti, sub, tr) => `<div class="wr"><span class="ic">${ic}</span><div class="tx"><b>${esc(ti)}</b><small>${esc(sub)}</small></div>${tr||""}</div>`;
  return `<div class="wp"><div class="wph"><b>${esc(R.place)}</b>${I.down}</div>
    <div class="wpl">${card}
    ${row(I.cart, t("sell_online_title"), t("sell_online_row_off"), `<span class="opill">${esc(t("sell_online_pill_off"))}</span>`)}
    <div class="wps">${esc(t("panel_heading_every_day"))}</div>
    ${row(I.rest, t("workspace_menu_title"), t("more_my_products_count", C.items.length))}
    ${row(I.person, t("more_customers_title"), tp("home_clientes_count", o.clients||0, o.clients||0))}
    ${row(I.rlong, t("workspace_full_reports"), t((R.country==="US"||R.country==="CA") ? "scan_row_reports_today" : "scan_row_reports_today_net", money(o.today||tot)))}
    </div></div>` + nav("biz");
}
/* the system biometric sheet that the flag tap opens (PlatataApp.kt flag gate -> showBiometricPrompt, settings_gate_*) */
const bioSheet = (ok) => `<div class="mscrim"><div class="bio"><b>${esc(t("settings_gate_title"))}</b><small>${esc(t("settings_gate_subtitle"))}</small>
  <span class="fpb${ok?" ok":""}" data-t="fingerprint">${ok?I.check:I.fp}</span></div></div>`;

/* Register screen (cash/RegisterStatusScreen.kt:130-520), 0/1 register: no tab row. o = {start, cashSales, moves:[{kind,reason,amount,at}], scroll} */
function registerScreen(o){
  const out = (o.moves||[]).filter(m=>m.kind==="out").reduce((s,m)=>s+m.amount,0), inn = (o.moves||[]).filter(m=>m.kind==="in").reduce((s,m)=>s+m.amount,0);
  const exp = o.start + o.cashSales + inn - out;
  const reason = r => t({supplier:"cash_movement_reason_supplier",owner:"cash_movement_reason_owner_took",other:"cash_movement_reason_other",change:"cash_movement_reason_change"}[r]);
  const moves = (o.moves||[]).map(m=>`<div class="mv${m.isNew?" new":""}"><span>${esc(t(m.kind==="out"?"cash_movement_out":"cash_movement_in"))} · ${esc(reason(m.reason))} · ${esc(fmtTime(m.at))}</span><b class="${m.kind}">${m.kind==="out"?"-":"+"}${money(m.amount)}</b><i>${esc(t("cash_movement_void"))}</i></div>`).join("");
  const tbar = topbar("", {html:`<div class="navd"><span class="dim">${I.chevL}</span><b>${esc(t("register_nav_today", shortDay(o.openedAt)))}</b><span class="dim">${I.chevR}</span></div>`,
                 action:`<span class="tba">${esc(t("register_status_full_reports"))}</span>`});
  const body = `<div class="rs" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <div class="pillrow"><span class="spill">${esc(t("register_status_pill_open"))}</span></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_opened_at"))}</span><span>${esc(fmtDT(o.openedAt))}</span></div>
      <div class="lr"><span>${esc(t("register_status_opened_by"))}</span><span>${esc(OWNER)}</span></div></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_starting_cash"))}</span><span>${money(o.start)}</span></div>
      <div class="lr"><span>${esc(t("register_status_cash_sales_here"))}</span><span>${money(o.cashSales)}</span></div>
      ${moves}<hr><div class="lr em${o.expFlash?" flash":""}"><span>${esc(t("register_status_expected"))}</span><span class="pri">${money(exp)}</span></div></div>
    ${btn(t("cash_movement_out"),"sec","cash-out")}${btn(t("cash_movement_in"),"sec","cash-in")}
    <div class="scard"><div class="lr ms"><span>${esc(t("register_status_cash_all"))}</span><span>${money(o.cashSales)}</span></div>
      ${o.cashSales?`<div class="lr ind"><span>${esc(OWNER)}</span><span>${money(o.cashSales)}</span></div>`:""}
      <hr><div class="lr em"><span>${esc(t("reports_total_collected"))}</span><span>${money(o.cashSales)}</span></div></div>
    <div class="hist">${I.clock}<span>${esc(t("register_list_title"))}</span></div>
    ${btn(t("register_status_close_btn"),"sec","close-reg")}<div style="height:calc(var(--u)*16)"></div></div>`;
  return `<div class="pg">${tbar}<div class="pscroll">${body}</div>${o.snack?`<div class="msnack" style="bottom:calc(var(--u)*16)">${esc(o.snack)}</div>`:""}</div>`;
}

const L = LG, CC = R.country;
const STRIPE = CC==="US" || CC==="CA";          // Stripe country: no QR row at all, Card = Tap to Pay (PayWaysVisibility.kt)

/* utils/CashRounding.kt: CL to $10 (1-5 down, 6-9 up), PE always down to S/ 0.10, CA to the nearest 5 cents. Cash only. */
function cashDue(v){
  if(CC==="CL"){ const r = Math.round(v) % 10; return r<=5 ? Math.round(v)-r : Math.round(v)-r+10; }
  if(CC==="PE") return Math.floor(v*10+1e-6)/10;
  if(CC==="CA") return Math.round(v*20)/20;
  return v;
}
const DECKEY = C.dec===0 ? "000" : new Intl.NumberFormat(C.loc).formatToParts(1.5).find(p=>p.type==="decimal").value;  // CheckoutPayBlock zeroKey

/* ---------- pay screen ---------- o: {lines, typed, table, others, qr, card:"none"|"ready"|"setup", cashDisabled} */
function payScreen(o){
  const total = saleTotal(o.lines), due = cashDue(total), typed = o.typed||"";
  const qr = !!o.qr, cardOn = o.card && o.card!=="none", cardReady = o.card==="ready";
  const cardPrimary = STRIPE && cardReady;
  /* PayWaysVisibility.link: owner, not dismissed, not a Stripe country, something not set up yet; Colombia always asks "QR or card" */
  const qrNotSetUp = !qr, cardNotSetUp = WOMPI && !cardReady;
  let link = (STRIPE || !(qrNotSetUp || cardNotSetUp)) ? null : WOMPI ? "pay_setup_link_qr_card" : (PIX ? "pay_setup_link_pix" : "pay_setup_link_qr");
  if(o.noLink) link = null;
  let rc = "";
  if(typed){ const v = typedValue(typed); const ch = v - due;
    rc = `<div class="ln"><small>${esc(t("checkout_received_label"))}</small><b>${money(v)}</b></div>` +
      (ch >= -1e-9 ? `<div class="ln"><small>${esc(t("checkout_change_row_label"))}</small><b class="chg">${money(ch)}</b></div>`
                   : `<div class="short">${esc(t("cash_shortfall", money(-ch)))}</div>`); }
  const keys = ["1","2","3","4","5","6","7","8","9",DECKEY,"0","⌫"];
  const enough = !typed || typedValue(typed) >= due-1e-9;
  const cashW = cardPrimary ? 1.2 : (cardOn && qr) ? 1.3 : qr ? 2 : 1;
  const exactLabel = cardOn ? t("cash_exact_short") : t("cash_exact", money(due));
  let btns = `<div style="flex:${cashW}" class="${!typed?"exact":enough?"cash":"dis"}" data-t="${typed?"cash":"exact"}">${esc(typed?t("checkout_cash_label"):exactLabel)}</div>`;
  if(qr) btns += `<div style="flex:1" class="ob" data-t="qr"><i class="x-qrg"></i>${esc(PIX?"Pix":t("pay_qr_short"))}</div>`;
  if(cardOn) btns += cardReady ? `<div style="flex:${cardPrimary?2:1}" class="ob" data-t="card">${J.card}${esc(t("pay_card_short"))}</div>`
                               : `<div style="flex:1" class="nudge" data-t="card-setup"><span>+ ${esc(t("pay_card_short"))}</span><small>${esc(t("pay_card_setup_hint"))}</small></div>`;
  const rounding = Math.abs(due-total) > 1e-9 ? `<div class="x-round">${esc(t("cash_rounding_line", (due-total<0?"-":"+")+money(Math.abs(due-total))))}</div>` : "";
  const links = `<span>${esc(t("checkout_items_link", unitCount(o.lines)))} ›</span>` +
    (o.table ? `<span>${esc(t("checkout_desglose_delivery_table", o.table))}</span>` : "") +
    (o.others ? `<span class="oth" data-t="other">${J.more}<span>${esc(t("checkout_other_method", o.others))}</span></span>` : "");
  return `<div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span><span class="clr">${esc(t("checkout_clear"))}</span></div><div class="grow"></div>
    <div class="x-pb"><div class="x-tot"><small>${esc(t("common_total"))}</small><b>${money(total)}</b></div>${rounding}
    <div class="x-amt"><div class="x-links">${links}</div><div class="x-rc">${rc}</div></div>
    <div class="x-kp">${keys.map(k=>`<span class="${k===DECKEY||k==="⌫"?"s":""}" data-t="key-${k}">${esc(k)}</span>`).join("")}</div>
    <div class="x-btns">${btns}</div>
    ${link?`<div class="x-slink"><span>${esc(t(link))}</span><span>${esc(t("pay_setup_link_dismiss"))}</span></div>`:`<div style="height:calc(var(--u)*14)"></div>`}</div>
    <div class="x-sec">${custField(o.customer)}${fiarButton(o.customer)}</div>`;
}

function fakeQr(seed, mod){ mod = mod||29; let x = seed>>>0 || 7; const rnd = () => (x = (x*1103515245+12345)>>>0, (x>>>16)&1);
  let r = ""; const fp = (cx,cy)=>{ r += `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#000"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#000"/>`; };
  for(let yy=0; yy<mod; yy++) for(let xx=0; xx<mod; xx++){ const inF = (xx<8&&yy<8)||(xx>=mod-8&&yy<8)||(xx<8&&yy>=mod-8); if(!inF && rnd()) r += `<rect x="${xx}" y="${yy}" width="1" height="1" fill="#000"/>`; }
  fp(0,0); fp(mod-7,0); fp(0,mod-7);
  return `<svg viewBox="-2 -2 ${mod+4} ${mod+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${mod+4}" height="${mod+4}" fill="#fff"/>${r}</svg>`; }

  if(st.screen==="pm") return X(pmScreen(st) + (st.chooser?chooser():"") + (st.toast?toast(qrS("qr_setup_saved")):""));
  if(st.screen==="terms") return termsPage(st);
  if(st.screen==="pick") return picker();
  if(st.screen==="reg") return X(shopReg({lines:SALE, fiado:true}));
  if(st.screen==="pay") return X(payScreen({lines:SALE, others:1, qr:true, card:"none"}) + (st.overlay?qrOverlay(SALE_TOTAL):""));
  if(st.screen==="done") return X(doneScreen({kind:"title"}));
  return "";
}
/* ---- US / Canada: no QR; the shop's own method ---- */
function renderUS(st){
  if(st.screen==="pm") return X(pmScreen(st) + (st.dlg?addMethodDialog(st.typed):""));
  if(st.screen==="reg") return X(shopReg({lines:SALE, fiado:true}));
  if(st.screen==="pay") return X(payScreen({lines:SALE, others:2, qr:false, card:"setup"}) + (st.sheet?otherSheet(SALE_TOTAL, othersList([EXAMPLE])):"") +
     (st.confirm?dialog(t("pay_custom_confirm_title", money(SALE_TOTAL), EXAMPLE), "", [{label:t("pay_custom_confirm_back")},{label:t("pay_custom_confirm_yes"), fill:true, t:"yes"}]):""));
  if(st.screen==="done") return X(doneScreen({kind:"title"}));
  return "";
}
