function home(o){ o=o||{};
  let h = `<div class="shome">`;
  if(o.warnBar) h += o.warnBar;
  if(o.regClosed) h += `<div class="rcbar"><span>${esc(T("workspace_register_closed"))}</span><b>${esc(T("workspace_register_open_action"))}</b></div>`;
  else if(o.nudge) h += `<div class="nudge"><b>${esc(T("nudge_connect_title"))}</b><span class="cta" data-t="nudge-connect">${esc(T("nudge_connect_cta"))}</span><span>${esc(T("nudge_connect_later"))}</span></div>`;
  if(o.offline) h += `<div class="offs">${esc(T("offline_strip_text"))}</div>`;
  h += `<div class="rc">`;
  if(o.fiado!==false) h += `<div class="mrow"><span class="em">📒</span><span class="tx">${esc(T("fiado_row_name"))}</span><span class="vl"><b>${money(FIADO_TOTAL)}</b><small>${esc(PL("fiado_row_count", C.fiado.length))}</small></span>${svg(IP.chev,"chv")}</div>`;
  h += `<div class="mrow"><span class="em">🏷</span><span class="tx">${esc(T("scan_no_barcode_btn"))}</span>${svg(IP.chev,"chv")}</div>`;
  h += `<div class="mrow">${svg(IP.calc,"ic")}<span class="tx">${esc(T("scan_row_manual"))}</span>${svg(IP.chev,"chv")}</div>`;
  h += `</div>`;
  const tot = (o.lines||[]).reduce((a,l)=>a+l.price,0);
  h += (o.lines&&o.lines.length)
    ? `<div class="sbar"><span class="om" data-t="scanmore">${esc(T("scan_btn_scan_more"))}</span><span class="ch" data-t="charge">${esc(T("common_charge", money(tot)))}</span></div>`
    : `<div class="sbar"><span class="q" data-t="scan">${esc(T("scan_btn_scan_barcodes"))}</span></div>`;
  h += `</div>` + nav(o.nav||{});
  return h;
}
function nav(o){ o=o||{};

/* demo plumbing only (not an app screen): the hint ring glides for 0.25 s after every redraw, so each tap keeps the engine "busy"
   until 0.45 s after its last scheduled change; then the ring sits on its target before the next tap is read. */
function settled(steps){
  return steps.map(s=>Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms||45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, ()=>{});
  }}));
}

    <span class="bs">${esc(t("outside"))}</span><span class="bs">${esc(t("tz",ZONE))}</span>
    <div class="mbtn" data-t="so-on">${esc(t("turnOn"))}</div></div></div>` + strip();
}
/* ---- the customer's phone: the store page (only what the server sells: no product sold by weight) ---- */
function browser(inner){ return `<div class="brw"><div class="url">${I("lock")}<span>${esc(LINK)}</span></div>${inner}</div>`; }
function webMenu(st){
  const chip = (label, c, sel) => `<span class="wchip${sel?" sel":""}" style="${c?`background:${hexA(c,.05)};border-color:${hexA(c,.3)}`:""}">${sel?"✓ ":""}${esc(label)}</span>`;
  const n = st.qty||0;
  let h = `<div class="wscr"><div style="transform:translateY(calc(var(--u)*${-(st.wsc||0)}))"><div class="whead"><div class="wshop">${esc(S.place)}</div><div class="wstat">${esc(wt("open",{t:webClock(18,0)}))}</div></div>
    <div class="wchips">${chip(wt("all"),null,true)}${WEB_CATS.map(c=>chip(c.name,c.color,false)).join("")}</div>
    <div class="wgrid">${ONLINE.map(it=>{ const c=colorOf(it);
      return `<div class="wpc" ${it.id===DISH.id?'data-t="w-dish"':""} style="background:${hexA(c,.12)};border-color:${hexA(c,.35)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div>`; }).join("")}</div></div></div>`;
  if(n>0) h += `<div class="wduo"><span class="wpri" data-t="w-bar">${esc(wt("bar",{n:wt("one"),amt:money(DISH.price)}))}</span></div>`;
  if(st.wsheet) h += `<div class="wlayer"><div class="wscrim"></div><div class="wsheet"><div class="wdrag"></div><div class="wmt">${esc(DISH.name)}</div>
      <div class="wfoot"><span class="wstep">−</span><span class="wqty">1</span><span class="wstep">+</span></div>
      <div class="wadd" data-t="w-add"><span>${esc(wt("add"))}</span><i>${money(DISH.price)}</i></div></div></div>`;
  return browser(h);
}
function webCart(st){
  const fld = (label, val, ph, focus) => `<div><div class="wfl">${esc(label)}</div><div class="winp${focus?" f":""}">${val?esc(val)+(focus?'<span class="caret" style="background:#007AFF"></span>':""):`<span class="ph">${esc(ph||"")}</span>`}</div></div>`;
  const h = `<div class="wtbar"><i>‹</i><b>${esc(wt("order"))}</b></div><div class="wscr">
    <div class="wlines"><div class="wcli"><span>1 × ${esc(DISH.name)}</span><span>${money(DISH.price)}</span></div></div>
    <div class="wsect">${esc(wt("how"))}</div>
    <div class="wrows"><div class="wr on"><div class="rm"><div class="rt">${esc(wt("at",{shop:S.place}))}</div><div class="rs">${esc(wt("about",{n:20}))}</div></div><span class="wpill">✓</span></div></div>
    <div class="wsect">${esc(wt("who"))}</div>
    <div class="wform">${fld(wt("name"), st.wname, "", st.focus==="name")}${fld(wt("mobile"), st.wphone, "", st.focus==="phone")}${fld(wt("note"), "", wt("noteph"))}</div>
    <div class="wsum"><span>${esc(wt("total"))}</span><b>${money(DISH.price)}</b></div></div>
    <div class="wduo"><span class="wpri" data-t="w-review">${esc(wt("reviewOrder"))}</span></div>`;
  return browser(h);
}
function webReview(st){
  const h = `<div class="wtbar"><i>‹</i><b>${esc(wt("review"))}</b></div><div class="wscr">
    <div class="wsect">${esc(wt("pickingAt"))}</div>
    <div class="wrows"><div class="wr"><div class="rm"><div class="rt">${esc(S.place)}</div><div class="rs">${esc(wt("readyIn",{n:20}))}</div></div></div></div>
    <div class="wsect">${esc(wt("youPay"))}</div>
    <div class="wrows"><div class="wr on"><div class="rm"><div class="rt">💵 ${esc(wt("cash"))}</div><div class="rs">${esc(wt("nothing"))}</div></div><span class="wpill">✓</span></div></div>
    <div class="wlines" style="margin-top:calc(var(--u)*16)"><div class="wcli"><span>1 × ${esc(DISH.name)}</span><span>${money(DISH.price)}</span></div></div>
    <div class="wtot"><div class="wtrow"><span>${esc(wt("sub"))}</span><span>${money(DISH.price)}</span></div><div class="wtrow big"><span>${esc(wt("total"))}</span><b>${money(DISH.price)}</b></div></div></div>
    <div class="wduo"><span class="wpri" data-t="w-place">${esc(st.sending?wt("sending"):wt("place"))}</span></div>`;
  return browser(h);
}
function webDone(){
  return browser(`<div class="wdone"><div class="wokc">✓</div><div class="wdt">${esc(wt("placed"))}</div>
    <div class="wds">${esc(wt("making",{shop:S.place,t:webClock(13,1)}))}</div>
    <div class="wtk"><div class="tl">${esc(wt("label"))}</div><div class="tref">#${REF}</div><div class="ts2">${esc(wt("show"))}</div></div>
    <span class="wout">${esc(wt("newo"))}</span></div>`);
}
function render(st){
  if(st.screen==="panel") return panel({salesToday:SALES_TODAY});
  if(st.screen==="sell") return sellPage(st) + (st.hop ? SKIT.hop(S,{from:DEV_OWNER, to:t("custPhone"), line:t("shareLine")}) : "");
  if(st.screen==="addr") return addrPage(st);
  if(st.screen==="hours") return hoursPage(st);
  if(st.screen==="wmenu") return webMenu(st);
  if(st.screen==="wcart") return webCart(st);
  if(st.screen==="wreview") return webReview(st);
  if(st.screen==="wdone") return webDone() + (st.hop ? SKIT.hop(S,{from:t("custPhone"), to:DEV_OWNER, line:t("newOrderLine",REF), note:T("sell_online_keep_open")}) : "");
  if(st.screen==="owner") return home({nav:{on:"reg", badge:1}}) + `<div class="hun"><span class="ai">P</span><span class="ht"><small>Platata · ${esc(nowTime(12,41))}</small><b>${esc(T("online_alert_title",REF))}</b><span>${esc([C.people.customer, PL("online_alert_items",1), T("online_order_ready_by", nowTime(13,1))].join(" · "))}</span></span></div>`;
  return "";
}
const HB = S.isPharm || !HIDDEN.length;   // a pharmacy sells nothing by weight: no "left out" card
const B3 = HB ? {es:"Toca Encender la tienda",pt:"Toque em Ligar a loja",en:"Tap Turn on the store"}
              : {es:"Enciéndela: lo que va por peso queda fuera",pt:"Ligue a loja: o que é por peso fica de fora",en:"Turn it on: items sold by weight stay off"};
SKIT.start(S, {
  id:"TS20", tallVideo:true, clock:"12:41",
  endText:P({es:"Así vendes en línea con Platata.",pt:"Assim você vende online com o Platata.",en:"That's how you sell online with Platata."}),
  beats: P({
    es:["Abre tu negocio y toca Vender en línea", FREE?"En EE. UU. y Canadá ya viene incluida":"Se abre cuando usas tu tercera conexión","Enciéndela: tu dirección y tu horario",B3.es,"Comparte tu enlace","Tu cliente elige y lo agrega al pedido","Pone su nombre y hace el pedido","El aviso llega a tu teléfono","Así vendes en línea con Platata."],
    pt:["Abra seu negócio e toque em Vender online", FREE?"Nos EUA e no Canadá já vem incluída":"Ela abre quando você usa sua terceira conexão","Ligue a loja: seu endereço e seu horário",B3.pt,"Compartilhe seu link","Seu cliente escolhe e adiciona ao pedido","Ele põe o nome e faz o pedido","O aviso chega ao seu celular","Assim você vende online com o Platata."],
    en:["Open your business and tap Sell online", FREE?"In the US and Canada it's already included":"It opens once you use your third connection","Turn it on: your address and your hours",B3.en,"Share your link","Your customer picks and adds to the order","They add their name and place the order","The alert reaches your phone","That's how you sell online with Platata."]}),
  state:{screen:"panel", dlg:false, skip:false, on:false, checked:false, typed:"", typedDone:false, sc:0, hop:false, qty:0, wsheet:false, wname:"", wphone:"", focus:"", sending:false, wsc:0},
  render,
  who: st => /^w/.test(st.screen) ? t("custPhone") : DEV_OWNER,
  steps: settled([
    {beat:0, hint:P({es:"Toca Vender en línea",pt:"Toque em Vender online",en:"Tap Sell online"}), target:'[data-t="sellonline"]', tap(st){ st.screen="sell"; if(!FREE) st.dlg=true; }},
  ].concat(FREE ? [] : [
    {beat:1, hint:P({es:"Toca ",pt:"Toque em ",en:"Tap "})+T("conn_add"), target:'[data-t="dlg-add"]', tap(st,E){ st.dlg=false; st.skip=true; E.after(4200,()=>{ st.skip=false; }); }},
  ]).concat([
    {beat:2, hint:P({es:"Toca el interruptor",pt:"Toque no interruptor",en:"Tap the switch"}), target:'[data-t="so-switch"]', tap(st,E){ st.screen="addr";
        E.after(700,()=>E.type("typed", SUFFIX, ()=>{ st.typedDone=true; }, 90)); }},
    {beat:2, hint:P({es:"Toca Siguiente",pt:"Toque em Próximo",en:"Tap Next"}), target:'[data-t="so-next"]', tap(st,E){ st.screen="hours"; st.sc=0;
        E.after(1600,()=>{ const v=scrollFor('[data-t="so-on"]'); if(v>0) st.sc=v; }); }},
    {beat:3, hint:P({es:"Toca Encender la tienda",pt:"Toque em Ligar a loja",en:"Tap Turn on the store"}), target:'[data-t="so-on"]', tap(st,E){ st.screen="sell"; st.on=true; st.checked=false; st.sc=0;
        E.after(1500,()=>{ st.checked=true; });
        if(!HB){ E.after(3000,()=>{ const v=scrollFor('[data-t="hidden"]'); if(v>0) st.sc=v; }); E.after(7600,()=>{ st.sc=0; }); } }},
    {beat:4, hint:P({es:"Toca Compartir",pt:"Toque em Compartilhar",en:"Tap Share"}), target:'[data-t="so-share"]', tap(st,E){ st.hop=true;
        E.after(2200,()=>{ st.hop=false; st.screen="wmenu"; });
        E.after(3000,()=>{ const v=scrollFor('[data-t="w-dish"]'); if(v>0) st.wsc=v; }); }},
    {beat:5, hint:P({es:"Toca "+DISH.name,pt:"Toque em "+DISH.name,en:"Tap "+DISH.name}), target:'[data-t="w-dish"]', tap(st){ st.wsheet=true; }},
    {beat:5, hint:P({es:"Toca "+WEB[SH].add,pt:"Toque em "+WEB[SH].add,en:"Tap "+WEB[SH].add}), target:'[data-t="w-add"]', tap(st){ st.wsheet=false; st.qty=1; }},
    {beat:5, hint:P({es:"Toca Ver pedido",pt:"Toque em Ver pedido",en:"Tap View order"}), target:'[data-t="w-bar"]', tap(st,E){ st.screen="wcart"; st.focus="name";
        E.after(500,()=>E.type("wname", C.people.customer, ()=>{ st.focus="phone"; E.type("wphone", DIAL+" "+C.people.phone, ()=>{ st.focus=""; }, 55); }, 60)); }},
    {beat:6, hint:P({es:"Toca "+WEB[SH].reviewOrder,pt:"Toque em "+WEB[SH].reviewOrder,en:"Tap "+WEB[SH].reviewOrder}), target:'[data-t="w-review"]', tap(st){ st.screen="wreview"; }},
    {beat:6, hint:P({es:"Toca "+WEB[SH].place,pt:"Toque em "+WEB[SH].place,en:"Tap "+WEB[SH].place}), target:'[data-t="w-place"]', tap(st,E){ st.sending=true;
        E.after(1100,()=>{ st.sending=false; st.screen="wdone"; });
        E.after(3000,()=>{ st.hop=true; });
        E.after(4800,()=>{ st.hop=false; st.screen="owner"; }); }}
  ]))
});
</script>
