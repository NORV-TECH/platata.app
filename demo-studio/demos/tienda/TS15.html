function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

  const open = p.open!==false;
  const owed = p.owed!=null ? p.owed : OWED_TOTAL, debtors = p.debtors!=null ? p.debtors : FIADO.length, clients = p.clients!=null ? p.clients : CLIENTS.length;
  const reg = open
    ? `<div class="rs-wr reg" data-t="reg-card" style="background:#E8F5E9;color:#2E7D32"><span class="dot">●</span><div class="tx"><b>${esc(PS.regOpen)}</b><small style="color:rgba(46,125,50,.7)">${esc(PS.regSales)}</small></div><b class="amt">${money(p.regTotal||0)}</b></div>`
    : `<div class="rs-wr reg" data-t="reg-card" style="background:#FFEBEE;color:#C62828"><span class="dot">●</span><div class="tx"><b>${esc(S("workspace_register_closed"))}</b><small style="color:rgba(198,40,40,.7)">${esc(S("workspace_register_closed_sub"))}</small></div><b class="act">${esc(S("workspace_register_open_action"))}</b></div>`;
  const stockSub = (STOCK_LOW?`<span style="color:#FF3B30;font-weight:600">${esc(PL("stock_headline_low", STOCK_LOW))}</span>`:"")
    + (STOCK_LOW&&STOCK_UNCOUNTED?" · ":"") + (STOCK_UNCOUNTED?esc(PL("stock_headline_uncounted", STOCK_UNCOUNTED)):"");
  const cliRow = owed>0
    ? panelRow("row-clients", I.person, PS.clients, PL("home_clientes_owed", debtors, debtors, money(owed)), {style:"background:#FFF6E5;color:#B07500", subStyle:"color:#B07500", icStyle:"color:#B07500"})
    : panelRow("row-clients", I.person, PS.clients, PL("home_clientes_none_owe", clients, clients));
  return `<div class="rs-panel"><div class="ph"><b>${esc(BIZ)}</b>${I.down}</div><div class="pl"><div class="pin" style="transform:translateY(calc(var(--u)*${-(p.scroll||0)}))">
    ${reg}
    ${panelRow("row-online", I.cart, PS.sellOnline, PS.off, {trail:`<span class="pill0">${esc(PS.offPill)}</span>`})}
    <div class="eh">${esc(PS.everyDay)}</div>
    ${panelRow("row-items", I.cart, PS.items, PS.itemsN(ITEMS.length))}
    ${panelRow("row-inventory", `<span class="emo">📦</span>`, PS.inventory, "", {subHtml:stockSub})}
    ${cliRow}
    ${panelRow("row-invoices", I.rlong, PS.invoices, PS.invMonth(p.invoices!=null?p.invoices:C.suppliers.length))}
    ${panelRow("row-team", `${I.group}${p.payDot?'<i class="pdot"></i>':""}`, PS.team, PS.teamSub(p.team!=null?p.team:1, p.phones||0))}
    ${panelRow("row-reports", I.rlong, PS.reports, PS.today(money(p.today||0)))}
    <hr>
    ${panelRow("row-settings", I.gear, PS.settings, PS.settingsSub)}
  </div></div></div>` + nav("biz", {flagTag:"flag"});
}

// KEYS: settings_hub_group_getting_paid,settings_hub_group_your_business,settings_hub_payment_methods,settings_hub_taxes,settings_hub_discounts,settings_hub_receipts,settings_hub_receipts_sub,receipt_layout_detailed,settings_hub_receipts_num_auto,settings_hub_business_info,workspace_registers_and_printers
function settingsHub(){
  const g = (t) => `<div class="rs-hg">${esc(t)}</div>`;
  const row = (tag, icon, t, s) => `<div class="rs-hr" data-t="${tag}"><span class="ic">${icon}</span><div class="tx"><b>${esc(t)}</b>${s?`<small>${esc(s)}</small>`:""}</div>${I.chev}</div>`;
  return topbar(PS.settings) + `<div class="rs-scroll"><div class="rs-hub">
    ${g(S("settings_hub_group_getting_paid"))}
    ${row("hub-pay", I.card, S("settings_hub_payment_methods"))}
    ${row("hub-taxes", I.pct, S("settings_hub_taxes"))}
    ${row("hub-discounts", I.tag, S("settings_hub_discounts"))}
    ${row("hub-receipts", I.receipt, S("settings_hub_receipts"), F("settings_hub_receipts_sub", S("receipt_layout_detailed"), S("settings_hub_receipts_num_auto")))}
    ${g(S("settings_hub_group_your_business"))}
    ${row("hub-info", I.store, S("settings_hub_business_info"))}
    ${row("hub-devices", I.devices, S("workspace_registers_and_printers"))}
  </div></div>` + strip();
}

// TITLE: Platata · Pago a empleados
/* TS15 "Pago a empleados" as a SHOP (no business-type rule in EmployeePay*: identical to the restaurant RS15): the owner turns on "Llevar la cuenta de los pagos a empleados" in Team, reads the deal,
   types what each person earns, turns it on; on the 5th of the next month the app asks what was paid.
   Screens follow the app at app-head (paths under app/src/main/java/com/example/):
   the switch      ui/screens/team/TeamManagementScreen.kt:900 EmployeePayTrackingSwitch (employee_pay_switch_label)
   the deal        EmployeePayConsentScreen.kt (SumaTopBar employee_pay_title; headlineSmall bold consent_title; lede;
                   three rows 📅 🔔 ⏻ with 34 dp r10 tiles, the last amber SumaFiadoAmberTint; SumaButton consent_confirm,
                   TextButton consent_dismiss). Commits nothing: it only opens the amount entry (TeamManagementScreen:233)
   amount entry    EmployeeDirectoryView :420-590 (turning on: an amount field under each payable person's name, the
                   owner gets none; pinned bottom: employee_pay_needs_all in red until every amount is set,
                   SumaButton employee_pay_turn_on, TextButton common_cancel)
   on              EmployeePayAmountDisplay :966 (amount bold + pencil) and the "Meses anteriores ›" bar :590
   the ask         HomeScreen.kt:1369-1384 FullScreenDialog -> EmployeePayAskScreen.kt (employee_pay_ask_title "Pago de
                   octubre", prefilled with each person's monthly pay, MoneyVisualTransformation, 160 dp box with pencil,
                   outlined "⦸ No trabajó este mes", ask_tap_hint, SumaButton ask_all_paid, outlined ask_remind_later);
                   the ask is for the PREVIOUS month from the 5th (employeePayAskDecision), not before tracking started
                   (askedMonthBeforeTrackingStarted: turned on in October -> first ask on 5 November, for October)
   The "5 de noviembre" card between the two parts is the demo's, not the app's.
   Demo data: the shop's one cashier (kit/shop-data.js); her monthly pay is the demo's (a believable full-time figure). */

const W1 = CASHIER;
const JOB1 = pick({es:"Cajera",pt:"Caixa",en:"Cashier"});
const PAY = {CO:[1300000],MX:[8500],PE:[1200],CL:[550000],EC:[470],AR:[850000],PA:[650],BR:[1700],US:[2600],CA:[2800]}[R.country];
const CODE = "K7Q2M9XD4P";
/* the two payable people in list order (letter groups, A-Z) */
const ORD = [0];
/* formatAmountForInput: the plain number at the currency's decimals; drawn with the money format */
const inputTxt = v => { const t = v.toFixed(dec); const [i,f] = t.split("."); return grp(i) + (f ? (COMMA_CUR?",":".")+f : ""); };
const initials = n => n.split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();
/* MoneyVisualTransformation: grouping and decimal mark of the shop's money, no ".00" while typing */
const grp = s => { const g = COMMA_CUR ? "." : ","; return s.replace(/\B(?=(\d{3})+(?!\d))/g, g); };
const monthName = (m) => new Intl.DateTimeFormat(LOCALE,{month:"long"}).format(new Date(2026,m,1));
const OCT = monthName(9);
const pen = P("M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z");
function row(name, job, owner, onPhone, extra){
  const badge = owner ? `<span class="tm-b own">${esc(S("team_role_owner"))}</span>` : `<span class="tm-b">${esc(job)}</span>`;
  const pill = onPhone ? `<span class="tm-p"><i></i>${esc(S("team_status_on_phone"))}</span>` : "";
  return `<div class="tm-row"><span class="av">${esc(initials(name))}</span><div class="nm"><b>${esc(name)}</b>${!owner?`<span class="jt">${esc(job)}</span>`:""}<div class="bd">${badge}${pill}</div>${extra||""}</div><span class="mv">${I.more}</span></div>`;
}
function team(st){
  const amt = i => {
    if(st.mode==="entry") return `<div class="pf${st.focus===i?" foc":""}" data-t="pay-${i}">${esc(grp(st["p"+i]))}${st.focus===i?'<i class="caret"></i>':""}</div>`;
    if(st.mode==="on") return `<div class="pa"><b>${money(PAY[i])}</b><span>${pen}</span></div>`;
    return "";
  };
  const ppl = [{n:OWNER_NAME, owner:true},{n:W1, job:JOB1, phone:false, i:0}];
  const groups = {}; ppl.slice().sort((a,b)=>a.n.localeCompare(b.n, LOCALE)).forEach(p=>{ const k=p.n[0].toUpperCase(); (groups[k]=groups[k]||[]).push(p); });
  const ready = !!st.p0;
  const bottom = st.mode==="entry" ? `<div class="pb">${ready?"":`<p>${esc(S("employee_pay_needs_all"))}</p>`}<div class="rs-btn${ready?"":" off"}" data-t="turn-on">${esc(S("employee_pay_turn_on"))}</div><span class="cx">${esc(S("common_cancel"))}</span></div>`
    : st.mode==="on" ? `<div class="ph2">${esc(S("employee_pay_history_title"))}${I.chev}</div>` : "";
  return `<div class="rs-lh"><div class="r1"><span class="ib">${I.back}</span><b>${esc(F("team_title", 1))}</b><span class="rs-new">${esc(pick({es:"+ Nuevo",pt:"+ Novo",en:"+ New"}))}</span></div>
    <div class="srch">${I.search}<span>${esc(S("team_search_placeholder"))}</span></div></div>
    <div class="tm-code"><small>${esc(S("team_business_code_title"))}</small><div><b>${CODE}</b><span>${esc(S("team_business_code_copy"))}</span></div><p>${esc(S("team_business_code_sub"))}</p></div>
    <div class="tm-sw"><span>${esc(S("employee_pay_switch_label"))}</span>${sw(st.mode==="on","switch")}</div>
    <div class="rs-scroll"><div class="in" style="transform:translateY(calc(var(--u)*${-st.scroll}))">${Object.keys(groups).sort().map(k=>`<div class="tm-h">${k}</div>`+groups[k].map(p=>row(p.n,p.job,p.owner,p.phone,p.owner?"":amt(p.i))).join("")).join("")}</div></div>` + bottom + strip();
}
function consent(){
  const r = (e, t, b, amber) => `<div class="cs-r"><span class="tl${amber?" am":""}">${e}</span><div><b>${esc(S(t))}</b><p>${esc(S(b))}</p></div></div>`;
  return topbar(S("employee_pay_title")) + `<div class="rs-scroll"><div class="in cs">
    <h2>${esc(S("employee_pay_consent_title"))}</h2><p class="ld">${esc(S("employee_pay_consent_lede"))}</p>
    ${r("📅","employee_pay_consent_row1_title","employee_pay_consent_row1_body")}
    ${r("🔔","employee_pay_consent_row2_title","employee_pay_consent_row2_body")}
    ${r("⏻","employee_pay_consent_row3_title","employee_pay_consent_row3_body",true)}
  </div></div><div class="cs-bot"><div class="rs-btn" data-t="ok">${esc(S("employee_pay_consent_confirm"))}</div><span>${esc(S("employee_pay_consent_dismiss"))}</span></div>` + strip();
}

  const r = (n, v) => `<div class="ak-r"><div class="t"><b>${esc(n)}</b><span class="bx">${esc(inputTxt(v))}${pen}</span></div><span class="dw">${block}${esc(S("employee_pay_ask_didnt_work"))}</span></div>`;

    <div class="rs-btn sec">${esc(S("employee_pay_ask_remind_later"))}</div></div></div>`;
}
function render(st){
  if(st.screen==="panel"){ const rt = {CO:186000,CL:98000,AR:186000,MX:2450,PE:486,BR:486,EC:214.5,PA:214,US:214.5,CA:214.5}[R.country];
    return panel({open:true, regTotal:rt, today:TAX ? r2(rt/(1+TAX.p/100)) : rt, invoices:2, team:1, phones:0}); }
  if(st.screen==="consent") return consent();
  if(st.screen==="ask") return ask(st);

  return team(st) + card;
}

    {beat:5, hint:H1("employee_pay_ask_all_paid"), target:'[data-t="all-paid"]', tap(st){ st.paid=true; }}
  ]
});
