/* demo plumbing only (not an app screen): the hint ring glides for 0.25 s after every redraw, so each tap keeps the engine "busy"
   until 0.45 s after its last scheduled change; then the ring sits on its target before the next tap is read. */
function settled(steps){
  return steps.map(s=>Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms||45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, ()=>{});
  }}));
}

  fiado_monto_manual fiado_recordarle customer_page_whatsapp customer_page_whatsapp_write crm_metric_visits crm_metric_last_visit
  customer_page_purchases crm_sold_by common_edit crm_edit_title common_save crm_delete_customer_button crm_delete_blocked_title
  crm_delete_blocked_body common_done crm_field_first_name crm_field_whatsapp profile_advanced profile_advanced_sub*/
IP.search = "M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z";
IP.expand = "M16.59 8.59L12 13.17 7.41 8.59 6 10l6 6 6-6z";
const FIADO = C.fiado, ANA = FIADO[0];
const CLIENTS = FIADO.map(f => f.customer);
const OWED_TOTAL = FIADO.reduce((s,f)=>s+f.owes, 0);
const DIAL = {CO:"57",MX:"52",PE:"51",CL:"56",EC:"593",AR:"54",PA:"507",BR:"55",US:"1",CA:"1"}[S.country];
const NAT = {CO:"3001234567",MX:"5512345678",PE:"987654321",CL:"987654321",EC:"991234567",AR:"91123456789",PA:"61234567",BR:"31912345678",US:"7135550142",CA:"4165550142"};
const natNum = i => { const n = NAT[S.country]; return n.slice(0, n.length-2) + String(10+i*7).slice(-2); };
const ANA_WA = DIAL + natNum(1);                                  /* same number TS13 shows for her */
function waRead(canonical){                                       /* utils/WhatsappUtils.kt formatWhatsappForReading */
  const national = canonical.slice(DIAL.length); let body;
  if(DIAL==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+DIAL+" "+body;
}
const LOCALE = {es:"es",pt:"pt-BR",en:"en-US"}[L];
const fmtDate = d => new Intl.DateTimeFormat(LOCALE,{dateStyle:"medium"}).format(d).replace(/\.$/,"");
const fmtDateTime = d => new Intl.DateTimeFormat(LOCALE,{dateStyle:"medium",timeStyle:"short"}).format(d);
const r2 = v => Math.round(v * Math.pow(10, C.dec)) / Math.pow(10, C.dec);
/* Ana's two tabs (fiado sales), as in TS13: 60% 22 days ago, 40% 12 days ago */
const d1 = r2(ANA.owes*0.6), d2 = r2(ANA.owes - d1);
const DEBTS = [{at:new Date(2026,9,20-ANA.days,10,40), v:d1}, {at:new Date(2026,9,8,17,15), v:d2}];
const ageColor = days => days > 30 ? "#C62828" : days >= 15 ? "#B07500" : "#1A7F3C";
const base = s => s.normalize("NFD").replace(/[̀-ͯ]/g,"")[0].toUpperCase();

function list(){
  const rows = FIADO.slice().sort((a,b)=>b.days-a.days).map(f=>`<div class="cl-row" ${f===ANA?'data-t="open-ana"':""}><span class="av">${esc(base(f.customer))}</span><b>${esc(f.customer)}</b><strong style="color:${ageColor(f.days)}">${money(f.owes)}</strong>${svg(IP.chev)}</div>`).join("");
  return `<div class="rs-lh"><div class="r1"><span class="ib">${I("back")}</span><b>${esc(T("crm_title_directory", CLIENTS.length))}</b><span class="rs-new">${esc(P({es:"+ Nuevo",pt:"+ Novo",en:"+ New"}))}</span></div>
    <div class="srch">${svg(IP.search)}<span>${esc(T("crm_search_placeholder"))}</span></div></div>
    <div class="fd-head"><small>${esc(T("fiado_te_deben"))}</small><b>${money(OWED_TOTAL)}</b><span>${esc(T("fiado_clientes_header", FIADO.length, CLIENTS.length))}</span></div>
    <div class="rs-scroll"><div class="in">
      <div class="fd-chips">${["fiado_sort_oldest","fiado_sort_amount","fiado_sort_az"].map((k,i)=>`<span class="${i===0?"on":""}">${i===0?svg(IP.check):""}${esc(T(k))}</span>`).join("")}</div>
      ${rows}</div></div>` + strip();
}
function page(){
  return topbar(ANA.customer, {action:`<span class="act" data-t="edit">${esc(T("common_edit"))}</span>`}) + `<div class="rs-scroll"><div class="in">
    <div class="fd-owes"><small>${esc(T("fiado_te_debe"))}</small><b>${money(ANA.owes)}</b><span>${esc(T("fiado_page_debts_age", DEBTS.length, ANA.days))}</span>
      <div class="rs-btn">${esc(T("fiado_saldar"))}</div>
      <div class="fd-tx">${esc(T("fiado_perdonar_deuda"))}</div>
      <div class="rs-btn sec">${esc(T("fiado_monto_manual"))}</div><div class="sp8"></div>
      <div class="rs-btn sec">${esc(T("fiado_recordarle"))}</div></div>
    <div class="cl-pg">
      <div class="dr"><span>${esc(T("customer_page_whatsapp"))}</span><b>${esc(waRead(ANA_WA))}</b></div>
      <div class="rs-btn sec">${esc(T("customer_page_whatsapp_write"))}</div><div class="sp8"></div>
      <div class="dr"><span>${esc(T("crm_metric_visits"))}</span><b>${DEBTS.length}</b></div>
      <div class="dr"><span>${esc(T("crm_metric_last_visit"))}</span><b>${esc(fmtDate(DEBTS[1].at))}</b></div>
    </div>
    <h5 class="cl-ph">${esc(T("customer_page_purchases"))}</h5>
    ${DEBTS.slice().reverse().map(p=>`<div class="cl-pr"><div><span>${esc(fmtDateTime(p.at))}</span><small>${esc(T("crm_sold_by", C.owner))}</small></div><strong>${money(p.v)}</strong></div>`).join("")}
  </div></div>` + strip();
}
function form(st){
  const act = `<span class="act">${esc(T("common_save"))}</span><span class="more" data-t="more">${svg(IP.more)}</span>`;
  let h = topbar(T("crm_edit_title"), {action:act}) + `<div class="form">
    <div class="ofld"><label>${esc(T("crm_field_first_name"))}</label>${esc(ANA.customer)}</div>
    <div class="ofld"><label>${esc(T("crm_field_whatsapp"))}</label>${esc(ANA_WA)}</div>
    <div class="adv"><span class="e">⚙️</span><span class="tx"><b>${esc(T("profile_advanced"))}</b><small>${esc(T("profile_advanced_sub"))}</small></span>${svg(IP.expand)}</div>
  </div>`;
  if(st.menu) h += `<div class="menu"><span data-t="del">${esc(T("crm_delete_customer_button"))}</span></div>`;
  if(st.dlg) h += dlg({title:T("crm_delete_blocked_title"), body:`<p>${esc(T("crm_delete_blocked_body", ANA.customer, money(ANA.owes)))}</p>`, dismiss:T("common_done"), tNo:"done"});
  return h + (st.dlg ? "" : strip());
}
function render(st){
  if(st.screen==="home") return home({nudge:true, nav:{on:"reg", finger:true}}) + (st.bio ? bio(T("settings_gate_title"), T("settings_gate_subtitle")) : "");
  if(st.screen==="panel") return panel({salesToday:ITEMS.slice(0,4).reduce((a,it)=>a+it.price,0)*3});
  if(st.screen==="list") return list();
  if(st.screen==="page") return page();
  return form(st);
}
SKIT.start(S, {
  id:"TS23", tallVideo:true, clock:"12:41",
  endText:P({es:"Así proteges tu negocio y tu fiado con Platata.",pt:"Assim você protege seu negócio e seu fiado com o Platata.",en:"That's how you protect your business and your tabs with Platata."}),
  beats: P({
    es:["Tu negocio se abre con tu huella","Abre Clientes y elige a quien te debe","Edítalo y toca Eliminar cliente","Si te debe, no se puede eliminar","Así proteges tu negocio y tu fiado con Platata."],
    pt:["Seu negócio abre com a sua digital","Abra Clientes e escolha quem te deve","Edite e toque em Excluir cliente","Se te deve, não dá para excluir","Assim você protege seu negócio e seu fiado com o Platata."],
    en:["Your business opens with your fingerprint","Open Clients and pick someone who owes you","Edit and tap Delete Client","If they owe you, they can't be deleted","That's how you protect your business and your tabs with Platata."]}),
  state:{screen:"home", bio:false, menu:false, dlg:false},
  render,
  who: () => DEV_OWNER,
  steps: settled([
    {beat:0, hint:P({es:"Toca Mi negocio",pt:"Toque em Meu negócio",en:"Tap My business"}), target:'[data-t="flag"]', tap(st){ st.bio=true; }},
    {beat:0, hint:P({es:"Toca el sensor de huella",pt:"Toque no sensor de digital",en:"Touch the fingerprint sensor"}), target:'[data-t="sensor"]', tap(st,E){ E.after(500,()=>{ st.bio=false; st.screen="panel"; }); }},
    {beat:1, hint:P({es:"Toca Clientes",pt:"Toque em Clientes",en:"Tap Clients"}), target:'[data-t="p-clients"]', tap(st){ st.screen="list"; }},
    {beat:1, hint:P({es:"Toca "+ANA.customer,pt:"Toque em "+ANA.customer,en:"Tap "+ANA.customer}), target:'[data-t="open-ana"]', tap(st){ st.screen="page"; }},
    {beat:2, hint:P({es:"Toca Editar",pt:"Toque em Editar",en:"Tap Edit"}), target:'[data-t="edit"]', tap(st){ st.screen="form"; }},
    {beat:2, hint:P({es:"Toca ⋮",pt:"Toque em ⋮",en:"Tap ⋮"}), target:'[data-t="more"]', tap(st){ st.menu=true; }},
    {beat:2, hint:P({es:"Toca Eliminar cliente",pt:"Toque em Excluir cliente",en:"Tap Delete Client"}), target:'[data-t="del"]', tap(st){ st.menu=false; st.dlg=true; }},
    {beat:3, hint:P({es:"Toca Listo",pt:"Toque em Concluído",en:"Tap Done"}), target:'[data-t="done"]', tap(st){ st.dlg=false; }}
  ])
});
</script>
