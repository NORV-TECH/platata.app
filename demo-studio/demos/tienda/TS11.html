function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

  const stockSub = (STOCK_LOW?`<span style="color:#FF3B30;font-weight:600">${esc(PL("stock_headline_low", STOCK_LOW))}</span>`:"")
    + (STOCK_LOW&&STOCK_UNCOUNTED?" · ":"") + (STOCK_UNCOUNTED?esc(PL("stock_headline_uncounted", STOCK_UNCOUNTED)):"");
  const cliRow = owed>0

    ${head(S("reports_net_sales"), mm(b.net), `<small>${esc(S((R.country==="US"||R.country==="CA")?"reports_net_sales_note":"reports_net_sales_note_no_tips"))}</small>${cmp(b.net, pv.net, month)}`)}
    ${b.service>0 ? sum(S("reports_service_charges"), "+"+mm(b.service), {tap:true, tag:"line-service"}) : ""}
    ${b.tax>0 ? sum(S("reports_taxes"), "+"+mm(b.tax), {tap:true, tag:"line-taxes"}) : ""}
    ${b.tips>0 ? sum(S("reports_tips"), "+"+mm(b.tips), {tap:true, tag:"line-tips"}) : ""}
    ${b.rounding ? `<div class="pr"><span>${esc(S("reports_cash_rounding"))}</span><b>${b.rounding<0?"− ":"+ "}${mm(Math.abs(b.rounding))}</b></div>` : ""}
    ${b.tab>0 ? `<div class="pr" data-t="on-tab"><span>${esc(S("reports_on_tab"))}</span><b>− ${mm(b.tab)}</b></div>` : ""}
    <hr>
    ${head(S("reports_total_collected"), mm(b.collected))}
    <hr>
    ${head(S("reports_transactions"), String(b.count), cmp(b.count, pv.count, month))}
    <hr>
    ${head(S("reports_avg_ticket"), money(r2(fromM(avg))), cmp(avg, pavg, month))}
  </div>`;
}
function blist(title, rows, note){
  const max = Math.max(...rows.map(r=>r.v));
  return `<div class="rp-card bl"><h4>${esc(title)}</h4>${note?`<small class="nt">${esc(note)}</small>`:""}<div class="sp8"></div>
    ${rows.slice(0,8).map(r=>`<div class="br"><div class="l"><span>${esc(r.label)}</span>${r.sec?`<small>${esc(r.sec)}</small>`:""}</div><b>${esc(mm(r.v))}</b></div><div class="trk"><i style="width:${r.v/max*100}%"></i></div>`).join("")}
  </div>`;
}
function lists(st){
  const f = RANGES[st.range].f;
  const sc = rows => rows.map(r=>Object.assign({}, r, {v:Math.round(r.v*f)}));
  const pay = sc(byMethod(ORDERS));
  const cats = sc(byCat(ORDERS));
  const top = itemsSold(ORDERS).map(i=>({label:i.name, v:Math.round(i.v*f), sec:F("reports_sold_count", Math.round(i.n*f))}));
  const emp = byEmployee(ORDERS).map(e=>({label:e.label, v:Math.round(e.v*f), sec:PL("reports_tx_count", Math.round(e.n*f))}));
  return blist(S("reports_payment_split"), pay, S("reports_after_refunds")) + `<div class="sp24"></div>` +
    blist(S("reports_category_title"), cats) + `<div class="sp24"></div>` +
    blist(S("reports_top_items"), top) + `<div class="sp24"></div>` +
    blist(S("reports_employee_sales"), emp);
}
/* ---- the line page (ReportLineDetailContent), for the refunds line and the country's line ---- */
function linePage(kind){
  const per = ORDERS.map(o=>({o, m:moneyOf(o)}));
  let title, total, names = null, rows;
  const amountOf = x => kind==="refunds" ? x.m.refunds : kind==="service" ? x.m.service : kind==="taxes" ? x.m.tax : kind==="tips" ? x.m.tips : x.m.discounts;
  rows = per.filter(x=>amountOf(x) > 0.5).map(x=>({id:x.o.id, h:x.o.h, mi:x.o.mi, v:Math.round(amountOf(x))})).reverse();
  total = rows.reduce((s,r)=>s+r.v,0);
  if(kind==="refunds"){ title = F("refunds_with_count", rows.length); total = DAY.refunds; }
  if(kind==="service"){ title = S("reports_service_charges"); names = [{label:pick({es:"Cargo por servicio",pt:"Taxa de serviço",en:"Service charge"}), v:total, sec:F("reports_line_sales_n", rows.length)}]; }
  if(kind==="taxes"){ title = S("reports_taxes"); names = [{label:TAX.name, v:total, sec:F("reports_line_sales_n", rows.length)}]; }
  if(kind==="tips") title = S("reports_tips");
  if(kind==="discounts") title = S("reports_discounts");
  return topbar(title, {backTag:"line-back"}) + `<div class="rs-scroll"><div class="in rp-in">
    <div class="rp-card lt"><b>${mm(total)}</b><span>${esc(F("reports_line_sales_n", rows.length))}</span></div>
    ${names ? blist(S("reports_line_by_name"), names) : kind!=="refunds" ? `<p class="nn">${esc(S("reports_line_no_names"))}</p>` : ""}
    <h5>${esc(S("reports_line_sales_list"))}</h5>
    ${rows.map(r=>`<div class="ls"><span>${esc(F("tx_sale_number_short", r.id))} · ${esc(fmtSaleTime(r.h, r.mi))}</span><b>${mm(r.v)}</b></div>`).join("")}
  </div></div>` + strip();
}
const PRESETS = ["today","yesterday","this_week","this_month","last_month","this_year","last_year","custom"];
function reports(st){
  const chips = `<div class="rp-chips"><div style="transform:translateX(calc(var(--u)*${-st.chipX}))">${PRESETS.map(p=>{
    const on = RANGES[st.range].chip===p;
    return `<span class="${on?"on":""}" data-t="chip-${p}">${esc(S("reports_period_"+p))}</span>`; }).join("")}</div></div>`;
  return topbar(S("reports_title")) + chips + `<div class="rp-per">${esc(RANGES[st.range].label)}</div>
    <div class="rs-scroll"><div class="in rp-in" style="transform:translateY(calc(var(--u)*${-st.scroll}))">
      <div class="rp-ct">${esc(S("reports_chart_title"))}</div>${chart(st)}
      ${table(st)}<div class="sp12"></div>${lists(st)}<div class="sp24"></div>
    </div></div>
    <div class="rp-bot"><div class="rs-btn" data-t="accountant">${esc(S("reports_send_to_accountant"))}</div></div>` + strip();
}

  if(st.screen==="panel") return panel({open:true, regTotal:fromM(DAY.total - DAY.tab), today:fromM(DAY.net), invoices:2, team:1, phones:0});
  if(st.screen==="line") return linePage(st.line);
  return reports(st);
}
