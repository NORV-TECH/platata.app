/* demo plumbing only (not an app screen): the hint ring glides for 0.25 s after every redraw, so each tap keeps the engine "busy"
   until 0.45 s after its last scheduled change; then the ring sits on its target before the next tap is read. */
function settled(steps){
  return steps.map(s=>Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms||45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, ()=>{});
  }}));
}

    <div class="k8pf"><div class="k8pbtn" data-t="cont">${esc(T("connect_device_continue"))}</div></div></div>`;
}
function code(st){
  const v = st.typed || "", act = st.focus ? v.length : -1;
  const slot = i => `<span class="${i===act?"act":""}">${esc(v[i]||"")}</span>`;
  const g = s => `<div class="g">${[0,1,2,3,4].map(k=>slot(s+k)).join("")}</div>`;
  return `<div class="k8p"><div class="k8ptb"><span>${J.pback}</span></div><div class="k8pb">
    <h1>${esc(T("connect_device_code_title"))}</h1><div class="k8sub">${esc(T("connect_device_where"))}</div>
    <div class="k8boxes" data-t="boxes">${g(0)}<b>-</b>${g(5)}</div>
    <div class="k8note"><span class="ic">${J.cel}</span><span>${esc(T("connect_device_code_changes"))}</span></div></div>
    <div class="k8pf"><div class="k8pbtn${v.length||st.pairing?"":" off"}" data-t="connect">${st.pairing?"<i></i>":esc(T("add_cash_register_connect"))}</div></div></div>`;
}
/* ---- counter tablet: MamaPosScreen ---- */
function locked(){
  return `<div class="k9"><div class="k9lock" data-t="lock">${J.lock}<b>${esc(T("mamaship_locked_title"))}</b><small>${esc(T("mamaship_tap_to_login"))}</small>
    <span class="gear">${J.gear}</span></div></div>`;
}
function picker(){
  return `<div class="k9"><div class="k9pick"><span class="k9back">${J.back}${esc(T("common_back"))}</span>
    <div class="k9mark">Platata</div><div class="k9biz">${esc(S.place)}</div><div class="k9choose">${esc(T("mamaship_choose_profile"))}</div>
    <div class="k9people">${PEOPLE.map(p=>`<div class="k9who" data-t="who-${p.id}"><span class="k9av" style="background:${PAL[p.id%6]}">${esc(ini(p.name))}</span>
      <div><b>${esc(p.name)}</b><small>${esc(p.role)}</small></div></div>`).join("")}</div></div></div>`;
}
function pin(st){
  const keys = ["1","2","3","4","5","6","7","8","9"];
  return `<div class="k9"><div class="k9pin"><div class="l"><span class="k9av" style="background:${COLOR}">${esc(ini(ME.name))}</span>
      <div class="ask">${esc(T("pin_enter_pin"))}</div>
      <div class="k9dots">${[0,1,2,3].map(i=>`<i style="${i<st.pin?`border-color:${COLOR}`:""}">${i<st.pin?`<em style="background:${COLOR}"></em>`:""}</i>`).join("")}</div>
      <div class="nm">${esc(ME.name)}</div><div class="rl">${esc(ME.role)}</div></div>
    <div class="k9keys">${keys.map(k=>`<span data-t="key-${k}">${k}</span>`).join("")}<span class="g sm">${esc(T("mamaship_clear"))}</span><span>0</span><span class="g">⌫</span></div>
    <div class="k9welcome">${esc(T("mamaship_welcome", FIRST))}</div></div></div>`;
}
function catalog(){
  const cats = `<div class="mcats">` + [{name:T("items_filter_all"),color:ALL_C,all:true}].concat(CHIPS).map(c=>{
    const s = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${s}">${c.all?J.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
  const grid = `<div class="mgrid">` + BYNAME.map(it=>{ const c=colorOf(it);
    return `<div class="mtile" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`;
  return cats + grid;
}
function selling(st){
  const tabs = [[T("mama_tab_scan"), J.qr], [T("home_tab_library"), ""], [T("tx_tab_all"), ""]];
  const tabRow = `<div class="k9tabs">${tabs.map((t,i)=>`<span class="t${i===st.tab?" on":""}" ${i===0?'data-t="tab-scan"':""}>${t[1]}${esc(t[0])}</span>`).join("")}<span class="bell">${svg(IP.bell)}</span></div>`;
  const left = st.tab===0 ? `<div class="k9scan"><div class="osb">${esc(T("mama_tab_scan"))}</div></div>` : catalog();
  const right = `<div class="k9right"><div class="k9sw">${IP.swap?svg(IP.swap):""}<b>${esc(FIRST)}</b><span>${esc(T("mamaship_switch"))}</span></div>
    <div class="k9cart"><div class="tr"><span>${J.trash}</span></div><div class="sc"><div class="k9empty"><b>${esc(T("home_cart_empty"))}</b><small>${esc(T("home_cart_empty_sub"))}</small></div></div></div></div>`;
  return `<div class="k9"><div class="k9main"><div class="k9left">${tabRow}${left}</div><div class="k9div"></div>${right}</div></div>`;
}

const TABLET_SCREENS = ["kind","code","lock","pick","pin","sell"];
function render(st){
  if(st.hop) return SKIT.hop(S, {from:DEV_OWNER, to:DEV_TABLET, line:CODE, note:P({
    es:"En la tablet escribes este código. Para conectarse, la tablet necesita internet.",
    pt:"No tablet você digita este código. Para se conectar, o tablet precisa de internet.",
    en:"You type this code on the tablet. To connect, the tablet needs internet."})});
  switch(st.screen){
    case "home": return home({nudge:true}) + (st.sheet ? chooser() : "");
    case "name": return namePage(st);
    case "code": return codePage();
    case "kind": return kind(st);
    case "tcode": return code(st);
    case "lock": return locked();
    case "pick": return picker();
    case "pin":  return pin(st);
    default:     return selling(st);
  }
}
const onTablet = st => ["kind","tcode","lock","pick","pin","sell"].includes(st.screen);

SKIT.start(S, {
  id:"TS19", tallVideo:true, clock:"12:41",
  endText:P({es:"Así conectas una tablet de mostrador con Platata.", pt:"Assim você conecta um tablet do balcão com o Platata.", en:"That's how you connect a counter tablet with Platata."}),
  beats:P({
    es:["Toca Conectar y elige Tablet de mostrador","Ponle un nombre y toca Siguiente: sale un código","En la tablet, elige Tablet de mostrador","Escribe el código y toca Conectar","Cada persona entra con su perfil y su PIN","En Escanear vende lo que ya está en tu catálogo","Así conectas una tablet de mostrador con Platata."],
    pt:["Toque em Conectar e escolha Um caixa","Dê um nome e toque em Próximo: sai um código","No tablet, escolha Tablet do balcão","Digite o código e toque em Conectar","Cada pessoa entra com seu perfil e seu PIN","Em Escanear, venda o que já está no catálogo","Assim você conecta um tablet do balcão com o Platata."],
    en:["Tap Connect and pick A register","Name it and tap Next: you get a code","On the tablet, pick Counter tablet","Type the code and tap Connect","Each person signs in with their profile and PIN","On Scan, sell what's already in your catalog","That's how you connect a counter tablet with Platata."]}),
  state:{screen:"home", sheet:false, hop:false, name:"", kind:"reg", typed:"", focus:false, pairing:false, pin:0, tab:1},
  render,
  device: st => st.hop ? "phone" : (onTablet(st) ? "tablet" : "phone"),
  who: st => st.hop ? "" : (onTablet(st) ? DEV_TABLET : DEV_OWNER),
  steps:settled([
    {beat:0, hint:P({es:"Toca Conectar", pt:"Toque em Conectar", en:"Tap Connect"}), target:'[data-t="nudge-connect"]', tap(st){ st.sheet = true; }},
    {beat:0, hint:P({es:"Toca ",pt:"Toque em ",en:"Tap "}) + T("conn_opt_register"), target:'[data-t="opt-reg"]', tap(st,E){
      st.sheet = false; st.screen = "name"; E.after(500, ()=>E.type("name", REG_NAME, null, 120)); }},
    {beat:1, hint:P({es:"Toca Siguiente", pt:"Toque em Próximo", en:"Tap Next"}), target:'[data-t="next"]', tap(st,E){
      st.screen = "code";
      E.after(3800, ()=>{ st.hop = true; });
      E.after(6200, ()=>{ st.hop = false; st.screen = "kind"; }); }},
    {beat:2, hint:P({es:"Toca Continuar", pt:"Toque em Continuar", en:"Tap Continue"}), target:'[data-t="cont"]', tap(st){ st.screen = "tcode"; st.focus = true; }},
    {beat:3, hint:P({es:"Toca las casillas y escribe el código", pt:"Toque nas caixas e digite o código", en:"Tap the boxes and type the code"}), target:'[data-t="boxes"]', tap(st,E){ E.type("typed", CODE, null, 110); }},
    {beat:3, hint:P({es:"Toca Conectar", pt:"Toque em Conectar", en:"Tap Connect"}), target:'[data-t="connect"]', tap(st,E){
      st.pairing = true; st.focus = false; E.after(1500, ()=>{ st.pairing = false; st.screen = "lock"; }); }},
    {beat:4, hint:P({es:"Toca la pantalla", pt:"Toque na tela", en:"Tap the screen"}), target:'[data-t="lock"]', tap(st){ st.screen = "pick"; }},
    {beat:4, hint:P({es:"Toca ",pt:"Toque em ",en:"Tap "}) + FIRST, target:`[data-t="who-${ME.id}"]`, tap(st){ st.screen = "pin"; }},
    {beat:4, hint:P({es:"Toca su PIN", pt:"Toque no PIN dela", en:"Tap her PIN"}), target:'[data-t="key-5"]', tap(st,E){
      st.pin = 1; E.after(220, ()=>{ st.pin = 2; }); E.after(440, ()=>{ st.pin = 3; }); E.after(660, ()=>{ st.pin = 4; });
      E.after(1100, ()=>{ st.screen = "sell"; }); }},
    {beat:5, hint:P({es:"Toca Escanear", pt:"Toque em Escanear", en:"Tap Scan"}), target:'[data-t="tab-scan"]', tap(st){ st.tab = 0; }}
  ])
});
</script>
</body>
</html>
