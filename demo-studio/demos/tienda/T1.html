/* ===== T1 T2 T3 T4 T5 T11 shared pieces (inlined into each page by the builder; kit/ is not edited) =====
   The shop owner's phone and the counter tablet, plain Material light (ui/theme/Color.kt LightColorScheme:
   primary #1C1C1E, onSurfaceVariant #6E6E73, surfaceVariant #F2F2F7, outlineVariant #E5E5EA, outline #C7C7CC, error #FF3B30,
   surfaceContainerLow #F7F7FA). Words come from STR (values / values-es / values-pt-rBR at the app-head commit in the comment
   of each page). Paths under app/src/main/java/com/example/:
   Register tab     ui/screens/home/ScanCheckoutTab.kt (a shop has NO tab row: HomeScreen.kt:609 !isRetail; OwnerRegisterCard :230-282,
                    SmartScanButton :458-498: one pill "Agregar productos" while the sale is empty, "Escanear más" + green "Cobrar" after)
   camera           ui/screens/home/ScannerScreen.kt:58-267 (topBar = black 75 % band, "TOCA LA PANTALLA PARA ESCANEAR" titleLarge
                    ExtraBold + status line bodyMedium white / red), ui/screens/home/BarcodeCameraBox.kt (guide 260 x 320 dp, 2 dp white 80 %,
                    r12, 48 dp white spinner), ScanCartBar :574-671 (back, grey "Sin código" pill, "Cobrar $X" pill + white count badge)
   scan form        ScannerScreen.kt:378-562 NamePriceOverlay ("¿Qué es este artículo?")
   pay screen       ui/screens/home/CheckoutSheetBody.kt + CheckoutPayBlock.kt (keypad always on, Exact blue #007AFF, links column, set-up
                    link; the tinted #F7F7FA section holds the customer field and, for a shop, the "Fiar" button CheckoutSaveButton :608)
   sale complete    ui/screens/home/ReceiptOptionsScreen.kt SaleCompleteContent (+ sync/ReceiptSendRoute: US/CA text + email)
   Sin código       ui/screens/items/BarlessShelfScreen.kt (no top bar for a shop; search, pills, 2-column grid, bottom bar Escanear / Cobrar)
   weight keypad    ui/screens/home/WeightEntryDialog.kt (full-screen Dialog)
   counter tablet   ui/screens/mamapos/MamaPosScreen.kt (tabs Escanear | Catálogo | Ventas, left 60 %), MamaScanPane.kt
   support strip    ui/screens/reports/SupportStrip.kt (LEVEL_2 pages: scanner_camera, barless_shelf, item_new), badge = accentBtn (Tienda #188448)
   data             kit/shop-data.js through kit/skit.js */
const S = SKIT.ctx(), C = S.C, L = S.lang, CC = S.country, esc = S.esc, pick = S.pick;
const SS = STR[L];
function fmt(s, a){ let i = 0; return s.replace(/%(\d+)\$[sd]|%[sd]/g, (m, n) => { const v = n ? a[n-1] : a[i++]; return v == null ? "" : String(v); }); }
const t = (k, ...a) => { const s = SS[k]; if(s == null) throw new Error("no string " + k); return fmt(s, a); };
/* Android plural category: pt (CLDR) "one" for 0 and 1; es / en "one" for 1 */
const tp = (k, n, ...a) => { const o = SS[k]; const one = n === 1 || (L === "pt" && n === 0); return fmt(o[one ? "one" : "other"] || o.other, a.length ? a : [n]); };
const money = v => S.money(v);
const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
const ALL_C = "#607D8B";                                     // getCategoryBaseColor(null)

/* ---------- EAN-13 bars (the printed label the camera reads) ---------- */
const EAN_L = ["0001101","0011001","0010011","0111101","0100011","0110001","0101111","0111011","0110111","0001011"];
const EAN_G = ["0100111","0110011","0011011","0100001","0011101","0111001","0000101","0010001","0001001","0010111"];
const EAN_R = ["1110010","1100110","1101100","1000010","1011100","1001110","1010000","1000100","1001000","1110100"];
const EAN_P = ["LLLLLL","LLGLGG","LLGGLG","LLGGGL","LGLLGG","LGGLLG","LGGGLL","LGLGLG","LGLGGL","LGGLGL"];
function eanSvg(code){
  const d = code.split("").map(Number), par = EAN_P[d[0]];
  let bits = "101";
  for(let i = 1; i <= 6; i++) bits += (par[i-1] === "L" ? EAN_L : EAN_G)[d[i]];
  bits += "01010";
  for(let i = 7; i <= 12; i++) bits += EAN_R[d[i]];
  bits += "101";
  const guard = i => i < 3 || (i >= 45 && i < 50) || i >= 92;
  let rects = "";
  for(let i = 0; i < bits.length; i++) if(bits[i] === "1") rects += `<rect x="${i+9}" y="0" width="1" height="${guard(i)?58:52}"/>`;
  const txt = `<text x="1" y="65">${d[0]}</text><text x="13" y="65" textLength="40" lengthAdjust="spacing">${code.slice(1,7)}</text><text x="60" y="65" textLength="40" lengthAdjust="spacing">${code.slice(7)}</text>`;
  return `<svg class="ean" viewBox="0 0 113 66"><rect width="113" height="66" fill="#fff"/><g fill="#111">${rects}</g><g class="d" fill="#111">${txt}</g></svg>`;
}

}

/* ---------- pay screen of the owner phone (CheckoutSheetBody + CheckoutPayBlock), a shop: customer field + dim "Fiar" ---------- */
function cashDue(v){
  if(CC === "CL"){ const r = Math.round(v) % 10; return r <= 5 ? Math.round(v) - r : Math.round(v) - r + 10; }
  if(CC === "PE") return Math.floor(v * 10 + 1e-6) / 10;
  if(CC === "CA") return Math.round(v * 20) / 20;
  return v;
}
function payScreen(total, nLines){
  const due = cashDue(total);
  const cardOn = STRIPE;                                                 // US/CA: "+ Tarjeta / Configurar"; CO card is seeded off
  const link = STRIPE ? null : WOMPI ? "pay_setup_link_qr_card" : (PIX ? "pay_setup_link_pix" : "pay_setup_link_qr");
  const keys = ["1","2","3","4","5","6","7","8","9",DECKEY,"0","⌫"];
  let btns = `<div style="flex:1" class="exact" data-t="exact">${esc(cardOn ? t("cash_exact_short") : t("cash_exact", money(due)))}</div>`;
  if(cardOn) btns += `<div style="flex:1" class="nudge"><span>+ ${esc(t("pay_card_short"))}</span><small>${esc(t("pay_card_setup_hint"))}</small></div>`;
  const rounding = Math.abs(due - total) > 1e-9 ? `<div class="x-round">${esc(t("cash_rounding_line", (due-total<0?"-":"+") + money(Math.abs(due-total))))}</div>` : "";
  const links = `<span>${esc(t("checkout_items_link", nLines))} ›</span><span class="oth">${I.more}<span>${esc(t("checkout_other_method", 1))}</span></span>`;
  return `<div class="x"><div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span><span class="clr">${esc(t("checkout_clear"))}</span></div><div class="grow"></div>
    <div class="x-pb"><div class="x-tot"><small>${esc(t("common_total"))}</small><b>${money(total)}</b></div>${rounding}
    <div class="x-amt"><div class="x-links">${links}</div><div class="x-rc"></div></div>
    <div class="x-kp">${keys.map(k => `<span class="${k===DECKEY||k==="⌫"?"s":""}">${esc(k)}</span>`).join("")}</div>
    <div class="x-btns">${btns}</div>
    ${link?`<div class="x-slink"><span>${esc(t(link))}</span><span>${esc(t("pay_setup_link_dismiss"))}</span></div>`:`<div style="height:calc(var(--u)*14)"></div>`}</div>
    <div class="x-sec"><div class="x-cust">${I.person}${esc(t("checkout_add_customer_cta"))}</div><div class="tq-fiar">${esc(t("fiado_chip_fiar"))}</div></div></div>`;
}
/* ---------- Sale complete (ReceiptOptionsScreen.kt SaleCompleteContent): an exact cash sale, no printer ---------- */
function doneScreen(received){
  let b = `<img src="${IMG.celebrate}" alt=""><div class="ttl">${esc(t("receipt_opt_completed"))}</div><div class="sub">${esc(t("receipt_opt_received", money(received)))}</div><div class="q">${esc(t("receipt_opt_how_receipt"))}</div>`;
  let f = STRIPE ? `<div class="b pri">${esc(t("receipt_text_receipt"))}</div><div class="b ol">${esc(t("receipt_email_receipt"))}</div>`
                 : `<div class="b wa">${esc(t("receipt_opt_whatsapp_btn"))}</div>`;
  f += `<div class="b ol">${esc(t("receipt_opt_show_receipt"))}</div><div class="b pri">${esc(t("receipt_opt_new_sale_no_receipt"))}</div><div class="pv">${esc(t("receipt_opt_privacy"))}</div>`;
  return `<div class="x"><div class="x-sc-body">${b}</div><div class="x-sc-foot">${f}</div></div>`;
}

/* ---------- counter tablet (MamaPosScreen.kt): left 60 % = tabs + pane, right = who is selling + the ticket ---------- */
const CASHIER_FIRST = C.people.cashier.split(" ")[0];
function tabletTabs(on){
  const names = [t("mama_tab_scan"), t("home_tab_library"), t("tx_tab_all")];
  return `<div class="k9tabs">${names.map((n, i) => `<span class="t${i===on?" on":""}" data-t="ttab-${i}">${i===0?I.qr:""}${esc(n)}</span>`).join("")}<span class="bell">${I.bell}</span></div>`;
}
function tabletScanPane(o){ o = o || {};
  return `<div class="tq-tscan">${camBox({tablet: true, scene: o.scene, spin: o.spin, flash: o.flash})}
    <div class="band"><b>${esc(t("scan_tap_to_scan"))}</b>${o.status?`<small class="${o.err?"e":""}">${esc(o.status)}</small>`:""}</div></div>`;
}
/* Catálogo of a shop tablet: the "Teclado" link on top (C-25), then ProductLibraryView with 4 columns; the chips are
   "Todos" + EVERY shop category (ProductLibraryView.kt:206, not only the ones that hold products) */
function tabletCatalog(items){
  const chips = `<div class="mcats">` + [{name: t("items_filter_all"), color: ALL_C, all: true}].concat(scanCats()).map(c => {
    const st = c.all ? `background:${hexA(c.color,.22)};border:calc(var(--u)*1.5) solid ${c.color};color:${c.color}` : `background:${hexA(c.color,.05)};border:1px solid ${hexA(c.color,.3)}`;
    return `<span style="${st}">${c.all?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>`;
  const grid = `<div class="mgrid">` + items.map(it => { const c = catColor(it.cat);
    return `<div class="mtile" data-t="tile-${it.id}" style="border-color:${hexA(c,.35)}"><div class="in" style="background:${hexA(c,.12)}"><b>${esc(it.name)}</b><span>${money(it.price)}</span></div></div>`; }).join("") + `</div>`;
  return `<div class="tq-tlink"><span>${esc(t("scan_row_manual"))}</span></div>${chips}${grid}`;
}
function tabletRight(lines){
  const n = lines.length, total = lines.reduce((s, l) => s + l.price, 0);
  const body = n
    ? lines.map(p => `<div class="k9line${p.isNew?" tq-new":""}"><div class="n"><b>${esc(p.name)}</b><small>${money(p.price)}</small></div><div class="q"><span>${I.minus}</span><i>1</i><span>${I.plus}</span></div></div>`).join("") +
      `<div class="k9hr"></div><div class="k9charge">${esc(tp("common_charge_items", n, money(total), n))}</div>`
    : `<div class="k9empty"><b>${esc(t("home_cart_empty"))}</b><small>${esc(t("home_cart_empty_sub"))}</small></div>`;
  return `<div class="k9right"><div class="k9sw">${I.swap}<b>${esc(CASHIER_FIRST)}</b><span>${esc(t("mamaship_switch"))}</span></div>
    <div class="k9cart"><div class="tr"><span>${I.trash}</span></div><div class="sc">${body}</div></div></div>`;
}
function tablet(tab, pane, lines){
  return `<div class="k9"><div class="k9main"><div class="k9left">${tabletTabs(tab)}<div class="tq-tpane">${pane}</div></div><div class="k9div"></div>${tabletRight(lines)}</div></div>`;
}

/* ---------- WeightEntryDialog (full screen) ---------- */
/* the raw stored unit under the big number (WeightEntryDialog.kt:119-124 prints `unitOfSale`, not its translation):
   drawn only where the stored name already reads right (Libra in Spanish, Pound in English); elsewhere it reads "Kilogram"
   in Spanish / Portuguese, which fix R6 (≈1:30 AM) changes, so the page leaves the line out until then */
const R6_LANDED = false;
function rawUnitLine(u){ if(R6_LANDED) return S.unitName(u); const ok = (L === "es" && u === "Libra") || (L === "en" && (u === "Pound" || u === "Kilogram")); return ok ? u : null; }
const wNum = s => s.replace(".", DMARK);
const presetLabel = (p, abbr) => `${wNum(String(p))} ${abbr}`;
function weightDialog(o){   // o: {item, price, unit, typed, short}
  const abbr = S.unitAbbr(o.unit), w = parseFloat(o.typed || "0") || 0, total = o.price * w;
  const unitLine = rawUnitLine(o.unit);
  const keys = [["1","2","3"],["4","5","6"],["7","8","9"],[".","0","⌫"]];
  const btn = w > 0 ? `<div class="tq-btn" data-t="w-add">${esc(t("opt_add_to_sale", money(total)))}</div>`
                    : `<div class="tq-btn off" data-t="w-add">${esc(t("home_add_to_sale"))}</div>`;
  return `<div class="tq-wd${o.short?" sh":""}"><div class="tq-top"><div class="t2"><b>${esc(o.item.name)}</b><small>${esc(t("home_weight_unit_info", abbr, money(o.price)))}</small></div><span class="tb">${esc(t("common_cancel"))}</span></div>
    <div class="wb"><div class="wcard"><div class="big">${esc(o.typed ? wNum(o.typed) : "0" + DMARK + "00")}</div>${unitLine?`<div class="un">${esc(unitLine)}</div>`:""}<div class="tt">${esc(t("home_calculated_cost", money(total)))}</div></div>
    <div class="pre">${[0.25, 0.5, 1, 2.5].map(p => `<span data-t="w-pre-${String(p).replace(".","_")}">${esc(presetLabel(p, abbr))}</span>`).join("")}</div></div>
    <div class="wk">${keys.map(r => `<div class="r">${r.map(k => `<span class="${k==="⌫"?"del":""}" data-t="w-key-${k==="."?"dot":k==="⌫"?"del":k}">${k==="."?esc(DMARK):k}</span>`).join("")}</div>`).join("")}${btn}<div style="height:calc(var(--u)*8)"></div></div></div>`;
}

/* ---------- the "Sin código" page (BarlessShelfScreen.kt) ---------- */
/* his own no-barcode products: products with no barcode (BarlessShelfScreen.kt:107), the shop's groceries (also on ?type=pharmacy:
   the pharmacy's eight items all carry a barcode, so its page would be empty; the page keeps the shop's loose goods) */
const BARLESS = C.items.filter(i => !i.barcode);
const iconOf = (name, slug) => slug && ICONS[slug] ? `<span class="ic">${ICONS[slug]}</span>` : `<span class="ic emo">🍽️</span>`;
const hisSlug = name => (HIS[L] || {})[name] || "";
/* grid label (BarlessShelfScreen.kt:305-307): "$price / <stored unit>" unless Per Item. A Spanish / Portuguese shop outside Colombia
   reads "/ Kilogram" there until fix R6; the page leaves the "/ unit" out where it would read wrong */
function gridPrice(it){ if(it.unit === "Per Item") return money(it.price); const u = rawUnitLine(it.unit); return u ? `${money(it.price)} / ${u}` : money(it.price); }
function barlessGrid(items, cats){
  const pills = cats.length >= 2 ? `<div class="tq-pills">` + [{name: t("stock_category_all"), color: ALL_C, all: true}].concat(cats).map(c => {
      const on = !!c.all, col = c.color;
      return `<span style="background:${on?hexA(col,.22):hexA(col,.05)};${on?`border:calc(var(--u)*1.5) solid ${col};color:${col}`:`border:1px solid ${hexA(col,.3)}`}">${on?I.check:""}${esc(c.name)}</span>`; }).join("") + `</div>` : "";
  return pills + `<div class="tq-bgrid">${items.map(it => `<div class="tq-card" data-t="his-${it.id}">${iconOf(it.name, hisSlug(it.name))}<div class="tx"><b>${esc(it.name)}</b><small>${esc(gridPrice(it))}</small></div></div>`).join("")}</div>`;
}
function barlessPage(o){ o = o || {};
  const sf = `<div class="tq-sf">${field({lead: `<span class="ld">${I.search}</span>`, value: o.query, ph: t("barless_search_here"), foc: o.focus, t: "search"})}</div>`;
  let body;
  if(o.results) body = `<div class="tq-res">${o.results.map((r, i) => `<div class="tq-card row" data-t="res-${i}">${r.his ? iconOf(r.name, hisSlug(r.name)) : iconOf(r.name, r.slug)}<b>${esc(r.name)}</b>${r.his?`<em>${money(r.price)}</em>`:""}</div>`).join("")}
      ${o.vender?`<div class="tq-card row v"><b>${esc(t("barless_sell_quoted", o.query))}</b></div>`:""}</div>`;
  else if(o.typing) body = `<div class="grow"></div>`;
  else body = barlessGrid(o.items, o.cats);
  const total = o.total || 0;
  const bar = `<div class="tq-bbar"><div class="ol">${esc(t("barless_back"))}</div><div class="go${total?"":" off"}" data-t="bl-charge">${esc(total ? `${t("barless_checkout")} · ${money(total)}` : t("barless_checkout"))}</div></div>`;
  return `<div class="tq-page">${sf}<div class="tq-body">${body}</div>${bar}${o.kbd ? kbd(o.kbd, {tags: o.kbdTags}) : strip()}</div>`;
}
/* the price step: a bottom sheet (BarlessShelfScreen.kt:464-597) */
function priceSheet(o){   // o: {name, price, unit, weight, focus}
  const isQty = o.unit !== "Per Item";
  const p = parseFloat(o.price || "0") || 0, w = parseFloat(o.weight || "0") || 0, total = isQty ? p * w : p;
  const ok = p > 0 && (!isQty || w > 0);
  return `<div class="tq-scrim"></div><div class="tq-sheet"><div class="handle"></div>
    ${field({label: t("barless_field_name"), value: o.name})}
    <div class="two">${field({label: t("barless_field_price"), value: o.price, foc: o.focus === "price", t: "sh-price"})}${field({label: t("barless_field_per"), value: S.unitName(o.unit), trail: `<span class="tr">${I.drop}</span>`})}</div>
    ${isQty ? `<hr><div class="now">${esc(t("barless_sale_now"))}</div>${field({label: `${t("barless_field_weight")} (${S.unitName(o.unit)})`, value: o.weight, foc: o.focus === "weight", t: "sh-weight"})}` : ""}
    <div class="tq-btn${ok?"":" off"}" data-t="sh-add">${esc(`${t("scan_focused_add")} · ${money(total)}`)}</div></div>`;
}

/* ===== T1 "Escanear el código de barras" =====
   The owner scans a product into the sale on HIS phone (tap the screen to read, the same code again adds one more), charges it, and
   the counter tablet scans a known product into its ticket and refuses a code the shop never created.
   Checked against app-head 6736ddfb (sim/usa-canada). Paths under app/src/main/java/com/example/:
   home      ui/screens/home/ScanCheckoutTab.kt:230-282 (Fiado row only while someone owes, Sin código, Teclado), SmartScanButton :458-498
   camera    ui/screens/home/ScannerScreen.kt:58-152 (a known product with a price goes straight in, status = its name; the same code
             again = scan_checkout_added_another "Otra más · %1$s × %2$d"), BarcodeCameraBox.kt (tap to capture, spinner while reading)
   bar       ScanCartBar :574-671 — the badge is uiState.cart.size (LINES, :65), the pay screen's "Artículos (N)" is the sum of
             quantities (CheckoutSheetBody.kt:521): after arroz x2 + leche the badge says 2 and the pay screen says 3
   pay       CheckoutSheetBody.kt / CheckoutPayBlock.kt (Exacto = the blue cash button), sale complete ReceiptOptionsScreen.kt
   tablet    ui/screens/mamapos/MamaScanPane.kt:62-171 (same band, white name / red "No está en tu catálogo" + red flash),
             ui/pos/TabletScanActions.kt:28-47 (KNOWN products only: an unknown code creates nothing) */
const A = SCAN_ITEMS[0];                                         // arroz (pharmacy: the pain reliever)
const B = S.isPharm ? SCAN_ITEMS[3] : C.item("leche");           // leche (pharmacy: oral rehydration salts)
const lineTotal = st => st.lines.reduce((s, l) => s + l.item.price * l.qty, 0);
function render(st){
  if(st.screen === "home") return home();
  if(st.screen === "cam") return cameraPage({status: st.status, scene: sceneOf(st.scene || A), spin: st.spin, count: st.lines.length, total: lineTotal(st)});
  if(st.screen === "pay") return payScreen(lineTotal(st), st.lines.reduce((s, l) => s + l.qty, 0));
  if(st.screen === "done") return doneScreen(cashDue(lineTotal(st)));
  if(st.screen === "hop") return SKIT.hop(S, {from: WHO_PHONE(), to: WHO_TABLET(), line: pick({es:"Otra caja, el mismo catálogo", pt:"Outro caixa, o mesmo catálogo", en:"Another register, same catalog"})});
  const pane = tabletScanPane({scene: st.tUnknown ? sceneUnknown() : sceneOf(A), spin: st.spin, flash: st.flash, status: st.status, err: st.err});
  return tablet(0, pane, st.tLines);
}
function read(st, E, then){ st.spin = true; st.flash = false; E.after(600, () => { st.spin = false; then(); }); }
SKIT.start(S, {
  id: "T1", tallVideo: true, clock: "12:41",
  endText: pick({es:"Así escaneas y vendes en segundos, con Platata.", pt:"Assim você escaneia e vende em segundos, com o Platata.", en:"That's how you scan and sell in seconds, with Platata."}),
  beats: pick({
    es: ["Para vender, toca Agregar productos", "Apunta al código y toca la pantalla", "El mismo otra vez: suma uno más", "Otro producto, otro toque", "Toca Cobrar y luego Exacto", "En la tablet de mostrador, igual: toca", "Un código que no es tuyo no entra", "Así escaneas y vendes en segundos."],
    pt: ["Para vender, toque em Adicionar produtos", "Aponte para o código e toque na tela", "O mesmo de novo: soma mais um", "Outro produto, outro toque", "Toque em Cobrar e depois em Exato", "No tablet do balcão é igual: toque", "Um código que não é seu não entra", "Assim você escaneia e vende em segundos."],
    en: ["To sell, tap Add items", "Aim at the barcode and tap the screen", "Same one again: one more", "Another product, another tap", "Tap Charge, then Exact", "On the counter tablet, same thing: tap", "A code you never added stays out", "That's how you scan and sell in seconds."]}),
  state: {screen: "home", lines: [], scene: null, status: "", spin: false, flash: false, err: false, tLines: [], tUnknown: false},
  render,
  device: st => (st.screen === "tablet") ? "tablet" : "phone",
  who: st => st.screen === "tablet" ? WHO_TABLET() : WHO_PHONE(),
  steps: [
    {beat: 0, hint: pick({es:"Toca Agregar productos", pt:"Toque em Adicionar produtos", en:"Tap Add items"}), target: '[data-t="add-items"]', tap(st){ st.screen = "cam"; st.scene = A; }},
    {beat: 1, hint: pick({es:"Toca la pantalla", pt:"Toque na tela", en:"Tap the screen"}), target: '[data-t="cam"]', tap(st, E){
        read(st, E, () => { st.lines.push({item: A, qty: 1}); st.status = A.name; }); }},
    {beat: 2, hint: pick({es:"Toca la pantalla otra vez", pt:"Toque na tela de novo", en:"Tap the screen again"}), target: '[data-t="cam"]', tap(st, E){
        read(st, E, () => { st.lines[0].qty = 2; st.status = t("scan_checkout_added_another", A.name, 2);
          E.after(1300, () => { st.scene = B; }); }); }},
    {beat: 3, hint: pick({es:"Toca la pantalla", pt:"Toque na tela", en:"Tap the screen"}), target: '[data-t="cam"]', tap(st, E){
        read(st, E, () => { st.lines.push({item: B, qty: 1}); st.status = B.name; }); }},
    {beat: 4, hint: pick({es:"Toca Cobrar", pt:"Toque em Cobrar", en:"Tap Charge"}), target: '[data-t="cam-charge"]', tap(st){ st.screen = "pay"; }},
    {beat: 4, hint: pick({es:"Toca Exacto", pt:"Toque em Exato", en:"Tap Exact"}), target: '[data-t="exact"]', tap(st, E){
        st.screen = "done";
        E.after(2200, () => { st.screen = "hop"; });
        E.after(3800, () => { st.screen = "tablet"; st.status = ""; st.spin = false; }); }},
    {beat: 5, hint: pick({es:"Toca la pantalla", pt:"Toque na tela", en:"Tap the screen"}), target: '[data-t="cam"]', tap(st, E){
        read(st, E, () => { st.tLines.push({name: A.name, price: A.price, isNew: true}); st.status = A.name;
          E.after(1500, () => { st.tLines[0].isNew = false; st.tUnknown = true; }); }); }},
    {beat: 6, hint: pick({es:"Toca la pantalla", pt:"Toque na tela", en:"Tap the screen"}), target: '[data-t="cam"]', tap(st, E){
        read(st, E, () => { st.flash = true; st.err = true; st.status = t("scan_tablet_not_in_catalog"); }); }}
  ]
});

</script>
