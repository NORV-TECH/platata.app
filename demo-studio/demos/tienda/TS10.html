function waRead(canonical){
  const dial = DIAL, national = canonical.slice(dial.length);
  let body;
  if(dial==="1" && national.length===10) body = "("+national.slice(0,3)+") "+national.slice(3,6)+"-"+national.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length]; const g=[]; let rest=national;
    if(sizes){ sizes.forEach(n=>{g.push(rest.slice(0,n)); rest=rest.slice(n);}); } else { while(rest.length>4){g.push(rest.slice(0,3)); rest=rest.slice(3);} if(rest) g.push(rest); }
    body = g.join(" "); }
  return "+"+dial+" "+body;
}

  const stockSub = (STOCK_LOW?`<span style="color:#FF3B30;font-weight:600">${esc(PL("stock_headline_low", STOCK_LOW))}</span>`:"")
    + (STOCK_LOW&&STOCK_UNCOUNTED?" · ":"") + (STOCK_UNCOUNTED?esc(PL("stock_headline_uncounted", STOCK_UNCOUNTED)):"");
  const cliRow = owed>0

// TITLE: Platata · Cerrar la caja
/* TS10 "Cerrar la caja" as a SHOP: the owner counts the drawer, confirms, gets the "Caja cerrada" summary with the two fiado lines
   ("Abonos de fiado" and "En fiado (sin cobrar)") and sends it by WhatsApp. Every country, es/pt/en, ?type=pharmacy works.
   Screens at the newest sim/usa-canada commit (paths under app/src/main/java/com/example/):
   business panel       ui/screens/home/HomeScreen.kt:1522-1570 (register card -> Screen.RegisterStatus)
   Register screen      ui/screens/cash/RegisterStatusScreen.kt:343-510 (drawer card with Abonos de fiado :361-366; the money card's
                        "En fiado (sin cobrar)" under Total cobrado, :730-735; Cerrar caja = Secondary button at the bottom)
   Close register       ui/screens/cash/CloseRegisterScreen.kt:375-556 (Expected card + one compact cash-out line + "Ver dinero por forma
                        de pago", Contado, the Diferencia line, CashKeypad, Cerrar caja); typing rule MoneyKeypadEntry.kt. A shop never
                        parks a ticket, so the open-tables warning (FIX-1 item 6) does not show.
   confirm              CloseRegisterScreen.kt CloseRegisterConfirmDialog (register_close_confirm_title, Faltante/Sobrante/Cuadrado,
                        TextButtons Seguir contando | Cerrar caja)
   summary              ui/screens/cash/RegisterClosedScreen.kt:181-322 (variance headline; times card; REPORTS-11 lines: Ventas netas,
                        Impuestos, En fiado (sin cobrar) "-$", Total cobrado, Por forma de pago without the Fiado row (ShiftSummary.kt :40);
                        drawer card with Abonos de fiado; Enviar por WhatsApp; Listo pinned). No Print button without a receipt printer.
   WhatsApp text        utils/ShiftSummaryText.kt build() (business name, CAJA CERRADA, 32 columns, thermalSafe) + WhatsappSignature.
   The day: cash sales, one sale on Juan's tab, Ana paid part of her tab in cash, one cash-out to a supplier (TS9). */
// KEYS: register_close_short,register_close_over,register_close_balanced

const START = {CO:50000,CL:50000,AR:50000,MX:1000,PE:200,BR:200,EC:100,PA:100,US:100,CA:100}[R.country];
const SALES = {CO:186000,CL:98000,AR:186000,MX:2450,PE:486,BR:486,EC:214.5,PA:214,US:214.5,CA:214.5}[R.country];   // cash sales
const FIA = {CO:18500,MX:185,PE:55,CL:9500,EC:15,AR:9500,PA:15,BR:45,US:22.5,CA:26.5}[R.country];                    // one sale on the tab
const ABONO = {CO:10000,MX:100,PE:30,CL:5000,EC:10,AR:5000,PA:10,BR:20,US:10,CA:12}[R.country];                      // tab paid in cash
const OUT = {CO:20000,CL:20000,AR:5000,MX:500,PE:100,BR:80,EC:40,PA:40,US:40,CA:40}[R.country];
const EXP = r2(START + SALES + ABONO - OUT);
const COUNTED = EXP;                                   // he counts exactly what should be there: "Cuadrado"
const DIFF = r2(COUNTED - EXP);
const KEYS = keysFor(COUNTED);
const OPENED = D(6,58), MOVED = D(15,10), CLOSED = D(21,5);
/* SalesBreakdown of the shift: Net is the total without the tax inside the price (US/CA: the tax added on top) */
const GROSS_SOLD = r2(SALES + FIA);
const NET = TAX ? r2(GROSS_SOLD/(1+TAX.p/100)) : GROSS_SOLD;
const TAXES = r2(GROSS_SOLD - NET);
const varText = d => d<0 ? F("register_close_short", money(-d)) : d>0 ? F("register_close_over", money(d)) : S("register_close_balanced");
const varCls = d => d<0 ? "neg" : d>0 ? "pos" : "bal";

      <hr><div class="lr em"><span>${esc(S("register_status_expected"))}</span><span class="pri">${money(EXP)}</span></div></div>
    ${btn(S("cash_movement_out"),"sec")}${btn(S("cash_movement_in"),"sec")}

  const lr = (l,v,c,tag) => `<div class="lr${c?" "+c:""}"${tag?` data-t="${tag}"`:""}><span>${esc(l)}</span><span>${esc(v)}</span></div>`;

    <div class="scard">${lr(S("register_status_net_sales"), money(NET),"k")}${TAXES>0?lr(S("reports_taxes"), "+"+money(TAXES),"k"):""}
      ${lr(S("reports_on_tab"), "-"+money(FIA),"k hl","on-tab")}${lr(S("reports_total_collected"), money(SALES),"em k")}
      <div class="sub">${esc(S("register_close_by_method"))}</div>${lr(S("payment_method_cash"), money(SALES),"k ind2")}</div>
    <div class="scard">${lr(S("register_status_starting_cash"), money(START),"k")}${lr(S("register_status_cash_sales"), money(SALES),"k")}
      ${lr(S("register_close_fiado_settled"), money(ABONO),"k hl","abonos")}${lr(S("cash_movement_out"), "-"+money(OUT),"k")}<hr>
      ${lr(S("register_status_expected"), money(EXP),"em k")}${lr(S("register_status_counted"), money(COUNTED),"em k")}</div>
    ${btn(S("register_closed_whatsapp"),"sec","wa")}<div style="height:calc(var(--u)*16)"></div></div></div>
    <div class="pf">${btn(S("common_done"),"pri","done")}</div></div>`;
}
/* the text ShiftSummaryText.build() makes for this shift, signed (WhatsappSignature) */
function shiftText(){
  const W = 32, rule = "-".repeat(W), out = [];
  const row = (l, r) => { const g = W - l.length - r.length; out.push(g>0 ? l+" ".repeat(g)+r : l+" "+r); };
  out.push(BIZ); out.push(S("register_closed_title").toUpperCase()); out.push(rule);
  row(S("register_status_opened_at"), fmtDT(OPENED)); row(S("register_status_closed_at"), fmtDT(CLOSED)); row(S("register_status_closed_by"), OWNER); out.push(rule);
  row(S("register_status_net_sales"), money(NET)); if(TAXES>0) row(S("reports_taxes"), "+"+money(TAXES));
  row(S("reports_on_tab"), "-"+money(FIA)); row(S("reports_total_collected"), money(SALES));
  out.push(S("register_close_by_method")); row("  "+S("payment_method_cash"), money(SALES)); out.push(rule);
  row(S("register_status_starting_cash"), money(START)); row(S("register_status_cash_sales"), money(SALES)); row(S("register_close_fiado_settled"), money(ABONO));
  row(S("cash_movement_out"), "-"+money(OUT));
  row(S("register_status_expected"), money(EXP)); row(S("register_status_counted"), money(COUNTED)); out.push(rule); out.push(varText(DIFF));
  return out.join("\n").replace(/[   ]/g," ") + "\n\n" + S("whatsapp_signature");
}
const waScreen = () => `<div class="wa"><div class="wah">${I.back}<b>WhatsApp</b></div><div class="wab"><div class="wam">${esc(shiftText())}<i>${esc(fmtTime(D(21,6)))} ✓✓</i></div></div></div>`;
function render(st){
  if(st.screen==="panel") return panel({open:true, regTotal:SALES, today:NET, invoices:2, team:1, owed:OWED_TOTAL+FIA-ABONO});
  if(st.screen==="reg") return registerScreen({scroll:st.scroll||0});
  if(st.screen==="close") return closeScreen(st);
  if(st.screen==="sum") return summary(st);
  if(st.screen==="wa") return waScreen();
  return "";
}
