const hexA = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };
/* ProductCard priceLabel: ASK -> "En la caja"; no price -> "Sin precio"; FROM -> "Desde $X"; else $X. The number is the FIRST
   variation's price (ProductLibraryView.kt:331), not the lowest. s = {mode:"fixed"|"from"|"ask"|"unset", first} */
function tileLabel(s){
  if(s.mode==="ask") return t("bridge_mode_ask");
  if(s.first==null) return t("items_price_unset");
  if(s.mode==="from") return t("items_price_from", money(s.first));
  return money(s.first);
}
/* a kit service as the till holds it: a picker is FROM (SVC-3 item 37), its tile shows the first choice's price */
const tillOf = (s, over) => Object.assign({
  id: s.id, name: s.name, min: s.min,
  mode: s.choices.length > 1 ? "from" : (s.price==null ? "unset" : "fixed"),
  first: s.choices.length > 1 ? s.choices[0].price : s.price,
  lowest: s.price, choices: s.choices.length > 1 ? s.choices.length : 0
}, over||{});

  const tip = o.tooltip ? `<div class="ttip"><b>${esc(t("till_tap_pointer"))}</b><span>${esc(t("till_tap_pointer_ok"))}</span></div>` : "";

  return (o.top||"") + tabs + (o.regClosed ? closedBar() : "") + edit + chips + `<div class="sgrid-w"><div class="sgrid">${tiles}${add}</div>${tip}</div>` + foot + nav("caja");

/* RegisterClosedBar.kt: #FEF3C7 row, titleSmall bold #856404, orange pill "Abrir" */
const closedBar = () => `<div class="cbar"><b>${esc(t("workspace_register_closed"))}</b><span>${esc(t("workspace_register_open_action"))}</span></div>`;

/* ---- money typing (a price box takes whole units and, where the currency has cents, the decimal mark) ---- */
const DECMARK = new Intl.NumberFormat(K.loc).formatToParts(1.5).find(p => p.type==="decimal").value;
const SEEDED = v => new Intl.NumberFormat(K.loc, {minimumFractionDigits:K.dec, maximumFractionDigits:K.dec}).format(v);   // seedMoneyField + MoneyVisualTransformation
const GROUPED = v => new Intl.NumberFormat(K.loc, {minimumFractionDigits:0, maximumFractionDigits:K.dec}).format(v);   // MoneyVisualTransformation draws the grouping
const typedOf = v => (K.dec && v % 1 ? String(v.toFixed(2)).replace(".", DECMARK) : String(Math.round(v)));
const currencySymbol = () => new Intl.NumberFormat(K.loc, {style:"currency", currency:K.cur}).formatToParts(0).find(p => p.type==="currency").value.replace(/US\$|USD/, "$");

/* the phone's number keyboard (Gboard number pad) while a money / number box has the focus; act = "next" (Sig.) or "done" */
const numKbd = (act) => { const k = [["1","2","3","−"],["4","5","6","␣"],["7","8","9","⌫"],[",","0",".",act==="next"?"→":"✓"]];
  return `<div class="nkbd">${k.map(r => `<div class="nkr">${r.map((x, i) => `<span class="${i===3?(x==="→"||x==="✓"?"act":"fn"):""}">${x}</span>`).join("")}</div>`).join("")}</div>`; };

/* ShrinkToFitText (ui/components/ShrinkToFitText.kt): one line, 1 sp smaller until it fits, never under 12 sp, then an ellipsis.
   Applied after every draw to the elements marked .fit (data-sp = the start size). */
function fitAll(){
  document.querySelectorAll("#app .fit").forEach(el => {
    let sp = +(el.dataset.sp || 16);
    el.style.fontSize = `calc(var(--u)*${sp})`;
    while(el.scrollWidth > el.clientWidth + 0.5 && sp > 12){ sp -= 1; el.style.fontSize = `calc(var(--u)*${sp})`; }
  });
}
new MutationObserver(() => fitAll()).observe(document.getElementById("root"), {childList:true, subtree:true});

function bridgePage(st, s, idx){
  const pick = isPicker(s);
  const seg = pick ? pSeg([t("bridge_mode_by_choice"), t("bridge_mode_ask")], 0) : pSeg([t("bridge_mode_fixed"), t("bridge_mode_from"), t("bridge_mode_ask")], 0);
  let price;
  if(pick){
    const typed = st.choiceTyped||{};
    price = `<div class="psmall">${esc(t("bridge_choice_note"))}</div><div class="pcard chc">${s.choices.map((c, i) => {
      const v = typed[i] != null ? typed[i] : c.price;
      return `<div class="chr"><div><b>${esc(c.name)}</b>${c.min?`<small>${c.min} ${esc(t("opt_min"))}</small>`:""}</div>${priceBox(v, 118, {focus:st.chFocus===i})}</div>`; }).join("")}</div>`;
  } else {
    const pills = PILLS(suggested(s));
    price = pills.length ? `<div class="pills">${pills.map(p => `<span class="${p===s.price?"on":""}">${esc(money(p))}</span>`).join("")}</div>
      <div class="cmn"><span class="psmall">${esc(t("bridge_common_price"))}</span>${pLink(t("bridge_other_price"), true)}</div>`
      : `<div class="pbig">${esc(t("bridge_price_tap"))}</div>`;
  }
  const back = st.fromList ? pBack("choice-back") : pBack();
  return `<div class="ppage">
    <div class="ptop">${back}${pProg(2, 3, (idx+1)/ORDER.length)}<span class="pstep">${esc(t("bridge_step_counter", idx+1, ORDER.length))}</span></div>
    <div class="pbody bgap">${headerCard(s)}<div class="mhead">${esc(t("bridge_how_charge"))}</div>${seg}${price}${comesRow(s)}</div>
    <div class="pfoot c lift">${pBtn(t(idx===ORDER.length-1 ? "guide_finish" : "bridge_next"), "next")}<div class="tplinks">${pLink(t("bridge_see_all"), false, "see-all")}${pLink(t("bridge_finish_later"))}</div></div>
    ${st.chFocus != null ? numKbd(st.chFocus === s.choices.length-1 ? "done" : "next") : ""}${st.sheet ? sheet(s) : ""}</div>`;
}
/* LoQueTraeSheet.kt: title "Lo que trae <service>", hint, INCLUIDO (check + name), SE COBRA APARTE (accent pill + name), link, Listo */

/* ---- S6 "Tus precios" (ServicesPriceListScreen.kt) ---- */
function listPage(st){
  const rows = ORDER.map(s => {
    if(isPicker(s)){
      const typed = (st.choiceDone && s === CHOICE_SVC) ? offered(s.id).choices.map(c => c.price) : s.choices.map(c => c.price);
      const pr = typed.filter(p => p != null);
      const lo = pr.length ? Math.min(...pr) : null, hi = pr.length ? Math.max(...pr) : null;
      const pill = lo == null ? "" : pPill(lo === hi ? money(lo) : t("bridge_list_range", money(lo), money(hi)));
      return `<div class="lrow" data-t="row-${s.id}"><div><b>${esc(s.name)}</b><small>${esc(t("bridge_list_choices", s.choices.length))}</small></div>${pill}<span class="lch">${I.chevR}</span></div>`;
    }
    const v = st.typed[s.id] != null ? st.typed[s.id] : suggested(s);
    return `<div class="lrow"><div><b>${esc(s.name)}</b>${s.min?`<small>${s.min} ${esc(t("opt_min"))}</small>`:""}</div>${priceBox(v, 104, {focus:st.focus===s.id, tag:"box-"+s.id})}<span class="lch big">${I.chevR}</span></div>`;
  }).join("");
  return `<div class="ppage">
    <div class="ptop">${pBack()}${pProg(3, 3)}</div>
    <div class="pbody"><div class="lin" style="transform:translateY(calc(var(--u)*${-(st.listScroll||0)}))"><div class="ph1">${esc(t("bridge_list_title"))}</div><div class="psub">${esc(t("bridge_list_sub"))}</div>

}

/* ---- the till after the walk ---- */
function tillServices(st){
  return ORDER.map(s => {
    if(isPicker(s)) return tillOf(s, {first: s.choices[0].price});
    const v = st.typed[s.id] != null ? st.typed[s.id] : s.price;
    return tillOf(s, {mode: v == null ? "unset" : "fixed", first: v});
  }).sort((a, b) => cmp(a.name, b.name));
}
const PRODUCTS_SEEDED = {peluqueria:13, veterinaria:11, "taller-motos":12, unas:12}[V.biz];   // assets/catalogo_investigado/<trade>.json "products"

function render(st){
  let h;
  if(st.screen==="picker") h = tradePicker({picked:st.picked, query:st.query, focus:st.qfocus});
  else if(st.screen==="pick") h = pickPage(st);
  else if(st.screen==="bridge") h = bridgePage(st, FIRST, 0);
  else if(st.screen==="choice") h = bridgePage(st, CHOICE_SVC, ORDER.indexOf(CHOICE_SVC));
  else if(st.screen==="list") h = listPage(st);
  else if(st.screen==="done") h = donePage();
  else h = servicesHome({services: tillServices(st), products: PRODUCTS_SEEDED, regClosed: true, ring: 0, tooltip: true});
  return `<div class="x">${h}</div>`;
}

/* typing the empty boxes of the list, one after the other ("Sig." on the keyboard moves to the next box) */
function typeBoxes(st, E){
  let at = 0;
  PLAIN_EMPTY.forEach(s => {
    const digits = typedOf(ownPrice(s.id));
    E.after(at, () => { st.focus = s.id; st.typed[s.id] = ""; });
    for(let k = 1; k <= digits.length; k++){ const part = digits.slice(0, k); E.after(at + 120 + k*110, () => { st.typed[s.id] = part.replace(DECMARK, "."); }); }
    at += 160 + digits.length*110 + 250;
  });
  E.after(at, () => { st.focus = null; });
}

  steps.push(
    {beat:3, hint:TAP+t("bridge_comes_title"), target:'[data-t="comes"]', tap(st){ st.sheet = true; }},
    {beat:3, hint:TAP+t("opt_done"), target:'[data-t="sheet-done"]', wait:1.6, tap(st){ st.sheet = false; }},

  steps.push(
    {beat:5, hint:TAP+t("guide_finish"), target:'[data-t="finish"]', tap(st){ st.screen = "done"; }},
    {beat:6, hint:TAP+t("bridge_done_cta"), target:'[data-t="to-till"]', tap(st){ st.screen = "till"; }});
} else {
  if(PLAIN_EMPTY.length) steps.push({beat:2, hint:H("Toca el precio de ","Toque no preço de ","Tap the price of ")+PLAIN_EMPTY[0].name, target:`[data-t="box-${PLAIN_EMPTY[0].id}"]`, tap(st,E){ typeBoxes(st, E); }});
  if(CHOICE_SVC){
    const own = offered(CHOICE_SVC.id).choices;
    steps.push(
      {beat:3, hint:TAP+CHOICE_SVC.name, target:`[data-t="row-${CHOICE_SVC.id}"]`, tap(st){ st.screen = "choice"; st.fromList = true; st.choiceTyped = {}; }},
      {beat:4, hint:H("Toca el precio de ","Toque no preço de ","Tap the price of ")+CHOICE_SVC.choices[0].name, target:'.chc .pbox', tap(st,E){
        let at = 0;
        own.forEach((c, i) => { const d = typedOf(c.price);
          E.after(at, () => { st.chFocus = i; st.choiceTyped[i] = ""; });
          for(let k = 1; k <= d.length; k++){ const part = d.slice(0, k); E.after(at + 120 + k*110, () => { st.choiceTyped[i] = part.replace(DECMARK, "."); }); }

  }
  steps.push({beat:5, hint:TAP+t("guide_finish"), target:'[data-t="finish"]', tap(st){ st.screen = "done"; }});
}

} : {

  pt:["Toque no seu ofício: "+TRADE,"Marque os populares e tire o que você não faz","Digite o preço; se cobra no caixa, deixe vazio","Tem opções? Abra o serviço","Cada opção com seu preço. Volte","Toque em Concluir: seus serviços estão prontos","Já pode cobrar: altere com Editar","Assim seu negócio fica pronto com o Platata."],

};
VKIT.start(V, {
