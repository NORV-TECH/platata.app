   type (sync/ServicesLibrarySplit.kt): with "Todos" picked the grid is A-Z, not the setup's order */
const byName = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
const SERVICES = C.services.slice().sort(byName), PRODUCTS = C.products.slice().sort(byName);

/* the price a tile prints (ProductCard.kt:103-123 at 37db6d6c): ASK -> "En la caja" (bridge_mode_ask); no price -> "Sin precio";
   FROM -> "Desde" (items_price_from_only) on its OWN small line + the amount of the LOWEST priced choice (R2-1 item 9,
   ProductLibraryView.kt:341-346 ServicesMenuRule.shownPrice; the kit's s.price is that lowest); FIXED -> the price.
   Returns {from, amt}. */
function tilePrice(s){
  if(s.mode === "ask") return {from:false, amt:S("bridge_mode_ask")};
  if(s.price == null || !(s.price > 0)) return {from:false, amt:S("items_price_unset")};
  return {from: s.mode === "from", amt: money(s.price)};
}

   bodyLarge Bold with the tile's WHOLE width (ShrinkToFitText, floor 8 sp for a FROM price, else 12 sp), then the minutes on
   their own line (bodySmall; the stored Duración first, ServiceTileFacts.kt ServiceDuration.minutes, item 17 = the kit's s.min);
   the combo pill in the free TOP-RIGHT corner, SumaComboGreen #10B981, on a service tile only the number "−10%" (R2-1 item 46,
   ProductCard.kt:241-249) */
function svcTile(s, o){ o = o || {};
  const pillTxt = o.combo ? `−${o.combo}%` : "", tp = tilePrice(s);
  return `<div class="sv-tile${o.hl?" hl":""}" data-t="tile-${s.id}"><span class="icb" style="background:${TRADE_TILE[V.biz]}">${TRADE_SVG[V.biz]}</span>

/* the service's option sets, as the setup writes them (GuideActions.ensureResearchedOptions + ui/ResearchedOptionStates.kt): every
   "Lo que trae" (INCLUIDO) and every "Cobra más" (AGREGAR) is ITS OWN set, displayName = its name, one value with the same name;
   an included one rides at 0 (switch ON), a priced add-on is OFF, an add-on with no price asks at the till, a per-unit one says "por …" */
function optionSets(s){
  return s.included.map(x => ({name:x.name, price:0, inc:true})).concat(s.extras.map(x => ({name:x.name, price:x.price, per:x.per, ask:x.price == null})));
}
function optRowText(set){
  if(set.inc) return set.name;
  if(set.ask) return `${set.name} · ${S("opt_ask_at_till_row")}`;
  if(set.per) return `${set.name} · ` + F("opt_per_unit_each", money(set.price), set.per);
  return `${set.name} · +${money(set.price)}`;
}
/* o = {base (the line price), deal (show "Agregar combo"), scroll, addTag, dealTag} */
function optSheet(s, o){ o = o || {};
  const sets = optionSets(s);
  // R2-1 item 27 (OptionSelectionSheet.kt:219-229, optionHeaderShown :449-451): each researched set holds ONE value named like
  // the set, so no header is drawn above its switch row
  const body = sets.map(set => `<div class="os-r"><span>${esc(optRowText(set))}</span>${sw(!!set.inc)}</div><hr>`).join("");
  const total = o.base;
  const add = `<div class="sv-btn pri" data-t="${o.addTag||"opt-add"}">${esc(total ? F("opt_add_to_sale", money(total)) : S("common_add"))}</div>`;
  const deal = o.deal ? `<div class="sv-btn sec" data-t="${o.dealTag||"opt-deal"}">${esc(S("deal_choice_add_deal"))}</div>` : "";
  return `<div class="sv-scrim"></div><div class="sv-sheet"><i class="hd"></i><div class="sc"><div class="in" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <h3>${esc(s.name)}</h3>${body}${add}${deal}</div></div></div>`; }
