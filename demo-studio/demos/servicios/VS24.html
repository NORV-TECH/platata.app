/* the page scrolls so an element sits fully on screen (a scroll the app would let the owner do; not an app behaviour) */
function scrollFor(sel, pageSel){
  const el = document.querySelector('#app ' + sel), pg = document.querySelector('#app ' + (pageSel || '.spage')); if(!el || !pg) return 0;
  const u = document.getElementById('screen').getBoundingClientRect().width / 412;
  const over = el.getBoundingClientRect().bottom - pg.getBoundingClientRect().bottom + 16 * u;
  return over > 0 ? Math.ceil(over / u) : 0;
}
/* demo plumbing only (not an app screen): each tap keeps the engine "busy" until 0.45 s after its last scheduled change */
function settled(steps){
  return steps.map(s => Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms||45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, ()=>{});
  }}));
}

    {beat:3, wait:0.6, hint:P({es:"Toca Clientes",pt:"Toque em Clientes",en:"Tap Clients"}), target:'[data-t="cust"]', tap(st){ st.cust=true; }},
    {beat:4, hint:P({es:"Toca Crear sucursal",pt:"Toque em Criar filial",en:"Tap Create Branch"}), target:'[data-t="create"]', tap(st,E){ st.creating=true;
        E.after(1600,()=>{ st.creating=false; st.made=true; st.on="branch"; st.screen="home"; }); }},
    {beat:5, wait:1.0, hint:P({es:"Toca Mi negocio",pt:"Toque em Meu negócio",en:"Tap My business"}), target:'[data-t="flag"]', tap(st){ st.screen="panel"; }},
    {beat:5, wait:1.0, hint:P({es:"Toca el nombre de la sucursal",pt:"Toque no nome da filial",en:"Tap the branch name"}), target:'[data-t="pname"]', tap(st){ st.screen="list"; }},
    {beat:5, wait:1.0, hint:P({es:"Toca "+OTHER.place,pt:"Toque em "+OTHER.place,en:"Tap "+OTHER.place}), target:'[data-t="biz-other"]', tap(st,E){
        E.after(400,()=>{ st.on="other"; st.screen="home"; st.toast=T("workspace_now_in", OTHER.place); });
        E.after(2800,()=>{ st.toast=""; }); }}
  ])
});
watchTiles();
</script>
