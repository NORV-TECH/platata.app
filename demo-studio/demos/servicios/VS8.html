   - every sale is charged on the owner's phone (one register), so Order.employeeName = the owner (CheckoutActions.kt:395);
   - a sale whose kit "by" is a staff member came from a booking that picked "¿Quién lo hace?" (DBSVC-1, item 21): it carries
     performerName = that person (Order.kt:320) and its scheduledFor = the booking's 15-minute slot (WhenPicker.kt:47-49);
     a sale done by the owner is a walk-in (no booking, no performer);
   - sale numbers are the sales in time order (1, 2, 3 ...);

const addDaysIso = (iso, n) => isoOf(new Date(dateAt(iso).getTime() + n*86400000 + 3600000));
/* ui/screens/services/WhenPicker.kt:76 fmtTimeCO ("3:00 p. m." es, "3:00 PM" en, "15:00" pt) and :183 dayLabelText */
function fmtTimeCO(mins){ const h = Math.floor(mins/60), m = mins%60, mm = pad2(m);
  if(L==="es") return `${h%12===0?12:h%12}:${mm} ${h<12?"a. m.":"p. m."}`;
  if(L==="en") return `${h%12===0?12:h%12}:${mm} ${h<12?"AM":"PM"}`;
  return `${h}:${mm}`; }
const DOW = {es:["dom","lun","mar","mié","jue","vie","sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], pt:["dom","seg","ter","qua","qui","sex","sáb"]}[L];
const MON = {es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],
  en:["January","February","March","April","May","June","July","August","September","October","November","December"],
  pt:["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"]}[L];
function dayLabel(iso){
  if(iso === TODAY_ISO) return S("cal_today");
  if(iso === addDaysIso(TODAY_ISO, 1)) return S("cal_tomorrow");
  const d = dateAt(iso), dow = DOW[d.getDay()], ab = MON[d.getMonth()].slice(0,3);
  if(L==="es") return `${dow} ${d.getDate()} de ${ab}`;
  if(L==="en") return `${dow} ${d.getDate()} ${ab}`;
  return `${dow} ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
}

/* ---------- the payment methods of the kit's sales (localizedPaymentMethod, utils/PaymentMethodLabels.kt:96-110) ----------
   cash / qr (Pix in Brazil) / card are the built-in rows; "transfer" (and the kit's Brazilian "other") is the one method the

const PAYKEY = p => p==="other" ? "transfer" : p;
const PAYNAME = p => ({cash:S("payment_method_cash"), qr:(C.pay.qr==="pix"?"Pix":S("payment_method_qr")), card:S("payment_method_card"),
  transfer:S("pay_methods_example_transfer")})[PAYKEY(p)];

/* services-data.js:247-249 rng + hash, copied: the early days are made with the kit's own rules */
function rng(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hash = s => { let h = 2166136261; for(const c of s){ h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; };
const hm = m => pad2(Math.floor(m/60)) + ":" + pad2(m%60);
function earlySales(){
  const first = C.sales.length ? C.sales[0].d : TODAY_ISO, out = [];
  const R = rng(hash(CC + V.biz + "-early"));
  const workers = [OWNER].concat(C.staff.map(s => s.name));
  const perDay = {peluqueria:[7,13], veterinaria:[6,10], "taller-motos":[5,9], unas:[4,7]}[V.biz];
  const payKinds = () => { const r = R();
    if(K.pay.qr === "pix") return r < .45 ? "cash" : r < .85 ? "qr" : r < .95 ? "transfer" : "other";
    if(K.pay.card) return r < .55 ? "cash" : r < .75 ? "card" : r < .9 ? "qr" : "transfer";
    return r < .6 ? "cash" : r < .85 ? "qr" : "transfer"; };
  const sv = C.services, pr = C.products, cl = C.clients;
  const pickService = () => sv[Math.min(sv.length - 1, Math.floor(Math.pow(R(), 1.6) * sv.length))];
  const lineOf = s => { let choice = null, price = s.price, min = s.min;
    if(s.choices.length){ const ok = s.choices.map((c, i) => [c, i]).filter(x => x[0].price != null);
      if(ok.length){ const [c, i] = ok[Math.floor(R() * Math.min(ok.length, 3))]; choice = i; price = c.price; min = c.min || min; } }
    return { sid: s.id, name: s.name, choice, qty: 1, price: price || 0, min }; };
  for(let d = "2026-09-01"; d < first; d = addDaysIso(d, 1)){

  else if(DIAL==="54" && national.length===11 && national.startsWith("911")) body = "9 11 "+national.slice(3,7)+"-"+national.slice(7);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[national.length], g = []; let rest = national;
    if(sizes) sizes.forEach(n => { g.push(rest.slice(0,n)); rest = rest.slice(n); }); else { while(rest.length>4){ g.push(rest.slice(0,3)); rest = rest.slice(3); } if(rest) g.push(rest); }

/* ---------- the sale screen (TransactionsScreen.kt:868-1290 ReceiptDetailContent, inside ReceiptDialog :1358, full screen) ----------
   title: appointmentDetailTitle (:106) for a sale that came from a booking ("mié 21 de oct · 5:00 p. m."), else tx_sale_title;
   subtitle formattedTimestamp (Order.kt:378, DateFormat MEDIUM+SHORT); action StatusBadge; SaleActionRow (WhatsApp #25D366, or
   "Mensaje" in US/CA; Print only with a receipt printer; Compartir); tx_employee; tx_customer; ReceiptPaperCard = the text
   ReceiptFormatter.generatePastPlainTextReceipt (utils/ReceiptFormatter.kt:343-470) builds; OUTLINED red Devolver while the sale
   is refundable; the void link only inside the open shift (a sale of an earlier day has none). */
function saleTitle(o){ return o.sched ? `${dayLabel(isoOf(o.sched))} · ${fmtTimeCO(minsOf(o.sched))}` : F("tx_sale_title", o.id); }
function receiptText(o){
  const RL = "=".repeat(31), DL = "-".repeat(31);
  const date = (US_CA ? `${pad2(o.ts.getMonth()+1)}/${pad2(o.ts.getDate())}/${o.ts.getFullYear()}` : `${pad2(o.ts.getDate())}/${pad2(o.ts.getMonth()+1)}/${o.ts.getFullYear()}`) + ` ${pad2(o.ts.getHours())}:${pad2(o.ts.getMinutes())}`;
  const out = [C.place, S("receipt_label_order_number") + o.id, `${S("receipt_label_date")}: ${date}`, RL];
  o.lines.forEach(l => { out.push(`${l.qty}x ${l.stored}`); out.push(`   @ ${money(l.price)} ${S("receipt_label_each")} ... ${money(l.price*l.qty)}`); });
  out.push(DL, `${S("receipt_label_subtotal")}: ${money(o.total)}`);
  out.push(S("where_mode_local"));            // SVC-4 item 43: the where mode prints even when it cost nothing (ReceiptFormatter.kt:90-102)
  out.push(RL, `${S("receipt_label_total")}: ${money(o.total)}`);
  if(o.refunded > 0){ out.push(`${S("tx_refunded_label")}: -${money(o.refunded)}`, `${S("tx_net_after_refund")}: ${money(o.total - o.refunded)}`); }
  if(o.performer) out.push(`${S("receipt_label_performer")}: ${o.performer}`);
  out.push(PAYNAME(o.pay), "", S("receipt_footer_default"));   // receipt_footer_default: written in the shop's language at creation (ReceiptFooterSeed.kt)
  return out.join("\n");
}
function saleScreen(o, st){ st=st||{};
  const refundable = isSale(o.status) && o.status !== "FULLY_REFUNDED";
  const banner = st.banner ? `<div class="vs-okb${st.flash?" new":""}"><span>${esc(F("refund_done_banner", money(st.banner)))}</span>${I.close}</div>` : "";

/* ---------- Reports (ui/screens/reports/ReportsScreen.kt:44-560) ----------
   SumaTopBar reports_title; pinned FilterChip row (RangeSelector :567); periodLabel (:598) bodySmall; the chart (ReportsSalesChart.kt,
   190 dp, bars #007AFF 12 dp, two grid lines, y labels abbreviateAxis, x labels chartLabelIndices); the table card (:228-397:
   Gross; Discounts; Refunds (N); Net sales + NetSalesWords.noteRes + ComparisonLine; the charge / tax / tip lines only when > 0;
   Total collected; Number of sales + ComparisonLine; services only: "Citas sin asistir" when > 0 (:378, DBSVC-1); Average sale);
   ReportBreakdownList cards (sorted, 8 rows + "Otros"): Cómo te pagaron (+ after refunds), Ventas de artículos por categoría,
   [Ventas por lugar: needs 2+ ways of working], Servicios con más ingresos (services title, 10 rows, "N vendidos"),
   Ventas por empleado (owner only, plural "N ventas"); bottom button reports_send_to_accountant (owner). LEVEL_2: support strip. */
const PRESETS = ["today","yesterday","this_week","this_month","last_month","this_year","last_year","custom"];
const DAYMS = 86400000;
const startOfWeekMon = d => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; };
/* data/ReportRange.kt forPreset + previous(): Today runs to the end of the day and compares with yesterday up to now;
   This week / This month run to now and compare with the same slice before; Last month compares with the month before */
function rangeOf(key){
  const t0 = dateAt(TODAY_ISO);
  if(key==="today") return {key, unit:"hour", a:t0, b:new Date(t0.getTime()+DAYMS), pa:new Date(t0.getTime()-DAYMS), pb:new Date(NOW.getTime()-DAYMS),
    label:F("reports_period_label_dated", S("reports_period_today"), `${t0.getDate()} ${shortMon(t0)}`), cmp:"reports_compare_vs_yesterday"};
  if(key==="this_week"){ const a = startOfWeekMon(NOW), el = NOW - a; return {key, unit:"day", a, b:NOW, pa:new Date(a.getTime()-7*DAYMS), pb:new Date(a.getTime()-7*DAYMS+el),
    label:`${a.getDate()}–${NOW.getDate()} ${shortMon(NOW)}`, cmp:"reports_compare_vs_last_week"}; }
  if(key==="last_month"){ const a = new Date(2026,8,1), b = new Date(2026,9,1);
    const mn = new Intl.DateTimeFormat(L==="pt"?"pt-BR":L==="es"?"es":"en", {month:"long"}).format(a);
    return {key, unit:"day", a, b, pa:new Date(2026,7,1), pb:a, label:mn[0].toUpperCase()+mn.slice(1), cmp:"reports_compare_vs_previous"}; }
  throw new Error("range "+key);
}
/* SimpleDateFormat "MMM" in the app's language (Java short month: "oct", "out", "Oct") */
const shortMon = d => { const s = new Intl.DateTimeFormat(L==="pt"?"pt-BR":L==="es"?"es":"en", {month:"short"}).format(d).replace(/\.$/,""); return s; };
/* data/ReportChartData.kt buildChartBuckets: a column is that bucket's Net sales; empty HOURS before the first and after the last
   sale are trimmed; empty days are kept */
function buckets(rg, sales){
  const rows = counted(inRange(sales, rg.a, rg.b)).map(o => ({ts:o.ts, net:moneyOf(o).net}));
  const out = [];
  if(rg.unit==="hour"){ for(let h = 0; h < 24; h++){ const s = new Date(rg.a.getTime()+h*3600000); out.push({s, v:rows.filter(r => r.ts.getHours()===h).reduce((a,r)=>a+r.net,0)}); }
    const f = out.findIndex(x => x.v > 0), l = out.length - 1 - out.slice().reverse().findIndex(x => x.v > 0);
    return f < 0 ? [] : out.slice(f, l+1); }
  for(let d = new Date(rg.a); d < rg.b; d = new Date(d.getFullYear(), d.getMonth(), d.getDate()+1)){ const iso = isoOf(d); out.push({s:d, v:rows.filter(r => isoOf(r.ts)===iso).reduce((a,r)=>a+r.net,0)}); }
  return out;
}
/* ReportsSalesChart.kt:287 abbreviateAxis; the million's decimal uses the currency's mark (decimalSeparatorFor) */
const COMMA_CUR = ["COP","CLP","ARS","BRL"].includes(K.cur);
function abbr(v){ const a = Math.abs(v);
  if(a >= 1e6){ const m = Math.round(v/1e5)/10; return (m%1===0 ? String(m) : String(m).replace(".", COMMA_CUR?",":"."))+"M"; }
  if(a >= 1e3) return Math.round(v/1e3)+"k"; return String(Math.trunc(v)); }
/* ReportsChartLabels.kt chartLabelIndices: the smallest step whose labels keep >= 8 dp apart; the last label always shows */
function labelIdx(n, plotW, gutter, wOf){
  if(n <= 1) return [0];
  const slot = plotW/n, total = gutter + plotW, last = n-1, minGap = 8;
  const left = i => Math.min(Math.max(gutter + slot*i + slot/2 - wOf(i)/2, 0), Math.max(total - wOf(i), 0));
  const roomed = (a,b) => left(b) - (left(a) + wOf(a)) >= minGap;
  for(let step = 1; step < n; step++){ const pk = []; for(let i = 0; i < last; i += step) pk.push(i);
    while(pk.length > 1 && !roomed(pk[pk.length-1], last)) pk.pop(); pk.push(last);
    if(pk.every((x,j) => j===0 || roomed(pk[j-1], x))) return pk; }
  return [0, last];
}
function chart(rg, sales, sel){
  const bs = buckets(rg, sales);
  if(!bs.length) return `<div class="rp-empty">${esc(S("reports_no_data"))}</div>`;
  const max = Math.max(...bs.map(b => b.v)), n = bs.length;
  const lab = b => rg.unit==="hour" ? `${b.s.getHours()}h` : String(b.s.getDate());          // reports_chart_axis_hour "H'h'", _day "d"
  const top = abbr(max), gutter = Math.max(top.length, 1)*6.2 + 8, plotW = 412 - 32 - gutter;
  const shown = new Set(labelIdx(n, plotW, gutter, i => lab(bs[i]).length*6.2));
  const mark = b => rg.unit==="hour" ? `${pad2(b.s.getHours())}:00` : `${DOW[b.s.getDay()]} ${b.s.getDate()} ${shortMon(b.s)}`;   // reports_chart_marker_hour / _day
  const bars = bs.map((b,i) => `<div class="slot"${b.tag?"":""} data-t="bar-${i}"><i style="height:${max>0?b.v/max*100:0}%"></i>${shown.has(i)?`<em>${esc(lab(b))}</em>`:""}${sel===i?`<s></s><u>${esc(mark(b))}<br>${money(b.v)}</u>`:""}</div>`).join("");
  return `<div class="rp-cht"><div class="ax" style="width:calc(var(--u)*${gutter-8})"><span>${top}</span><span>0</span></div><div class="plot"><hr class="t"><hr class="b">${bars}</div></div>`;
}
const tallest = (rg, sales) => { const bs = buckets(rg, sales); return bs.reduce((m,b,i,a) => b.v > a[m].v ? i : m, 0); };
const sumLine = (lab, val, o) => { o=o||{}; return `<div class="sl${o.tap?" tap":""}${o.red?" red":""}"${o.tag?` data-t="${o.tag}"`:""}><span>${esc(lab)}</span><b>${esc(val)}</b>${o.tap?I.chev:""}</div>`; };
const headLine = (lab, val, inner, tag) => `<div class="hm"${tag?` data-t="${tag}"`:""}><div><span>${esc(lab)}</span><b>${esc(val)}</b></div>${inner||""}</div>`;
/* ComparisonLine (ReportsScreen.kt:655): nothing against a zero baseline; ▲ green SumaSafeGreen / ▼ red, "N%  vs ..." */
const cmpLine = (cur, prev, key) => { if(!(prev > 0)) return ""; const p = Math.round((cur-prev)/prev*100);
  return `<div class="cmp${p<0?" dn":p===0?" eq":""}">${p>0?"▲":p<0?"▼":"—"}${p===0?"":` ${Math.abs(p)}%`}  ${esc(S(key))}</div>`; };
function reportTable(rg, sales, noShows){
  const cur = inRange(sales, rg.a, rg.b), prev = inRange(sales, rg.pa, rg.pb);
  const b = breakdown(cur), pb = breakdown(prev);
  const avg = b.count ? b.net/b.count : null, pavg = pb.count ? pb.net/pb.count : 0;
  return `<div class="rp-card">
    ${sumLine(S("reports_gross_sales"), money(b.gross))}
    ${sumLine(S("reports_discounts"), b.discounts>0 ? "-"+money(b.discounts) : money(0), {tap:b.discounts>0})}
    ${sumLine(F("refunds_with_count", b.refundCount), b.refunds>0 ? "-"+money(b.refunds) : money(0), {tap:b.refunds>0, red:b.refunds>0, tag:"line-refunds"})}
    <hr>
    ${headLine(S("reports_net_sales"), money(b.net), `<small>${esc(S((US_CA || C.pay.card==="stripe") ? "reports_net_sales_note" : "reports_net_sales_note_no_tips"))}</small>${cmpLine(b.net, pb.net, rg.cmp)}`, "net")}
    ${b.service>1e-9 ? sumLine(S("reports_service_charges_services"), "+"+money(b.service), {tap:true}) : ""}
    ${b.taxes>1e-9 ? sumLine(S("reports_taxes"), "+"+money(b.taxes), {tap:true}) : ""}
    ${b.tips>1e-9 ? sumLine(S("reports_tips"), "+"+money(b.tips), {tap:true}) : ""}
    <hr>
    ${headLine(S("reports_total_collected"), money(b.total))}
    <hr>
    ${headLine(S("reports_transactions"), String(b.count), cmpLine(b.count, pb.count, rg.cmp), "count")}
    ${noShows>0 ? `<div class="pr" data-t="no-shows"><span>${esc(S("reports_no_shows"))}</span><b>${noShows}</b></div>` : ""}
    <hr>
    ${headLine(S("reports_avg_ticket"), avg!=null ? money(avg) : S("reports_avg_ticket_empty"), cmpLine(avg||0, pavg, rg.cmp))}
  </div>`;
}
/* ReportBreakdownList.kt: sorted high to low, bars relative to the largest row; past maxRows the rest goes to "Otros" */
function blist(title, rows, o){ o=o||{};
  const sorted = rows.slice().sort((a,b) => b.v - a.v), max = o.max || 8;
  const disp = sorted.length > max ? sorted.slice(0,max).concat([{label:S("reports_breakdown_other"), v:sorted.slice(max).reduce((a,r)=>a+r.v,0)}]) : sorted;
  const top = Math.max(...disp.map(r => r.v), 0);

    ${disp.length ? disp.map((r,i) => `<div class="br"><div class="l"><span>${esc(r.label)}</span>${r.sec?`<small>${esc(r.sec)}</small>`:""}</div><b>${money(r.v)}</b></div><div class="trk"><i style="width:${top>0?Math.max(0,r.v)/top*100:0}%"></i></div>`).join("") : `<p class="nd">${esc(S("reports_no_data"))}</p>`}
  </div>`;
}

const YEST = addDaysIso(TODAY_ISO, -1);
function pickTarget(){
  for(let back = 1; back < 7; back++){
    const day = SALES.filter(s => s.d === addDaysIso(TODAY_ISO, -back) && s.pay === "cash");
    const svc = s => s.lines.every(l => !l.product);
    const tries = [s => !s.performer && s.client && svc(s), s => s.client && svc(s), s => !s.performer && svc(s), s => svc(s), s => true];
    for(const f of tries){ const r = day.filter(f); if(r.length) return r[r.length-1]; }
  }
  return SALES[SALES.length-1];
}
const SALE = pickTarget();
const SHIFT_START = shiftOpenedAt;                 // the owner opened the register at 8:00 today with the kit's opening cash
const LIST = () => SALES.filter(o => o.ts < NOW).slice().reverse();          // orderHistory, newest first
const ROW_DP = 65;
const TARGET_INDEX = LIST().findIndex(o => o.id === SALE.id);
const LIST_SCROLL = Math.max(0, (TARGET_INDEX - 3) * ROW_DP);

/* ---------- the services Ventas | Agenda screen ---------- */
function txHeader(tab){

    <div class="sx-search">${I.search}<span>${esc(S("sx_search"))}</span></div>`;
}
function agenda(){
  const days = {};
  C.bookings.forEach(b => { (days[b.d] = days[b.d] || []).push(b); });
  const rows = Object.keys(days).sort().map(d => `<div class="sx-day">${esc(dayLabel(d))}</div>` + days[d].map(b => {

    return `<div class="sx-row"><div class="lc"><b>${esc(S(V.isOrder ? "sx_order_ready" : "sx_comes"))}</b><small>${esc(dayLabel(b.d))}</small><small>${esc(fmtTimeCO(h*60+mi))}</small></div>

  if(st.pin!=null){ const k = ["1","2","3","4","5","6","7","8","9","","0","⌫"];
    h += `<div class="dlg-s"><div class="pind"><b>${esc(S("refund_pin_title"))}</b><small>${esc(S("refund_pin_subtitle"))}</small><small class="pw">${esc(S("refund_pin_where"))}</small>
      <div class="pdots">${[0,1,2,3].map(i => `<i class="${i<st.pin?"f":""}"></i>`).join("")}</div>
      <div class="pk">${k.map(x => x ? `<span data-t="pin-${x==="⌫"?"del":x}">${x==="⌫"?I.bksp:x}</span>` : `<em></em>`).join("")}</div><div class="pc">${esc(S("common_cancel"))}</div></div></div>`; }

/* ---------- the register (RegisterStatusScreen, one register: no tab row) ---------- */
function registerScreen(st){
  const shift = inRange(SALES, SHIFT_START, NOW).filter(o => isSale(o.status));
  const cashSales = shift.filter(o => o.pay === "cash").reduce((a,o) => a + o.total - o.refunded, 0);   // DRAWER_CASH_SALES_SUB
  const oldRefunds = SALE.status === "FULLY_REFUNDED" && SALE.ts < SHIFT_START ? SALE.refunded : 0;        // DRAWER_OLD_REFUNDS_SUB
  const expected = C.openingCash + cashSales - oldRefunds;
  const methods = {}; shift.forEach(o => { methods[o.pay] = (methods[o.pay] || 0) + o.total - o.refunded; });
  const order = ["cash","qr"].concat(Object.keys(methods).filter(k => k!=="cash" && k!=="qr").sort((a,b) => PAYNAME(a).localeCompare(PAYNAME(b))));
  const mrows = order.filter(k => methods[k] != null).map(k => `<div class="lr ms"><span>${esc(k==="cash" ? S("register_status_cash_all") : PAYNAME(k))}</span><span>${money(methods[k])}</span></div>
    <div class="lr ind"><span>${esc(OWNER)}</span><span>${money(methods[k])}</span></div>`).join("");
  const net = Object.values(methods).reduce((a,v) => a+v, 0);
  const nav_ = `<div class="navd"><span>${I.chevL}</span><b>${esc(F("register_nav_today", `${NOW.getDate()} ${shortMon(NOW)}`))}</b><span class="dim">${I.chevR}</span></div>`;
  return `<div class="vs-pg"><div class="vs-top"><span class="ib" data-t="reg-back">${I.back}</span><div class="tt">${nav_}</div><span class="tba">${esc(S("register_status_full_reports"))}</span></div>
    <div class="vs-scroll"><div class="in rg" style="transform:translateY(calc(var(--u)*${-(st.regScroll||0)}))">
    <div class="pillrow"><span class="spill">${esc(S("register_status_pill_open"))}</span></div>
    <div class="scard"><div class="lr"><span>${esc(S("register_status_opened_at"))}</span><span>${esc(fmtDT(SHIFT_START))}</span></div>
      <div class="lr"><span>${esc(S("register_status_opened_by"))}</span><span>${esc(OWNER)}</span></div></div>
    <div class="scard"><div class="lr"><span>${esc(S("register_status_starting_cash"))}</span><span>${money(C.openingCash)}</span></div>
      <div class="lr"><span>${esc(S("register_status_cash_sales_here"))}</span><span>${money(cashSales)}</span></div>
      ${oldRefunds>0?`<div class="lr${st.flash?" flash":""}" data-t="old-refunds"><span>${esc(S("register_close_old_refunds"))}</span><span>${money(-oldRefunds)}</span></div>`:""}
      <hr><div class="lr em${st.flash?" flash":""}"><span>${esc(S("register_status_expected"))}</span><span>${money(expected)}</span></div></div>
    ${btn(S("cash_movement_out"),"sec")}${btn(S("cash_movement_in"),"sec")}
    <div class="scard">${mrows}<hr><div class="lr em"><span>${esc(S("reports_total_collected"))}</span><span>${money(net)}</span></div></div>
    <div class="hist">${I.clock}<span>${esc(S("register_list_title"))}</span></div>
    ${btn(S("register_status_close_btn"),"sec")}<div style="height:calc(var(--u)*16)"></div>
    </div></div></div>` + strip();
}

function render(st){
  SALE.status = st.refunded ? "FULLY_REFUNDED" : "PAID"; SALE.refunded = st.refunded ? SALE.total : 0;   // the one sale this demo changes
  if(st.screen==="tx") return txScreen(st);
  if(st.screen==="sale") return saleScreen(SALE, {banner:st.banner, flash:st.flash, scroll:st.saleScroll});
  if(st.screen==="refund") return refundScreen(st);
  if(st.screen==="panel") return panel({});
  if(st.screen==="register") return registerScreen(st);
  return "";
}
