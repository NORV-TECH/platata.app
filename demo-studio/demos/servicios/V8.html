/* utils/WhatsappUtils.kt:132 formatWhatsappForReading */
function waRead(canon){
  const nat = canon.slice(DIAL.length);
  let body;
  if(DIAL==="1" && nat.length===10) body = "("+nat.slice(0,3)+") "+nat.slice(3,6)+"-"+nat.slice(6);
  else if(DIAL==="55" && nat.length>=10 && nat.length<=11) body = nat.slice(0,2)+" "+nat.slice(2,nat.length-4)+"-"+nat.slice(-4);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[nat.length]; const g=[]; let r=nat;
    if(sizes){ sizes.forEach(n=>{ g.push(r.slice(0,n)); r=r.slice(n); }); } else { while(r.length>4){ g.push(r.slice(0,3)); r=r.slice(3); } if(r) g.push(r); }
    body = g.join(" "); }
  return "+"+DIAL+" "+body;
}

function dayLabel(iso){
  if(iso === V.today) return S("cal_today");
  if(iso === SERV.isoAdd(V.today, 1)) return S("cal_tomorrow");
  const d = new Date(iso+"T12:00:00Z"), dow = DOW[d.getUTCDay()], day = d.getUTCDate(), mo = d.getUTCMonth();
  if(L==="es") return `${dow} ${day} de ${MONTHS[mo].slice(0,3)}`;
  if(L==="en") return `${dow} ${day} ${MONTHS[mo].slice(0,3)}`;
  return `${dow} ${String(day).padStart(2,"0")}/${String(mo+1).padStart(2,"0")}`;
}

const _cv = document.createElement("canvas").getContext("2d");

  const roboto = document.fonts && document.fonts.check(`${w} ${sp}px Roboto`);

  return base + (track||0)*t.length; };

function payScreen(o){
  const lines = o.lines, fee = o.fee||0, total = linesTotal(lines) + fee, due = cashDue(total);
  const whereAsk = o.where && o.where.modes.length >= 2, blocked = whereAsk && !o.where.picked;
  const keys = ["1","2","3","4","5","6","7","8","9",ZKEY,"0","⌫"];
  const exact = STRIPE_CARD ? S("cash_exact_short") : F("cash_exact", money(due));

  if(STRIPE_CARD) btns += `<div style="flex:1" class="nudge" data-t="card-setup"><span>+ ${esc(S("pay_card_short"))}</span><small>${esc(S("pay_card_setup_hint"))}</small></div>`;
  const rounding = Math.abs(due-total) > 1e-9 ? `<div class="x-round">${esc(F("cash_rounding_line", (due-total<0?"-":"+")+money(Math.abs(due-total))))}</div>` : "";

  if(whereAsk) sec += whereGate(o.where);                                                                                      // WhereGate above the customer field (:427-436)
  sec += `<div class="x-cust${o.customer?" on":""}">${I.person}${o.customer?`<b>${esc(o.customer)}</b><span class="xx">${I.close}</span>`:esc(S("checkout_add_customer_cta"))}</div>`;   // CheckoutCustomerField.kt:730
  return `<div class="x"><div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span>${o.ticket?"":`<span class="clr">${esc(S("checkout_clear"))}</span>`}</div><div class="grow"></div>

// KEYS: checkout_desglose_title,checkout_done,checkout_items_heading,checkout_details_header,common_subtotal,checkout_fee_remove,checkout_fee_rate_subtitle
/* title 19 sp bold + black "Listo" pill; ITEMS GroupCard (r16, 1.5 dp outlineVariant) of CheckoutItemRow (name bold, "+ <option>" per
   option incl. the included ones, the unit price grey, trash / qty / +); DETALLES card of ChargeRow (fees, then discounts in green with "−",
   a grey "Quitar" chip); the black total card (Subtotal, Total) */
function breakdown(o){
  const lines = o.lines, fees = o.fees||[], discs = o.discs||[];
  const sub = linesTotal(lines), total = sub + fees.reduce((a,f)=>a+f.amount,0) - discs.reduce((a,d)=>a+d.amount,0);
  const li = l => `<div class="li"><div><b>${esc(l.name)}</b>${(l.mods||[]).map(m=>`<small>+ ${esc(m.name)}</small>`).join("")}<small>${esc(money(lineUnit(l)))}</small></div>
    <span class="sb tr">${I.trash}</span><em>${l.qty}</em><span class="sb">${I.add}</span></div>`;
  const cr = (f, disc) => `<div class="cr"><div><b>${esc(f.name)}</b>${f.sub?`<small>${esc(f.sub)}</small>`:""}</div><span class="${disc?"g":""}">${disc?"− ":""}${esc(money(f.amount))}</span><em>${esc(S("checkout_fee_remove"))}</em></div>`;
  const details = fees.map(f=>cr(f,false)).concat(discs.map(d=>cr(d,true)));
  return `<div class="x-bd"><div class="hd"><b>${esc(S("checkout_desglose_title"))}</b><span data-t="bd-done">${esc(S("checkout_done"))}</span></div>
    <div class="sc"><div class="sh">${esc(S("checkout_items_heading"))}</div><div class="gc">${lines.map(li).join("<i></i>")}</div>
    ${details.length?`<div class="sh">${esc(S("checkout_details_header"))}</div><div class="gc">${details.join("<i></i>")}</div>`:""}</div>
    <div class="ft"><div class="s"><span>${esc(S("common_subtotal"))}</span><span>${esc(money(sub))}</span></div><i></i>
    <div class="t"><b>${esc(S("common_total"))}</b><strong>${esc(money(total))}</strong></div></div></div>`;
}

// KEYS: receipt_label_order_number,receipt_label_date,receipt_label_each,receipt_label_subtotal,receipt_label_total,receipt_label_discount,receipt_label_change_due,receipt_label_performer,common_included,payment_method_cash,receipt_footer_default,receipt_dlg_title,common_send
/* the receipt the shop keeps and sends, built from the stored sale: ReceiptFormatter.kt:343 generatePastPlainTextReceipt (Detallado).
   Lines: name (SaleLineName.of), "@ $x c/u ... $y", the paid options "+ x", the included ones "x (Incluido)" (SVC-4 item 45);
   Subtotal; the fees by name ("A domicilio: $ 10.000"); the way of working when it cost nothing (whereModeLine :90, SVC-4 item 43:
   a single-mode shop's sale is stored "En el local", CartActions.kt:726, and prints it); TOTAL; "Atendió: <name>" (DBSVC-1 item 21);
   the change when there was some; the tender; the shop's footer (receipt_footer_default, written at creation). */
function receiptText(o){
  const lines = o.lines, fees = o.fees||[], sub = linesTotal(lines);
  const total = sub + fees.reduce((a,f)=>a+f.amount,0) - (o.discount||0);
  let s = `${C.place}\n${S("receipt_label_order_number")}${SALE_NO}\n${S("receipt_label_date")}: ${receiptDate(o.time)}\n===============================\n`;
  lines.forEach(l => { const u = lineUnit(l);
    s += `${l.qty}x ${storedName(l)}\n   @ ${money(u)} ${S("receipt_label_each")} ... ${money(u*l.qty)}\n`;
    (l.mods||[]).filter(m=>!m.inc).forEach(m => { s += `   + ${m.name}\n`; });
    (l.mods||[]).filter(m=>m.inc).forEach(m => { s += `   ${m.name} (${S("common_included")})\n`; }); });
  s += `-------------------------------\n${S("receipt_label_subtotal")}: ${money(sub)}\n`;
  if(o.discount) s += `${S("receipt_label_discount")}: -${money(o.discount)}\n`;
  fees.forEach(f => { s += `${f.name}: ${money(f.amount)}\n`; });
  if(!fees.length) s += `${S("where_mode_local")}\n`;
  s += `===============================\n${S("receipt_label_total")}: ${money(total)}\n`;
  if(o.performer) s += `${S("receipt_label_performer")}: ${o.performer}\n`;
  if(o.change) s += `${S("receipt_label_change_due")}: ${money(o.change)}\n`;
  s += `${S("payment_method_cash")}\n\n${S("receipt_footer_default")}`;
  return s;
}
