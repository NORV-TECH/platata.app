/* V9 "Reservas en línea" — a customer books a service on the shop's own web page; the booking lands on the owner's phone.
   App sim/usa-canada 37db6d6c (paths under app/src/main/java/com/example/, web page under public/store/, server under functions*).
   Story: the customer's phone (a web browser) opens the shop's booking page at OnlineStoreSlug.HOST/<slug>
   (sync/OnlineStoreSlug.kt:22,86-107: the shop name + a word the owner typed, here the city) and sees the shop's SERVICES
   (functions/storefront-projection.js:184-203,283-301: on a SERVICES shop every SERVICE item is bookable, "En la caja" too
   since REVFIX-14; priceMode, the service's minutes from settings.serviceMinutes, the included items as text). A tap on a
   service with no add-ons goes straight to "¿Cuándo?" (app.js:383-396), a day and a time (app.js:397-458: one day at a time,
   21 days, times sooner than one hour dashed), the name and the mobile (WhatsApp) number (the country code already
   written, logic.js:278-281) -> "Reservar <day> <time>" -> "Reserva solicitada" with the 6-letter code (app.js:968-977;
   the code = the order id's first 6 hex, functions-public/index.js:329 = OnlineOrder.shortCode, sync/OnlineOrder.kt:28).
   NOTHING is charged online, in any country: a SERVICES shop's page pays at the shop only (functions/online-store-rules.js:51,
   sync/OnlineStoreRules.kt:47-50; the server refuses a card on a booking, functions-public/index.js:212). So no card online in
   Colombia (Wompi) or Brazil, and none in Mexico either (CardCountryGate.forOnlineStore, sync/CardCountryGate.kt:44-45).
   The booking is a PENDING open ticket with scheduledFor (functions-public/index.js:282-326). The owner's phone (Platata open)
   rings "Nueva reserva en línea · <day> · <time>" / "<name> · 1 servicio · #<code>" (ui/pos/OnlineOrderAlerts.kt:139-176,
   R2-4 L4 the services plural), a tap opens the appointment page (ui/app/NavigationEventEffects.kt:59-68), which stops the
   alert (AppointmentDetailScreen.kt:97-102, SVC-3 item 44) and shows "EN LÍNEA · Reservada en línea: confirma la hora con
   el cliente" + a WhatsApp button that opens the client's own chat with the message written (:337-370, SVC-2 item 25,
   utils/AppointmentText.kt:84-99). Back: the Agenda row carries the EN LÍNEA tag (ServicesTransactionsScreen.kt:430-437).
   Business: Peluquería (?biz= works for the other three). Unlock (sync/StoreLockRule.kt, values conn_store_lock_body_services):
   outside US/Canada the booking page opens when a tablet or an employee phone uses an extra connection; the peluquería's two
   stylists have their phones connected, so one of them uses it. Said in the small print of the hop card, never in the voice. */
const V = VKIT.ctx({biz:"peluqueria"});
const C = V.C, esc = V.esc, LG = V.lang, CC = V.country;

/* app strings (values / values-es / values-pt-rBR at 37db6d6c) */
const STR = {"booking_when_arrive":{"en":"When are they coming?","es":"¿Cuándo viene?","pt":"Quando vem?"},"booking_for_who":{"en":"For who?","es":"¿Para quién?","pt":"Para quem?"},"booking_save":{"en":"Save","es":"Guardar","pt":"Salvar"},"sx_agenda":{"en":"Agenda","es":"Agenda","pt":"Agenda"},"sx_search":{"en":"By name or phone…","es":"Por nombre o teléfono…","pt":"Por nome ou telefone…"},"sx_comes":{"en":"Coming","es":"Viene","pt":"Vem"},"ax_cobrar":{"en":"Charge","es":"Cobrar","pt":"Cobrar"},"ax_no_show":{"en":"No-show","es":"No asistió","pt":"Não compareceu"},"ax_resched":{"en":"Reschedule","es":"Reprogramar","pt":"Reagendar"},"ax_cancel":{"en":"Cancel booking","es":"Cancelar cita","pt":"Cancelar agendamento"},"appt_wa_when":{"en":"on %1$s at %2$s","es":"el %1$s a las %2$s","pt":"%1$s, às %2$s"},"appt_wa_booked":{"en":"Hi %1$s, your %2$s at %3$s is %4$s (%5$s).","es":"Hola %1$s, tu %2$s en %3$s es %4$s (%5$s).","pt":"Olá %1$s, %3$s: %2$s é %4$s (%5$s)."},"appt_wa_appointment":{"en":"appointment","es":"cita","pt":"seu agendamento"},"tp_change":{"en":"Change","es":"Cambiar","pt":"Alterar"},"cal_today":{"en":"Today","es":"Hoy","pt":"Hoje"},"cal_tomorrow":{"en":"Tomorrow","es":"Mañana","pt":"Amanhã"},"agenda_service_with_dur":{"en":"%1$s · Takes %2$d min","es":"%1$s · Dura %2$d min","pt":"%1$s · Dura %2$d min"},"agenda_end_hint":{"en":"%1$s → %2$s · Takes %3$d min","es":"%1$s → %2$s · Dura %3$d min","pt":"%1$s → %2$s · Dura %3$d min"},"home_tab_services":{"en":"Services","es":"Servicios","pt":"Serviços"},"mamaship_tab_register":{"en":"Register","es":"Caja","pt":"Caixa"},"home_tab_my_business":{"en":"My business","es":"Mi negocio","pt":"Meu negócio"},"tx_tab_all":{"en":"Sales","es":"Ventas","pt":"Vendas"},"whatsapp_signature":{"en":"Made with Platata · platata.app","es":"Hecho con Platata · platata.app","pt":"Feito com Platata · platata.app"},"online_tag":{"en":"ONLINE","es":"EN LÍNEA","pt":"ONLINE"},"online_order_whatsapp":{"en":"WhatsApp","es":"WhatsApp","pt":"WhatsApp"},"online_alert_items_services":{"en":{"one":"%1$d service","other":"%1$d services"},"es":{"one":"%1$d servicio","other":"%1$d servicios"},"pt":{"one":"%1$d serviço","other":"%1$d serviços"}},"online_alert_booking_title":{"en":"New online booking · %1$s","es":"Nueva reserva en línea · %1$s","pt":"Nova reserva online · %1$s"},"online_booking_confirm":{"en":"Booked online: confirm the time with the customer","es":"Reservada en línea: confirma la hora con el cliente","pt":"Reservada online: confirme o horário com o cliente"},"conn_slot_phone":{"en":"Your phone","es":"Tu teléfono","pt":"Seu celular"},"conn_store_title_services":{"en":"Booking page","es":"Página de reservas","pt":"Página de reservas"},"conn_store_lock_body_services":{"en":"Your booking page opens when a tablet or an employee phone uses an extra connection. Customers book from a link you share.","es":"Tu página de reservas se abre cuando una tablet o un teléfono de empleado usa una conexión adicional. Tus clientes reservan desde un enlace que compartes.","pt":"Sua página de reservas abre quando um tablet ou um celular de funcionário usa uma conexão adicional. Seus clientes reservam por um link que você compartilha."},"conn_store_usa_body_services":{"en":"The booking page is included in your country. Share your link and take bookings.","es":"La página de reservas está incluida en tu país. Comparte tu enlace y reciben reservas.","pt":"A página de reservas está incluída no seu país. Compartilhe seu link e receba reservas."},"rp_strip_support":{"en":"Support","es":"Soporte","pt":"Suporte"},"rp_strip_support_sub":{"en":"Report a problem here","es":"Reporta un problema aquí","pt":"Relatar um problema aqui"},"rp_sheet_my_reports_none":{"en":"No reports yet","es":"Aún no hay reportes","pt":"Ainda não há relatos"},"rp_my_title":{"en":"My reports","es":"Mis reportes","pt":"Meus relatos"}};
/* the web page's words (public/store/strings.js at 37db6d6c), in the SHOP's language (logic.js:486-492) */
const WS = {"tab_services":{"es":"Servicios","pt":"Serviços","en":"Services"},"tab_products":{"es":"Productos","pt":"Produtos","en":"Products"},"shop_confirms":{"es":"El negocio te confirmará la hora.","pt":"O estabelecimento vai confirmar o horário.","en":"The shop will confirm your time."},"service_from":{"es":"Desde {amt}","pt":"A partir de {amt}","en":"From {amt}"},"service_ask":{"es":"Precio en el local","pt":"Preço no local","en":"Price at the shop"},"service_includes":{"es":"Incluye: {list}","pt":"Inclui: {list}","en":"Includes: {list}"},"when_title":{"es":"¿Cuándo?","pt":"Quando?","en":"When?"},"no_times":{"es":"No hay horas este día","pt":"Não há horários neste dia","en":"No times this day"},"who_books":{"es":"¿A nombre de quién?","pt":"Em nome de quem?","en":"Whose name is it under?"},"name":{"es":"Nombre","pt":"Nome","en":"Name"},"mobile":{"es":"Celular (con código de país)","pt":"Celular (com código do país)","en":"Mobile number (with country code)"},"note":{"es":"Nota","pt":"Observação","en":"Note"},"note_ph":{"es":"Algo que debamos saber","pt":"Algo que devemos saber","en":"Anything we should know"},"pay_at_shop":{"es":"Pagas en el negocio · {amt}","pt":"Você paga no estabelecimento · {amt}","en":"You pay at the shop · {amt}"},"pay_at_shop_ask":{"es":"Pago en el local","pt":"Pagamento no local","en":"Pay at the shop"},"pick_time":{"es":"Elige una hora","pt":"Escolha um horário","en":"Choose a time"},"book_at":{"es":"Reservar {d} {t}","pt":"Reservar {d} {t}","en":"Book {d} {t}"},"sending":{"es":"Enviando…","pt":"Enviando…","en":"Sending…"},"booking_requested":{"es":"Reserva solicitada","pt":"Reserva solicitada","en":"Booking requested"},"booking_label":{"es":"RESERVA","pt":"RESERVA","en":"BOOKING"},"new_booking":{"es":"Hacer otra reserva","pt":"Fazer outra reserva","en":"Book something else"},"back":{"es":"Volver","pt":"Voltar","en":"Back"}};
/* public/store/money.js:14-52 (generated from the till's formatCurrency): the page formats money by hand per country */
const MT = {"CO":{"digits":0,"decimalSep":",","groupSep":".","prefix":"$ ","suffix":""},"MX":{"digits":2,"decimalSep":".","groupSep":",","prefix":"$","suffix":""},"PE":{"digits":2,"decimalSep":".","groupSep":",","prefix":"S/ ","suffix":""},"CL":{"digits":0,"decimalSep":",","groupSep":".","prefix":"$","suffix":""},"EC":{"digits":2,"decimalSep":",","groupSep":".","prefix":"$","suffix":""},"AR":{"digits":2,"decimalSep":",","groupSep":".","prefix":"$ ","suffix":""},"PA":{"digits":2,"decimalSep":".","groupSep":",","prefix":"$","suffix":""},"BR":{"digits":2,"decimalSep":",","groupSep":".","prefix":"R$ ","suffix":""},"US":{"digits":2,"decimalSep":".","groupSep":",","prefix":"$","suffix":""},"CA":{"digits":2,"decimalSep":".","groupSep":",","prefix":"$","suffix":""}};

const fmtS = (s, a) => { let i = 0; return s.replace(/%(\d+)\$[sd]|%[sd]/g, (m, n) => { const v = n ? a[n-1] : a[i++]; return v == null ? "" : v; }); };
const t = (k, ...a) => { const o = STR[k]; if(!o) return "??"+k; return fmtS(o[LG] ?? o.es, a); };
const plCat = n => LG==="pt" ? ((n===0||n===1)?"one":"other") : (n===1?"one":"other");
const tp = (k, n, ...a) => { const p = STR[k][LG] || STR[k].es; return fmtS(p[plCat(n)] || p.other, a.length ? a : [n]); };
const w = (k, v) => { let s = (WS[k] && (WS[k][LG] ?? WS[k].es)) || k; if(v) for(const x of Object.keys(v)) s = s.split("{"+x+"}").join(String(v[x])); return s; };
const H = (es, pt, en) => V.pick({es, pt, en});
const money = v => V.money(v);
/* money.js format(): HALF_EVEN rounding is moot here (the prices are whole minor units) */
function webMoney(v){ const e = MT[CC] || MT.CO; const f = Number(v||0).toFixed(e.digits); let [i, d] = f.split(".");
  if(i.length >= 4) i = i.replace(/\B(?=(\d{3})+(?!\d))/g, e.groupSep);
  return e.prefix + i + (e.digits ? e.decimalSep + d : "") + e.suffix; }
const pad2 = n => n<10 ? "0"+n : ""+n;

/* ---------- days and times ---------- */
/* the demos' today: Thursday 22 Oct 2026, 12:41 (V.today) */
const [TY, TM, TD] = V.today.split("-").map(Number);
const dayUTC = off => new Date(Date.UTC(TY, TM-1, TD+off, 12));
const dow7 = off => { const d = dayUTC(off).getUTCDay(); return d===0 ? 7 : d; };          /* ISO weekday, 7 = Sunday */
const PL = LG === "pt" ? "pt" : LG;                                                       /* the page's own tag (pageLanguage slices to 2 letters) */
/* app.js:409-412 dayLabel: Intl short weekday + day, in the shop's language ("vie 23", "sex., 23") */
const webDay = off => new Intl.DateTimeFormat(PL, {weekday:"short", day:"numeric", timeZone:"UTC"}).format(dayUTC(off));
/* logic.js:393-397 formatClock: "14:00" (es/pt, two-digit hour), "2:00 PM" (en) */
const webClock = m => { const h = Math.floor(m/60), mm = pad2(m%60); return LG==="en" ? `${((h+11)%12)+1}:${mm} ${h<12?"AM":"PM"}` : `${pad2(h)}:${mm}`; };
/* the owner's phone: ui/screens/services/WhenPicker.kt:76-93 fmtTimeCO (es "2:00 p. m.", en "2:00 PM", pt "14:00") */
const fmtTime = m => { const h = Math.floor(m/60), mm = pad2(m%60);
  if(LG==="es") return `${h%12===0?12:h%12}:${mm} ${h<12?"a. m.":"p. m."}`;
  if(LG==="en") return `${h%12===0?12:h%12}:${mm} ${h<12?"AM":"PM"}`;
  return `${h}:${mm}`; };
/* WhenPicker.kt:183-200 dayLabelText: Hoy / Mañana, else es "sáb 24 de oct", en "Sat 24 Oct", pt "sáb 24/10" */
const DOW = {es:["dom","lun","mar","mié","jue","vie","sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], pt:["dom","seg","ter","qua","qui","sex","sáb"]}[LG];
const MON = {es:["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"], en:["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"], pt:["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"]}[LG];
function dayLabel(off){ if(off===0) return t("cal_today"); if(off===1) return t("cal_tomorrow");
  const d = dayUTC(off), dw = DOW[d.getUTCDay()], mon = MON[d.getUTCMonth()], dd = d.getUTCDate();
  if(LG==="es") return `${dw} ${dd} de ${mon}`; if(LG==="en") return `${dw} ${dd} ${mon}`; return `${dw} ${pad2(dd)}/${pad2(d.getUTCMonth()+1)}`; }
/* the alert's day: OnlineOrderAlerts.kt:131-136 SimpleDateFormat("EEE d", the phone's locale) · the phone's clock */
const ALOC = LG==="pt" ? "pt-BR" : LG;
const alertWhen = (off, m) => new Intl.DateTimeFormat(ALOC, {weekday:"short", timeZone:"UTC"}).format(dayUTC(off)) + " " + dayUTC(off).getUTCDate() + " · " + fmtTime(m);
/* utils/AppointmentText.kt:30-62: dayText = SimpleDateFormat("EEEE d", the SHOP's language), timeText "14:00" */
const waDay = off => new Intl.DateTimeFormat(ALOC, {weekday:"long", timeZone:"UTC"}).format(dayUTC(off)) + " " + dayUTC(off).getUTCDate();
const waTime = m => `${Math.floor(m/60)}:${pad2(m%60)}`;
const NOW = 12*60 + 41;

/* ---------- the shop's booking page (what the owner set in Vender en línea, the same set-up VS20 shows) ----------
   hours: every day 9:00–18:00 (SellOnline.kt:156-158 default, VS20 "Todos los días 9:00 – 18:00 · 20 min por cita").
   "Duración de la cita" (values sell_online_slot_title, OnlineStoreSettings.prepMinutes default 20) = doc.slotMinutes, the
   grid the SERVER checks (functions-public/index.js:231-238); the page's grid uses the service's own minutes (app.js:400-405). */
const OPEN = 540, CLOSE = 1080, SHOP_SLOT = 20;
const closedDay = off => false;
/* the services on the page, A-Z by name: the reference reads productDao.getAllProductsSync() (BranchSnapshotStore.kt:99) =
   "SELECT * FROM products ORDER BY name ASC" (PosDao.kt:353, SQLite BINARY), project() keeps that order into doc.services
   (storefront-projection.js:269-301) and viewServices draws it in order (app.js:379). Same order as VS20.
   A FROM service shows its FIRST stored choice ("Desde", storefront-projection.js:145-149,291): an app bug on the coder list,
   drawn as the app shows it today (the Brazil video waits for its fix). */
const byName = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0;      // ORDER BY name (SQLite BINARY)
const PAGE_SVCS = V.services.slice().sort(byName);
const pagePrice = s => s.mode==="ask" ? null : s.mode==="from" ? (s.choices[0] && s.choices[0].price) : s.price;
/* app.js:357-359 priceText ; :360-361 includesText */
const priceText = s => s.mode==="ask" ? w("service_ask") : s.mode==="from" ? w("service_from", {amt: webMoney(pagePrice(s))}) : webMoney(s.price);
const incText = s => s.included.length ? w("service_includes", {list: s.included.map(x => x.name).join(", ")}) : null;
/* the service this customer books: one with a single fixed price (peluquería: "Corte de caballero / hombre"); per business */
const PREF = {peluqueria:"corte-caballero", unas:"manicure-tradicional", veterinaria:"vacunacion", "taller-motos":"revision-gases"}[V.biz];
const SVC = PAGE_SVCS.find(s => s.id===PREF) || PAGE_SVCS.find(s => s.mode==="fixed") || PAGE_SVCS[0];
const SVC_PRICE = pagePrice(SVC) || 0;
/* the service's minutes: Product.durationMin seeded from the research (DBSVC-1), published as durationMin (REVFIX-14) */
const DUR = SVC.min || SHOP_SLOT;
/* app.js:397-408 daySlots: the grid of THIS service's minutes (online-store-hours.js slotFits: on the window's grid, ends by close) */
const slotsOf = off => { if(closedDay(off)) return []; const out = []; for(let s = OPEN; s + DUR <= CLOSE; s += DUR) out.push({start:s, soon: off===0 && s < NOW + 60}); return out; };
const DAY = 1;                                                  /* tomorrow, Friday 23 */
/* the time picked: 14:00 when the service's grid has it (it also sits on the shop's 20-min grid the server checks) */
const SLOT = (slotsOf(DAY).find(s => s.start===840) || slotsOf(DAY).find(s => s.start>=840 && (s.start-OPEN)%SHOP_SLOT===0) || slotsOf(DAY)[0]).start;
/* the customer: a client of the kit; she or he types the name and the WhatsApp number after the country code */
const CUST = C.clients[3];
const DIAL = {CO:"57",MX:"52",PE:"51",CL:"56",EC:"593",AR:"54",PA:"507",BR:"55",US:"1",CA:"1"}[CC];
const PREFILL = "+" + DIAL + " ";                                 /* logic.js:278-281 phonePrefill: "+57 " */
const custNational = (() => { let n = CUST.phone.replace(/\D/g, ""); if(CC==="EC") n = n.replace(/^0/, ""); if(CC==="AR") n = "9" + n; return n; })();
const TYPED_PHONE = CC==="AR" ? "9 " + CUST.phone : CC==="EC" ? CUST.phone.replace(/^0/, "") : CUST.phone;
const CANON = DIAL + custNational;
/* utils/WhatsappUtils.kt:132-162 formatWhatsappForReading (the Agenda row and the appointment page, R2-2 item 12) */
function waRead(canon){ const nat = canon.slice(DIAL.length); let body;
  if(DIAL==="1" && nat.length===10) body = `(${nat.slice(0,3)}) ${nat.slice(3,6)}-${nat.slice(6)}`;
  else if(DIAL==="55" && nat.length>=10 && nat.length<=11) body = nat.slice(0,2)+" "+nat.slice(2,nat.length-4)+"-"+nat.slice(-4);
  else if(DIAL==="54" && nat.length===11 && nat.startsWith("911")) body = "9 11 "+nat.slice(3,7)+"-"+nat.slice(7);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[nat.length]; const g = []; let r = nat;
    if(sizes) sizes.forEach(k=>{ g.push(r.slice(0,k)); r = r.slice(k); }); else { while(r.length>4){ g.push(r.slice(0,3)); r = r.slice(3); } if(r) g.push(r); }
    body = g.join(" "); }
  return `+${DIAL} ${body}`; }
const REF = "3FA9C1";
/* the slug: OnlineStoreSlug.normalize + base(shop name) + "-" + the word he typed (his city) */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[\s_]+/g, "-").replace(/[^a-z0-9-]/g, "").replace(/-{2,}/g, "-").replace(/^-+|-+$/g, "");
const SLUG = norm(C.place) + "-" + norm(C.city);

/* ---------- the owner's Agenda: the kit's bookings (as in V4) + the one V3 made + the online one ---------- */
const hm = s => { const [h, m] = s.split(":").map(Number); return h*60 + m; };
const lineName = (s, choice) => (choice!=null && s.choices[choice]) ? `${s.name} (${s.choices[choice].name})` : s.name;
const CL = C.clients.map((c, i) => { let n = c.phone.replace(/\D/g, ""); if(CC==="EC") n = n.replace(/^0/, ""); if(CC==="AR") n = "9" + n;
  return { i, name: c.name, first: c.name.split(" ")[0], wa: DIAL + n }; });
const clientIdx = name => Math.max(0, CL.findIndex(c => c.name === name));
const BOOKINGS = C.bookings.map(b => { const s = V.service(b.sid);
  return { id: b.id, day: b.day, t: hm(b.t), client: clientIdx(b.client), name: lineName(s, b.choice), price: b.price || 0 }; });
const V3S = V.services.find(s => s.id==="corte-caballero" && !s.choices.length && s.price!=null) || V.services.find(s => !s.choices.length && s.price!=null) || V.services[0];
const V3_BOOKING = { id: 10, day: 2, t: 600, client: 1, name: V3S.name, price: V3S.price || 0 };
const ONLINE = { id: 11, day: DAY, t: SLOT, client: 3, name: SVC.name, price: SVC_PRICE, online: true };
const sortB = list => list.slice().sort((a,b) => (a.day-b.day) || (a.t-b.t) || (a.id-b.id));
const AGENDA = sortB(BOOKINGS.concat([V3_BOOKING, ONLINE]));

/* ---------- icons ---------- */
const svg = (d, cls) => `<svg class="${cls||"mi"}" viewBox="0 0 24 24"><path d="${d}"/></svg>`;
const I = {
  back: svg("M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"),

/* ---------- demo plumbing: keep an element on screen in a page that scrolls (measured on the real layout) ---------- */
function scrolled(html, sel, o){
  o = o || {};
  const app = document.getElementById("app"); if(!app || !sel) return html;
  app.innerHTML = html;
  const box = app.querySelector(o.box||".wscr"), inn = app.querySelector(o.inner||".wscr-in"), el = app.querySelector(sel);
  if(!box || !inn || !el) return html;
  const u = document.getElementById("screen").getBoundingClientRect().width / 412;
  const b = box.getBoundingClientRect(), e = el.getBoundingClientRect();
  let dy = e.bottom - b.bottom + (o.pad==null ? 16 : o.pad) * u;
  dy = Math.max(0, Math.min(dy, inn.getBoundingClientRect().height - b.height));
  if(dy <= 0) return html;
  return html.replace(`class="${(o.inner||".wscr-in").slice(1)}`, `style="transform:translateY(calc(var(--u)*-${(dy/u).toFixed(1)}))" class="${(o.inner||".wscr-in").slice(1)}`);
}

    {beat:6, wait:2.2, hint:H("Envía el mensaje", "Envie a mensagem", "Send the message"), target:'[data-t="wa-send"]', tap(st){ st.sent = true; }},
    {beat:7, hint:H("Toca la flecha de atrás", "Toque na seta de voltar", "Tap the back arrow"), target:'[data-t="wa-back"]', tap(st){ st.o = "detail"; }},
    {beat:7, hint:H("Toca la flecha de atrás", "Toque na seta de voltar", "Tap the back arrow"), target:'[data-t="dt-back"]', tap(st, E){ st.o = "agenda"; st.flash = true; E.after(1800, () => { st.flash = false; }); }}
  ]
});
</script>
