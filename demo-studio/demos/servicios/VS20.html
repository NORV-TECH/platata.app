/* the service card's price (public/store/app.js:356-359): ASK -> service_ask; FROM -> "Desde" + svc.price = the FIRST stored choice
   (storefront-projection.js:291 price: v.price of the first variation); FIXED -> the price */
function webPrice(s){
  if(s.mode === "ask") return WT("service_ask");
  if(s.mode === "from"){ const first = s.choices[0] ? s.choices[0].price : null;
    return first != null ? WT("service_from", {amt: money(first)}) : WT("service_ask"); }
  return money(s.price);
}

/* demo plumbing only (not an app screen): each tap keeps the engine busy until its last scheduled change has settled */
function settled(steps){
  return steps.map(s => Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms || 45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, () => {});
  }}));
}
