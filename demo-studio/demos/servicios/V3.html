const C = V.C, esc = V.esc, LG = V.lang, CC = V.country;
const fmtS = (s, a) => { let i = 0; return s.replace(/%(\d+)\$[sd]|%[sd]/g, (m, n) => { const v = n ? a[n-1] : a[i++]; return v == null ? "" : v; }); };
const t = (k, ...a) => { const o = STR[k]; if(!o) return "??"+k; return fmtS(o[LG] ?? o.es, a); };
const plCat = n => LG==="pt" ? ((n===0||n===1)?"one":"other") : (n===1?"one":"other");
const tp = (k, n, ...a) => { const p = STR[k][LG]; return fmtS(p[plCat(n)] || p.other, a.length ? a : [n]); };

/* ---------- time and day words: ui/screens/services/WhenPicker.kt (the APP language, not the country) ---------- */
/* fmtTimeCO :76-93: es "3:00 p. m.", en "3:00 PM", pt "15:00" */
function fmtTime(mins){ const h = Math.floor(mins/60), m = mins%60, mm = m<10 ? "0"+m : ""+m;
  if(LG==="es") return `${h%12===0?12:h%12}:${mm} ${h<12?"a. m.":"p. m."}`;
  if(LG==="en") return `${h%12===0?12:h%12}:${mm} ${h<12?"AM":"PM"}`;
  return `${h}:${mm}`; }
/* dowNames :101-109, monthNames :111-119 (monthAbbr = take(3)) */
const DOW = {es:["dom","lun","mar","mié","jue","vie","sáb"], en:["Sun","Mon","Tue","Wed","Thu","Fri","Sat"], pt:["dom","seg","ter","qua","qui","sex","sáb"]}[LG];
const MONTHS = {es:["enero","febrero","marzo","abril","mayo","junio","julio","agosto","septiembre","octubre","noviembre","diciembre"],
  en:["January","February","March","April","May","June","July","August","September","October","November","December"],
  pt:["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"]}[LG];
/* the demos' today: Thursday 22 Oct 2026 (V.today) */
const TODAY = new Date(V.today + "T12:00:00");
const dayDate = off => { const d = new Date(TODAY); d.setDate(d.getDate()+off); return d; };
const pad2 = n => n<10 ? "0"+n : ""+n;
/* dayLabelText :182-200: Hoy / Mañana, else es "sáb 24 de oct", en "Sat 24 Oct", pt "sáb 24/10" */
function dayLabel(off){
  if(off===0) return t("cal_today"); if(off===1) return t("cal_tomorrow");
  const d = dayDate(off), dow = DOW[d.getDay()], mon = MONTHS[d.getMonth()].slice(0,3);
  if(LG==="es") return `${dow} ${d.getDate()} de ${mon}`;
  if(LG==="en") return `${dow} ${d.getDate()} ${mon.charAt(0).toUpperCase()+mon.slice(1)}`;
  return `${dow} ${pad2(d.getDate())}/${pad2(d.getMonth()+1)}`;
}

/* ---------- clients: the kit's, saved with first name + last name and a WhatsApp number ----------
   whatsappNumber is stored canonical (country code + national digits, WA-FIX-1: EC trunk 0 out, AR mobile 9).
   The Agenda ROW prints "+" + those digits raw (ServicesTransactionsScreen.kt:271-274); the appointment page reads it
   through utils/WhatsappUtils.kt:132 formatWhatsappForReading (AppointmentDetailScreen.kt:101). */
const DIAL = {CO:"57",MX:"52",PE:"51",CL:"56",EC:"593",AR:"54",PA:"507",BR:"55",US:"1",CA:"1"}[CC];
const nationalOf = p => { let n = p.replace(/\D/g,""); if(CC==="EC") n = n.replace(/^0/,""); if(CC==="AR") n = "9"+n; return n; };
function waRead(canon){
  const nat = canon.slice(DIAL.length); let body;
  if(DIAL==="1" && nat.length===10) body = `(${nat.slice(0,3)}) ${nat.slice(3,6)}-${nat.slice(6)}`;
  else if(DIAL==="55" && nat.length>=10 && nat.length<=11) body = nat.slice(0,2)+" "+nat.slice(2,nat.length-4)+"-"+nat.slice(-4);
  else if(DIAL==="54" && nat.length===11 && nat.startsWith("911")) body = "9 11 "+nat.slice(3,7)+"-"+nat.slice(7);
  else if(DIAL==="54" && nat.length===10 && nat.startsWith("11")) body = "11 "+nat.slice(2,6)+"-"+nat.slice(6);
  else { const sizes = {10:[3,3,4],9:[3,3,3],8:[4,4]}[nat.length]; const g = []; let r = nat;
    if(sizes) sizes.forEach(k=>{ g.push(r.slice(0,k)); r = r.slice(k); }); else { while(r.length>4){ g.push(r.slice(0,3)); r = r.slice(3); } if(r) g.push(r); }
    body = g.join(" "); }
  return `+${DIAL} ${body}`;
}
const CL = C.clients.map((c, i) => { const parts = c.name.split(" "); const nat = nationalOf(c.phone), wa = DIAL + nat;
  return { i, name: c.name, first: parts[0], nat, wa, waRow: "+"+wa, waRead: waRead(wa) }; });
const clientIdx = name => Math.max(0, CL.findIndex(c => c.name === name));

  return { id: b.id, day: b.day, t: hm(b.t), client: clientIdx(b.client), sid: b.sid, name: lineName(s, b.choice), price: b.price || 0, who: b.who, min: durOf(s) }; });

const V3_BOOKING = { id: 10, day: 2, t: 10*60, client: 1, sid: DEMO_SVC.id, name: DEMO_SVC.name, price: DEMO_PRICE, who: TEAM[TEAM.length-1], min: durOf(DEMO_SVC), v3: true };
const sortB = list => list.slice().sort((a,b) => (a.day-b.day) || (a.t-b.t) || (a.id-b.id));
/* takenByDay (WhenPicker.kt:152-179): each open booking greys its own length in 15-min slots (BookingOverlap.lengthOf = max(min, 15)),
   with the client's first name; the booking being edited is left out */
function takenOn(list, day, exceptId){
  const m = {};
  list.filter(b => b.day===day && b.id!==exceptId).forEach(b => { const len = Math.max(b.min||15, 15);
    for(let x = b.t; x < b.t+len; x += 15) m[x] = CL[b.client].first; });
  return m;
}

/* page scrolling: the app's pages scroll; the demo moves the page's inner column. sel = the element that must be on
   screen; the shift is measured on the real layout (render writes the page once, measures, and returns it shifted) */
function scrolled(html, sel, o={}){
  const app = document.getElementById("app"); if(!app || !sel) return html;
  app.innerHTML = html;
  const box = app.querySelector(".scr"), inn = app.querySelector(".scr-in"), el = app.querySelector(sel);
  if(!box || !inn || !el) return html;
  const u = document.getElementById("screen").getBoundingClientRect().width / 412;
  const b = box.getBoundingClientRect(), e = el.getBoundingClientRect();
  let dy = o.top ? (e.top - b.top - (o.pad||8)*u) : (e.bottom - b.bottom + (o.pad==null?16:o.pad)*u);
  const maxDy = Math.max(0, inn.getBoundingClientRect().height - b.height);
  dy = Math.max(0, Math.min(dy, maxDy));
  if(dy <= 0) return html;
  return html.replace('class="scr-in', `style="transform:translateY(calc(var(--u)*-${(dy/u).toFixed(1)}))" class="scr-in`);
}

   a taken slot keeps its tile and shows the client's first name, a slot already gone today is dim and not tappable (item 29),
   footer "Abrimos de 8:00 a. m. a 8:00 p. m." (dp_hours, item 31). A slot tap closes the picker (:304-307). */
function slotGrid(o){
  const periods = [["dp_morning",480,720],["dp_afternoon",720,1080],["dp_evening",1080,1200]];
  const per = o.period;
  let h = "";
  if(o.allowNone) h += `<div class="nonechip${o.mins===null && o.noneOn?" on":""}">${esc(t("dp_no_time"))}</div>`;
  h += `<div class="pers">${periods.map((p,i)=>`<span class="${per===i?"on":""}" data-t="${o.pre}-per-${i}">${esc(t(p[0]))}</span>`).join("")}</div>`;
  const [_, a, b] = periods[per]; const slots = []; for(let m=a; m<b; m+=15) slots.push(m);
  const rows = []; for(let i=0; i<slots.length; i+=4) rows.push(slots.slice(i,i+4));
  h += rows.map(r => `<div class="srow">${r.map(m => { const who = o.taken[m], sel = o.mins===m, gone = o.nowMins!=null && m < o.nowMins;
      return `<span class="sl${sel?" on":""}${gone?" gone":""}${who&&!sel?" tk":""}" data-t="${o.pre}-slot-${m}"><b>${esc(fmtTime(m))}</b>${who?`<i>${esc(who)}</i>`:""}</span>`; }).join("")}</div>`).join("");
  h += `<div class="hrs">${esc(t("dp_hours", fmtTime(480), fmtTime(1200)))}</div>`;
  return h;
}
function whenPicker(o){
  let h = `<div class="wlbl">${esc(o.label)}</div>`;
  if(o.day!=null) h += `<div class="wsum" data-t="${o.pre}-sum"><b>${esc(dayLabel(o.day))} · ${esc(o.mins!=null ? fmtTime(o.mins) : t("tp_no_time"))}</b><span>${esc(t(o.open ? "where_done" : "tp_change"))}</span></div>`;
  if(o.open){
    h += `<div class="dstrip"><span class="cal">📅</span>${Array.from({length:21},(_,i)=>{ const d = dayDate(i);
      return `<span class="dc${o.day===i?" on":""}" data-t="${o.pre}-day-${i}"><small>${esc(DOW[d.getDay()])}</small><b>${d.getDate()}</b><small>${esc(MONTHS[d.getMonth()].slice(0,3))}</small></span>`; }).join("")}</div>`;
    if(o.day!=null) h += slotGrid(o);
  }
  return `<div class="wp${o.open?" open":""}">${h}</div>`;
}
/* the booking page. b = {day, mins, period, open, client (index|null), perf (name|null), perfOpen, sobre} */
function bookingScreen(b){
  const missing = b.client==null ? "booking_missing_who" : (b.day==null || b.mins==null) ? "booking_missing_day" : null;
  const ok = !missing;
  let h = `<div class="bcap">${esc(t("booking_no_charge"))}</div>`;
  h += whenPicker({label:t("booking_when_arrive"), pre:"arr", day:b.day, mins:b.mins, open:b.open, period:b.period||0,
    taken: b.day!=null ? takenOn(b.list||BOOKINGS, b.day, null) : {}, nowMins: b.day===0 ? b.now : null});
  if(b.sobre) h += `<div class="berr">${esc(t("booking_sobrecupo"))}</div>`;
  h += `<hr class="bdiv">`;
  if(V.isOrder) h += whenPicker({label:t("booking_when_ready"), pre:"rdy", day:null, mins:null, open:true, period:0, taken:{}}) + `<hr class="bdiv">`;
  h += `<hr class="bdiv">`;
  h += `<div class="li" data-t="bk-client"><div><b>${esc(t("booking_for_who"))}</b><small>${esc(b.client!=null ? CL[b.client].first : t("booking_no_client"))}</small></div>${I.chevR}</div><hr class="bdiv">`;
  h += `<div class="li" data-t="bk-perf"><div><b>${esc(t("booking_performer"))}</b><small>${esc(b.perf || t("booking_performer_none"))}</small></div>${I.chevR}</div>`;
  if(b.perfOpen) h += [null].concat(TEAM).map(p => `<div class="pfr" data-t="perf-${p==null?"none":TEAM.indexOf(p)}"><span>${esc(p==null ? t("booking_performer_none") : p)}</span>${(b.perf||null)===p?`<i>✓</i>`:""}</div>`).join("");
  h += `<hr class="bdiv"><div class="tf"><span>${esc(t("booking_note"))}</span></div><div style="height:calc(var(--u)*24)"></div>`;
  if(missing) h += `<div class="berr" data-t="bk-missing">${esc(t(missing))}</div><div style="height:calc(var(--u)*12)"></div>`;
  h += btn(t("booking_save"), "pri", "bk-save", {off:!ok});
  if(b.client!=null) h += `<div style="height:calc(var(--u)*12)"></div>` + btn(t("resch_notify"), "sec", "bk-save-wa", {off:!ok});
  h += `<div style="height:calc(var(--u)*24)"></div>`;
  return `<div class="pg">${topbar(t("booking_title"))}<div class="scr"><div class="scr-in bk">${h}</div></div>${b.overlay||""}</div>`;
}

/* ---------- the client picker the booking opens (BookingScreen.kt:373-399 → customers/CustomerCrmScreen.kt picker mode) ----------
   ListScreenHeader (back · "Seleccionar cliente" · "+ Nuevo", the search box on its own line, :302-314); A–Z with letter bands;
   row = 44 dp avatar on primaryContainer with the initial, the full name bodyLarge bold, an Info button (:600-720) */
function clientPicker(){
  const sorted = CL.slice().sort((a,b)=>a.name.localeCompare(b.name, LG));
  let last = "", rows = "";
  sorted.forEach(c => { const L = c.name.charAt(0).toUpperCase(); if(L!==last){ rows += `<div class="cl-l">${esc(L)}</div>`; last = L; }
    rows += `<div class="cl-r" data-t="pick-${c.i}"><span class="av">${esc(c.first.charAt(0).toUpperCase())}</span><b>${esc(c.name)}</b><span class="inf">${I.info}</span></div>`; });
  return `<div class="pg cl"><div class="cl-h"><span class="bk">${I.back}</span><b>${esc(t("crm_title_select"))}</b><span class="nw">${esc(t("common_new_short"))}</span></div>
    <div class="cl-s">${I.search}<span>${esc(t("crm_search_placeholder"))}</span></div><div class="cl-list">${rows}</div></div>`;
}

/* ---------- WhatsApp opened on the client's OWN chat with the message already typed (utils/AppointmentText.kt:122-124 →
   WhatsappOpen.openWhatsapp): this is WhatsApp's screen, not Platata's; the owner taps send. The text is the app's
   (AppointmentText.booked / rescheduled / noShow), in the SHOP's language, signed once (WASIG-1: blank line + whatsapp_signature). */
const dayLong = off => new Intl.DateTimeFormat(LG==="pt"?"pt-BR":LG, {weekday:"long"}).format(dayDate(off)) + " " + dayDate(off).getDate();   /* SimpleDateFormat("EEEE d") :27-32 */
const waTime = mins => `${Math.floor(mins/60)}:${pad2(mins%60)}`;                                                                          /* timeText :35-39 */
const waWhen = (off, mins) => t("appt_wa_when", dayLong(off), waTime(mins));
const signed = s => s + "\n\n" + t("whatsapp_signature");
function waChat(o){
  const c = CL[o.client];
  return `<div class="wa"><div class="wahd"><span>${I.back}</span><span class="waav">${esc(c.first.charAt(0))}</span><b>${esc(c.waRead)}</b><span>${I.more}</span></div>
    <div class="wachat">${o.sent?`<div class="wabub">${esc(o.text)}<small>${esc(o.clock)} <i>✓✓</i></small></div>`:""}</div>
    <div class="wain"><div class="wabox">${o.sent?"":esc(o.text)}</div><span class="wasend" data-t="wa-send">${I.send}</span></div></div>`;
}

/* ---------- Agenda — ui/screens/transactions/ServicesTransactionsScreen.kt (owner phone: its own top row) ----------
   top (:126-185): back arrow (item 51) + transparent TabRow "Ventas | Agenda N" (bodyMedium, selected bold primary, the count
   labelSmall primary); opens on the Agenda half (:99). Search (:195-216): pill OutlinedTextField (shapes.extraLarge) on
   surfaceVariant, "Por nombre o teléfono…" — matches the name or the WhatsApp digits (item 26, :218-227, :581-585).
   Rows grouped by DAY (item 23, :245-284): header "Hoy" / "Mañana" / "sáb 24 de oct" titleSmall bold grey on surfaceVariant;
   BookingRow (:369-476): 96 dp column "Viene" labelMedium bold (primary; red when the day is past) + day + time labelSmall grey;
   the client's first name bodyMedium SemiBold; "service · +57…" labelSmall grey (raw digits); right the total bold; 0.5 dp
   outlineVariant dividers. Paid / cancelled tickets leave this list. */
function agendaScreen(o){
  const list = sortB(o.list);
  const q = (o.query||"").trim().toLowerCase();
  const rows = list.filter(b => !q || CL[b.client].first.toLowerCase().includes(q) || CL[b.client].wa.includes(q.replace(/ /g,"")));
  let body = "";
  if(!rows.length) body = `<div class="aempty">${esc(t(q ? "sx_no_match" : "sx_none"))}</div>`;
  else { let lastDay = null;
    rows.forEach(b => { if(b.day!==lastDay){ body += `<div class="adh">${esc(dayLabel(b.day))}</div>`; lastDay = b.day; }
      const c = CL[b.client];
      body += `<div class="arow${o.flash===b.id?" flash":""}" data-t="row-${b.id}"><div class="al"><b class="${b.day<0?"late":""}">${esc(t("sx_comes"))}</b><small>${esc(dayLabel(b.day))}</small><small>${esc(fmtTime(b.t))}</small></div>
        <div class="am"><b>${esc(c.first)}</b><small>${esc(b.name)} · ${esc(c.waRow)}</small></div><b class="ar">${b.price>0?money(b.price):"—"}</b></div>`; }); }
  const search = `<div class="asrch${o.typing?" focus":""}" data-t="search">${I.search}<span class="${q?"":"ph"}">${esc(q ? o.query : t("sx_search"))}${o.typing?'<i class="caret"></i>':""}</span>${q?`<span class="x" data-t="search-x">${I.close}</span>`:""}</div>`;
  const top = `<div class="atop"><span class="ib" data-t="ag-back">${I.back}</span><div class="atabs"><span data-t="tab-sales">${esc(t("tx_tab_all"))}</span><span class="on">${esc(t("sx_agenda"))}<em>${list.length}</em></span></div></div>`;
  return `<div class="pg">${top}${search}<div class="scr"><div class="scr-in">${body}</div></div>${nav("agenda")}${o.overlay||""}${o.snack||""}</div>`;
}

/* ---------- the appointment page — ui/screens/transactions/AppointmentDetailScreen.kt ----------
   SumaTopBar with the client's first name (:198-205, item 51). Column 16 dp padding, 12 dp gaps (:207-214):
   "Servicios" labelMedium grey; every line + its price bodyLarge (:216-241, item 24); "name · Dura N min" bodySmall grey
   (:242-248, the stored length, DBSVC-1); where / note when set (:249-267); "Atendió: <person>" (:268-277, item 21);
   SumaButtons (:280-312): Cobrar (filled), No asistió (Secondary, only when the hour is here or past and the person may
   cancel, :146-152 items 17/29), Reprogramar (Secondary), Cancelar cita (Secondary, not when the day is past);
   WhenPicker "¿Cuándo viene?" (:314-327, opened by Reprogramar = forceOpen); "2:00 p. m. → 2:40 p. m. · Dura 40 min"
   (:329-341); the clash box when the new slot is taken (:377-403); "¿Para quién?" + "Ana · +57 300 123 4567" (:405-414);
   footer (:418-463): time unchanged → Guardar; moved → "Movida de … a …" bodySmall + Guardar + "Guardar y avisar por WhatsApp". */
function detailScreen(o){
  const b = o.b, c = CL[b.client], s = V.service(b.sid);
  const day = o.day!=null ? o.day : b.day, mins = o.mins!=null ? o.mins : b.t;
  const moved = day!==b.day || mins!==b.t;
  const reached = b.day < 0 || (b.day===0 && b.t <= o.now);
  const dur = b.min;
  let h = `<div class="dlb">${esc(t("home_tab_services"))}</div>`;
  h += `<div class="dln"><span>${esc(b.name)}</span><span>${money(b.price)}</span></div>`;
  if(dur) h += `<div class="dsm">${esc(t("agenda_service_with_dur", b.name, dur))}</div>`;
  if(b.who) h += `<div class="dbm">${esc(t("receipt_label_performer"))}: ${esc(b.who)}</div>`;
  h += `<div class="dbt">${btn(t("ax_cobrar"),"pri","ax-charge")}${reached ? btn(t("ax_no_show"),"sec","ax-noshow") : ""}${btn(t("ax_resched"),"sec","ax-resched")}${b.day>=0 ? btn(t("ax_cancel"),"sec","ax-cancel") : ""}</div>`;
  const taken = takenOn(o.list, day, b.id);
  h += whenPicker({label:t("booking_when_arrive"), pre:"dt", day, mins, open:!!o.resching, period:o.period!=null?o.period:[[480,720],[720,1080],[1080,1200]].findIndex(p=>mins>=p[0]&&mins<p[1]),
    taken, nowMins: day===0 ? o.now : null});
  if(dur) h += `<div class="dsm">${esc(t("agenda_end_hint", fmtTime(mins), fmtTime(mins+dur), dur))}</div>`;
  if(moved && taken[mins]) h += `<div class="clash"><b>⚠ ${esc(t("sx_overbook"))}</b><span>${esc(t("sx_overbook_body", taken[mins], fmtTime(mins)))}</span></div>`;
  h += `<div class="dlb">${esc(t("booking_for_who"))}</div><div class="dln"><span>${esc(c.first)} · ${esc(c.waRead)}</span></div><div style="height:calc(var(--u)*4)"></div>`;
  if(moved) h += `<div class="dsm ink" data-t="moved">${esc(t("agenda_resch_moved_line", dayLabel(b.day)+" · "+fmtTime(b.t), dayLabel(day)+" · "+fmtTime(mins)))}</div>`
    + btn(t("booking_save"),"pri","dt-save") + btn(t("resch_notify"),"sec","dt-save-wa");
  else h += btn(t("booking_save"),"pri","dt-done");
  h += `<div style="height:calc(var(--u)*4)"></div>`;
  return `<div class="pg">${topbar(c.first, {backT:"dt-back"})}<div class="scr"><div class="scr-in dt">${h}</div></div>${o.overlay||""}</div>`;
}

/* demo plumbing (not an app screen): fetch every Roboto weight the screens use up front, and re-place the hint ring when a
   font file lands late (the engine re-places it on resize) */
(function(){ const d = document.createElement("div"); d.setAttribute("aria-hidden","true");
  d.style.cssText = "position:absolute;left:-9999px;top:0;font-family:Roboto";
  d.innerHTML = [300,400,500,600,700,800,900].map(w=>`<span style="font-weight:${w}">Aa 0 ✓</span><i style="font-weight:${w}">Aa</i>`).join("");
  document.body.appendChild(d);
  if(document.fonts && document.fonts.addEventListener) document.fonts.addEventListener("loadingdone", ()=>window.dispatchEvent(new Event("resize")));
})();


const WHO_CLIENT = 1, PERF = TEAM.length - 1, BOOK_DAY = 2, BOOK_MIN = 10*60;
const NOW = 12*60 + 41;
/* AppointmentText.booked (utils/AppointmentText.kt:71-84): "Hola Juan, tu cita en <tienda> es el sábado 24 a las 10:00 (<servicio>)."
   who = preferredName, noun = cita (arrival = CITA, appt_wa_appointment), shop = the business name, service = the first line */
const WA_TEXT = signed(t("appt_wa_booked", CL[WHO_CLIENT].first, t("appt_wa_appointment"), C.place, waWhen(BOOK_DAY, BOOK_MIN), DEMO_SVC.name));
function render(st){
  if(st.screen==="till") return till({cart:st.cart, regClosed:true, overlay: st.sheet ? optionSheet(DEMO_SVC) : "",
    snack: st.snack ? snack(t("booking_saved_snackbar", dayLabel(BOOK_DAY)+" · "+fmtTime(BOOK_MIN)), t("booking_saved_see_agenda")) : ""});
  if(st.screen==="book") return scrolled(bookingScreen(Object.assign({}, st.bk, {now:NOW, overlay: st.picker ? clientPicker() : ""})), st.scrollTo, st.scrollTop ? {top:true} : {});
  if(st.screen==="wa") return waChat({client:WHO_CLIENT, text:WA_TEXT, sent:st.sent, clock:fmtTime(NOW)});
  return "";
}
const tapHint = (es, pt, en) => H("Toca "+es, "Toque em "+pt, "Tap "+en);
const T = k => t(k);
/* demo plumbing: keep the engine busy a moment after each tap so the ring is placed once the screen settled */
function settled(steps){
  return steps.map(s=>Object.assign({}, s, {tap(st, E){ let last = 0; const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); }; s.tap(st, E2); E.after(last + 450, ()=>{}); }}));
}

    es: VOICE.es.map((v,i) => i===4 && V.biz!=="peluqueria" ? "¿Quién lo hace? Escoge de tu equipo." : v),

  state:{screen:"till", cart:[], sheet:false, snack:false, picker:false, sent:false, scrollTo:null, scrollTop:false,

  render,

  steps: settled([
    {beat:0, hint:tapHint(DEMO_SVC.name, DEMO_SVC.name, DEMO_SVC.name), target:`[data-t="svc-${DEMO_SVC.id}"]`, tap(st){ st.sheet = true; }},
    {beat:0, hint:tapHint(t("opt_add_to_sale", money(DEMO_PRICE)), t("opt_add_to_sale", money(DEMO_PRICE)), t("opt_add_to_sale", money(DEMO_PRICE))), target:'[data-t="opt-add"]',
      tap(st){ st.sheet = false; st.cart = [{sid:DEMO_SVC.id, price:DEMO_PRICE}]; }},
    {beat:1, hint:tapHint(actionWord(), actionWord(), actionWord()), target:'[data-t="book"]', tap(st){ st.screen = "book"; }},
    {beat:2, hint:tapHint(dayLabel(BOOK_DAY), dayLabel(BOOK_DAY), dayLabel(BOOK_DAY)), target:`[data-t="arr-day-${BOOK_DAY}"]`,
      tap(st){ st.bk.day = BOOK_DAY; st.bk.period = 0; st.scrollTo = `[data-t="arr-slot-${BOOK_MIN}"]`; }},
    {beat:2, hint:tapHint(fmtTime(BOOK_MIN), fmtTime(BOOK_MIN), fmtTime(BOOK_MIN)), target:`[data-t="arr-slot-${BOOK_MIN}"]`,
      tap(st){ st.bk.mins = BOOK_MIN; st.bk.open = false; st.scrollTo = '[data-t="bk-client"]'; }},
    {beat:3, hint:tapHint(T("booking_for_who"), T("booking_for_who"), T("booking_for_who")), target:'[data-t="bk-client"]', tap(st){ st.picker = true; }},
    {beat:3, hint:tapHint(CL[WHO_CLIENT].name, CL[WHO_CLIENT].name, CL[WHO_CLIENT].name), target:`[data-t="pick-${WHO_CLIENT}"]`,
      tap(st){ st.picker = false; st.bk.client = WHO_CLIENT; st.scrollTo = '[data-t="bk-perf"]'; }},
    {beat:4, hint:tapHint(T("booking_performer"), T("booking_performer"), T("booking_performer")), target:'[data-t="bk-perf"]',
      tap(st){ st.bk.perfOpen = true; st.scrollTo = `[data-t="perf-${PERF}"]`; }},
    {beat:4, hint:tapHint(TEAM[PERF], TEAM[PERF], TEAM[PERF]), target:`[data-t="perf-${PERF}"]`,
      tap(st){ st.bk.perf = TEAM[PERF]; st.bk.perfOpen = false; st.scrollTo = '[data-t="bk-save-wa"]'; }},
    {beat:5, hint:tapHint(T("resch_notify"), T("resch_notify"), T("resch_notify")), target:'[data-t="bk-save-wa"]',
      tap(st, E){ st.screen = "till"; st.cart = []; st.snack = true; st.scrollTo = null;
        E.after(1100, ()=>{ st.screen = "wa"; }); }},
    {beat:6, hint:H("Toca enviar","Toque em enviar","Tap send"), target:'[data-t="wa-send"]',
      tap(st){ st.sent = true; }}
  ])
});
