// KEYS: home_tab_services,home_tab_products,common_edit,items_filter_all,items_price_from,items_price_unset,opt_min,scan_row_manual,services_action_agendar,services_action_crear_orden,common_charge,combo_label_offer_percent
// PLURALS: home_current_sale_services
/* the library lists viewModel.products = ProductDao.getAllProducts "ORDER BY name ASC" (PosDao.kt:334; SQLite BINARY), split by
   type (sync/ServicesLibrarySplit.kt): with "Todos" picked the grid is A-Z, not the setup's order */
const byName = (a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0;
const SERVICES = C.services.slice().sort(byName), PRODUCTS = C.products.slice().sort(byName);
/* ServiceActionLabel.secondActionLabel: "Agendar" for beauty / pets, "Crear orden" for a workshop (TradeFamily ORDEN) */
const BOOK_WORD = () => S(V.isOrder ? "services_action_crear_orden" : "services_action_agendar");
/* the price a tile prints (ProductCard.kt:96-107): FIXED -> the price; FROM -> "Desde" + the price of the FIRST stored variation
   (ProductLibraryView.kt:331 takes variations.find{}, ORDER BY id = the catalogue's choice order, not the lowest); no price ->
   "Sin precio" */
function tilePrice(s){
  if(!s.choices.length) return s.price != null ? money(s.price) : S("items_price_unset");
  const first = s.choices[0].price;
  return first ? F("items_price_from", money(first)) : S("items_price_unset");
}
/* CU-21 ServiceTileBody: icon box 40 r12 in the trade family's tile, name bodyLarge 500 (2 lines), price bold + "N min";
   the combo pill (SVC-4 item 48) in the free TOP-RIGHT corner, SumaComboGreen #10B981 */
function svcTile(s, o){ o = o || {};
  const pillTxt = o.combo ? F("combo_label_offer_percent", o.combo) : "";
  return `<div class="sv-tile${o.hl?" hl":""}" data-t="tile-${s.id}"><span class="icb" style="background:${TRADE_TILE[V.biz]}">${TRADE_SVG[V.biz]}</span>
    <b>${esc(s.name)}</b><div class="pr"><span data-fit="16">${esc(tilePrice(s))}</span>${s.min?`<small>${s.min} ${esc(S("opt_min"))}</small>`:""}</div>
    ${o.combo?`<span class="cpill">${esc(pillTxt)}</span>`:""}</div>`; }
/* the Mini POS / plain tile (ProductCard.kt plain branch: square, category tint 12 %, border 35 %, name titleMedium bold, price) —
   the staff phone passes no serviceFacts (MiniPosSellScreen.kt:647-657), so its services wear the plain tile */
function plainTile(s){
  return `<div class="sv-ptile" data-t="tile-${s.id}" style="border-color:${hexA(CAT_COLOR,.35)}"><div class="in" style="background:${hexA(CAT_COLOR,.12)}"><b>${esc(s.name)}</b><span>${esc(tilePrice(s))}</span></div></div>`; }
const chips = (cats) => `<div class="sv-chips">${cats.map((c,i)=>{
  const col = i===0 ? ALL_COLOR : CAT_COLOR, on = i===0;
  const st = on ? `background:${hexA(col,.22)};border:calc(var(--u)*1.5) solid ${col};color:${col}` : `background:${hexA(col,.05)};border:1px solid ${hexA(col,.3)};color:var(--m-onv)`;
  return `<span style="${st}">${on?I("check"):""}${esc(c)}</span>`; }).join("")}</div>`;
/* o = {tab, cartCount, total, combo:{sid, pct}, hl, scroll, sheet (html drawn over)} */
function caja(o){ o = o || {};
  const tabs = [`${S("home_tab_services")} · ${SERVICES.length}`, `${S("home_tab_products")} · ${PRODUCTS.length}`];
  const tabRow = `<div class="sv-tabs">${tabs.map((t,i)=>`<span class="${i===(o.tab||0)?"on":""}">${esc(t)}</span>`).join("")}</div>`;
  const edit = `<div class="sv-editrow"><span>${I("edit")}${esc(S("common_edit"))}</span></div>`;
  const grid = `<div class="sv-grid"><div class="in" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">${SERVICES.map(s => svcTile(s, {combo: o.combo && o.combo.sid === s.id ? o.combo.pct : 0, hl: o.hl === s.id})).join("")}</div></div>`;
  const n = o.cartCount || 0, total = o.total || 0;
  const foot = `<div class="sv-foot"><div class="lk"><span>${esc(S("scan_row_manual"))}</span></div>
    ${n ? `<div class="cur" data-t="cur-sale"><span>${esc(PL("home_current_sale_services", n))}</span><i>›</i></div>` : ""}
    <div class="pair"><span class="sec${n?"":" off"}">${esc(BOOK_WORD())}</span><span class="pri${total?"":" off"}" data-t="charge"><small>${esc(F("common_charge","").trim())}</small> ${esc(money(total))}</span></div></div>`;
  return `<div class="sv-caja">${tabRow}${edit}${chips([S("items_filter_all"), V.tradeName])}${grid}${foot}</div>` + navOwner("caja") + (o.sheet || ""); }

/* ---------- the option sheet (OptionSelectionSheet.kt) ---------- */
// KEYS: opt_add_to_sale,common_add,deal_choice_add_deal,opt_ask_at_till_row,opt_per_unit_each,home_variation_choose_one
/* the service's option sets, as the setup writes them (GuideActions.ensureResearchedOptions + ui/ResearchedOptionStates.kt): every
   "Lo que trae" (INCLUIDO) and every "Cobra más" (AGREGAR) is ITS OWN set, displayName = its name, one value with the same name;
   an included one rides at 0 (switch ON), a priced add-on is OFF, an add-on with no price asks at the till, a per-unit one says "por …" */
function optionSets(s){
  return s.included.map(x => ({name:x.name, price:0, inc:true})).concat(s.extras.map(x => ({name:x.name, price:x.price, per:x.per, ask:x.price == null})));
}
function optRowText(set){
  if(set.inc) return set.name;
  if(set.ask) return `${set.name} · ${S("opt_ask_at_till_row")}`;
  if(set.per) return `${set.name} · ` + F("opt_per_unit_each", money(set.price), set.per);
  return `${set.name} · +${money(set.price)}`;
}
/* o = {base (the line price), deal (show "Agregar oferta"), scroll, addTag, dealTag} */
function optSheet(s, o){ o = o || {};
  const sets = optionSets(s);
  const body = sets.map(set => `<div class="os-h">${esc(set.name)}</div><div class="os-r"><span>${esc(optRowText(set))}</span>${sw(!!set.inc)}</div><hr>`).join("");
  const total = o.base;
  const add = `<div class="sv-btn pri" data-t="${o.addTag||"opt-add"}">${esc(total ? F("opt_add_to_sale", money(total)) : S("common_add"))}</div>`;
  const deal = o.deal ? `<div class="sv-btn sec" data-t="${o.dealTag||"opt-deal"}">${esc(S("deal_choice_add_deal"))}</div>` : "";
  return `<div class="sv-scrim"></div><div class="sv-sheet"><i class="hd"></i><div class="sc"><div class="in" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <h3>${esc(s.name)}</h3>${body}${add}${deal}</div></div></div>`; }
/* VariationSelectionSheet.kt: "Elige uno" (labelMedium bold primary), the name (headlineMedium ExtraBold), a row per choice */
function varSheet(s, tagPrefix){
  return `<div class="sv-scrim"></div><div class="sv-sheet"><i class="hd"></i><div class="vs"><small>${esc(S("home_variation_choose_one"))}</small><h2>${esc(s.name)}</h2>
    ${s.choices.map((c,i)=>`<div class="vr" data-t="${tagPrefix||"var"}-${i}"><b>${esc(c.name)}</b><span>${esc(c.price ? money(c.price) : S("opt_ask_at_till_row"))}</span></div>`).join("")}</div></div>`; }

}
