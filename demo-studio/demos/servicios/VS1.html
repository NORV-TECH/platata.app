/* ShrinkToFitText (ui/components/ShrinkToFitText.kt): one line, 1 sp smaller until it fits, never under 12 sp, then an ellipsis.
   Applied after every draw to the elements marked .fit (data-sp = the start size). */
function fitAll(){
  document.querySelectorAll("#app .fit").forEach(el => {
    let sp = +(el.dataset.sp || 16);
    el.style.fontSize = `calc(var(--u)*${sp})`;
    while(el.scrollWidth > el.clientWidth + 0.5 && sp > 12){ sp -= 1; el.style.fontSize = `calc(var(--u)*${sp})`; }
  });
}
new MutationObserver(() => fitAll()).observe(document.getElementById("root"), {childList:true, subtree:true});

function typePage(st){
  const sel = !!st.type;
  const tile = (k, wide) => { const f = FAM[k], on = sel && k==="serv";

  const rows = []; for(let i=0;i<TILES.length;i+=2) rows.push(TILES.slice(i,i+2));
  const grid = rows.map(r => `<div class="trow">${r.map(k => tile(k, r.length===1)).join("")}</div>`).join("");
  const pitch = sel ? `<div class="pitch" style="background:${SV.soft}"><b style="color:${SV.ink}">${esc(t("biz_pitch_header", t("biz_setup_type_services")))}</b>
      <div class="pl">${IC("drawn_navaja", 24)}<span>${esc(t(CO ? "biz_picker_serv_1" : "biz_picker_serv_1_no_prices", TRADES_N))}</span></div>
      <div class="pl">${IC("drawn_calendario", 24)}<span>${esc(t("biz_pitch_serv_dates"))}</span></div>
      <div class="pl">${IC("drawn_efectivo", 24)}<span>${esc(PAYLINE)}</span></div></div>` : "";
  return `<div class="ppage">${header(2, sel?SV.main:"#3A2A1F")}<div class="pbody" style="padding-top:calc(var(--u)*8)">
    <div class="ph1" style="font-size:calc(var(--u)*25);line-height:1.14">${esc(t("biz_picker_screen_title"))}</div><div class="tgrid">${grid}</div>${pitch}</div>
    <div class="pfoot">${sel ? pBtn(t("biz_pick_continue_with", t("biz_setup_type_services")), "type-go") : pBtn(t("biz_start_cta"), null, {off:true})}</div></div>`;
}
function namePage(st){
  const v = st.name;

    <div class="ph1">${esc(t("biz_name_title"))}</div>
    <div class="pfield" data-t="name-field">${v?`<span>${esc(v)}</span><i class="pcaret"></i>`:`<i class="pcaret"></i><em>${esc(t("biz_setup_field_placeholder"))}</em>`}</div>
    ${v?`<div class="rcard"><span class="rib">${IC("drawn_recibo", 21)}</span><div><small>${esc(t("biz_name_receipt_label"))}</small><b>${esc(v.trim())}</b></div></div>`:""}</div>
    <div class="pfoot">${pBtn(t("biz_start_cta"), v ? "name-go" : null, {off:!v})}</div>${keyboard()}</div>`;
}
function keyboard(){
  const r = ["qwertyuiop","asdfghjklñ".slice(0, LG==="es"?10:9),"zxcvbnm"];
  return `<div class="kbd">${r.map((row,i)=>`<div class="kr2">${i===2?"<span class=w>⇧</span>":""}${row.split("").map(c=>`<span>${c}</span>`).join("")}${i===2?"<span class=w>⌫</span>":""}</div>`).join("")}
    <div class="kr2"><span class="w">?123</span><span>,</span><span class="sp"></span><span>.</span><span class="w">✓</span></div></div>`;
}

}

  return warn + tradePicker({});
}
function render(st){
  return `<div class="x">${({welcome, country, type:typePage, name:namePage, google, setup:settingUp, ready, landing})[st.screen](st)}</div>`;
}
const steps = [
  {beat:0, hint:TAP+t("welcome_start_cta"), target:'[data-t="start"]', tap(st){ st.screen="country"; }},
  {beat:1, hint:TAP+t("biz_start_cta"), target:'[data-t="country-go"]', tap(st){ st.screen="type"; }},

  {beat:4, hint:TAP+t("biz_start_cta"), target:'[data-t="name-go"]', tap(st){ st.screen="google"; }},
  {beat:4, hint:TAP+t("auth_google_btn"), target:'[data-t="google"]', tap(st,E){ st.screen="setup"; st.done=0;

  {beat:5, hint:TAP+t("ready_cta_services"), target:'[data-t="ready-go"]', tap(st){ st.screen="landing"; }}
];
VKIT.start(V, {
  id:"VS1", tallVideo:true, clock:"9:05",
  endText:H("Así creas tu negocio de servicios con Platata.","Assim você cria seu negócio de serviços com o Platata.","That's how you set up your services business with Platata."),
  beats:pick({
    es:["Abre Platata y toca Empezar mi negocio","Tu país ya viene de tu celular: Continuar","Elige Servicios","Escribe el nombre de tu negocio","Entra con tu cuenta de Google","Listo. Toca Escoger mis servicios","Ahora escoges tu oficio","Así creas tu negocio de servicios con Platata."],
    pt:["Abra o Platata e toque em Começar meu negócio","Seu país já vem do celular: Continuar","Escolha Serviços","Digite o nome do seu negócio","Entre com sua conta Google","Pronto. Toque em Escolher meus serviços","Agora você escolhe seu ofício","Assim você cria seu negócio de serviços com o Platata."],

  state:{screen:"welcome", type:null, name:"", done:0},
  render,
  device: () => "phone",
  who: () => H("Tu teléfono","Seu celular","Your phone"),
  steps
