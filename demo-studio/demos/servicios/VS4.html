const V = VKIT.ctx({biz: PAGE.biz});
const C = V.C, LG = V.lang, CC = V.country, KC = V.K, esc = VKIT.esc;
const fmtS = (s, a) => { let i = 0; return s.replace(/%(\d+)\$[sd]|%[sd]/g, (m, n) => { const v = n ? a[n-1] : a[i++]; return v == null ? "" : v; }).replace(/%%/g, "%"); };
const t = (k, ...a) => { const o = STR[k]; if(!o) return "??"+k; return fmtS(o[LG] ?? o.en, a); };
/* Android plural categories: pt "one" = 0 and 1; es/en "one" = 1 */
const plCat = n => LG==="pt" ? ((n===0||n===1)?"one":"other") : (n===1?"one":"other");
const tp = (k, n, ...a) => { const p = PLU[k][LG]; return fmtS(p[plCat(n)] || p.other, a.length ? a : [n]); };
const money = v => V.money(v);
const H = (es,pt,en) => V.pick({es,pt,en});
const TAP = H("Toca ","Toque em ","Tap ");
const hexA = (hex, a) => { const n = parseInt(hex.slice(1),16); return `rgba(${n>>16},${(n>>8)&255},${n&255},${a})`; };

/* ---- the country facts the pay screens read ----
   sync/CardCountryGate.kt:33-37   Stripe = US, CA, MX (STRIPE-MX-1); Wompi = CO; everyone else no card
   sync/QrCountries.kt:10          no QR only in US and CA (Mexico keeps its QR)
   utils/PixLabels.kt:16            the QR is "Pix" when the money is the real
   sync/ReceiptSendRoute.kt:23     text + email in US and CA, WhatsApp everywhere else
   sync/PosLinkRules.kt:74         "Cobrar con enlace" countries: US, CA, MX */
const STRIPE = CC==="US" || CC==="CA" || CC==="MX";
const WOMPI = CC==="CO";
const CARDC = STRIPE || WOMPI;
const QRC = !(CC==="US" || CC==="CA");
const PIX = KC.cur==="BRL";
const TEXT_ROUTE = CC==="US" || CC==="CA";
const DIAL = {CO:"+57",MX:"+52",PE:"+51",CL:"+56",EC:"+593",AR:"+54",PA:"+507",BR:"+55",US:"+1",CA:"+1"}[CC];
/* utils/PixLabels.kt:40-60 PIX_TEXT_RES: only these QR strings have a Pix twin */
const PIX_RES = ["qr_terms_bar_title","qr_terms_subtitle","qr_terms_agree","qr_terms_cta","qr_terms_note_bold","qr_options_row","qr_upload_image",
  "qr_setup_button","qr_setup_take_photo","qr_setup_saved"];
const qrS = k => (PIX && PIX_RES.includes(k)) ? t(k+"_pix") : t(k);
/* utils/CashRounding.kt: CL to $10 (1-5 down, 6-9 up), PE always down to S/ 0.10, CA to the nearest 5 cents. Cash only. */
function cashDue(v){
  if(CC==="CL"){ const r = Math.round(v) % 10; return r<=5 ? Math.round(v)-r : Math.round(v)-r+10; }
  if(CC==="PE") return Math.floor(v*10+1e-6)/10;
  if(CC==="CA") return Math.round(v*20)/20;
  return v;
}
const DECKEY = KC.dec===0 ? "000" : new Intl.NumberFormat(KC.loc).formatToParts(1.5).find(p=>p.type==="decimal").value;   // CheckoutSheetBody onTripleZero

/* ---- a services sale line: {sid, ci (choice index or null), add:[extra indexes], qty} ----
   CheckoutActions.kt:305-312: the stored line is SaleLineName.of(product, variation) ("Cepillado (Largo)"; a blank or
   "Regular" variation adds nothing, item 14) at MoneyLines.lineUnitPrice = variation price + every option's price.
   The "Lo que trae" options come switched on at 0 (OptionSelectionSheet.kt:145-150); paid ones ("Cobra más") only when ticked. */
function svcLine(l){
  const s = V.service(l.sid);
  const ch = (l.ci!=null && s.choices[l.ci]) ? s.choices[l.ci] : null;
  const base = ch ? ch.price : s.price;
  const paid = (l.add||[]).map(i => s.extras[i]).filter(Boolean);
  const unit = (base||0) + paid.reduce((a,e)=>a+(e.price||0), 0);
  const name = (ch && ch.name && ch.name.trim() && ch.name!=="Regular") ? `${s.name} (${ch.name})` : s.name;   // sync/SaleLineName.kt:32-37
  return {s, ch, unit, qty:l.qty||1, name, paid:paid.map(e=>e.name), incl:s.included.map(i=>i.name), min:(ch&&ch.min)||s.min};
}
const saleTotal = lines => lines.reduce((a,l)=>{ const x = svcLine(l); return a + x.unit*x.qty; }, 0);
/* sync/SaleNoun.kt (R2-1 items 8/14): "services" only while every unit is a service; these pages' lines are all services */
const allSvc = lines => lines.length > 0 && lines.every(l => l.sid);
const unitCount = lines => lines.reduce((a,l)=>a+(l.qty||1), 0);

   ItemEditModeBar :2080-2097 (owner "Editar"), ProductLibraryView.kt:209-286 chips ("Todos" + the trade, the system
   bucket hidden, HomeScreen.kt:942), the service tiles ProductCard.kt:341-410 (ServiceTileBody: trade icon 40/r12 on the
   trade tile colour, name 16/500) + ServicePriceBlock :303-333 (round 3, R2-1 item 2 / REVIEW-16 F1: "Desde" on its OWN small
   grey line, the amount bold with the tile's whole width (floor 8 sp for a FROM price), the minutes on their own line; a
   "Desde" price is the LOWEST choice, ProductLibraryView.kt:343, item 9), and the services footer

   cart holds only services, HomeScreen.kt:805-809 saleNounOf, R2-1 items 8/14; FooterButtonPair "Agendar" |
   "Cobrar $X"; a work-order trade says "Crear orden", ServiceActionLabel + TradeFamily). ======== */
/* ShrinkToFitText.kt:23-45: one line, 16 sp stepping down to 12 sp, then "…". Measured here with a canvas (dp at 1:1). */
const MEAS = document.createElement("canvas").getContext("2d");
function textDp(text, weight, sp){ MEAS.font = `${weight} 100px Roboto, system-ui, sans-serif`; return MEAS.measureText(text).width * sp / 100; }
function fitSp(text, weight, startSp, minSp, availDp){ for(let sp = startSp; sp > minSp; sp--) if(textDp(text, weight, sp) <= availDp) return sp; return minSp; }
/* the tile on a 412 dp phone: Adaptive(120 dp) -> 3 columns of 121 dp (ProductLibraryView.kt:322-330), padding 12 -> 97 dp inside.
   ServicePriceBlock (ProductCard.kt:303-333): "Desde" (items_price_from_only) bodySmall on its own line, then the amount with the whole
   97 dp (ShrinkToFitText from 16 sp, floor 8 sp for a FROM price, 12 sp otherwise), then the minutes on their own line */
function svcTile(s){
  const price = s.mode==="ask" ? null : s.price, from = s.mode==="from" && price!=null;
  const amount = price==null ? t("items_price_unset") : money(price);
  const mins = s.min ? `${s.min} ${t("opt_min")}` : "";
  const sp = fitSp(amount, 700, 16, from ? 8 : 12, 97);
  return `<div class="vtile" data-t="svc-${s.id}"><span class="vic" style="background:${FAMILY[V.biz]}">${DRAWN[TRADE_ICON[V.biz]]}</span>
    <b>${esc(s.name)}</b><div class="vpr">${from?`<small>${esc(t("items_price_from_only"))}</small>`:""}<span style="font-size:calc(var(--u)*${sp})">${esc(amount)}</span>${mins?`<small>${esc(mins)}</small>`:""}</div></div>`;
}
function svcHome(lines){
  const n = unitCount(lines), tot = saleTotal(lines);
  const tabs = `<div class="vtabs"><span class="on">${esc(t("home_tab_services"))} · ${V.services.length}</span><span>${esc(t("home_tab_products"))} · ${C.products.length}</span></div>`;
  const edit = `<div class="hedit"><span>${I2.edit}${esc(t("common_edit"))}</span></div>`;
  const chips = `<div class="mcats"><span style="background:${hexA("#607D8B",.22)};border:calc(var(--u)*1.5) solid #607D8B;color:#607D8B">${J.check}${esc(t("items_filter_all"))}</span>` +
    `<span style="background:${hexA("#81C784",.05)};border:1px solid ${hexA("#81C784",.3)}">${esc(V.tradeName)}</span></div>`;
  /* "Todos" picked = PosDao.kt:334 getAllProducts "ORDER BY name ASC" (binary), split by ServicesLibrarySplit.kt; the owner's menu
     order (MenuOrder.inCategory) only when the trade chip is picked (ProductLibraryView.kt:216-220). Round 3 fix: the page used the menu order. */
  const grid = `<div class="vgrid">${V.services.slice().sort((a, b) => a.name < b.name ? -1 : a.name > b.name ? 1 : 0).map(svcTile).join("")}</div>`;
  const foot = `<div class="vfoot"><div class="vkey"><span>${esc(t("scan_row_manual"))}</span></div>
    ${n?`<div class="cstrip"><span>${esc(tp(allSvc(lines) ? "home_current_sale_services" : "home_current_sale_items", n, n))}</span><i>›</i></div>`:""}
    <div class="vpair"><div class="sb sec pill${n?"":" off"}" data-t="book"><span>${esc(t(V.isOrder ? "services_action_crear_orden" : "services_action_agendar"))}</span></div>
    <div class="sb pri pill${n?"":" off"}" data-t="charge"><span>${esc(t("common_charge", money(tot)))}</span></div></div></div>`;
  return tabs + edit + chips + grid + foot + nav("caja");
}

/* ======== the pay screen: CheckoutSheetBody.kt:1040-1240 (phone) + CheckoutPayBlock.kt:143-470.
   SERVICES: no Save / Fiar button at all (hasSaveTicketButton = false, CheckoutSheetBody.kt:138, 1230): the tinted bottom
   section holds only the client field. A booking being charged shows the amber open-ticket bar (OpenTicketBanner.kt:36-110,
   label = the client's name, "Salir") in that section (CheckoutSheetBody.kt:438-455) and no "Borrar" link (:1084).
   Ways to pay drawn by sync/PayWaysVisibility.kt:54-83: QR when switched on and its photo saved; Card when on and
   connected (Stripe: the big button, weights Exacto 1.2 · QR 1 · Tarjeta 2, CheckoutPayBlock.kt:302-311); the owner's
   set-up link only for what is missing, and (Stripe connected, a phone that can tap) "Cobrar con enlace": round 3 (R2-1 item 7,
   Arreglo 15 F8, CheckoutSheetBody.kt:490-518 setupLink2 + CheckoutPayBlock.kt:467-476 SetupLinkRow) both can show, each on its
   own 44 dp row, the set-up link first. The items link says "Servicios (N)" for a sale of services only (:245-250, item 14).
   o = {lines, qr, card:"none"|"ready"|"setup", others, customer, banner, typed, cardLink} ======== */
function payScreen(o){
  const total = saleTotal(o.lines), due = cashDue(total), typed = o.typed||"";
  const qrOn = QRC && !!o.qr, cardOn = o.card==="ready" || o.card==="setup", cardReady = o.card==="ready";
  const cardPrimary = STRIPE && cardReady;
  const qrNotSetUp = !o.qr, cardNotSetUp = WOMPI && !cardReady;
  let link = null;
  if(QRC && (qrNotSetUp || cardNotSetUp)){
    link = WOMPI ? (qrNotSetUp && cardNotSetUp ? "pay_setup_link_qr_card" : cardNotSetUp ? "pay_setup_link_card" : "pay_setup_link_qr") : (PIX ? "pay_setup_link_pix" : "pay_setup_link_qr");
  }
  const link2 = cardReady && STRIPE && o.cardLink ? "pay_card_link_under" : null;   // its own row, no "No, gracias"
  let rc = "";
  if(typed){ const v = Number(typed); const ch = v - due;
    rc = `<div class="ln"><small>${esc(t("checkout_received_label"))}</small><b>${money(v)}</b></div>` +
      (ch >= -1e-9 ? `<div class="ln"><small>${esc(t("checkout_change_row_label"))}</small><b class="chg">${money(ch)}</b></div>`
                   : `<div class="short">${esc(t("cash_shortfall", money(-ch)))}</div>`); }
  const keys = ["1","2","3","4","5","6","7","8","9",DECKEY,"0","⌫"];
  const enough = !typed || Number(typed) >= due-1e-9;
  const cashW = cardPrimary ? 1.2 : (cardOn && qrOn) ? 1.3 : qrOn ? 2 : 1;
  const exactLabel = cardOn ? t("cash_exact_short") : t("cash_exact", money(due));
  let btns = `<div style="flex:${cashW}" class="${!typed?"exact":enough?"cash":"dis"}" data-t="${typed?"cash":"exact"}">${esc(typed?t("checkout_cash_label"):exactLabel)}</div>`;
  if(qrOn) btns += `<div style="flex:1" class="ob" data-t="qr"><i class="x-qrg"></i>${esc(PIX?"Pix":t("pay_qr_short"))}</div>`;
  if(cardOn) btns += cardReady ? `<div style="flex:${cardPrimary?2:1}" class="ob" data-t="card">${J.card}${esc(t("pay_card_short"))}</div>`
                               : `<div style="flex:1" class="nudge" data-t="card-setup"><span>+ ${esc(t("pay_card_short"))}</span><small>${esc(t("pay_card_setup_hint"))}</small></div>`;
  const rounding = Math.abs(due-total) > 1e-9 ? `<div class="x-round">${esc(t("cash_rounding_line", (due-total<0?"-":"+")+money(Math.abs(due-total))))}</div>` : "";
  const itemsWord = allSvc(o.lines) ? `${t("home_tab_services")} (${unitCount(o.lines)})` : t("checkout_items_link", unitCount(o.lines));
  const links = `<span>${esc(itemsWord)} ›</span>` +
    (o.others ? `<span class="oth" data-t="other">${J.more}<span>${esc(t("checkout_other_method", o.others))}</span></span>` : "");
  const banner = o.banner ? `<div class="v-otb"><b>${esc(o.banner)}</b><span>${esc(t("open_ticket_exit"))}</span></div>` : "";
  return `<div class="x-phd"><span class="chev">‹</span><span class="wm">Platata</span>${o.banner?"":`<span class="clr">${esc(t("checkout_clear"))}</span>`}</div><div class="grow"></div>
    <div class="x-pb"><div class="x-tot"><small>${esc(t("common_total"))}</small><b>${money(total)}</b></div>${rounding}
    <div class="x-amt"><div class="x-links">${links}</div><div class="x-rc">${rc}</div></div>
    <div class="x-kp">${keys.map(k=>`<span class="${k===DECKEY||k==="⌫"?"s":""}" data-t="key-${k}">${esc(k)}</span>`).join("")}</div>
    <div class="x-btns">${btns}</div>
    ${link?`<div class="x-slink"><span data-t="slink">${esc(t(link))}</span><span>${esc(t("pay_setup_link_dismiss"))}</span></div>`:""}${link2?`<div class="x-slink"><span data-t="slink2">${esc(t(link2))}</span></div>`:""}${!link && !link2?`<div style="height:calc(var(--u)*14)"></div>`:""}</div>
    <div class="x-sec">${banner}${custField(o.customer)}</div>`;
}

/* ======== Sale complete: ReceiptOptionsScreen.kt:185-470. hero: {kind:"exact",received} | {kind:"change",change,received} |
   {kind:"title"} | {kind:"card",line}; the card line (brand ••last four) when the gateway gave one: Wompi does, and since
   round 3 (37db6d6c, R2-1 item 7) a Stripe Tap to Pay sale does too (StripePaymentActions.kt reads card_present's brand and
   last four, TerminalReaderManager.kt), so "VISA ••4242" shows under "Pago aprobado". ======== */
function doneScreen(hero, o){ o=o||{};
  let b = `<img src="${ASSET.pot.celebrating}" alt="">`;
  if(hero.kind==="change") b += `<div class="lbl">${esc(t("receipt_opt_change_label"))}</div><div class="big">${money(hero.change)}</div><div class="sub">${esc(t("receipt_opt_tendered", money(hero.received)))}</div>`;
  else if(hero.kind==="exact") b += `<div class="ttl">${esc(t("receipt_opt_completed"))}</div><div class="sub">${esc(t("receipt_opt_received", money(hero.received)))}</div>`;
  else if(hero.kind==="card") b += `<div class="ttl">${esc(t("receipt_opt_completed"))}</div><div class="ok">${esc(t("card_approved_title"))}</div>${hero.line?`<div class="sub">${esc(hero.line)}</div>`:""}`;
  else b += `<div class="ttl">${esc(t("receipt_opt_completed"))}</div>`;
  b += `<div class="q">${esc(t("receipt_opt_how_receipt"))}</div>`;
  let f = TEXT_ROUTE ? `<div class="b pri" data-t="text">${esc(t("receipt_text_receipt"))}</div><div class="b ol" data-t="email">${esc(t("receipt_email_receipt"))}</div>`
                     : `<div class="b wa" data-t="wa">${esc(t("receipt_opt_whatsapp_btn"))}</div>`;
  if(o.printer) f += `<div class="b ol" data-t="print">${esc(t("receipt_print_again"))}</div>`;
  f += `<div class="b ol" data-t="view">${esc(t("receipt_opt_show_receipt"))}</div><div class="b pri" data-t="new">${esc(t(o.printer?"receipt_opt_new_sale":"receipt_opt_new_sale_no_receipt"))}</div><div class="pv">${esc(t("receipt_opt_privacy"))}</div>`;
  return `<div class="x-sc-body">${b}</div><div class="x-sc-foot">${f}</div>`;
}
/* ======== the receipt the client gets: utils/ReceiptFormatter.kt:343-470 generatePastPlainTextReceipt, built from the
   STORED sale (CheckoutActions.kt:667-669): store name = the business (SeedStore.kt:78), "Venta #N", the date
   (dd/MM/yyyy HH:mm, US/CA month first :186), each line "1x Cepillado (Largo)" with its option (item 13), "@ $x c/u",
   the paid options with "+", the included ones as "Lavado profundo (Incluido)" (ModifierLines.split, item 45; MoneyLines.kt:113
   includedLine: no suffix when the name already says "incluido", R2-3 item 29), Subtotal, NO "En el local" line any more
   (whereModeLine :90-104 returns null for LOCAL, R2-4 item 15), the tip (card), TOTAL, the card line, "Atendió: Carla" when the sale settles a booking that named someone
   (ReceiptBuilder.kt:84-85, item 21), the change, the method, the shop's footer ("¡Gracias por tu visita!",
   receipt_footer_default seeded by ReceiptFooterSeed.kt). o = {method, performer, tip, cardLine, received, no} ======== */
const DATE = (CC==="US"||CC==="CA") ? "10/22/2026 12:41" : "22/10/2026 12:41";
function receiptText(lines, o){ o=o||{};
  const each = t("receipt_label_each"), total = saleTotal(lines), tip = o.tip||0;
  let s = `${C.place}\n${t("receipt_label_order_number")}${o.no||C.sales.length+1}\n${t("receipt_label_date")}: ${DATE}\n===============================\n`;
  lines.forEach(l=>{ const x = svcLine(l);
    s += `${x.qty}x ${x.name}\n   @ ${money(x.unit)} ${each} ... ${money(x.unit*x.qty)}\n`;
    x.paid.forEach(m => { s += `   + ${m}\n`; });
    x.incl.forEach(m => { s += `   ${/inclu/i.test(m) ? m : `${m} (${t("common_included")})`}\n`; }); });
  s += `-------------------------------\n${t("receipt_label_subtotal")}: ${money(total)}\n`;
  /* the where line: R2-4 item 15 (ReceiptFormatter.kt:98-101): "En el local" is never printed; only a free home visit or pickup would be */
  if(tip) s += `${t("receipt_label_tip")}: ${money(tip)}\n`;
  s += `===============================\n${t("receipt_label_total")}: ${money(total + tip)}\n`;
  const due = cashDue(total);
  if(o.cash && Math.abs(due-total) > 1e-9){ s += `${t("receipt_label_cash_rounding")}: ${(due-total<0?"-":"+")+money(Math.abs(due-total))}\n${t("receipt_label_cash_total")}: ${money(due)}\n`; }
  if(o.cardLine) s += o.cardLine + "\n";

   draws a NEW QR that carries the sale total (QrPaymentOverlay.kt:180-185, PixBrCode.withAmount) */
function fakeQr(seed, mod){ mod = mod||29; let x = seed>>>0 || 7; const rnd = () => (x = (x*1103515245+12345)>>>0, (x>>>16)&1);
  let r = ""; const fp = (cx,cy)=>{ r += `<rect x="${cx}" y="${cy}" width="7" height="7" fill="#000"/><rect x="${cx+1}" y="${cy+1}" width="5" height="5" fill="#fff"/><rect x="${cx+2}" y="${cy+2}" width="3" height="3" fill="#000"/>`; };
  for(let yy=0; yy<mod; yy++) for(let xx=0; xx<mod; xx++){ const inF = (xx<8&&yy<8)||(xx>=mod-8&&yy<8)||(xx<8&&yy>=mod-8); if(!inF && rnd()) r += `<rect x="${xx}" y="${yy}" width="1" height="1" fill="#000"/>`; }
  fp(0,0); fp(mod-7,0); fp(0,mod-7);
  return `<svg viewBox="-2 -2 ${mod+4} ${mod+4}" shape-rendering="crispEdges"><rect x="-2" y="-2" width="${mod+4}" height="${mod+4}" fill="#fff"/>${r}</svg>`; }

  }
  let body = "";
  if(st.sstage==="idle") body = `<div class="x-spin s48"></div><div class="bm">${esc(t("stripe_starting_title"))}</div>`;
  if(st.sstage==="collect") body = `<div class="hs">${esc(t("stripe_present_tap"))}</div><div class="sb" style="align-self:stretch">${esc(t("stripe_cancel"))}</div>`;

}
