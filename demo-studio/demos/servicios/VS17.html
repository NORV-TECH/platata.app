function tradePicker(o){
  o = o||{};
  const q = (o.query||"").trim().toLocaleLowerCase(AL);
  /* TradeAliases / filterTrades: the name or an alias contains the query (the demo only ever types a trade's own name) */
  const shown = TRADES.filter(x => !q || TRADE_NAME(x[0]).toLocaleLowerCase(AL).includes(q));
  const fams = ["BELLEZA","MASCOTAS","VEHICULOS"].filter(f => shown.some(x => x[2]===f));
  const grid = fams.map(f => { const F = FAMILY[f], list = shown.filter(x => x[2]===f);
    return `<div class="tfh"><i style="background:${F.main}"></i><b>${esc(t(F.name))}</b><small>${q ? list.length : FAMILY_COUNT[f]}</small></div>
      <div class="tgr">${list.map(x => { const on = o.picked===x[0];
        return `<div class="ttile${on?" on":""}" data-t="trade-${x[0]}" style="${on?`background:${F.soft};border-color:${F.main}`:""}">
          <span class="tib" style="background:${on?"#fff":F.soft}">${IC(x[1])}</span><b style="${on?`color:${F.ink}`:""}">${esc(TRADE_NAME(x[0]))}</b>${on?`<span class="tck">${pChk(true, F.main)}</span>`:""}</div>`; }).join("")}</div>`; }).join("");
  const lede = t(CO ? "trade_picker_lede" : "trade_picker_lede_no_prices");      // SVC-3 item 16 (TradePickerScreen.kt:180-186)
  const field = `<div class="tsearch${o.focus?" foc":""}" data-t="trade-search">${I.search}${o.query?`<span>${esc(o.query)}</span>${o.focus?'<i class="pcaret"></i>':""}`:`${o.focus?'<i class="pcaret"></i>':""}<em>${esc(t("trade_picker_search_hint"))}</em>`}</div>`;
  const btn = o.picked ? pBtn(t("trade_picker_continue", TRADE_NAME(o.picked)), "trade-go") : pBtn(t("trade_picker_continue_zero"), null, {off:true});
  return `<div class="ppage">
    <div class="tphead"><div class="tprow">${pProg(1, 3)}<span class="pstep">${esc(t("trade_picker_step_oficio"))}</span>${flagCircle(40)}</div>

    <div class="tpgrid">${grid}</div>
    <div class="pfoot c">${btn}<div class="tplinks">${pLink(t("trade_picker_my_trade_missing"), true)}${pLink(t("trade_picker_skip_for_now"))}</div></div></div>`;
}

/* ShrinkToFitText (ui/components/ShrinkToFitText.kt): one line, 1 sp smaller until it fits, never under 12 sp, then an ellipsis.
   Applied after every draw to the elements marked .fit (data-sp = the start size). */
function fitAll(){
  document.querySelectorAll("#app .fit").forEach(el => {
    let sp = +(el.dataset.sp || 16);
    el.style.fontSize = `calc(var(--u)*${sp})`;
    while(el.scrollWidth > el.clientWidth + 0.5 && sp > 12){ sp -= 1; el.style.fontSize = `calc(var(--u)*${sp})`; }
  });
}
