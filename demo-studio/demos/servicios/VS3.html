   (kit bookings of today) are charged in cash; at 19:40 the register is closed (VS10). ---- */
const OPENED = D(8,5), VS3_AT = D(12,41), OUT_AT = D(13,10), CLOSED = D(19,40);
const OPENING = C.openingCash;
const OUT = {CO:40000, MX:200, PE:40, CL:12000, EC:12, AR:20000, PA:12, BR:60, US:40, CA:40}[CC];   // the supplies errand (VS9)
/* the kit's pay kinds, as the app names them: US/CA have no QR (sync/QrCountries), so their "qr" is a card sale; "transfer"/"other" is a
   method the owner added ("Transferencia", pay_methods_example_transfer) */
const payKey = p => ((CC==="US"||CC==="CA") && p==="qr") ? "card" : (p==="transfer"||p==="other") ? "custom" : p;
const MORNING = C.sales.filter(s => s.d===V.today).map(s => ({total:s.total, pay:payKey(s.pay)}));
const AFTERNOON = C.bookings.filter(b => b.day===0 && b.price).map(b => ({total:b.price, pay:"cash"}));
const VS3_SALE = {total:RING_PRICE, pay:"cash"};
const sumPay = (list, key) => r2(list.filter(s => !key || s.pay===key).reduce((a,s)=>a+s.total, 0));
/* the sales of the shift up to a moment: "noon" = before VS3, "after3" = with VS3, "night" = the whole day */
const SALES_AT = when => when==="noon" ? MORNING : when==="after3" ? MORNING.concat([VS3_SALE]) : MORNING.concat([VS3_SALE], AFTERNOON);
const METHOD_ORDER = ["cash","qr","card","custom"];
const methodName = k => k==="cash" ? t("payment_method_cash") : k==="qr" ? (K.cur==="BRL" ? "Pix" : t("payment_method_qr"))
                      : k==="card" ? t("payment_method_card") : t("pay_methods_example_transfer");   // utils/PaymentMethodLabels.kt:96-110
const methodsOf = list => METHOD_ORDER.map(k => ({k, total:sumPay(list, k)})).filter(m => m.total>0);

/* SumaTopBar (ui/components/SumaTopBar.kt): 64 dp, back arrow 48 dp, titleLarge 22sp bold */
const topbar = (title, o={}) => `<div class="tb">${o.noBack?"":`<span class="ib" data-t="${o.backT||"back"}">${o.close?I.close:I.back}</span>`}<div class="tt">${o.html||esc(title)}</div>${o.action||""}</div>`;
/* SumaButton (ui/components/SumaButton.kt): 52 dp min, shapes.medium r12 (pill = extraLarge), titleMedium SemiBold; Secondary = outlined */

/* CashKeypad (ui/screens/cash/OpenRegisterScreen.kt:189-262): 4 rows sharing the height, 48..72 dp, 4 dp gaps, grey keys r12, headlineLarge bold */
const keypad = (pre, rowH) => { const rows=[["1","2","3"],["4","5","6"],["7","8","9"],["z","0","del"]];
  return `<div class="ck" style="--kh:${rowH||64}">${rows.map(r=>`<div class="kr">${r.map(k=>`<span data-t="${pre}-${k}">${k==="del"?I.bksp:k==="z"?esc(ZKEY):k}</span>`).join("")}</div>`).join("")}</div>`; };
/* owner bottom NavigationBar (PlatataApp.kt:525-700): Caja (ShoppingCart), Agenda (NavLabels.kt:24-26, a services shop), the flag "Mi negocio" */
const nav = (on, o={}) => `<div class="mnav">
  <div class="${on==="caja"?"on":""}" data-t="nav-caja"><span class="pill">${I.cart}</span>${esc(t("mamaship_tab_register"))}</div>

/* text width in dp with the app's font (Roboto), for ShrinkToFitText (ui/components/ShrinkToFitText.kt: starts at the style's size, steps
   down 1 sp while it overflows, never under 12 sp, then ellipsis) */
const _cv = document.createElement("canvas").getContext("2d");
const textW = (txt, px, weight, ls) => { _cv.font = `${weight||400} ${px}px Roboto, system-ui, sans-serif`; return _cv.measureText(txt).width + (ls||0)*txt.length; };
const shrinkFs = (txt, room, start, weight, ls) => { let f = start||16; while(f > 12 && textW(txt, f, weight, ls) > room) f--; return f; };
/* ServiceTileBody (ProductCard.kt:262-342): tile = (412 - 2*16 padding - 2*8 gaps) / 3 wide, 12 dp padding inside; price row = the price
   (ShrinkToFitText bodyLarge bold, weight(1f, fill=false)) + 8 dp + "30 min" (bodySmall) */
const TILE_IN = (412 - 32 - 16) / 3 - 24;
const tile = s => { const pl = svcPriceLabel(s), mins = s.min ? `${s.min} ${t("opt_min")}` : "";
  const room = TILE_IN - (mins ? textW(mins, 12, 400, .4) + 8 : 0), fs = shrinkFs(pl, room, 16, 700, .5);
  return `<div class="vtile" data-t="svc-${s.id}"><span class="ib" style="background:${TRADE_TILE}">${TRADE_SVG}</span>
  <b>${esc(s.name)}</b><div class="pr"><b style="font-size:calc(var(--u)*${fs})">${esc(pl)}</b>${mins?`<small>${esc(mins)}</small>`:""}</div></div>`; };

/* the M3 Switch (Material3 defaults over the light scheme): checked = primary track + white 24 dp thumb */
const sw = (on, tag) => `<div class="rsw${on?" on":""}"${tag?` data-t="${tag}"`:""}><i></i></div>`;
/* OptionSelectionSheet.kt:186-330: ModalBottomSheet, 16 dp sides; title = the service (titleLarge bold); one block per option set
   (its name titleSmall grey, then the row: "Lavado" ON (included), a priced add-on "· +$X" OFF, an unpriced one "· se pregunta en la caja"

/* ---------- Register screen (ui/screens/cash/RegisterStatusScreen.kt:140-505), one register: no tab row. Top bar: ‹ Hoy · 22 oct › +
   "Reportes"; pill "● ABIERTA"; info card (Abierta / Abierta por); drawer card (Efectivo inicial, Ventas en efectivo (esta caja), one line per
   cash in/out with "Anular", Debe haber en la caja); Sacar efectivo / Meter efectivo (Secondary, owner phone); the money card (RegisterMethodMoneyCard
   :674-738: each method with its collector under it, "Todo el efectivo desde que abrió" for the cash line, Total cobrado); Historial de caja;
   Cerrar caja. o = {when, moves:[{amount,at,isNew}], scroll, snack, flash} ---------- */
function registerScreen(o){
  const sales = SALES_AT(o.when), cashSales = sumPay(sales, "cash");
  const moves = o.moves||[];
  const out = moves.reduce((a,m)=>a+m.amount, 0);
  const exp = r2(OPENING + cashSales - out);
  const mv = moves.map(m=>`<div class="mv${m.isNew?" new":""}"><span>${esc(t("cash_movement_out"))} · ${esc(t("cash_movement_reason_supplier"))} · ${esc(fmtTime(m.at))}</span><b class="out">-${money(m.amount)}</b><i>${esc(t("cash_movement_void"))}</i></div>`).join("");
  const tbar = topbar("", {html:`<div class="navd"><span class="dim">${I.chevL}</span><b>${esc(t("register_nav_today", shortDay(OPENED)))}</b><span class="dim">${I.chevR}</span></div>`,
                 action:`<span class="tba">${esc(t("register_status_full_reports"))}</span>`});
  const methods = methodsOf(sales);
  const mcard = methods.map(m => `<div class="lr ms"><span>${esc(m.k==="cash" ? t("register_status_cash_all") : methodName(m.k))}</span><span>${money(m.total)}</span></div>
      <div class="lr ind"><span>${esc(OWNER)}</span><span>${money(m.total)}</span></div>`).join("");
  const body = `<div class="rs" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <div class="pillrow"><span class="spill">${esc(t("register_status_pill_open"))}</span></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_opened_at"))}</span><span>${esc(fmtDT(OPENED))}</span></div>
      <div class="lr"><span>${esc(t("register_status_opened_by"))}</span><span>${esc(OWNER)}</span></div></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_starting_cash"))}</span><span>${money(OPENING)}</span></div>
      <div class="lr"><span>${esc(t("register_status_cash_sales_here"))}</span><span>${money(cashSales)}</span></div>
      ${mv}<hr><div class="lr em${o.flash?" flash":""}"><span>${esc(t("register_status_expected"))}</span><span class="pri">${money(exp)}</span></div></div>
    ${btn(t("cash_movement_out"),"sec","cash-out")}${btn(t("cash_movement_in"),"sec","cash-in")}
    <div class="scard">${mcard}<hr><div class="lr em"><span>${esc(t("reports_total_collected"))}</span><span>${money(sumPay(sales))}</span></div></div>
    <div class="hist">${I.clock}<span>${esc(t("register_list_title"))}</span></div>
    ${btn(t("register_status_close_btn"),"sec","close-reg")}<div style="height:calc(var(--u)*16)"></div></div>`;
  return `<div class="pg">${tbar}<div class="pscroll">${body}</div>${o.snack?`<div class="msnack" style="bottom:calc(var(--u)*16)">${esc(t("cash_movement_saved"))}</div>`:""}</div>`;
}
/* how far (dp) the scrolled page on screen can move: its content minus the room it has (a Column with verticalScroll stops at the end) */
const maxScrollDp = () => { const rs = document.querySelector(".pscroll .rs"); if(!rs) return 0; const ps = rs.parentElement, u = ps.getBoundingClientRect().width / 412;
  return Math.max(0, Math.round((rs.scrollHeight - ps.clientHeight) / u)); };
/* a scrolled list slides (transform .5s); once it stops, ask the engine to put the tap ring on the target again (it listens to resize) */
document.addEventListener("transitionend", e => { if(e.propertyName==="transform") window.dispatchEvent(new Event("resize")); });

/* ===== VS3 ===== */
/* VS3 "Cobrar en efectivo" as a SERVICES business (Peluquería; ?biz= works for the other three), on the OWNER phone, register open.
   Every country, es/pt/en. Screens at sim/usa-canada 73c65f08 (paths under app/src/main/java/com/example/):
   services Home        see the common block; a tile tap -> CartActions.handleProductClick :483-499 -> the option sheet
   option sheet         ui/screens/home/OptionSelectionSheet.kt:186-330 ("Lavado" included ON, the unpriced add-on "se pregunta en la caja" OFF,
                        "Agregar a la venta · $X" = basePrice + the ticked add-ons: SVC-1 item 1, verified fixed)
   Cobrar               HomeScreen.kt:706-718 openPayScreen (register open: straight to the pay screen; closed: Abrir caja, SVC-1 item 22)
   pay screen           ui/screens/home/CheckoutSheetBody.kt + CheckoutPayBlock.kt:150-500 (Total; "Artículos (1) ›", "Otro método de pago (1)"
                        = Cortesía; Recibido / Cambio; the keypad, "000" in COP/CLP else the decimal mark; Exacto -> Efectivo; QR / card by
                        sync/PayWaysVisibility.kt: CO no card connected -> "Configurar QR o tarjeta", BR "Configurar Pix", MX/US/CA Stripe card
                        connected -> Card is the big button (cardIsPrimary, :260) and Exacto shrinks; the cash rounding line in CL/PE/CA
                        (utils/CashRounding.kt, FIX-3 item 4)). Services: no Save / Fiar (ServicesRules.hasSaveTicketButton = false,
                        fiadoEnabled = false); the "¿Dónde se hace?" chips only when 2-3 ways of working are on (the demo salon: only in the shop)
   Sale complete        ui/screens/home/ReceiptOptionsScreen.kt:270-450 (CAMBIO hero, "¿Cómo envías el recibo?", WhatsApp (US/CA: text / email),
                        Ver recibo, "Nueva venta · Sin recibo", Aviso de privacidad) */
const L = LG;
const STRIPE = CC==="US" || CC==="CA" || CC==="MX";      // CardCountryGate: Stripe in the US, Canada and Mexico (STRIPE-MX-1)
const WOMPI = CC==="CO";
const PIX = K.cur==="BRL";
const QR_COUNTRY = !(CC==="US" || CC==="CA");              // sync/QrCountries
const TEXT_ROUTE = CC==="US" || CC==="CA";                // sync/ReceiptSendRoute: own {US, CA} set
/* utils/CashRounding.kt: CL to $10 (1-5 down, 6-9 up), PE always down to S/ 0.10, CA to the nearest 5 cents. Cash only. */
function cashDue(v){
  if(CC==="CL"){ const r = Math.round(v) % 10; return r<=5 ? Math.round(v)-r : Math.round(v)-r+10; }
  if(CC==="PE") return Math.floor(v*10+1e-6)/10;
  if(CC==="CA") return Math.round(v*20)/20;
  return v;
}
const DECKEY = ZKEY;
/* what the client hands over: the next round note above what is due */
function received(due){ let k = 1; while(k*10 <= due) k *= 10; for(const m of [1,2,5,10]) if(m*k > due+1e-9) return m*k; return 10*k; }
function payKeys(v){ return (K.dec===0 && v>=1000 && v%1000===0) ? [...String(v/1000), "000"] : [...String(v)]; }
const typedValue = s => s ? Number(s) : 0;
const J = {
  person:'<svg class="i" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>',
  more:'<svg viewBox="0 0 24 24"><path d="M6 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm12 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm-6 0c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>',
  card:'<svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>'
};
const X = h => `<div class="x">${h}</div>`;
/* ---------- the pay screen (one service in the sale) ---------- */
function payScreen(o){
  const total = o.total, due = cashDue(total), typed = o.typed||"";
  const cardReady = STRIPE;                                  // MX/US/CA: the salon's Stripe account is connected; CO: no Wompi key yet
  const cardPrimary = STRIPE && cardReady;
  /* PayWaysVisibility.decide: owner, a QR country, QR not set up (and in Colombia the card neither) -> one small link */
  const link = !QR_COUNTRY ? null : WOMPI ? "pay_setup_link_qr_card" : PIX ? "pay_setup_link_pix" : "pay_setup_link_qr";
  let rc = "";
  if(typed){ const v = typedValue(typed); const ch = v - due;
    rc = `<div class="ln"><small>${esc(t("checkout_received_label"))}</small><b>${money(v)}</b></div>` +
      (ch >= -1e-9 ? `<div class="ln"><small>${esc(t("checkout_change_row_label"))}</small><b class="chg">${money(ch)}</b></div>`
                   : `<div class="short">${esc(t("cash_shortfall", money(-ch)))}</div>`); }
  const keys = ["1","2","3","4","5","6","7","8","9",DECKEY,"0","⌫"];
  const enough = !typed || typedValue(typed) >= due-1e-9;
  const cashW = cardPrimary ? 1.2 : 1;
  const exactLabel = cardReady ? t("cash_exact_short") : t("cash_exact", money(due));
  let btns = `<div style="flex:${cashW}" class="${!typed?"exact":enough?"cash":"dis"}" data-t="${typed?"cash":"exact"}">${esc(typed?t("checkout_cash_label"):exactLabel)}</div>`;
  if(cardReady) btns += `<div style="flex:${cardPrimary?2:1}" class="ob" data-t="card">${J.card}${esc(t("pay_card_short"))}</div>`;
  const rounding = Math.abs(due-total) > 1e-9 ? `<div class="x-round">${esc(t("cash_rounding_line", (due-total<0?"-":"+")+money(Math.abs(due-total))))}</div>` : "";
  const links = `<span>${esc(t("checkout_items_link", 1))} ›</span><span class="oth" data-t="other">${J.more}<span>${esc(t("checkout_other_method", 1))}</span></span>`;

  if(st.screen==="pay") return X(payScreen({total:TOTAL, typed:st.typed}));

}

  state:{screen:"home", count:0, sheet:null, typed:"", change:0, got:0},

  ]
});
