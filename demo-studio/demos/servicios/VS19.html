// PLURALS: home_clientes_count,home_equipo_count_phones,home_equipo_on_phones
/* the money the register card and Reportes show: this morning's sales of the demo business (kit: C.sales of V.today) */
const TODAY_SALES = C.sales.filter(s => s.d === V.today).reduce((a, s) => a + s.total, 0);
function panelRow(tag, icon, title, sub, o){ o = o || {};
  return `<div class="sv-wr${o.cls?" "+o.cls:""}"${tag?` data-t="${tag}"`:""}><span class="ic">${icon}${o.dot?'<i class="pdot"></i>':""}</span><div class="tx"><b>${esc(title)}</b><small>${esc(sub||"")}</small></div>${o.trail||`<span class="ch">${I("chev")}</span>`}</div>`; }
/* p = {team, phones, payDot, scroll} */
function panel(p){ p = p || {};
  const team = p.team != null ? p.team : C.staff.length, phones = p.phones || 0;
  const reg = `<div class="sv-wr reg" data-t="reg-card" style="background:#E8F5E9;color:#2E7D32"><span class="dot">●</span><div class="tx"><b>${esc(S("workspace_register_open"))}</b><small style="color:rgba(46,125,50,.7)">${esc(S("workspace_register_sales"))}</small></div><b class="amt">${money(TODAY_SALES)}</b></div>`;
  return `<div class="sv-panel"><div class="ph"><b>${esc(V.place)}</b>${I("down")}</div><div class="pl"><div class="pin" style="transform:translateY(calc(var(--u)*${-(p.scroll||0)}))">
    ${reg}
    ${panelRow("row-online", I("cart"), S("sell_online_title"), S("sell_online_row_off"), {trail:`<span class="pill0">${esc(S("sell_online_pill_off"))}</span>`})}
    <div class="eh">${esc(S("panel_heading_every_day"))}</div>
    ${panelRow("row-clients", I("person"), S("more_customers_title"), PL("home_clientes_count", C.clients.length))}
    ${panelRow("row-invoices", I("rlong"), S("invoices_title"), S("invoices_row_first"))}
    ${panelRow("row-team", I("group"), S("more_team_title"), PL("home_equipo_count_phones", team, team, PL("home_equipo_on_phones", phones)), {dot:p.payDot})}
    ${panelRow("row-reports", I("rlong"), S("workspace_full_reports"), F(FREE ? "scan_row_reports_today" : "scan_row_reports_today_net", money(TODAY_SALES)))}
    <hr>
    ${panelRow("settings", I("gear"), S("settings_title"), S("panel_settings_row_sub"))}

/* the service's option sets, as the setup writes them (GuideActions.ensureResearchedOptions + ui/ResearchedOptionStates.kt): every
   "Lo que trae" (INCLUIDO) and every "Cobra más" (AGREGAR) is ITS OWN set, displayName = its name, one value with the same name;
   an included one rides at 0 (switch ON), a priced add-on is OFF, an add-on with no price asks at the till, a per-unit one says "por …" */
function optionSets(s){
  return s.included.map(x => ({name:x.name, price:0, inc:true})).concat(s.extras.map(x => ({name:x.name, price:x.price, per:x.per, ask:x.price == null})));
}
function optRowText(set){
  if(set.inc) return set.name;
  if(set.ask) return `${set.name} · ${S("opt_ask_at_till_row")}`;
  if(set.per) return `${set.name} · ` + F("opt_per_unit_each", money(set.price), set.per);
  return `${set.name} · +${money(set.price)}`;
}
/* o = {base (the line price), deal (show "Agregar oferta"), scroll, addTag, dealTag} */
function optSheet(s, o){ o = o || {};

  const add = `<div class="sv-btn pri" data-t="${o.addTag||"opt-add"}">${esc(total ? F("opt_add_to_sale", money(total)) : S("common_add"))}</div>`;
  const deal = o.deal ? `<div class="sv-btn sec" data-t="${o.dealTag||"opt-deal"}">${esc(S("deal_choice_add_deal"))}</div>` : "";

    <h3>${esc(s.name)}</h3>${body}${add}${deal}</div></div></div>`; }

/* ShrinkToFitText (ui/components/ShrinkToFitText.kt): one line, the font steps down 1 sp at a time to 12 sp, then "…" */
function fitShrink(){
  document.querySelectorAll('#app [data-fit]').forEach(el => {
    let s = +el.dataset.fit; el.style.fontSize = `calc(var(--u)*${s})`;
    while(el.scrollWidth > el.clientWidth + 0.5 && s > 12){ s--; el.style.fontSize = `calc(var(--u)*${s})`; }

/* demo plumbing only (not an app screen): each tap keeps the engine busy until its last scheduled change has settled */
function settled(steps){
  return steps.map(s => Object.assign({}, s, {tap(st, E){
    let last = 0;
    const E2 = Object.create(E);
    E2.after = (ms, fn) => { last = Math.max(last, ms); return E.after(ms, fn); };
    E2.type = (key, text, done, ms) => { last = Math.max(last, (String(text).length + 1) * (ms || 45)); return E.type(key, text, done, ms); };
    s.tap(st, E2);
    E.after(last + 450, () => {});
  }}));
}
/* how far (dp) a scrolled column must move so that `sel` sits inside `box` (both CSS selectors under #app) */
function scrollNeed(sel, box, margin){
  const el = document.querySelector('#app ' + sel), pg = document.querySelector('#app ' + box); if(!el || !pg) return 0;
  const u = document.getElementById('screen').getBoundingClientRect().width / 412;
  const over = el.getBoundingClientRect().bottom - pg.getBoundingClientRect().bottom + (margin == null ? 16 : margin) * u;
  return over > 0 ? Math.ceil(over / u) : 0;
}

  const box = i => `<span class="cs${i===act?" on":""}">${code[i] ? esc(code[i]) : (i===act ? '<i class="ct"></i>' : "")}</span>`;
  const grp = s => `<div class="cg">${[0,1,2,3,4].map(k => box(s + k)).join("")}</div>`;
  const pact = st.focus === "pin" && pin.length < 4 ? pin.length : -1;
  const pbox = i => `<span class="ps${i===pact?" on":""}">${i < pin.length ? '<i class="dot"></i>' : (i===pact ? '<i class="ct"></i>' : "")}</span>`;
  const can = code.length > 0 && pin.length === 4;
  return `<div class="jn"><div class="sv-ptop"><span class="pib">${I("back")}</span></div><div class="jb">
    <div class="h1">${esc(S("join_biz_title"))}</div><p class="sub">${esc(S("join_biz_sub"))}</p>

}

function miniSell(st){
  const tabs = [S("home_tab_services"), S("home_tab_products"), S("tx_tab_all"), S("sx_agenda")];
  const tabRow = `<div class="mp-tabs">${tabs.map((t,i) => `<span class="${i===0?"on":""}">${esc(t)}</span>`).join("")}</div>`;
  /* every category, the system one too, ORDER BY sortOrder (0), name; colour = CategoryChipPalette[id % 10] (id 1 = the
     system "Otros servicios" made with the shop, id 2 = the trade category of the setup) */
  const cats = [{n:S("services_cat_other"), c:"#4FC3F7"}, {n:V.tradeName, c:CAT_COLOR}].sort((a, b) => a.n < b.n ? -1 : a.n > b.n ? 1 : 0);
  const chip = (n, col, on) => `<span style="${on ? `background:${hexA(col,.22)};border:calc(var(--u)*1.5) solid ${col};color:${col}` : `background:${hexA(col,.05)};border:1px solid ${hexA(col,.3)};color:var(--m-onv)`}">${on?I("check"):""}${esc(n)}</span>`;
  const chipRow = `<div class="sv-chips">${chip(S("items_filter_all"), ALL_COLOR, true)}${cats.map(c => chip(c.n, c.c, false)).join("")}</div>`;
  const grid = `<div class="sv-grid mp-grid"><div class="in" style="transform:translateY(calc(var(--u)*${-(st.gsc||0)}))">${SERVICES.map(plainTile).join("")}</div></div>`;
  const total = st.added ? SVC_PRICE : 0;
  const foot = `<div class="sv-foot"><div class="lk"><span>${esc(S("scan_row_manual"))}</span></div>
    <div class="pair"><span class="sec${total?"":" off"}">${esc(BOOK_WORD())}</span><span class="pri${total?"":" off"}"><small>${esc(F("common_charge","").trim())}</small> ${esc(money(total))}</span></div></div>`;
  let over = "";
  if(st.sheet === "var") over = varSheet(SVC, "var");
  else if(st.sheet === "opt") over = optSheet(SVC, {base: SVC_PRICE});
  return `<div class="sv-caja">${tabRow}${chipRow}${grid}${foot}</div>` + navMini() + over;
}

    case "panel": h = panel({team: TEAM.length, phones: 0}); break;
