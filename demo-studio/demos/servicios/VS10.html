/* ---- the business (kit) ---- */
const OWNER = C.owner;                                   // the owner's name: register openings / closings / sales are saved with it (FIX-3 item 2, SVC-4)
/* the trade's drawn icon (ui/screens/tradepicker/TradeCatalogue.kt:38-58 TRADE_VISUAL, res/drawable/ic_drawn_*.xml, converted)
   and its family tile colour (PaperTheme.kt:93-99, PaperColor.kt:66-79: light --tile == the family's Soft) */
const TRADE_TILE = {peluqueria:"#F8E8EC", unas:"#F8E8EC", veterinaria:"#F0F2E3", "taller-motos":"#E8EBF4"}[V.biz];
const TRADE_SVG = TRADE_ICONS[V.biz];
/* the left footer word follows the trade (sync/ServiceActionLabel.kt, data/TradeFamily): "Crear orden" for a workshop, else "Agendar" */
const ACTION_WORD = t(V.isOrder ? "services_action_crear_orden" : "services_action_agendar");
/* the home grid shows the services in the owner's menu order; the trade name is the one category (GuideActions.kt:221-226) */
const SERVICES = C.services;
const svcPriceLabel = s => s.mode==="ask" ? t("items_price_unset") : s.mode==="from" ? t("items_price_from", money(s.price)) : money(s.price);

/* the one service each page rings. Peluquería: "Corte de caballero / hombre", a fixed price in every country with its researched options
   (Lavado + an unpriced add-on), so the tap opens the option sheet everywhere (CartActions.handleProductClick :490-499). The other ?biz=
   values ring a service from their first grid row; where it has choices (outside Colombia, kit) "Elige uno" opens first. */
const RING_ID = {peluqueria:"corte-caballero", veterinaria:"consulta-general", "taller-motos":"mantenimiento-preventivo", unas:"manicure-tradicional"}[V.biz];
const RING = SERVICES.find(s => s.id===RING_ID) || SERVICES.find(s => s.price!=null) || SERVICES[0];
const RING_CHOICE = RING.choices.length ? 0 : null;        // a service with choices opens "Elige uno" first (HomeScreen.kt:976-978)
const RING_PRICE = RING_CHOICE!=null ? (RING.choices[0].price || RING.price || 0) : (RING.price || 0);
const RING_HAS_OPTS = (RING.included.length + RING.extras.length) > 0;

/* ---- the day (the same in the four pages): opened at 8:05 with the kit's openingCash; this morning's sales are the kit's;
   at 12:41 a walk-in pays RING in cash (VS3); at 13:10 cash goes out for supplies (VS9); the afternoon's booked clients
   (kit bookings of today) are charged in cash; at 19:40 the register is closed (VS10). ---- */
const OPENED = D(8,5), VS3_AT = D(12,41), OUT_AT = D(13,10), CLOSED = D(19,40);
const OPENING = C.openingCash;
const OUT = {CO:40000, MX:200, PE:40, CL:12000, EC:12, AR:20000, PA:12, BR:60, US:40, CA:40}[CC];   // the supplies errand (VS9)
/* the kit's pay kinds, as the app names them: US/CA have no QR (sync/QrCountries), so their "qr" is a card sale; "transfer"/"other" is a
   method the owner added ("Transferencia", pay_methods_example_transfer) */
const payKey = p => ((CC==="US"||CC==="CA") && p==="qr") ? "card" : (p==="transfer"||p==="other") ? "custom" : p;
const MORNING = C.sales.filter(s => s.d===V.today).map(s => ({total:s.total, pay:payKey(s.pay)}));
const AFTERNOON = C.bookings.filter(b => b.day===0 && b.price).map(b => ({total:b.price, pay:"cash"}));
const VS3_SALE = {total:RING_PRICE, pay:"cash"};
const sumPay = (list, key) => r2(list.filter(s => !key || s.pay===key).reduce((a,s)=>a+s.total, 0));
/* the sales of the shift up to a moment: "noon" = before VS3, "after3" = with VS3, "night" = the whole day */
const SALES_AT = when => when==="noon" ? MORNING : when==="after3" ? MORNING.concat([VS3_SALE]) : MORNING.concat([VS3_SALE], AFTERNOON);
const METHOD_ORDER = ["cash","qr","card","custom"];
const methodName = k => k==="cash" ? t("payment_method_cash") : k==="qr" ? (K.cur==="BRL" ? "Pix" : t("payment_method_qr"))
                      : k==="card" ? t("payment_method_card") : t("pay_methods_example_transfer");   // utils/PaymentMethodLabels.kt:96-110
const methodsOf = list => METHOD_ORDER.map(k => ({k, total:sumPay(list, k)})).filter(m => m.total>0);

/* ---------- pieces ---------- */
/* SumaTopBar (ui/components/SumaTopBar.kt): 64 dp, back arrow 48 dp, titleLarge 22sp bold */
const topbar = (title, o={}) => `<div class="tb">${o.noBack?"":`<span class="ib" data-t="${o.backT||"back"}">${o.close?I.close:I.back}</span>`}<div class="tt">${o.html||esc(title)}</div>${o.action||""}</div>`;
/* SumaButton (ui/components/SumaButton.kt): 52 dp min, shapes.medium r12 (pill = extraLarge), titleMedium SemiBold; Secondary = outlined */
const btn = (text, kind, dt, o={}) => `<div class="sb ${kind||"pri"}${o.pill?" pill":""}${o.off?" off":""}" ${dt?`data-t="${dt}"`:""}>${o.icon||""}<span>${esc(text)}</span></div>`;
/* CashKeypad (ui/screens/cash/OpenRegisterScreen.kt:189-262): 4 rows sharing the height, 48..72 dp, 4 dp gaps, grey keys r12, headlineLarge bold */
const keypad = (pre, rowH) => { const rows=[["1","2","3"],["4","5","6"],["7","8","9"],["z","0","del"]];
  return `<div class="ck" style="--kh:${rowH||64}">${rows.map(r=>`<div class="kr">${r.map(k=>`<span data-t="${pre}-${k}">${k==="del"?I.bksp:k==="z"?esc(ZKEY):k}</span>`).join("")}</div>`).join("")}</div>`; };
/* owner bottom NavigationBar (PlatataApp.kt:525-700): Caja (ShoppingCart), Agenda (NavLabels.kt:24-26, a services shop), the flag "Mi negocio" */
const nav = (on, o={}) => `<div class="mnav">
  <div class="${on==="caja"?"on":""}" data-t="nav-caja"><span class="pill">${I.cart}</span>${esc(t("mamaship_tab_register"))}</div>
  <div class="${on==="agenda"?"on":""}" data-t="nav-agenda"><span class="pill">${I.receipt}</span>${esc(t("sx_agenda"))}</div>
  <div class="${on==="biz"?"on":""}" data-t="nav-biz"><span class="flagc${on==="biz"?" lit":""}">${o.locked?`<i class="fp">${I.fp}</i>`:V.flag()}</span>${esc(t("home_tab_my_business"))}</div></div>`;
/* RegisterClosedBar.kt: #FEF3C7 row, titleSmall bold #856404, orange pill "Abrir" (SumaWarning #FF9500) */
const closedBar = () => `<div class="cbar"><b>${esc(t("workspace_register_closed"))}</b><span data-t="bar-open">${esc(t("workspace_register_open_action"))}</span></div>`;
/* text width in dp with the app's font (Roboto), for ShrinkToFitText (ui/components/ShrinkToFitText.kt: starts at the style's size, steps
   down 1 sp while it overflows, never under 12 sp, then ellipsis) */
const _cv = document.createElement("canvas").getContext("2d");
const textW = (txt, px, weight, ls) => { _cv.font = `${weight||400} ${px}px Roboto, system-ui, sans-serif`; return _cv.measureText(txt).width + (ls||0)*txt.length; };
const shrinkFs = (txt, room, start, weight, ls) => { let f = start||16; while(f > 12 && textW(txt, f, weight, ls) > room) f--; return f; };
/* ServiceTileBody (ProductCard.kt:262-342): tile = (412 - 2*16 padding - 2*8 gaps) / 3 wide, 12 dp padding inside; price row = the price
   (ShrinkToFitText bodyLarge bold, weight(1f, fill=false)) + 8 dp + "30 min" (bodySmall) */
const TILE_IN = (412 - 32 - 16) / 3 - 24;
const tile = s => { const pl = svcPriceLabel(s), mins = s.min ? `${s.min} ${t("opt_min")}` : "";
  const room = TILE_IN - (mins ? textW(mins, 12, 400, .4) + 8 : 0), fs = shrinkFs(pl, room, 16, 700, .5);
  return `<div class="vtile" data-t="svc-${s.id}"><span class="ib" style="background:${TRADE_TILE}">${TRADE_SVG}</span>
  <b>${esc(s.name)}</b><div class="pr"><b style="font-size:calc(var(--u)*${fs})">${esc(pl)}</b>${mins?`<small>${esc(mins)}</small>`:""}</div></div>`; };
/* the owner's services Home. o = {closed, count, total, overlay, locked} */
function home(o){
  o = o||{};
  const nP = C.products.length, n = o.count||0, tot = o.total||0;
  const tabs = `<div class="htabs"><span class="on">${esc(t("home_tab_services"))} · ${SERVICES.length}</span><span>${esc(t("home_tab_products"))} · ${nP}</span></div>`;
  /* ProductLibraryView.kt:212-286: "Todos" (CategoryChipNeutral #607D8B, picked: 22 % fill, 1.5 dp border, check) + the trade's one category
     (CategoryChipPalette by category id: the system "Otros servicios" bucket is hidden, the trade category is the second row -> #81C784) */
  const chips = `<div class="mcats"><span style="background:rgba(96,125,139,.22);border:calc(var(--u)*1.5) solid #607D8B;color:#607D8B">${I.check}${esc(t("items_filter_all"))}</span><span style="background:rgba(129,199,132,.05);border:1px solid rgba(129,199,132,.3)">${esc(V.tradeName)}</span></div>`;
  const body = `<div class="hedit"><span>${I.edit}${esc(t("common_edit"))}</span></div>${chips}<div class="vgrid">${SERVICES.map(tile).join("")}</div>`;
  const foot = `<div class="vfoot"><div class="klink"><span>${esc(t("scan_row_manual"))}</span></div>
    ${n?`<div class="cstrip"><span>${esc(tp("home_current_sale_services", n, n))}</span><i>›</i></div>`:""}
    <div class="fpair">${btn(ACTION_WORD,"sec","book",{pill:true,off:!n})}${btn(t("common_charge", money(tot)),"pri","charge",{pill:true,off:!n})}</div></div>`;
  return `<div class="pg">${tabs}${o.closed?closedBar():""}${body}${foot}${nav("caja",{locked:o.locked!==false})}${o.overlay||""}</div>`;
}
/* the M3 Switch (Material3 defaults over the light scheme): checked = primary track + white 24 dp thumb */
const sw = (on, tag) => `<div class="rsw${on?" on":""}"${tag?` data-t="${tag}"`:""}><i></i></div>`;
/* OptionSelectionSheet.kt:186-330: ModalBottomSheet, 16 dp sides; title = the service (titleLarge bold); one block per option set
   (its name titleSmall grey, then the row: "Lavado" ON (included), a priced add-on "· +$X" OFF, an unpriced one "· se pregunta en la caja"
   OFF); the CTA "Agregar a la venta · $X" = the line's price + what is ticked (SVC-1 item 1, :319-331) */
function optionSheet(s, price){
  const rows = s.included.map(x => ({name:x.name, on:true, tail:""}))
    .concat(s.extras.map(x => ({name:x.name, on:false, tail: x.price==null ? " · "+t("opt_ask_at_till_row")
      : (x.per && CC==="CO") ? " · "+t("opt_per_unit_each", money(x.price), x.per) : " · +"+money(x.price)})));   // :219-229 (per-unit add-on: the corpus's
      // unit word, Colombia only; abroad the researched amount is stripped, CatalogoInvestigadoAssets.kt:76-90, and the owner typed a plain price)
  const sets = rows.map(r => `<div class="osl">${esc(r.name)}</div><div class="osr"><span>${esc(r.name+r.tail)}</span>${sw(r.on)}</div><hr>`).join("");
  return `<div class="mscrim"><div class="osheet"><div class="hdl"></div><h2>${esc(s.name)}</h2><div class="osets">${sets}</div>
    ${btn(price>0 ? t("opt_add_to_sale", money(price)) : t("common_add"), "pri", "opt-add")}</div></div>`;
}
/* VariationSelectionSheet.kt:43-125: "Elige uno" (labelMedium bold primary), the service (headlineMedium ExtraBold), one r16 row per choice */
function chooseSheet(s){
  return `<div class="mscrim"><div class="vsheet"><div class="hdl"></div><small>${esc(t("home_variation_choose_one"))}</small><h2>${esc(s.name)}</h2>
    ${s.choices.map((c,i)=>`<div class="vrow" data-t="choice-${i}"><b>${esc(c.name)}</b><span>${c.price>0?money(c.price):esc(t("opt_ask_at_till_row"))}</span></div>`).join("")}</div></div>`;
}
/* the system biometric sheet that the locked flag opens (PlatataApp.kt:560-585 FlagGate -> showBiometricPrompt, settings_gate_*) */
const bioSheet = ok => `<div class="mscrim"><div class="bio"><b>${esc(t("settings_gate_title"))}</b><small>${esc(t("settings_gate_subtitle"))}</small>
  <span class="fpb${ok?" ok":""}" data-t="fingerprint">${ok?I.check:I.fp}</span></div></div>`;

/* Open register (ui/screens/cash/OpenRegisterScreen.kt:96-187): SumaTopBar, "Efectivo inicial" centred, the amount (displaySmall bold,
   start-aligned), CashKeypad taking the rest, SumaButton "Abrir caja" in the bottom bar */
const openRegister = typed => `<div class="pg">${topbar(t("register_open_title"))}
  <div class="pb"><div class="lbl" style="text-align:center">${esc(t("register_open_amount_hint"))}</div><div class="amt" style="${amtFs(money(amountOf(typed)))}">${money(amountOf(typed))}</div>
  <div class="grow"></div>${keypad("k", 72)}</div>
  <div class="pf">${btn(t("register_open_confirm"),"pri","open-confirm")}</div></div>`;

/* ---------- the business panel of a services shop (HomeScreen.kt:1510-1870): register card (#E8F5E9/#2E7D32 open, #FFEBEE/#C62828 closed),
   Vender en línea (owner phone, SellOnlineGate), "Día a día", Clientes (home_clientes_count: no fiado for services), Facturas
   (hasSupplierInvoiceRow), Equipo, Reportes ("Ventas netas hoy", NetSalesWords: not US/CA), divider, Configuración. No Items row
   (workspaceHasItemsRow = false) and no Inventory (retail only). ---------- */
function panel(p){
  p = p||{};
  const open = p.open!==false;
  const row = (tag, icon, title, sub, o={}) => `<div class="wr" data-t="${tag}"><span class="ic">${icon}</span><div class="tx"><b>${esc(title)}</b><small>${esc(sub||"")}</small></div>${o.trail||""}</div>`;

/* ---------- Register screen (ui/screens/cash/RegisterStatusScreen.kt:140-505), one register: no tab row. Top bar: ‹ Hoy · 22 oct › +
   "Reportes"; pill "● ABIERTA"; info card (Abierta / Abierta por); drawer card (Efectivo inicial, Ventas en efectivo (esta caja), one line per
   cash in/out with "Anular", Debe haber en la caja); Sacar efectivo / Meter efectivo (Secondary, owner phone); the money card (RegisterMethodMoneyCard
   :674-738: each method with its collector under it, "Todo el efectivo desde que abrió" for the cash line, Total cobrado); Historial de caja;
   Cerrar caja. o = {when, moves:[{amount,at,isNew}], scroll, snack, flash} ---------- */
function registerScreen(o){
  const sales = SALES_AT(o.when), cashSales = sumPay(sales, "cash");
  const moves = o.moves||[];
  const out = moves.reduce((a,m)=>a+m.amount, 0);
  const exp = r2(OPENING + cashSales - out);
  const mv = moves.map(m=>`<div class="mv${m.isNew?" new":""}"><span>${esc(t("cash_movement_out"))} · ${esc(t("cash_movement_reason_supplier"))} · ${esc(fmtTime(m.at))}</span><b class="out">-${money(m.amount)}</b><i>${esc(t("cash_movement_void"))}</i></div>`).join("");
  const tbar = topbar("", {html:`<div class="navd"><span class="dim">${I.chevL}</span><b>${esc(t("register_nav_today", shortDay(OPENED)))}</b><span class="dim">${I.chevR}</span></div>`,
                 action:`<span class="tba">${esc(t("register_status_full_reports"))}</span>`});
  const methods = methodsOf(sales);
  const mcard = methods.map(m => `<div class="lr ms"><span>${esc(m.k==="cash" ? t("register_status_cash_all") : methodName(m.k))}</span><span>${money(m.total)}</span></div>
      <div class="lr ind"><span>${esc(OWNER)}</span><span>${money(m.total)}</span></div>`).join("");
  const body = `<div class="rs" style="transform:translateY(calc(var(--u)*${-(o.scroll||0)}))">
    <div class="pillrow"><span class="spill">${esc(t("register_status_pill_open"))}</span></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_opened_at"))}</span><span>${esc(fmtDT(OPENED))}</span></div>
      <div class="lr"><span>${esc(t("register_status_opened_by"))}</span><span>${esc(OWNER)}</span></div></div>
    <div class="scard"><div class="lr"><span>${esc(t("register_status_starting_cash"))}</span><span>${money(OPENING)}</span></div>
      <div class="lr"><span>${esc(t("register_status_cash_sales_here"))}</span><span>${money(cashSales)}</span></div>
      ${mv}<hr><div class="lr em${o.flash?" flash":""}"><span>${esc(t("register_status_expected"))}</span><span class="pri">${money(exp)}</span></div></div>
    ${btn(t("cash_movement_out"),"sec","cash-out")}${btn(t("cash_movement_in"),"sec","cash-in")}
    <div class="scard">${mcard}<hr><div class="lr em"><span>${esc(t("reports_total_collected"))}</span><span>${money(sumPay(sales))}</span></div></div>
    <div class="hist">${I.clock}<span>${esc(t("register_list_title"))}</span></div>
    ${btn(t("register_status_close_btn"),"sec","close-reg")}<div style="height:calc(var(--u)*16)"></div></div>`;
  return `<div class="pg">${tbar}<div class="pscroll">${body}</div>${o.snack?`<div class="msnack" style="bottom:calc(var(--u)*16)">${esc(t("cash_movement_saved"))}</div>`:""}</div>`;
}
/* how far (dp) the scrolled page on screen can move: its content minus the room it has (a Column with verticalScroll stops at the end) */
const maxScrollDp = () => { const rs = document.querySelector(".pscroll .rs"); if(!rs) return 0; const ps = rs.parentElement, u = ps.getBoundingClientRect().width / 412;
  return Math.max(0, Math.round((rs.scrollHeight - ps.clientHeight) / u)); };
/* a scrolled list slides (transform .5s); once it stops, ask the engine to put the tap ring on the target again (it listens to resize) */
document.addEventListener("transitionend", e => { if(e.propertyName==="transform") window.dispatchEvent(new Event("resize")); });

/* ===== VS10 ===== */
/* VS10 "Cerrar la caja" as a SERVICES business (Peluquería; ?biz= works for the other three), on the OWNER phone, at 19:40 of the same day.
   Every country, es/pt/en. Screens at sim/usa-canada 73c65f08 (paths under app/src/main/java/com/example/):
   business panel        ui/screens/home/HomeScreen.kt:1552-1610 (register card -> Screen.RegisterStatus)
   Register screen       ui/screens/cash/RegisterStatusScreen.kt:140-505 (scrolled to the bottom: Cerrar caja, Secondary)
   Close register        ui/screens/cash/CloseRegisterScreen.kt:365-566 (the Expected card, tight with a cash movement: "Debe haber en la caja",
                         the red "Sacar efectivo -$X" line, "Ver dinero por forma de pago ›" (owner, money to break down); "Contado" + the amount;
                         the Diferencia line (Cuadrado in onSurface); CashKeypad (MoneyKeypadEntry rule); "Cerrar caja" off until a digit)
   the tomorrow check    CloseRegisterScreen.kt:75-84 + sync/OpenTablesAtClose.kt:36-46 (SVC-2, item 20, verified): only TODAY's unpaid bookings
                         are counted, and a services shop says "citas de hoy" (register_close_open_appointments). The salon has tomorrow's and
                         Saturday's bookings (kit) and charged all of today's, so no "Antes de cerrar" question shows: Cerrar caja goes straight
                         to the confirm.
   confirm               CloseRegisterScreen.kt:306-351 (AlertDialog: "¿Cerrar la caja con $X contados?", Cuadrado, Seguir contando | Cerrar caja)
   summary               ui/screens/cash/RegisterClosedScreen.kt:181-322 (variance headline; times card; Ventas netas, Total cobrado, Dinero por forma
                         de pago; the drawer card; no Print without a receipt printer; Enviar por WhatsApp; Listo pinned)
   WhatsApp text         utils/ShiftSummaryText.kt build(plain = true) (business name, CAJA CERRADA, "Label: value", blank lines for the rules)
                         + WhatsappSignatureText (one blank line + whatsapp_signature); RegisterClosedScreen.kt:95-113 hands it to WhatsApp (ACTION_SEND)
   The day (common block): opened 8:05 with openingCash, the kit's morning sales, VS3's 12:41 cash sale, VS9's 13:10 cash out, today's afternoon
   bookings charged in cash. */
const SALES = SALES_AT("night");
const CASH = sumPay(SALES, "cash");
const EXP = r2(OPENING + CASH - OUT);
const COUNTED = EXP;                                   // she counts what should be there: "Cuadrado"
const KEYS = keysFor(COUNTED);
const NET = sumPay(SALES);                             // no tax set up, no tips, no charges: Net sales = Total collected (REPORTS-11)
const METHODS = methodsOf(SALES);
const varText = d => d<0 ? t("register_close_short", money(-d)) : d>0 ? t("register_close_over", money(d)) : t("register_close_balanced");
const varCls = d => d<0 ? "neg" : d>0 ? "pos" : "bal";
function closeScreen(st){
  const has = st.typed!=="", c = amountOf(st.typed), d = r2(c-EXP);
  const a = money(c);
  return `<div class="pg">${topbar(t("register_close_title"))}
    <div class="pb"><div class="scard tight" style="margin-top:calc(var(--u)*8)"><div class="lr"><span>${esc(t("register_close_expected_label"))}</span><span class="v">${money(EXP)}</span></div>
      <div class="lr sm neg"><span>${esc(t("cash_movement_out"))}</span><span>-${money(OUT)}</span></div>
      <div class="seeb">${esc(t("register_close_see_breakdown"))}</div></div>
    <div class="lbl2">${esc(t("register_close_counted_label"))}</div>
    <div class="amt2" style="${amtFs(a)}">${a}</div>
    <div class="diff">${has?`<span>${esc(t("register_close_diff_label"))}</span><b class="${varCls(d)}">${esc(varText(d))}</b>`:""}</div>
    <div class="grow"></div>${keypad("k", 64)}</div>
    <div class="pf">${btn(t("register_close_confirm"),"pri","close-confirm",{off:!has})}</div>
    ${st.dlg?`<div class="dlg-s"><div class="dlg"><h3>${esc(t("register_close_confirm_title", money(c)))}</h3><p class="vt ${varCls(d)}">${esc(varText(d))}</p>
      <div class="bt"><span>${esc(t("register_close_keep_counting"))}</span><span data-t="dlg-close">${esc(t("register_close_confirm"))}</span></div></div></div>`:""}</div>`;
}
function summary(st){
  const lr = (l,v,c) => `<div class="lr k${c?" "+c:""}"><span>${esc(l)}</span><span>${esc(v)}</span></div>`;
  return `<div class="pg">${topbar(t("register_closed_title"))}<div class="pscroll"><div class="rs" style="transform:translateY(calc(var(--u)*${-(st.scroll||0)}))">
    <div class="vhead bal">${esc(varText(0))}</div>
    <div class="scard">${lr(t("register_status_opened_at"), fmtDT(OPENED))}${lr(t("register_status_closed_at"), fmtDT(CLOSED))}${lr(t("register_status_closed_by"), OWNER)}</div>
    <div class="scard">${lr(t("register_status_net_sales"), money(NET))}${lr(t("reports_total_collected"), money(NET), "em")}
      <div class="sub">${esc(t("register_close_by_method"))}</div>${METHODS.map(m => lr(methodName(m.k), money(m.total), "ind2")).join("")}</div>
    <div class="scard">${lr(t("register_status_starting_cash"), money(OPENING))}${lr(t("register_status_cash_sales"), money(CASH))}
      ${lr(t("cash_movement_out"), "-"+money(OUT))}<hr>
      ${lr(t("register_status_expected"), money(EXP), "em")}${lr(t("register_status_counted"), money(COUNTED), "em")}</div>
    ${btn(t("register_closed_whatsapp"),"sec","wa")}<div style="height:calc(var(--u)*16)"></div></div></div>
    <div class="pf">${btn(t("common_done"),"pri","done")}</div></div>`;
}
/* the text ShiftSummaryText.build(labels, summary, plain = true) makes for this shift, signed (WhatsappSignature.append) */
function shiftText(){
  const out = [], row = (l, r) => out.push((l.startsWith(" ") ? "- " : "") + l.trim() + ": " + r);
  out.push(C.place); out.push(t("register_closed_title").toUpperCase()); out.push("");
  row(t("register_status_opened_at"), fmtDT(OPENED)); row(t("register_status_closed_at"), fmtDT(CLOSED)); row(t("register_status_closed_by"), OWNER); out.push("");
  row(t("register_status_net_sales"), money(NET)); row(t("reports_total_collected"), money(NET));
  out.push(t("register_close_by_method")); METHODS.forEach(m => row("  "+methodName(m.k), money(m.total))); out.push("");
  row(t("register_status_starting_cash"), money(OPENING)); row(t("register_status_cash_sales"), money(CASH)); row(t("cash_movement_out"), "-"+money(OUT));
  row(t("register_status_expected"), money(EXP)); row(t("register_status_counted"), money(COUNTED)); out.push(""); out.push(varText(0));
  return out.join("\n").replace(/[   ]/g," ") + "\n\n" + t("whatsapp_signature");
}
/* WhatsApp (not Platata): the chat the owner picked, the summary waiting in the message box */
const waScreen = () => `<div class="wa"><div class="wah">${I.back}<b>WhatsApp</b></div><div class="wab"></div>
  <div class="wain"><div class="box">${esc(shiftText())}</div><span class="sendb"><svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg></span></div></div>`;
function render(st){
  if(st.screen==="panel") return panel({open:true, sales:NET, today:NET});
  if(st.screen==="reg") return registerScreen({when:"night", moves:[{amount:OUT, at:OUT_AT}], scroll:st.scroll||0});
  if(st.screen==="close") return closeScreen(st);
  if(st.screen==="sum") return summary(st);
  if(st.screen==="wa") return waScreen();
  return "";
}
VKIT.start(V, {
  id:"VS10", tallVideo:true, clock:"19:40",
  endText:pick({es:"Así cierras la caja con Platata.", pt:"Assim você fecha o caixa com o Platata.", en:"That's how you close the register with Platata."}),
  beats:pick({
    es:["Al final del día, toca la caja abierta","Baja y toca Cerrar caja","Arriba ves cuánto debe haber: cuenta y escríbelo","Cuadrado. Toca Cerrar caja y confírmalo","El resumen: ventas, efectivo y lo que salió","Envíalo por WhatsApp","Así cierras la caja con Platata."],
    pt:["No fim do dia, toque no caixa aberto","Desça e toque em Fechar caixa","Em cima você vê quanto deve haver: conte e digite","Fechado exato. Toque em Fechar caixa e confirme","O resumo: vendas, dinheiro e o que saiu","Envie pelo WhatsApp","Assim você fecha o caixa com o Platata."],
    en:["At the end of the day, tap the open register","Scroll down and tap Close register","On top: what should be there. Count and type it","Balanced. Tap Close register and confirm","The summary: sales, cash and what went out","Send it by WhatsApp","That's how you close the register with Platata."]}),
  state:{screen:"panel", scroll:0, typed:"", dlg:false},
  render,
  device: () => "phone",
  who: st => st.screen==="wa" ? "WhatsApp" : t("conn_slot_phone"),
  steps:[
    {beat:0, hint:TAP+t("workspace_register_open"), target:'[data-t="reg-card"]', tap(st,E){ st.screen="reg"; E.after(900,()=>{ st.scroll=maxScrollDp(); }); }},
    {beat:1, hint:TAP+t("register_status_close_btn"), target:'[data-t="close-reg"]', tap(st){ st.screen="close"; st.scroll=0; }},
    {beat:2, hint:TAP+KEYS.map(keyLabel).join(" "), target:`[data-t="k-${KEYS[0]}"]`, tap(st,E){
        st.typed=press(st.typed,KEYS[0]); KEYS.slice(1).forEach((k,i)=>E.after(380*(i+1),()=>{ st.typed=press(st.typed,k); })); }},
    {beat:3, hint:TAP+t("register_close_confirm"), target:'[data-t="close-confirm"]', tap(st){ st.dlg=true; }},
    {beat:3, hint:TAP+t("register_close_confirm"), target:'[data-t="dlg-close"]', tap(st,E){ st.dlg=false; st.screen="sum"; E.after(1000,()=>{ st.scroll=Math.min(150, maxScrollDp()); }); }},
    {beat:5, hint:TAP+t("register_closed_whatsapp"), target:'[data-t="wa"]', tap(st){ st.screen="wa"; }}
  ]
});
