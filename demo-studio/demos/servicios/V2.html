/* the phone's number keyboard (Gboard number pad) while a money / number box has the focus; act = "next" (Sig.) or "done" */
const numKbd = (act) => { const k = [["1","2","3","−"],["4","5","6","␣"],["7","8","9","⌫"],[",","0",".",act==="next"?"→":"✓"]];
  return `<div class="nkbd">${k.map(r => `<div class="nkr">${r.map((x, i) => `<span class="${i===3?(x==="→"||x==="✓"?"act":"fn"):""}">${x}</span>`).join("")}</div>`).join("")}</div>`; };

/* ShrinkToFitText (ui/components/ShrinkToFitText.kt): one line, 1 sp smaller until it fits, never under 12 sp, then an ellipsis.
   Applied after every draw to the elements marked .fit (data-sp = the start size). */
function fitAll(){
  document.querySelectorAll("#app .fit").forEach(el => {
    let sp = +(el.dataset.sp || 16);
    el.style.fontSize = `calc(var(--u)*${sp})`;
    while(el.scrollWidth > el.clientWidth + 0.5 && sp > 12){ sp -= 1; el.style.fontSize = `calc(var(--u)*${sp})`; }
  });
}
new MutationObserver(() => fitAll()).observe(document.getElementById("root"), {childList:true, subtree:true});

/* scrolled lists slide with a transform; when it stops, ask the engine to place the ring again */
document.addEventListener("transitionend", e => { if(e.propertyName==="transform") window.dispatchEvent(new Event("resize")); });

/* ===== V2 "Ajusta tus precios": change a service's price, how it is charged, its length and an extra — owner's phone =====
   Screens at sim/usa-canada 73c65f08 (paths under app/src/main/java/com/example/):
   the till        services Home (see common): "Editar" turns on the amber "Editando" bar whose link "Mis servicios >" is the only
                   door to the services menu (HomeScreen.kt:938-956 onOpenServices -> ITEMS_WORKSPACE_ROUTE; ItemEditModeBar :2018-2100).
   Mis servicios   ui/screens/items/ServicesMenuScreen.kt:60-338 (PAPER: back, title Fredoka 20, "+ Nuevo"; the trade card in the trade
                   family colour with "N servicios · M productos" and "Cambiar"; one card with every service: name, "N opciones · M min",
                   the price by sync/ServicesMenuRule.kt:40-64 (choices -> "Desde" the lowest priced one; FROM -> "Desde"; ASK -> "En la
                   caja"); "Adiciones" / "Combos" picture cards). A LEVEL_2 page: the support strip sits under it (reports/ReportLevels.kt).
   Editar servicio ui/screens/services/ServiceEditScreen.kt:162-430 (plain MATERIAL): SumaTopBar + "Listo"; Name; "¿Cómo cobras?" with
                   FilterChips Precio fijo / Desde / En la caja (SVC-3 item 40; a service with choices: Según la opción / En la caja);
                   "¿Cuánto cobras?" + PricePicker (guide/PricePicker.kt:41-104: Colombia = three FilterChips around the CURRENT price
                   + "Otro"; elsewhere one box SEEDED with the stored price, item 40); "Duración (minutos)" (DBSVC-1, 200 dp box);
                   "Lo que suele venir con esto" (BridgeScreen.kt:543-640 WhatComesSection + BridgeOptionRow); the tax checkbox only
                   when a tax is on (ShopSwitches.showTaxCheckbox); big "Listo"; red "Eliminar servicio". Phone Back saves too (item 40).
   option editor   ui/screens/guide/BridgeOptionEditor.kt:47-371 (replaces the page: name + "Cancelar", "Nombre de la opción", ¿Va
                   incluido o se cobra? chips, ¿Cuánto tarda? 5..30 min chips, ¿Cuánto cobras? box, Colombia +pills (ResearchedOption
                   States.kt upchargePills(5.000) = 3.000 / 5.000 / 8.000), the ask-at-till and flip notes, "Quitar esta opción", "Listo").
   Data: kit/services-data.js — the service is the business's own one-price service with an extra asked at the till
   (Peluquería: "Corte de caballero / hombre", 30 min, "Cepillado / secado" se pregunta en la caja). */
// TITLE: Platata · Ajusta tus precios
// KEYS: services_menu_new,services_menu_change,services_menu_adds_title,services_menu_adds_sub,services_menu_combos_title,services_menu_combos_sub,guide_back
// PLURALS: services_menu_services_count,services_menu_products_count,services_menu_options_count
// KEYS: svc_edit_picker_title,svc_edit_picker_note,opt_no_price,svc_edit_title,svc_edit_name_label,bridge_how_charge,bridge_mode_fixed,bridge_mode_from,bridge_mode_by_choice,bridge_price_title,bridge_other,svc_edit_duration_label,bridge_what_comes,bridge_add_option,opt_tag_included,opt_tag_charge,opt_tag_pick,opt_ask_at_till_row,bridge_not_set,svc_delete_service
// KEYS: opt_name_label,opt_cancel,opt_kind_q,opt_how_long,opt_leave_empty,opt_ask_at_till_note,opt_flip_note,opt_remove,opt_done
// ICONS: drawn_opciones,drawn_etiqueta
const CAT = window.SERV.CATALOG[V.biz].services;
const noPicker = id => { const c = CAT.find(x => x.id === id); return c && !c.ones.length; };
/* the service to edit: one price in every country (no researched pick-one) and an extra; then an extra asked at the till */
const EDIT = C.services.find(s => noPicker(s.id) && s.extras.length && s.choices.length <= 1)
  || C.services.find(s => s.choices.length <= 1) || C.services[0];
const PICKER = EDIT.choices.length > 1;
const OPT_I = Math.max(0, EDIT.extras.findIndex(e => e.price == null));
const OPT = EDIT.extras[OPT_I] || null;
const OLD = PICKER ? null : EDIT.price;
const PILLS = p => p == null ? [] : [...new Set([Math.round(p*0.8/1000)*1000, p, Math.round(p*1.2/1000)*1000])].sort((a,b)=>a-b);   // GuideLogic.pricePills (Colombia only)
const NEW_PRICE = OLD == null ? null : (CO ? PILLS(OLD)[PILLS(OLD).length-1] : window.SERV.nice(OLD*1.2, K.cur));
const NEW_MIN = EDIT.min ? EDIT.min + 10 : 30;
const UPCHARGE = CO ? 5000 : window.SERV.local(CC, 5000);         // Colombia: the middle pill of upchargePills(5.000)
const UP_PILLS = [3000, 5000, 8000];                               // upchargePills(5000): 0.6x / 1x / 1.5x rounded to 1.000

/* ---- Mis servicios ---- */
function rowsOf(st){
  return C.services.map(s => {
    const mine = s.id === EDIT.id && st.saved;
    const choices = s.choices.length > 1 ? s.choices.length : 0;
    const price = mine ? NEW_PRICE : s.price;
    const from = choices || (mine && st.mode === 1);
    return {s, name:s.name, sub:[choices ? tp("services_menu_options_count", choices, choices) : null, (mine ? NEW_MIN : s.min) ? `${mine ? NEW_MIN : s.min} ${t("opt_min")}` : null].filter(Boolean).join(" · "),
      price: price == null ? t("items_price_unset") : from ? t("items_price_from", money(price)) : money(price), hl: mine};
  }).sort((a, b) => cmp(a.name, b.name));
}
function menuPage(st){
  const sc = C.services.length, pc = C.products.length;
  const line = tp("services_menu_services_count", sc, sc) + (pc ? " · " + tp("services_menu_products_count", pc, pc) : "");
  const rows = rowsOf(st).map(r => `<div class="mrw${r.hl?" hl":""}" data-t="row-${r.s.id}"><div><b>${esc(r.name)}</b>${r.sub?`<small>${esc(r.sub)}</small>`:""}</div><span class="mp">${esc(r.price)}</span>${I.chevR}</div>`).join("");
  return `<div class="ppage">
    <div class="ptop">${pBack("menu-back")}<span class="mtitle">${esc(t("services_menu_title"))}</span>${pLink(t("services_menu_new"), true)}</div>
    <div class="pbody"><div class="min" style="transform:translateY(calc(var(--u)*${-(st.menuScroll||0)}))">
      <div class="pcard tcard"><span class="tib" style="background:${MYFAM.soft}">${IC(MY[1], 32)}</span><div><b>${esc(V.tradeName)}</b><small>${esc(line)}</small></div><span class="plink" style="color:${MYFAM.ink}">${esc(t("services_menu_change"))}</span></div>
      <div class="pcard mcard">${rows}</div>
      <div class="pics"><div class="pcard pic"><span class="pti" style="background:#EEF0F1">${IC("drawn_opciones")}</span><b>${esc(t("services_menu_adds_title"))}</b><small>${esc(t("services_menu_adds_sub"))}</small></div>
        <div class="pcard pic"><span class="pti" style="background:#FBF1D9">${IC("drawn_etiqueta")}</span><b>${esc(t("services_menu_combos_title"))}</b><small>${esc(t("services_menu_combos_sub"))}</small></div></div>
    </div></div>${strip()}</div>`;
}

/* ---- Editar servicio (Material) ---- */
const chip = (label, on, tag) => `<span class="fchip${on?" on":""}"${tag?` data-t="${tag}"`:""}>${esc(label)}</span>`;
function optRow(o, st){
  const priced = st.optSaved && o === OPT;
  const sub = priced ? "+" + money(UPCHARGE) : (o.price != null ? "+" + money(o.price) : t("opt_ask_at_till_row"));
  return `<div class="orow${priced?" hl":""}"${o===OPT?' data-t="opt"':""}><div><b>${esc(o.name)}</b><small>${esc(sub)}</small></div><span class="otag">${esc(t("opt_tag_charge"))}</span></div>`;
}
function editPage(st){
  const modes = PICKER ? [t("bridge_mode_by_choice"), t("bridge_mode_ask")] : [t("bridge_mode_fixed"), t("bridge_mode_from"), t("bridge_mode_ask")];
  let price;
  if(PICKER){
    /* ServiceEditScreen.kt:226-268: one row per choice, a 160 dp box seeded with its price (placeholder "Sin precio") */
    price = `<div class="tm">${esc(t("svc_edit_picker_title"))}</div><div class="pnote">${esc(t("svc_edit_picker_note"))}</div>` +
      EDIT.choices.map(c => `<div class="chrow"><span>${esc(c.name)}</span>${field("", c.price != null ? SEEDED(c.price) : "", {w:160, ph:t("opt_no_price")})}</div>`).join("");
  } else if(CO){
    const pills = PILLS(OLD), on = st.price != null ? st.price : OLD;
    price = `<div class="tm">${esc(t("bridge_price_title"))}</div><div class="frow">${pills.map(p => chip(money(p), p === on, p === NEW_PRICE ? "pill-new" : null)).join("")}</div><div class="frow">${chip(t("bridge_other"), false)}</div>`;
  } else {
    const shown = st.priceText != null ? (st.priceText === "" ? "" : GROUPED(+st.priceText.replace(DECMARK,"."))) : SEEDED(OLD);   // item 40: seeded with the stored price
    price = `<div class="tm">${esc(t("bridge_price_title"))}</div>${field(t("bridge_price_title"), shown, {focus:st.focus==="price", tag:"price"})}`;
  }
  const inc = EDIT.included.map(o => `<div class="orow"><div><b>${esc(o.name)}</b><small>${esc(t("opt_tag_included"))}</small></div><span class="otag">${esc(t("opt_tag_included"))}</span></div>`).join("");
  const ext = EDIT.extras.map(o => optRow(o, st)).join("");
  const dur = st.durText != null ? st.durText : String(EDIT.min || "");
  const body = `<div class="ein">
    ${field(t("svc_edit_name_label"), EDIT.name)}
    <div class="tm">${esc(t("bridge_how_charge"))}</div>
    <div class="frow">${modes.map((m, i) => chip(m, i === st.mode, `mode-${i}`)).join("")}</div>
    ${price}
    ${field(t("svc_edit_duration_label"), dur, {focus:st.focus==="dur", tag:"dur", w:200})}
    <div class="tm big">${esc(t("bridge_what_comes"))}</div>
    ${inc}${ext}
    <div class="tbtn">${esc(t("bridge_add_option"))}</div>
    <div class="sb pri" data-t="svc-done">${esc(t("where_done"))}</div>
    <hr><div class="tbtn red">${esc(t("svc_delete_service"))}</div></div>`;
  return `<div class="pg">${topbar(t("svc_edit_title"), {action:`<span class="rs-act">${esc(t("where_done"))}</span>`})}
    <div class="rs-scroll"><div class="in" style="transform:translateY(calc(var(--u)*${-(st.editScroll||0)}))">${body}</div></div>
    ${st.focus ? numKbd(st.focus === "dur" ? "done" : "done") : strip()}</div>`;
}
/* ---- the option editor (BridgeOptionEditor.kt) ---- */
function optEditor(st){
  const typed = st.upText;
  const amount = CO ? (st.upPill ? UPCHARGE : null) : (typed ? +typed.replace(DECMARK,".") : null);
  const fieldHtml = field(t("bridge_price_title"), amount != null ? GROUPED(amount) : "", {focus:st.focus==="up", tag:"up", ph:`${currencySymbol()} — ${t("opt_leave_empty")}`, showPh:true});
  const pills = CO ? `<div class="frow">${UP_PILLS.map(p => chip("+" + money(p), st.upPill && p === UPCHARGE, p === UPCHARGE ? "up-pill" : null)).join("")}</div>` : "";
  const notes = (OPT.price == null ? `<div class="snote">${esc(t("opt_ask_at_till_note"))}</div>` : "") + `<div class="snote">${esc(t("opt_flip_note", t("opt_tag_charge")))}</div>`;
  return `<div class="pg"><div class="rs-scroll"><div class="in oein">
    <div class="oh"><b>${esc(OPT.name)}</b><span>${esc(t("opt_cancel"))}</span></div>
    ${field(t("opt_name_label"), OPT.name)}
    <div class="ts">${esc(t("opt_kind_q"))}</div>
    <div class="frow">${chip(t("opt_tag_included"), false)}${chip(t("opt_tag_charge"), true)}${chip(t("opt_tag_pick"), false)}</div>
    <div class="ts">${esc(t("opt_how_long"))}</div>
    <div class="frow">${[5,10,15,20,30].map(m => chip(`${m} ${t("opt_min")}`, false)).join("")}</div>
    <div class="ts">${esc(t("bridge_price_title"))}</div>
    ${fieldHtml}${pills}${notes}
    <div class="tbtn red c">${esc(t("opt_remove"))}</div>
    <div class="sb pri m3" data-t="opt-done">${esc(t("opt_done"))}</div></div></div>
    ${st.focus === "up" ? numKbd("done") : strip()}</div>`;
}

/* ---- the till ---- */
const TILL = C.services.map(s => tillOf(s)).sort((a, b) => cmp(a.name, b.name));
function render(st){
  let h;
  if(st.screen==="till") h = servicesHome({services: TILL, products: C.products.length, editing: st.editing});
  else if(st.screen==="menu") h = menuPage(st);
  else if(st.screen==="opt") h = optEditor(st);
  else h = editPage(st);
  return `<div class="x">${h}</div>`;
}
/* typing into a box: the old number goes, the new one comes digit by digit */
function typeInto(st, E, key, text, done){ st[key] = ""; let at = 150; for(let k = 1; k <= text.length; k++){ const part = text.slice(0, k); E.after(at, () => { st[key] = part; }); at += 140; } E.after(at + 250, () => { if(done) done(); }); }

const steps = [
  {beat:0, hint:TAP+t("common_edit"), target:'[data-t="edit"]', tap(st){ st.editing = true; }},
  {beat:1, hint:TAP+t("services_menu_title"), target:'[data-t="my-services"]', tap(st){ st.screen = "menu"; }},
  {beat:2, hint:TAP+EDIT.name, target:`[data-t="row-${EDIT.id}"]`, tap(st){ st.screen = "edit"; }}];
if(!PICKER && NEW_PRICE != null){
  if(CO) steps.push({beat:3, hint:TAP+money(NEW_PRICE), target:'[data-t="pill-new"]', tap(st){ st.price = NEW_PRICE; }});
  else steps.push({beat:3, hint:TAP+t("bridge_price_title"), target:'[data-t="price"]', tap(st,E){ st.focus = "price"; typeInto(st, E, "priceText", typedOf(NEW_PRICE), () => { st.focus = null; }); }});
}
steps.push(
  {beat:4, hint:TAP+(PICKER ? t("bridge_mode_ask") : t("bridge_mode_from")), target:`[data-t="mode-1"]`, wait:1.2, tap(st){ st.mode = 1; }},
  {beat:5, hint:TAP+t("svc_edit_duration_label"), target:'[data-t="dur"]', tap(st,E){ st.focus = "dur"; typeInto(st, E, "durText", String(NEW_MIN), () => { st.focus = null; }); }});
if(OPT){
  steps.push({beat:6, hint:TAP+OPT.name, target:'[data-t="opt"]', tap(st){ st.screen = "opt"; }});
  if(CO) steps.push({beat:6, hint:TAP+"+"+money(UPCHARGE), target:'[data-t="up-pill"]', tap(st){ st.upPill = true; }});
  else steps.push({beat:6, hint:TAP+t("bridge_price_title"), target:'[data-t="up"]', tap(st,E){ st.focus = "up"; typeInto(st, E, "upText", typedOf(UPCHARGE), () => { st.focus = null; }); }});
  steps.push({beat:6, hint:TAP+t("opt_done"), target:'[data-t="opt-done"]', tap(st){ st.screen = "edit"; st.optSaved = true; }});
}
steps.push({beat:7, hint:TAP+t("where_done"), target:'[data-t="svc-done"]', tap(st){ st.screen = "menu"; st.saved = true; }});
const NAME = EDIT.name;
VKIT.start(V, {
  id:"V2", tallVideo:true, clock:"12:41",
  endText:H("Así ajustas tus precios con Platata.","Assim você ajusta seus preços com o Platata.","That's how you adjust your prices with Platata."),
  beats:pick({
    es:["En la caja, toca Editar","Toca Mis servicios: todos tus precios","Toca el servicio que quieres cambiar",CO?"Toca el precio nuevo":"Escribe el precio nuevo","¿Puede costar más? Elige Desde","Cambia la duración","Ponle precio a lo que se cobra aparte","Toca Listo: queda guardado","Así ajustas tus precios con Platata."],
    pt:["No caixa, toque em Editar","Toque em Meus serviços: todos os seus preços","Toque no serviço que você quer mudar","Digite o preço novo","Pode custar mais? Escolha A partir de","Mude a duração","Dê preço ao que é cobrado à parte","Toque em Pronto: fica salvo","Assim você ajusta seus preços com o Platata."],
    en:["At the till, tap Edit","Tap Your services: all your prices","Tap the service you want to change",CO?"Tap the new price":"Type the new price","Can it cost more? Pick From","Change the length","Price what's charged on top","Tap Done: it's saved","That's how you adjust your prices with Platata."]}),
  state:{screen:"till", editing:false, saved:false, price:null, priceText:null, mode:0, durText:null, focus:null, editScroll:0, upPill:false, upText:"", optSaved:false},
  render,
  device: () => "phone",
  who: () => H("Tu teléfono","Seu celular","Your phone"),
  steps
});

</script>
